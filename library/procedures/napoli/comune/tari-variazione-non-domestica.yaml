schema_version: 0
id: napoli/comune/tari-variazione-non-domestica
title: TARI – variazione per uso non abitativo (Comune di Napoli)
headline: "TARI di un'attività a Napoli: come comunicare cambio di superficie, locali o voltura"
aka:
  - tassa sulla spazzatura
  - tassa rifiuti
  - voltura TARI
  - cambio superficie TARI
  - Mod. 6 TARI
updated: 2026-11-11
summary: >-
  Un'impresa, un professionista o un'associazione già iscritti alla TARI a Napoli per locali a uso
  non abitativo devono comunicare con il Mod. 6, entro 90 giorni, ogni cambiamento che modifica la
  tassa: superficie diversa, trasferimento in altri locali dentro Napoli o subentro (voltura) in
  un'utenza intestata a un'altra ditta. Se la tassa diminuisce, dichiararlo in tempo serve ad
  avere la riduzione dal giorno del cambiamento.
ente:
  name: Comune di Napoli
  office: Area Entrate – Servizio IMU e TARI
  ipa: c_f839
applies_to:
  events: [change, move]
  audience: [business]
  conditions:
    - text: >-
        Voltura: la ditta subentra in un'utenza TARI non abitativa intestata in precedenza a
        un'altra ditta (per esempio per cessione d'azienda o di ramo d'azienda) – quadro A del
        Mod. 6.
      status: verified
      source: mod-6
    - text: >-
        Trasferimento interno: la ditta passa da uno o più immobili a uno o più altri immobili
        sempre nel Comune di Napoli – quadro B del Mod. 6.
      status: verified
      source: mod-6
    - text: >-
        Variazione della superficie dei locali o delle aree già dichiarati – quadro C del Mod. 6.
      status: verified
      source: mod-6
    - text: >-
        Più in generale va dichiarata ogni variazione dei dati dichiarati da cui consegua un diverso
        ammontare del tributo, comprese le variazioni di destinazione d'uso dei locali e delle aree
        (artt. 12, c. 5, e 25, cc. 1 e 6).
      status: verified
      source: regolamento-2023
    - text: >-
        La dichiarazione spetta al soggetto legalmente responsabile dell'attività (art. 25, c. 3);
        se riguarda più immobili, va presentata solo per quelli in cui è cambiato qualcosa
        (art. 25, c. 6).
      status: verified
      source: regolamento-2023
legal_basis:
  - text: >-
      Regolamento TARI del Comune di Napoli, artt. 12 (periodi di applicazione e decorrenza delle
      variazioni), 25 (obbligo di dichiarazione) e 26 (contenuto e presentazione).
    status: verified
    source: regolamento-2023
deadline:
  summary:
    text: >-
      Entro 90 giorni dalla variazione. Gli aumenti valgono dal giorno della variazione; le
      riduzioni anche, ma solo se si dichiara entro i 90 giorni, altrimenti dalla data di
      presentazione.
    status: verified
    source: regolamento-2023
  rules:
    - text: >-
        Entro 90 giorni dalla data in cui si è verificata la variazione (art. 25, cc. 5 e 6).
      status: verified
      source: regolamento-2023
    - text: >-
        Le variazioni che fanno aumentare la tariffa producono effetti dal giorno dell'effettiva
        variazione. Anche quelle che la fanno diminuire decorrono dal giorno della variazione, ma
        solo se la dichiarazione è presentata entro i 90 giorni; altrimenti decorrono dalla data di
        presentazione (art. 12, c. 5). Le differenze sono di regola conteggiate a conguaglio.
      status: verified
      source: regolamento-2023
  lateness:
    text: >-
      Per l'omessa dichiarazione di variazione il regolamento prevede una sanzione sul primo anno
      d'imposta dal 100% (un anno) al 200% (più di due anni) del tributo, minimo 50 euro
      (art. 35, c. 3); per la dichiarazione infedele o incompleta dal 50% al 100%, minimo 50 euro
      (art. 35, c. 4). Se la variazione riduce la tassa, il ritardo fa perdere la riduzione per il
      periodo prima della presentazione (art. 12, c. 5). Farsi calcolare gli importi dall'ufficio:
      norme nazionali successive possono averli modificati.
    status: verified
    source: regolamento-2023
cost:
  text: >-
    Nessun costo indicato: come dichiarazione tributaria è esente dall'imposta di bollo (D.P.R.
    642/1972, tabella B, art. 5, testo in vigore fino al 31/12/2026) e né il modulo né la pagina
    della modulistica chiedono diritti. La TARI si paga a parte, con F24.
  status: verified
  source: dpr642-tabella-b
duration:
  text: >-
    La variazione vale dal giorno in cui è avvenuta; se fa diminuire la tassa, solo se dichiarata
    entro 90 giorni, altrimenti dalla data di presentazione (art. 12, c. 5). Le differenze sono di
    regola conteggiate a conguaglio; il regolamento non fissa un termine di risposta dell'ufficio.
  status: verified
  source: regolamento-2023
appointment:
  text: >-
    Non serve: la dichiarazione si presenta online sui Servizi Tributari (POTESs, con SPID, CIE o
    CNS), via PEC, email o raccomandata A/R, senza andare allo sportello.
  status: verified
  source: modulistica
channels:
  - type: pec
    purpose: procedure
    address: entrate.tari-tares-tarsu@pec.comune.napoli.it
    receipt: legal
    preferred: true
    source: mod-6
    notes: Dà una ricevuta con valore legale; un'impresa ha comunque l'obbligo di avere una PEC.
  - type: portal
    purpose: procedure
    name: POTESs – Servizi Tributari
    url: https://servizionline.comune.napoli.it/web/napoli/servizi-tributari
    auth: [spid, cie, cns]
    use:
      ways: [web_form, upload]
      status: unverified
      source: potess-tributi
      notes: >-
        La pagina del servizio indica, per la TARI, «presentare istanze di iscrizione, cessazione e
        trasferimento»: non dice se voltura e variazione di superficie si presentano qui, né se i
        dati si inseriscono online o si allega il Mod. 6 firmato; la pagina della modulistica dice
        che le dichiarazioni si compilano sui moduli del Comune. Non controllato dentro il portale.
    source: modulistica
  - type: email
    purpose: procedure
    address: entrate.tari-tares-tarsu@comune.napoli.it
    receipt: informal
    source: mod-6
  - type: post
    purpose: procedure
    receipt: legal
    address: Comune di Napoli, Area Entrate, Servizio IMU e TARI, Via Diocleziano 330, 80125 Napoli
    source: mod-6
    notes: Raccomandata (A/R secondo la pagina della modulistica).
  - type: desk
    purpose: procedure
    name: Sportello Unico Attività Produttive (SUAP)
    address: Piazza Cavour 42 (II piano), 80137 Napoli
    booking: Solo su appuntamento, prenotato online sul portale del cittadino del Comune.
    source: suap-contatti
    notes: >-
      Per le utenze non domestiche (pagina della modulistica TARI). Dal 18 maggio 2026 il SUAP
      riceve il pubblico solo su appuntamento.
  - type: desk
    purpose: info
    name: Sportello TARI
    address: Via Diocleziano 330, 80125 Napoli
    hours: lunedì–venerdì 8:30–12:30
    source: mod-6
  - type: phone
    purpose: info
    address: 081 795 3711
    hours: tutti i giorni 9:00–13:00 (orario indicato sul modulo)
    source: mod-6
    notes: >-
      Il modulo indica per prenotare un appuntamento telefonico o via mail
      https://servizionline.comune.napoli.it/web/napoli/tributi, ma il 26/10/2026 la pagina
      non esisteva (errore 404). Il modulo indica anche 081 795 3891 e 081 795 3856 (mercoledì e venerdì, 9–13) e
      081 795 3734 (giovedì e venerdì, 9–13).
payment:
  method: f24
  codice_ente: F839
  codici_tributo: ["3944", "TEFA"]
  status: unverified
  calculator_url: https://portaletributi.comune.napoli.it/?ente=NAPO
  schedule:
    - { label: Acconto 2026 – rata 1, due: 2026-09-30, source: tari-2026, status: verified }
    - { label: Acconto 2026 – unica soluzione, due: 2026-10-15, source: tari-2026, status: verified }
    - { label: Acconto 2026 – rata 2, due: 2026-10-30, source: tari-2026, status: verified }
    - { label: Acconto 2026 – rata 3, due: 2026-11-30, source: tari-2026, status: verified }
    - { label: Saldo 2026 (nuovo avviso del Comune), due: 2027-02-16, source: tari-2026, status: verified }
  notes:
    - text: >-
        Il pagamento è in autoliquidazione: è dovuto alle scadenze anche se l'avviso non arriva.
        Se l'avviso non tiene conto della variazione, calcolare la tassa con il simulatore e
        comunicare le variazioni all'ufficio.
      status: verified
      source: mod-6
    - text: Le variazioni di tariffa sono di regola conteggiate a conguaglio (art. 12, c. 5).
      status: verified
      source: regolamento-2023
    - text: >-
        Codice ente F839 (codice catastale di Napoli) e codici tributo 3944 (TARI) e TEFA: non
        riportati nella pagina TARI 2026; controllarli sull'avviso o con il simulatore del Comune.
      status: unverified
documents:
  - name: Mod. 6 TARI compilato e firmato
    required: true
  - name: Copia del documento d'identità del dichiarante
    required: true
    notes: Art. 38 DPR 445/2000.
  - name: Planimetria con misure e destinazione d'uso delle diverse aree o locali utilizzati
    required: false
    notes: Richiesta dal modulo per la voltura (quadro A).
  - name: Planimetria asseverata
    required: false
    notes: Richiesta dal modulo per la variazione di superficie (quadro C).
  - name: Planimetria catastale con relazione tecnica asseverata da un tecnico abilitato
    required: false
    notes: Solo se si chiede la detassazione per la produzione di rifiuti speciali (art. 7 del regolamento).
dichiarante:
  ruolo: [titolare, legale_rappresentante]
forms:
  - id: mod-6
    name: Mod. 6 TARI – Variazione uso non abitativo
    url: https://static-www.comune.napoli.it/wp-content/uploads/2020/09/MOD-6-VARIAZIONE-USO-NON-ABITATIVO.pdf
    source: mod-6
    sha256: fc3addc03f676a4da7d6e7a8ffad8c3f1fc4f39c0803c56bf904c855f8205eee
    signature_required: true
    fields:
      - label: "Cod.Contr."
        map: { blank_with_reason: Spazio riservato all'ufficio. }
        notes: "Il codice contribuente della ditta (business.tari_codice_contribuente) si può citare nel testo della PEC."
      - label: "Il/La sottoscritto/a"
        map: { concat: [identity.last_name, identity.first_name] }
      - label: "nato/a a"
        map:
          concat: [identity.birth_comune, identity.birth_country]
          template: "{identity.birth_comune}[ ({identity.birth_country})]"
        optional:
          - field: identity.birth_country
            required_if:
              - { field: identity.birth_province, equals: EE }
              - { field: identity.codice_fiscale, matches: "^.{11}Z" }
        notes: "Il modulo ha una sola riga per il luogo di nascita: per chi è nato all'estero, il luogo come scritto sui documenti e lo stato tra parentesi."
      - label: "il"
        map: { direct: identity.date_of_birth, template: "{identity.date_of_birth|date}" }
      - label: "C.F."
        map: { direct: identity.codice_fiscale }
      - label: "residente in"
        map: { direct: residenza.comune }
      - label: "Via"
        map: { direct: residenza.indirizzo }
      - label: "n°"
        map: { direct: residenza.civico }
      - label: "Telefono"
        map: { direct: identity.phone }
      - label: "e-mail"
        map: { direct: identity.email }
      - label: "pec"
        map: { direct: identity.pec }
        optional: [{ field: identity.pec }]
      - label: "nella sua qualità di (titolare / legale rappresentante)"
        map: { fallback: [business.qualita_dichiarante, ruolo.tipo] }
        choices:
          - { box: titolare, values: [titolare] }
          - { box: legale rappresentante, values: [legale_rappresentante] }
      - label: "Ragione Sociale"
        map: { direct: business.denominazione }
      - label: "C.F. (della ditta)"
        map: { direct: business.codice_fiscale }
        notes: "Il codice fiscale dell'impresa: per una società di solito coincide con la partita IVA; per una ditta individuale è quello del titolare, mai la partita IVA. Se business.codice_fiscale non c'è, chiederlo."
      - label: "PARTITA IVA"
        map: { direct: business.partita_iva }
      - label: "Con sede in via"
        map:
          concat: [business.sede_legale_indirizzo, business.sede_legale_civico]
          template: "{business.sede_legale_indirizzo}, {business.sede_legale_civico}"
      - label: "Comune di"
        map: { direct: business.sede_legale_comune }
      - label: "CAP"
        map: { direct: business.sede_legale_cap }
      - label: "e-mail (della ditta)"
        map: { direct: business.email }
      - label: "pec (della ditta)"
        map: { direct: business.pec }
      - label: "CHIEDE – scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)"
        map: { ask: "Che cosa è cambiato: subentro in un'utenza di un'altra ditta (A), trasferimento in altri locali a Napoli (B) o superficie (C)?" }
        choices:
          - { box: A, values: [A, voltura] }
          - { box: B, values: [B, trasferimento, trasferimento interno] }
          - { box: C, values: [C, superficie, variazione della superficie] }
        notes: "Il modulo non ha caselle per la scelta: si sceglie compilando il quadro corrispondente."
      - label: "A. la voltura dal"
        map: { direct: locale.data_inizio }
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
        notes: "È la data da cui la ditta occupa i locali."
      - label: "B. trasferimento interno al Comune di Napoli dal"
        map: { direct: locale.data_inizio }
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [B] }
        notes: "Il modulo lascia solo i posti del giorno e del mese: l'anno si scrive in Eventuali note. locale.* deve già contenere i nuovi locali."
      - label: "A. Utenza precedentemente intestata a – Ragione Sociale"
        map: { ask: "Ragione sociale della ditta che aveva l'utenza prima" }
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
      - label: "A. Utenza precedentemente intestata a – C.F."
        map: { ask: "Codice fiscale della ditta che aveva l'utenza prima" }
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
      - label: "A. Utenza precedentemente intestata a – PARTITA IVA"
        map: { ask: "Partita IVA della ditta che aveva l'utenza prima" }
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
      - label: "A. Utenza precedentemente intestata a – Con sede in via"
        map: { ask: "Indirizzo della sede della ditta che aveva l'utenza prima" }
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
      - label: "A. Utenza precedentemente intestata a – Comune di"
        map: { ask: "Comune della sede della ditta che aveva l'utenza prima" }
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
      - label: "A. Utenza precedentemente intestata a – CAP"
        map: { ask: "CAP della sede della ditta che aveva l'utenza prima" }
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
      - label: "A. Per i seguenti immobili siti in via"
        map: { direct: locale.indirizzo }
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
      - label: "A. n°"
        map: { direct: locale.civico }
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
      - label: "A. 1. Dati catastali – sez."
        map: { direct: locale.catasto_sezione }
        optional: [{ field: locale.catasto_sezione }]
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
      - label: "A. 1. Dati catastali – fg."
        map: { direct: locale.catasto_foglio }
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
      - label: "A. 1. Dati catastali – part."
        map: { direct: locale.catasto_particella }
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
      - label: "A. 1. Dati catastali – sub"
        map: { direct: locale.catasto_subalterno }
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
      - label: "A. 1. superficie in mq"
        map: { direct: locale.superficie_mq }
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
      - label: "A. 1. destinazione d'uso"
        map: { direct: locale.destinazione_uso }
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
      - label: "A. 2. Dati catastali – sez."
        map: { direct: locale2.catasto_sezione }
        optional: [{ field: locale2.catasto_sezione }]
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
        notes: "Solo se la voltura riguarda anche un secondo immobile, nel vault locale2.*; altrimenti vuoto."
      - label: "A. 2. Dati catastali – fg."
        map: { direct: locale2.catasto_foglio }
        optional: [{ field: locale2.catasto_foglio }]
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
      - label: "A. 2. Dati catastali – part."
        map: { direct: locale2.catasto_particella }
        optional: [{ field: locale2.catasto_particella }]
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
      - label: "A. 2. Dati catastali – sub"
        map: { direct: locale2.catasto_subalterno }
        optional: [{ field: locale2.catasto_subalterno }]
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
      - label: "A. 2. superficie in mq"
        map: { direct: locale2.superficie_mq }
        optional: [{ field: locale2.superficie_mq }]
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
      - label: "A. 2. destinazione d'uso"
