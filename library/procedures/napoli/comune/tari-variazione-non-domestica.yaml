          - { box: cessione di ramo d'azienda, values: [cessione di ramo d'azienda] }
          - { box: altro, values: [altro], write_value: true }
        when: { field: "CHIEDE \u2013 scelta del quadro (A voltura, B trasferimento interno, C variazione della superficie)", ticks: [A] }
      - label: "B. Dall'immobile – 1. Dati catastali – sez."
