name: Library

# The procedure library (library/): types, tests, procedures validated against their schema, the
# `updated` dates of changed procedures, the site, the reports backend. Runs when library/** or the
# vault's schema.json (which library/contract/vault-schema.json must equal) changes.
on:
  push:
    branches: [main]
    paths:
      - library/**
      - schema.json
      - .github/workflows/library.yml
  pull_request:
    paths:
      - library/**
      - schema.json
      - .github/workflows/library.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: library
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # check:updated compares with the base branch

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: library/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate procedures
        run: npm run validate

      # The vault's schema.json is in this repository: the library's copy and the field
      # registry built from it must follow it (make schema).
      - name: Vault schema
        run: npm run check:vault-schema

      - name: Check updated dates
        if: github.event_name == 'pull_request'
        run: npm run check:updated -- origin/${{ github.base_ref }}

      - name: Build site
        run: npm run build

  reports:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: library/reports/functions
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: library/reports/functions/package-lock.json

      - uses: actions/setup-java@v5 # the Firestore emulator runs on Java
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.34.1

      - name: Install
        run: |
          npm ci --ignore-scripts
          npm install --global firebase-tools@15.34.1

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test against the Firestore emulator
        run: npm run test:emulator
