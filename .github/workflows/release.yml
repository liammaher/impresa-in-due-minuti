name: Release

on:
  push:
    tags:
      - "v*"
  # The one button: Actions > Release > Run workflow on main releases the version plugin.json says.
  # It makes that tag itself (a tag pushed by the workflow's own token starts no second run).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # The tag this release is: the one pushed, or, from the button, v<plugin.json's version>, made here.
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF_NAME" != main ]; then
            echo "Run it on main: a release is cut from main only" >&2
            exit 1
          fi
          version=$(python3 -c 'import json; print(json.load(open("plugin/portali/.claude-plugin/plugin.json"))["version"])')
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null || gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is released already: bump version in plugin/portali/.claude-plugin/plugin.json first" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # plugin/build.yaml's `vault`: false, the release builds no pvault (no Touch ID helper, no
  # goreleaser archives) and the plugin it attaches ships none.
  switch:
    needs: tag
    runs-on: ubuntu-latest
    outputs:
      vault: ${{ steps.read.outputs.vault }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - id: read
        run: |
          set -euo pipefail
          vault=$(sed -n -E 's/^vault: *(true|false) *$/\1/p' plugin/build.yaml)
          if [ "$vault" != true ] && [ "$vault" != false ]; then
            echo "plugin/build.yaml: vault must be true or false" >&2
            exit 1
          fi
          echo "vault=$vault" >> "$GITHUB_OUTPUT"

  # The Touch ID helper needs Swift and a Mac: one universal binary (Apple silicon and Intel),
  # ad-hoc signed as `make touchid` does; the installer signs it again on the person's Mac.
  touchid:
    needs: [tag, switch]
    if: needs.switch.outputs.vault == 'true'
    runs-on: macos-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - name: Build pvault-touchid
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p touchid
          for arch in arm64 x86_64; do
            swiftc -O -swift-version 5 -target "$arch-apple-macos13" cmd/pvault-touchid/main.swift -o "touchid/h-$arch"
          done
          lipo -create -output touchid/pvault-touchid touchid/h-arm64 touchid/h-x86_64
          codesign -s - -f -o runtime touchid/pvault-touchid
          tar -czf "touchid/pvault-touchid_${version}_darwin_universal.tar.gz" -C touchid pvault-touchid
      - uses: actions/upload-artifact@v4
        with:
          name: touchid
          path: touchid/pvault-touchid_*.tar.gz

  release:
    needs: [tag, switch, touchid]
    # touchid is skipped when the plugin ships no archive.
    if: ${{ !cancelled() && needs.switch.result == 'success' && needs.touchid.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      VAULT: ${{ needs.switch.outputs.vault }}
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        if: env.VAULT == 'true'
        with:
          name: touchid
          path: touchid

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run tests
        run: go test -race ./...

      - uses: goreleaser/goreleaser-action@v6
        if: env.VAULT == 'true'
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Without the archive goreleaser doesn't run, so the release itself is made here.
      - name: Create the release (no archive)
        if: env.VAULT != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes

      # The plugin people install in Claude (plugin/): built from this tag and the pratiche-napoli
      # library, with this release's checksums (when it ships the archive) so its setup skill can
      # check the pvault download.
      # It is attached to the release as portali-<version>.zip.
      - uses: actions/checkout@v4
        with:
          repository: liammaher/pratiche-napoli
          path: pratiche-napoli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and attach the plugin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          manifest=$(python3 -c 'import json; print(json.load(open("plugin/portali/.claude-plugin/plugin.json"))["version"])')
          if [ "$manifest" != "$version" ]; then
            echo "plugin/portali/.claude-plugin/plugin.json says $manifest, the tag says $version: bump the plugin first" >&2
            exit 1
          fi
          python3 -m pip install pyyaml
          pin=()
          if [ "$VAULT" = true ]; then
            pin=(--pvault-version "$version" --pvault-checksums dist/checksums.txt)
          fi
          python3 plugin/build.py --library pratiche-napoli --out "$RUNNER_TEMP/plugin" "${pin[@]}"
          cp "$RUNNER_TEMP/plugin/portali.plugin" "portali-$version.zip"
          gh release upload "$TAG" "portali-$version.zip"
          echo "PLUGIN_VERSION=$version" >> "$GITHUB_ENV"

      # The zip stays on the release for Upload plugin; the marketplace installs the same build from
      # the `plugin` branch (tag plugin-v<version>), since the Claude app takes only git sources.
      - name: Publish the plugin to the plugin branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit=$(python3 plugin/publish_plugin.py --version "$PLUGIN_VERSION" --dir "$RUNNER_TEMP/plugin/portali" --push)
          echo "PLUGIN_COMMIT=$commit" >> "$GITHUB_ENV"

      # The marketplace file in the repository points at one release's commit of the plugin branch.
      # A pull request moves it to this one. If the repository doesn't let Actions open pull
      # requests, the release still stands: run plugin/pin_marketplace.py by hand.
      # A pull request this token opens runs its checks only once a maintainer approves them
      # (2026-11-07: "Some checks are waiting for approval", merge blocked): the body says how.
      - name: Open a pull request pinning the marketplace to this release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 plugin/pin_marketplace.py --version "$PLUGIN_VERSION" --commit "$PLUGIN_COMMIT"
          branch="release/marketplace-$PLUGIN_VERSION"
          git checkout -b "$branch"
          git add .claude-plugin/marketplace.json
          git commit -m "Marketplace: point at the $PLUGIN_VERSION plugin"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Marketplace: point at the $PLUGIN_VERSION plugin" \
            --body "Pins .claude-plugin/marketplace.json to plugin-v$PLUGIN_VERSION (commit $PLUGIN_COMMIT on the plugin branch). Merge it and adding the marketplace liammaher/portali gives this release. Its checks wait for approval (the workflow opened it): press Approve workflows to run, or gh api -X POST repos/$GITHUB_REPOSITORY/actions/runs/RUN_ID/approve; once they pass, an ordinary merge."
