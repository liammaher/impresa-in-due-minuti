name: Fill pilots

# fill.py fills the library's forms (library/) at its layouts: run the pilots (pilot/regress.py)
# whenever the filler, the vault it reads or the library's entries, layouts, offices or contract change.
# No scheduled run.
on:
  pull_request:
    paths:
      - claude/skills/pratica/fill/**
      - internal/**
      - schema.json
      - go.mod
      - go.sum
      - library/procedures/**
      - library/layouts/**
      - library/contract/**
      - library/offices/**
      - library/package-lock.json
      - .github/workflows/fill.yml
  push:
    branches: [main]
    paths:
      - claude/skills/pratica/fill/**
      - internal/**
      - schema.json
      - go.mod
      - go.sum
      - library/procedures/**
      - library/layouts/**
      - library/contract/**
      - library/offices/**
      - library/package-lock.json
      - .github/workflows/fill.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          npm --prefix library ci --omit=dev --ignore-scripts
          pip install pymupdf==1.27.2.3

      - name: Run the pilots
        run: python3 -I claude/skills/pratica/fill/pilot/regress.py
