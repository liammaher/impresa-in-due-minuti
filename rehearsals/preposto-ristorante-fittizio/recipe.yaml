# A change of preposto (the person holding the professional requirements) for a bar or restaurant outside the protected zones,
# as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-060-variazione-del-preposto-in-attivita-di-somministra.json), for the made-up ditta individuale of
# rehearsals/pizzeria-fittizia/fixture.json.
procedure: napoli/comune/variazione-preposto-somministrazione
title: "Variazione del preposto (la persona con i requisiti professionali) di un bar o ristorante, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-060-variazione-del-preposto-in-attivita-di-somministra
subject: impresa
operation: Variazione del preposto in attività di somministrazione e vendita di alimenti e bevande (quando non vi siano anche variazioni societarie)
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Esercizio di somministrazione di alimenti e bevande in zone NON tutelate], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Variazione del preposto in attività di somministrazione e vendita di alimenti e bevande (quando non vi siano anche variazioni societarie)"], confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per l'attività? Spunta tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "preposto ristorante {{business.denominazione}}"}
  diritti_euro: {type: number, question: "I diritti SUAP in euro (controlla la voce nel tariffario 2026; 0 se non dovuti)"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta tu le dichiarazioni sui requisiti di onorabilità e professionali, tasse comunali, consapevolezza (artt. 46-47) e informativa privacy: nella bozza controlla anche se il modulo chiede i dati del nuovo preposto, che non ho letto"
  - "Paga i diritti di segreteria, se dovuti, con pagoPA nella schermata di pagamento"
  - "Allega quanto chiede la schermata degli allegati dopo aver spuntato le dichiarazioni"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
