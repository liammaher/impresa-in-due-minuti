# CIL opere temporanee con autorizzazione paesaggistica ordinaria and a dichiarazione di utilizzo delle terre e rocce da scavo
# (art. 21 DPR 120/2017), three operations in one pratica on Napoli's SUE: rehearsals/cil-paesaggistica-ordinaria-fittizia's case
# with excavated soil that leaves a small site as a by-product. The dichiarazione adds two adempimenti
# and no section (catalogue/F839/sue-wizard.json `pairs`); the crawl is catalogue/F839/sections/sue-combo-cil-paesaggistica-ordinaria-dichiarazione-utilizzo.json.
# Everything else is cil-paesaggistica-ordinaria-fittizia's recipe and what the dichiarazione adds (parts/dichiarazione-utilizzo-terre.yaml).
extends: [cil-paesaggistica-ordinaria-fittizia, parts/dichiarazione-utilizzo-terre]
procedure: napoli/comune/cil-con-paesaggistica-ordinaria-e-dichiarazione-utilizzo-terre
title: "CIL opere temporanee con autorizzazione paesaggistica ordinaria e dichiarazione di utilizzo delle terre e rocce da scavo, SUE Napoli (tecnico con procura)"
crawl: sue-combo-cil-paesaggistica-ordinaria-dichiarazione-utilizzo
asks:
  descrizione: {default: "CIL ord. e terre e rocce {{c:identity.last_name}}"}
# cil-paesaggistica-ordinaria-fittizia's steps for the person (a recipe's `yours` replaces the one it extends), then the dichiarazione's.
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Spunti le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC (domicilio elettronico), consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "Paghi i diritti di {{ask.diritti_euro}} € prima della seconda compilazione (dopo le dichiarazioni): la ricevuta, firmata, va allegata in quella; il bollo prima dell'invio"
  - "I lavori iniziano solo quando il SUE comunica che l'autorizzazione paesaggistica è stata acquisita: la data di inizio è la prima possibile"
  - "Se è dovuta la notifica preliminare (art. 99 D.Lgs. 81/2008): la alleghi in Allegati liberi, firmata digitalmente (solo .p7m): la CIL non ha uno spazio di caricamento apposito"
  - "La dichiarazione di utilizzo (Allegato 6 DPR 120/2017) è il documento del portale in Allega documenti dopo aver spuntato le dichiarazioni: la firma il produttore, Claude la allega nella seconda compilazione (dopo le dichiarazioni); lo scavo inizia almeno 15 giorni dopo l'invio"
  - "Quando tutte le terre e rocce da scavo saranno state utilizzate, entro la validità della dichiarazione, presenti sul SUE la dichiarazione di avvenuto utilizzo (art. 7 DPR 120/2017)"
  - "Firmi e invii (Firma e invio); conservi la ricevuta"
answers:
  descrizione: PROVA NON INVIARE - CIL ord. e terre e rocce P6
