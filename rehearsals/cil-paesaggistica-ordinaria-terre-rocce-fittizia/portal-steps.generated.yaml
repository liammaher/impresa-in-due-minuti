    id: cila-impresa-dopo
    title: 'CILA and CIL: the firm can''t be left to be named later, though the form offers it'
    portal: 'Napoli''s SUE on impresainungiorno: the CILA''s quadro i) and the CIL''s quadro g) (salute e sicurezza), and their firm''s quadro (h, f)'
    what: The safety quadro offers "ricade nell'ambito di applicazione del d.lgs. 81/2008 ma si riserva di presentare le dichiarazioni di cui al presente quadro prima dell'inizio lavori", yet the firm's
      quadro has no line for a firm still to be chosen and the portal requires the firm's details (16 required boxes, the DURC ones among them) whatever the safety quadro says.
    law: The committente sends the firm's documents (DURC, the notifica preliminare, the check of the firm's fitness) before the works start (art. 90 c. 9 c D.Lgs. 81/2008), not necessarily with the filing;
      the permesso's and the SCIA's forms on the same portal let the firm be named later.
    checked: 2026-11-01, a run of a made-up CILA in the pane (rehearsals/cila-fittizia, answers-impresa-dopo) stopped on the firm's required boxes; InfoCamere's national CILA form has no such reservation
      (schema/sue-choices.json 009-012)
    choices:
    - 'File the CILA or CIL once the firm is chosen: Claude fills it then.'
    - Ask the SUE whether a CILA may be filed before the firm is chosen, and how.
    - 'Report the defect to the portal''s operator (InfoCamere''s impresainungiorno support) or the SUE: docs/portal-defects.md says what and how it was checked.'
    report: docs/portal-defects.md
  else: 'The CIL names its building firm: its quadro f) has no line for a firm still to be chosen, and the portal requires the firm''s details (seen 2026-11-01). File the CIL once the firm is chosen.'
- if: '{{ask.intervento|is_opere_temporanee}} {{ask.bene_culturale}}'
  value: '{{ask.soprintendenza_autorizzata}}'
  in:
  - 'true'
  else: 'On a bene culturale the works need the Soprintendenza''s authorization first (art. 21 c. 4 D.Lgs. 42/2004), and Napoli''s SUE portal has no procedure to ask for it with this pratica: request it
    from the Soprintendenza ABAP per il Comune di Napoli (by PEC to sabap-na@pec.cultura.gov.it, on its form ''Istanza per opere su immobili vincolati'', 16 euro bollo; up to 120 days, art. 22), then file
    this.'
- when: '{{ask.atti_da_acquisire|not}}'
  else: 'The CIL''s form has no request for assents for the SUE to acquire (only filings presented with it, quadro e): obtain them first (a nulla osta, an authorization), then file the CIL and attach them
    under Allegati liberi.'
- when: '{{ask.vincolo|is_art_134|not}}'
  else: 'The ordinaria''s form names only art. 136 and art. 142: a property protected by the piano paesaggistico alone (art. 134) needs a person to choose.'
- when: '{{ask.titolo|is_locatario|not}}'
  else: 'The ordinaria''s form offers only ownership, co-ownership, the condominio''s administrator or another real right: a tenant isn''t one.'
- if: '{{ask.bollo_esenzione|is_onlus}}'
  when: '{{ask.bollo_onlus_esercizio}}'
  else: 'The ONLUS exemption ended with the ONLUS regime on 1 January 2026, except for a tax year begun before then: an ex-ONLUS in the RUNTS is exempt as an ets.'
