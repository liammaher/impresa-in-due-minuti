# Closing a bar or restaurant outside the protected zones (cessazione, with the Reg. 852/2004
# update), as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-060-cessare-l-attivita.json), for the pizzeria rehearsal's
# made-up ditta individuale.
procedure: napoli/comune/cessazione-attivita-commerciale
title: "Cessazione di un bar o ristorante, SUAP Napoli (ditta individuale)"
comune: F839
sportello: suap
crawl: suap-060-cessare-l-attivita
subject: impresa
operation: Cessare l'attività
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Esercizio di somministrazione di alimenti e bevande in zone NON tutelate], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Cessare l'attività"], confirm: CONFERMA}
  - {screen: Scelta interventi eventuali, confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per l'attività? Spunti tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), non ancora mappata."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "cessazione {{business.denominazione}}"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
  diritti_euro: {type: number, question: "I diritti SUAP in euro", default: "0"}
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Spunti Lei le dichiarazioni: la casella di presa d'atto sotto la PEC, consapevolezza (artt. 46-47), informativa privacy, norme del Comune di Napoli (normative comunali), tasse comunali, art. 75 DPR 445/2000"
  - "Firmi e invii (Firma e invio); conservi la ricevuta"
# Which pratica a case is: the library's rules table (rules/suap-napoli.yaml) decides, and pre-flight
# refuses a case it gives to another pratica or that needs a pratica this one doesn't file.
rules:
  table: suap-napoli
  facts: {attivita: somministrazione, evento: cessazione}
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non ancora gestito."}
