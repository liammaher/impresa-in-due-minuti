  main: napoli/comune/scia-alternativa-pdc
  handles:
  - napoli/comune/rinnovo-autorizzazione-paesaggistica-semplificata
answers:
  descrizione: PROVA NON INVIARE - SCIA alt. + rinnovo paesaggistica P6
  paesaggio: rinnovo
