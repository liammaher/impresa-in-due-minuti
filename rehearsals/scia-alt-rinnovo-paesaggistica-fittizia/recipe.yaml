# SCIA alternativa e rinnovo paesaggistica: 2 operations in one pratica on Napoli's SUE (catalogue/F839/sue-pairs.yaml, reason
# authorization-keeps-pace). The case: scia-alt-paesaggistica-semplificata-fittizia's, with what rinnovo-paesaggistica-fittizia adds; the other's answers fill
# what the main's don't say (gen.py combo_answers). The rules table sue-napoli routes it.
extends:
- scia-alt-paesaggistica-semplificata-fittizia
- rinnovo-paesaggistica-fittizia
procedure: napoli/comune/scia-alternativa-pdc-con-rinnovo-autorizzazione-paesaggistica-semplificata
title: SCIA alternativa e rinnovo paesaggistica in una pratica, SUE Napoli (tecnico con procura)
comune: F839
sportello: sue
crawl: sue-combo-scia-alt-rinnovo-paesaggistica
operation:
- Segnalazione Certificata Inizio Attività alternativa al Permesso di Costruire (S.C.I.A. alternativa P.d.C.)
- Rinnovo Autorizzazione Paesaggistica Semplificata  (DPR 31/2017 - Comune)
scelte:
- IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE
first:
- Scheda anagrafica
- Qualifica e dati del procuratore
after:
- Pagamento degli oneri
- Gestione degli allegati
asks:
  descrizione:
    default: SCIA alt. + rinnovo paesaggistica {{c:identity.last_name}}
  diritti_euro:
    question: "I diritti del SUE in euro: la tabella 2026 non indica la voce per questo caso (il contributo lo calcola il SUE, o è esattamente 5.000 €). Pratica onerosa, SUE 7-9 in base al contributo: 1003 fino a 5.000 €, 1505 da 5.000 a 30.000 €, 1998 oltre"
    propose: "{{ask.scia_onerosa,ask.contributo_fascia|diritti_scia_alt}}"
    why: "Voci del tariffario 2026 dei diritti SUE del Comune (G.C. 239/2026): SUE 10, 401 € se non soggetta al contributo; se onerosa, SUE 7-9 in base al contributo (oneri di urbanizzazione + costo di costruzione): 1.003 € fino a 5.000 €, 1.505 € da 5.000 a 30.000 €, 1.998 € oltre"
yours:
- "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
- "Spunta le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC, b) PER PRESA VISIONE, m) diritti di terzi, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
- 'In qualità di progettista, verifica ogni asseverazione di questa pagina: sono tue, e le firmi con la pratica'
- "Prima dell'inizio dei lavori, nomina chi la pratica lascia da nominare (il direttore dei lavori, il direttore dei lavori strutturali, l'impresa) con la comunicazione di nomina del SUE"
- "Paga il bollo come chiede il portale, poi firma e invia (Firma e invio); conserva la ricevuta"
- "I 30 giorni prima dell'inizio dei lavori decorrono dal rilascio dell'autorizzazione paesaggistica, non dalla presentazione (art. 23 c. 3 DPR 380/2001); il contributo, se dovuto, si paga come indica il quadro g)"
- "Spunta le dichiarazioni del dichiarante: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, e le prese visione a nome del committente"
- "Firma e invia (Firma e invio); conserva la ricevuta"
rules:
  table: sue-napoli
  question: Quali di queste cose valgono per i lavori? Spunta quelle vere, anche nessuna.
  facts:
    permesso_per_scelta: 'false'
