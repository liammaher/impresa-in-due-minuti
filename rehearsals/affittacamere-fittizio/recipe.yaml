# The SUAP's opening of rooms to let or a B&B (SCIA per strutture ricettive extralberghiere), as
# gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-056-aprire-l-attivita.json), for this folder's made-up ditta
# individuale (fixture.json). Its own sections (type, name, season, services, rooms) were written
# from the crawl and mod_attivita_extra_alberghiere_apertura.
procedure: napoli/comune/avvio-bed-and-breakfast
title: "SCIA: apertura di un affittacamere o B&B, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-056-aprire-l-attivita
subject: impresa
operation: Aprire l'attività
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
after: [Pagamento degli oneri, Gestione degli allegati]
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: ["Strutture ricettive extralberghiere (affittacamere, bed and breakfast, case e appartamenti per vacanze, case per ferie, case religiose di ospitalità, ostelli per la gioventù, residenze rurali o country house, rifugi di montagna)"], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Aprire l'attività"], confirm: CONFERMA}
  - {screen: Scelta interventi eventuali, confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per la struttura ricettiva? Spunti tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), non ancora mappata."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "camere {{business.denominazione}}"}
  grande: {group: extras, type: yes_no, item: "Più di 25 posti letto, o soggetta ai controlli di prevenzione incendi", why: "Ciò comporta la SCIA di prevenzione incendi, un caso non ancora gestito."}
  alcolici: {group: extras, type: yes_no, item: "Venderà bevande alcoliche", why: "La vendita di alcolici comporta la comunicazione alle Dogane, un caso non ancora gestito."}
  insegna_esterna: {group: extras, type: yes_no, item: "Avrà un'insegna esterna", why: "Un'insegna esterna include in questa la SCIA dell'insegna, un ramo non ancora mappato."}
  servizi: {group: extras, type: yes_no, item: "Una piscina, un centro estetico, una palestra o un negozio per gli ospiti o per il pubblico", why: "Those services aren't mapped yet."}
  diritti_euro: {type: number, question: "I diritti SUAP in euro", default: "200", why: "La voce S94 del tariffario 2026 per una struttura ricettiva extralberghiera senza notifica sanitaria."}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Spunti Lei le dichiarazioni: consapevolezza (artt. 46-47), informativa privacy, requisiti di onorabilità, altre dichiarazioni, tasse comunali, art. 75 DPR 445/2000"
  - "Paghi i diritti di segreteria (€ {{ask.diritti_euro}}) con pagoPA nella schermata di pagamento"
  - "Firmi e invii (Firma e invio); conservi la ricevuta"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non ancora gestito."}
  - {when: "{{ask.grande|not}}", else: "Le strutture con più di 25 posti letto o soggette ai controlli di prevenzione incendi non sono ancora gestite."}
  - {when: "{{ask.alcolici|not}}", else: "La vendita di alcolici non è ancora gestita: aggiunge alla pratica la comunicazione alle Dogane."}
  - {when: "{{ask.insegna_esterna|not}}", else: "Un'insegna esterna non è ancora gestita: include in questa la SCIA dell'insegna."}
  - {when: "{{ask.servizi|not}}", else: "Piscina, centro estetico, palestra o negozio non sono ancora gestiti."}
  - {when: "{{ask.colazione|is_nessuna}}", else: "Gli alimenti per gli ospiti non sono ancora gestiti: aggiungono la somministrazione agli ospiti (e, se preparati, la notifica Reg. 852)."}
