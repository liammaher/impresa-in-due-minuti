# A CILA with its autorizzazione paesaggistica ordinaria in one pratica on Napoli's SUE: the CILA
# rehearsal's P6 job (rehearsals/cila-fittizia) with a 45 m² timber pergola on the roof terrace of
# a protected building (over B.17's 30 m², so outside DPR 31/2017's Allegato B: art. 146). Two
# operations: gen.py takes each one's sections from the catalogue and the order from the
# combination's crawl (catalogue/F839/sections/sue-combo-cila-paesaggistica-ordinaria.json).
# Everything else is cila-fittizia's recipe and what the ordinaria adds (parts/paesaggistica-ordinaria.yaml):
# a slot or a refusal mapped on either reaches this one.
extends: [cila-fittizia, parts/paesaggistica-ordinaria]
procedure: napoli/comune/cila-con-paesaggistica-ordinaria
title: "CILA con autorizzazione paesaggistica ordinaria, SUE Napoli (tecnico con procura)"
crawl: sue-combo-cila-paesaggistica-ordinaria
asks:
  descrizione: {default: "CILA e paesaggistica {{c:identity.last_name}}"}
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Spunti le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC (domicilio elettronico), c) PER PRESA VISIONE, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "Paghi i diritti prima della seconda compilazione (dopo le dichiarazioni): la ricevuta, firmata, va allegata in quella; il bollo prima dell'invio. La sanzione della CILA tardiva si paga prima della prima compilazione: la sua ricevuta è nel quadro d)"
  - "La pergola si realizza solo quando il SUE comunica che l'autorizzazione paesaggistica è stata rilasciata"
  - "Firmi e invii (Firma e invio); conservi la ricevuta"
attachments:
  Gestione degli allegati:
    # The ordinaria's second relazione slot opens from the SCIA's and the permesso's asseverazione
    # ("Si allega la relazione paesaggistica e la documentazione"): this form has no such box.
    - {label: Relazione paesaggistica e documentazione per il rilascio, drop: true}
# The case: the main pratica's P6 answers, the part's, then these (a null drops one);
# `gen.py --answers` writes answers-p6.json.
answers:
  descrizione: PROVA NON INVIARE - CILA e ordinaria P6 generato
  oggetto: 'Manutenzione straordinaria non strutturale in appartamento: demolizione e ricostruzione di due tramezzi interni con nuova distribuzione di cucina e bagno, nuovo bagno, rifacimento degli impianti idrico ed elettrico; pergolato in legno di 45 m² sul lastrico solare (dati inventati per la prova).'
