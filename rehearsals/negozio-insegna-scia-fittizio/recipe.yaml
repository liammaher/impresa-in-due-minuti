# The SUAP's opening of a non-food shop with an outside sign where the sign needs a SCIA (the wizard's
# "in caso di attività che preveda insegna esterna (dove è prevista la SCIA)", the second of the two sign
# options: the first, the comunicazione, is rehearsals/negozio-insegna-fittizio), as gen.py writes its steps
# file from the batch crawl (catalogue/F839/sections/suap-016-aprire-l-attivita-interventi.json), for the
# shop rehearsal's made-up ditta individuale (rehearsals/negozio-fittizio/fixture.json). The sign's six
# sections (place, structure, installer, designer, director of works, title) were written from the crawl's
# text and what each choice opens; the attachments and payment screens are not read (no `after:`). The crawl was
# taken with the sign's tick on, so its sections are the base ones: no `scelte:`.
procedure: napoli/comune/scia-esercizio-vicinato
title: "SCIA: apertura di un negozio di vicinato non alimentare con la SCIA per l'insegna esterna, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-016-aprire-l-attivita-interventi
subject: impresa
operation: Aprire l'attività
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Vicinato - settore merceologico NON alimentare], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Aprire l'attività"], confirm: CONFERMA}
  - {screen: Scelta interventi eventuali, tree: [{leaf: "in caso di attività che preveda insegna esterna (dove è prevista la SCIA)", nth: 1}], confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per il negozio? Spunta tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "negozio insegna scia {{business.denominazione}}"}
  titolo_attivita_protocollo: {type: text, question: "La pratica chiede per l'insegna gli estremi del titolo dell'attività: il numero di protocollo (l'apertura è presentata insieme e non ne ha ancora uno: chiedi al SUAP cosa indicare)"}
  insegna_vincolo: {group: extras, type: yes_no, item: "L'edificio è sottoposto a tutela paesaggistica o monumentale", why: "In tal caso l'insegna richiede una propria autorizzazione, caso non ancora previsto."}
  insegna_zona_a: {group: extras, type: yes_no, item: "L'installazione ricade in zona A del PRG (il centro storico)", why: "In zona A la SCIA dell'insegna ha altre condizioni, che non preparo ancora."}
  insegna_grande: {group: extras, type: yes_no, item: "Le insegne superano complessivamente 5 m²", why: "Oltre 5 m² è dovuto anche il canone unico: un pagamento a parte, che non preparo ancora."}
  alcolici: {group: extras, type: yes_no, item: "Venderà bevande alcoliche", why: "La vendita di alcolici comporta la comunicazione alle Dogane: un caso che non preparo ancora."}
  speciali: {group: extras, type: yes_no, item: "Venderà armi, metalli preziosi, prodotti fitosanitari, medicinali o mangimi", why: "Ciascuna aggiunge alla pratica una propria autorizzazione o SCIA: rami non ancora mappati."}
  in_centro_commerciale: {type: yes_no, question: "Il negozio si trova all'interno di un centro commerciale?", default: "false", why: "Napoli chiede il tipo di centro commerciale, che non preparo ancora."}
  diritti_euro: {type: number, question: "I diritti SUAP in euro (100 per il negozio e 100 per l'insegna, S204: sommati per una pratica congiunta, da confermare)"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta tu le dichiarazioni sull'insegna (ulteriori dichiarazioni, mezzi pubblicitari)"
  - "Controlla nella bozza gli estremi del titolo dell'attività che la pratica chiede per l'insegna (la dichiarazione sui titoli abilitanti): l'apertura è presentata insieme e non ha ancora un numero di protocollo, quindi chiedi al SUAP cosa indicare"
  - "Spunta tu le dichiarazioni: consapevolezza (artt. 46-47), informativa privacy, requisiti di onorabilità, altre dichiarazioni, tasse comunali, art. 75 DPR 445/2000"
  - "Paga i diritti di segreteria (€ {{ask.diritti_euro}}) con pagoPA nella schermata di pagamento"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
  - {when: "{{ask.insegna_vincolo|not}}", else: "Un'insegna su un edificio vincolato richiede una propria autorizzazione, che non preparo ancora."}
  - {when: "{{ask.insegna_zona_a|not}}", else: "In zona A del PRG (il centro storico) la SCIA dell'insegna ha altre condizioni, che non preparo ancora."}
  - {when: "{{ask.insegna_grande|not}}", else: "Le insegne oltre 5 m² pagano anche il canone unico, che non preparo ancora."}
  - {when: "{{ask.speciali|not}}", else: "Armi, metalli preziosi, prodotti fitosanitari, medicinali o mangimi non sono ancora previsti."}
  - {when: "{{ask.in_centro_commerciale|not}}", else: "Un negozio all'interno di un centro commerciale per ora non lo preparo: Napoli chiede la tipologia del centro."}
  - {when: "{{ask.in_factory_outlet|not}}", else: "Un negozio in un factory outlet non lo preparo ancora."}
  - {when: "{{ask.superficie_alimentare_mq|positive|not}}", else: "Questa è la pratica del negozio non alimentare: un negozio che vende alimenti presenta quella del settore alimentare (con la notifica ai sensi del Reg. 852)."}
