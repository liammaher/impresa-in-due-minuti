# A SCIA alternativa al permesso di costruire with its autorizzazione paesaggistica semplificata in one
# pratica on Napoli's SUE: the two operations selected together in the wizard, as for the SCIA
# and the permesso (rehearsals/pdc-paesaggistica-semplificata-fittizio). gen.py takes each one's sections
# from the catalogue and the order from the combination's crawl
# (catalogue/F839/sections/sue-combo-scia-alt-paesaggistica-semplificata.json); every section is one of
# theirs. The SCIA alternativa's people and cases are rehearsals/scia-alternativa-fittizia's; its
# asseverazione names the semplificata procedure.
# Everything else is scia-alternativa-fittizia's recipe and what the semplificata adds (parts/paesaggistica-semplificata.yaml):
# a slot or a refusal mapped on either reaches this one.
extends: [scia-alternativa-fittizia, parts/paesaggistica-semplificata]
procedure: napoli/comune/scia-alternativa-pdc-con-paesaggistica-semplificata
title: "SCIA alternativa al permesso di costruire con autorizzazione paesaggistica semplificata, SUE Napoli (tecnico con procura)"
crawl: sue-combo-scia-alt-paesaggistica-semplificata
asks:
  descrizione: {default: "SCIA alt e paesaggistica {{c:identity.last_name}}"}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC, b) PER PRESA VISIONE, m) diritti di terzi, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "In qualità di progettista, verifica ogni asseverazione di questa pagina: sono tue, e le firmi con la pratica"
  - "Prima dell'inizio dei lavori, nomina chi la pratica lascia da nominare (il direttore dei lavori, il direttore dei lavori strutturali, l'impresa) con la comunicazione di nomina del SUE"
  - "Paga il bollo come chiede il portale, poi firma e invia (Firma e invio); conserva la ricevuta"
  - "I 30 giorni prima dei quali i lavori non possono iniziare decorrono dal rilascio dell'autorizzazione paesaggistica, non dalla presentazione (art. 23 c. 3 DPR 380/2001); il contributo, se dovuto, si paga come indica il quadro g)"
# The case: the main pratica's P6 answers, the part's, then these (a null drops one);
# `gen.py --answers` writes answers-p6.json.
answers:
  oggetto: Ristrutturazione edilizia con modifica dei prospetti e ampliamento entro il 10% del volume e 100 m³ di un edificio residenziale, in area vincolata (dati inventati per la prova).
  dettaglio_intervento: Ristrutturazione edilizia con modifica dei prospetti e ampliamento sul retro di 25 m³ (meno del 10% del volume originario); consolidamento strutturale, nuovi impianti elettrico e idrico. Dati inventati per la prova.
  descrizione: PROVA NON INVIARE - SCIA alt ampliamento e semplificata
  allegato_b:
  - paes_b1
  - paes_b3
