# CILA e rinnovo paesaggistica: 2 operations in one pratica on Napoli's SUE (catalogue/F839/sue-pairs.yaml, reason
# authorization-keeps-pace). The case: cila-paesaggistica-fittizia's, with what rinnovo-paesaggistica-fittizia adds; the other's answers fill
# what the main's don't say (gen.py combo_answers). The rules table sue-napoli routes it.
extends:
- cila-paesaggistica-fittizia
- rinnovo-paesaggistica-fittizia
procedure: napoli/comune/cila-lavori-edilizi-con-rinnovo-autorizzazione-paesaggistica-semplificata
title: CILA e rinnovo paesaggistica in una pratica, SUE Napoli (tecnico con procura)
comune: F839
sportello: sue
crawl: sue-combo-cila-rinnovo-paesaggistica
operation:
- Comunicazione Inizio Lavoro Asseverata (C.I.L.A.)
- Rinnovo Autorizzazione Paesaggistica Semplificata  (DPR 31/2017 - Comune)
scelte:
- IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE
first:
- Scheda anagrafica
- Qualifica e dati del procuratore
after:
- Pagamento degli oneri
- Gestione degli allegati
asks:
  descrizione:
    default: PROVA NON INVIARE - CILA + rinnovo paesaggistica {{c:identity.last_name}}
  diritti_euro:
    default: '{{ask.cila_stato|diritti_cila}}'
    why: 'Line SUE 13 of the Comune''s 2026 table of SUE diritti (G.C. 239/2026): 151 € for a CILA; SUE 15: 166
      € for one filed once the works started (mancata CILA)'
yours:
- Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page
- 'Tick the dichiarante''s declarations: the awareness box under the PEC (domicilio elettronico), c) PER PRESA VISIONE,
  consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000'
- 'Pay the diritti before the second run (after the declarations): its receipt, signed, goes with it; the bollo
  before sending. A late CILA''s penalty is paid before the first run: its receipt is in quadro d)'
- 'Tick the dichiarante''s declarations: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, and
  the acknowledgements in the client''s name'
- Sign and send (Firma e invio); keep the receipt
rules:
  table: sue-napoli
  question: Quali di queste cose valgono per i lavori? Spunta quelle vere, anche nessuna.
  facts:
