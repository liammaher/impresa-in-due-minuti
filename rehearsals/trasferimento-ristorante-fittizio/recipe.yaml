# A bar or restaurant outside the protected zones moving to new premises (SCIA di trasferimento
# with the Reg. 852/2004 notifica for the new premises), as gen.py writes its steps file from the
# batch crawl (catalogue/F839/sections/suap-060-trasferire-la-sede-dell-attivita.json), for the
# pizzeria rehearsal's made-up ditta individuale (rehearsals/pizzeria-fittizia/fixture.json):
# the vault's `locale` is the new premises, the old ones are asked.
procedure: napoli/comune/scia-somministrazione-alimenti-bevande
title: "SCIA: trasferimento di un bar o ristorante (somministrazione) con notifica sanitaria, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-060-trasferire-la-sede-dell-attivita
subject: impresa
operation: Trasferire la sede dell'attività
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
# The payment and attachments screens: its slots read on a filled draft (2026-11-10), every one
# but Allegati liberi taking only signed files: the person's.
after: [Pagamento degli oneri, Gestione degli allegati]
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Esercizio di somministrazione di alimenti e bevande in zone NON tutelate], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Trasferire la sede dell'attività"], confirm: CONFERMA}
  - {screen: Scelta interventi eventuali, confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per l'attività? Spunta tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "trasferimento {{business.denominazione}}"}
  alcolici: {group: extras, type: yes_no, item: "Venderà bevande alcoliche, birra e vino compresi", why: "La vendita di alcolici aggiunge la comunicazione alle Dogane: un caso che non preparo ancora."}
  musica: {group: extras, type: yes_no, item: "Avrà musica o un impianto audio nei nuovi locali", why: "La musica comporta la documentazione di impatto acustico: un caso che non preparo ancora."}
  insegna_esterna: {group: extras, type: yes_no, item: "Avrai un'insegna esterna nei nuovi locali", why: "Un'insegna esterna include in questa la SCIA dell'insegna: per ora non la preparo."}
  diritti_euro: {type: number, question: "I diritti SUAP in euro", default: "96", why: "La colonna VCA della tabella 2026 (variazioni, trasferimento compreso) per un bar o ristorante fuori dalle zone tutelate con la notifica sanitaria (S72)."}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta tu le dichiarazioni: consapevolezza (artt. 46-47), informativa privacy, altre dichiarazioni, art. 6 Reg. 852/2004, tasse comunali, art. 75 DPR 445/2000"
  - "Paga i diritti di segreteria (€ {{ask.diritti_euro}}) con pagoPA nella schermata di pagamento, e la tariffa forfettaria ASL"
  - "Allega, firmati con la tua firma digitale (.p7m), quanto chiede la schermata degli allegati dopo aver spuntato le dichiarazioni (la planimetria dei nuovi locali, la ricevuta della tariffa ASL)"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
# Which pratica a case is: the library's rules table (rules/suap-napoli.yaml) decides, and pre-flight
# refuses a case it gives to another pratica or that needs a pratica this one doesn't file.
rules:
  table: suap-napoli
  facts: {attivita: somministrazione, evento: trasferimento, insegna: "{{ask.insegna_esterna}}"}
  handles: [napoli/asl-napoli-1/registrazione-attivita-alimentare]
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
  - {when: "{{ask.ristorazione}}", else: "Per ora solo bar o ristorante: le altre voci di attività della notifica non sono gestite."}
  - {when: "{{ask.forno|not}} {{ask.dettaglio_alimenti|not}}", else: "Un bar o ristorante che produce anche prodotti da forno o gestisce un negozio alimentare per ora non lo preparo: queste voci insieme non sono ancora state mappate."}
