# The SUAP's opening of a non-food shop (SCIA per l'esercizio di vicinato, settore NON
# alimentare), as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-016-aprire-l-attivita.json), for this folder's made-up ditta
# individuale (fixture.json). Its one own section, the shop's data, was drafted by draft.py from
# mod_esercizio_vicinato_apertura and checked by hand.
procedure: napoli/comune/scia-esercizio-vicinato
title: "SCIA: apertura di un negozio di vicinato non alimentare, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-016-aprire-l-attivita
subject: impresa
operation: Aprire l'attività
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
after: [Pagamento degli oneri, Gestione degli allegati]
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Vicinato - settore merceologico NON alimentare], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Aprire l'attività"], confirm: CONFERMA}
  - {screen: Scelta interventi eventuali, confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per il negozio? Spunti tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), non ancora mappata."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "negozio {{business.denominazione}}"}
  alcolici: {group: extras, type: yes_no, item: "Venderà bevande alcoliche", why: "La vendita di alcolici comporta la comunicazione alle Dogane, un caso non ancora gestito."}
  speciali: {group: extras, type: yes_no, item: "Venderà armi, metalli preziosi, prodotti fitosanitari, medicinali o mangimi", why: "Ciascuna aggiunge alla pratica una propria autorizzazione o SCIA: rami non ancora mappati."}
  in_centro_commerciale: {type: yes_no, question: "Il negozio si trova all'interno di un centro commerciale?", default: "false", why: "Napoli chiede il tipo di centro commerciale, non ancora gestito."}
  diritti_euro: {type: number, question: "I diritti SUAP in euro", default: "100", why: "La voce del tariffario 2026 per l'apertura di un negozio non alimentare (DGC 239/2026)."}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Spunti Lei le dichiarazioni: consapevolezza (artt. 46-47), informativa privacy, requisiti di onorabilità, altre dichiarazioni, tasse comunali, art. 75 DPR 445/2000"
  - "Paghi i diritti di segreteria (€ {{ask.diritti_euro}}) con pagoPA nella schermata di pagamento"
  - "Firmi e invii (Firma e invio); conservi la ricevuta"
# Which pratica a case is: the library's rules table (rules/suap-napoli.yaml) decides, and pre-flight
# refuses a case it gives to another pratica or that needs a pratica this one doesn't file.
rules:
  table: suap-napoli
  facts: {attivita: vicinato_non_alimentare, evento: apertura}
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non ancora gestito."}
  - {when: "{{ask.speciali|not}}", else: "Armi, metalli preziosi, prodotti fitosanitari, medicinali o mangimi non sono ancora previsti."}
  - {when: "{{ask.in_centro_commerciale|not}}", else: "Un negozio all'interno di un centro commerciale non è ancora gestito: Napoli chiede la tipologia del centro."}
  - {when: "{{ask.in_factory_outlet|not}}", else: "A shop in a factory outlet centre isn't supported yet."}
  - {when: "{{ask.superficie_alimentare_mq|positive|not}}", else: "Questa è la pratica del negozio non alimentare: un negozio che vende alimenti presenta quella del settore alimentare (con la notifica ai sensi del Reg. 852)."}
