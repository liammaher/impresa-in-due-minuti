# proroga straordinaria inizio e paesaggistica ordinaria: 2 operations in one pratica on Napoli's SUE (catalogue/F839/sue-pairs.yaml, reason
# authorization-keeps-pace). The case: proroga-straordinaria-inizio-fittizia's, with what paesaggistica-ordinaria-fittizia adds; the other's answers fill
# what the main's don't say (gen.py combo_answers). The rules table sue-napoli-adempimenti routes it.
extends:
- proroga-straordinaria-inizio-fittizia
- paesaggistica-ordinaria-fittizia
procedure: napoli/comune/proroga-straordinaria-inizio-lavori-con-autorizzazione-paesaggistica-ordinaria
title: Proroga straordinaria inizio e paesaggistica ordinaria in una pratica, SUE Napoli (tecnico con procura)
comune: F839
sportello: sue
crawl: sue-combo-proroga-straordinaria-inizio-paesaggistica-ordinaria
operation:
- Comunicazione integrativa proroga straordinaria trenta mesi inizio lavori (art. 10 septies, Legge 51/2022)
- Autorizzazione paesaggistica ordinaria (art.146 del D.Lgs 42/2004 - Comune)
scelte:
- option: in assenza di titolarità esclusiva all'esecuzione dell'intervento edilizio, si dispone della dichiarazione
    di assenso dei terzi titolari di altri diritti reali o obbligatori
  when: '{{ask.titolo_esclusivo|not}}'
- IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE
first:
- Scheda anagrafica
- Qualifica e dati del procuratore
after:
- Pagamento degli oneri
- Gestione degli allegati
asks:
  descrizione:
    default: PROVA NON INVIARE - pror. straord. inizio + paes. ord. {{c:identity.last_name}}
  diritti_euro:
    why: "The Comune's 2026 table of SUE diritti (G.C. 239/2026) has no row for an art. 10-septies communication: SUE 11 (501 €) names the proroghe of permessi di costruire rilasciati, and whether it covers a communication that asks for no decision (or one on another title) is for the SUE to say (library pitfall)"
yours:
- Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page
- 'Tick the dichiarante''s declarations: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, and
  any acknowledgement in the client''s name'
- 'No imposta di bollo to pay on this form: the portal''s form for this pratica has no bollo section or slot'
- 'Tick the dichiarante''s declarations: consapevolezza (artt. 46-47), informativa privacy, tasse comunali'
- Sign and send (Firma e invio); keep the receipt
