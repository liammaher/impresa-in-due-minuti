procedure: napoli/comune/permesso-in-sanatoria-con-accertamento-paesaggistico
title: Permesso di costruire in sanatoria con accertamento di compatibilità paesaggistica, SUE Napoli (tecnico con procura)
generated: gen.py from sue-combo-pdc-sanatoria-accertamento (2026-11-02) and dictionary/fnsuap.yaml
yours:
- Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page
- 'Tick the dichiarante''s declarations: the awareness box under the PEC, j) diritti di terzi, consapevolezza (artt. 46-47), informativa privacy, art. 181 (PER PRESA VISIONE), tasse comunali, art. 75 DPR
  445/2000'
- 'As progettista, check every asseverazione on this page: the portal makes them the Relazione tecnica di asseverazione you sign with the request. Its landscape quadro says the works alter the place and
  ticks none of its three procedures: the compatibility is the accertamento filed with it (state so in the relazione tecnica)'
- 'The asseverazione''s "non interessa aree percorse dal fuoco" (qualità terreni) is one choice with the soil statement on the portal: Claude ticks the soil statement and leaves it (a portal defect, docs/portal-defects.md);
  state it in the relazione tecnica if the SUE wants it'
- 'On Allega documenti: the portal''s procura signed by the client and the Quadro riepilogativo (PdC DSC), the Elaborati richiesti per la sanatoria (stato legittimo, stato di fatto and the comparison, the
  difformità in red as the SUE''s guidelines ask), the relazione paesaggistica (DPCM 12/12/2005), the drawings of the state as it is with the materials and the photos of the context, the scheda professionisti
  e imprese, then everything signed digitally (.p7m)'
- '{{ask.bollo_marche,ask.bollo_esenzione|bollo_yours}}'
- Sign and send (Firma e invio); keep the receipt
- 'The Comune decides the compatibility first, with the Soprintendenza''s binding parere: if it''s found, pay the sum it sets (art. 167 c. 5 D.Lgs. 42/2004, the greater of the damage and the profit); if
  not, the works must be removed and the permesso in sanatoria can''t be issued'
- 'Once the permesso is granted: pay the oblazione it determines (twice the contributo di costruzione, art. 36 c. 2) and collect the permesso in sanatoria'
