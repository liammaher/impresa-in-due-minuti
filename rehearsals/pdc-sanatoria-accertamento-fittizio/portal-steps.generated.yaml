supports:
- value: '{{ask.incentivo_energetico}}'
  in:
  - art 14 c6
  - art 14 c7
  - bonus volumetrico
  else: 'The permesso''s form on the portal wants one energy incentive claimed (art. 14 c. 6 or 7 D.Lgs. 102/2014, or the 5% bonus of D.Lgs. 28/2011) even with no energy works: a project with none can''t
    be filed on it as is; ask the SUE.'
- value: '{{ask.pdc_sanatoria_caso}}'
  in:
  - assenza
  defect:
    id: pdc-36bis
    title: 'Permesso in sanatoria, art. 36-bis: the portal saves one of the statements'
    portal: 'Napoli''s SUE on impresainungiorno: the permesso''s asseverazione, sanatoria quadro'
    what: 'The documents attached, the date of the works (documents or attestation) and the works proposal are one radio group: ticking one unticks the others.'
    law: Art. 36-bis DPR 380/2001 asks for the date of the works, the oblazione and whether works are proposed, together.
    checked: 2026-10-30, by hand on a made-up draft
    choices:
    - Ask the SUE how they want this permesso in sanatoria filed while the portal can't take it.
    - 'Report the defect to the portal''s operator or the SUE: docs/portal-defects.md says what.'
    - 'File it on the portal yourself, by hand, as the SUE tells you: Claude doesn''t fill this case.'
    report: docs/portal-defects.md
  else: 'Only art. 36 (works without the permesso or in total difformity) is mapped. Under art. 36-bis the portal''s asseverazione makes the documents attached, the date of the works and the works proposal
    one radio choice, so it can''t state the case in full: a defect of the portal (docs/portal-defects.md); ask the SUE.'
- if: '{{ask.scia_onerosa}}'
  value: '{{ask.contributo_pagamento}}'
  in:
  - prima dei lavori
  else: 'In sanatoria the release is subordinate to paying the oblazione (art. 36 c. 2, art. 36-bis c. 5): it''s paid when the permesso is collected, not in instalments or during works already done.'
- if: '{{ask.strutture}}'
  value: '{{ask.sismica}}'
  in:
  - autorizzazione
  else: 'Works on structures begun without the seismic filing always need the autorizzazione sismica in Campania, never the deposito or a variant filing (art. 4 c. 1 e L.R. 9/1983): the sismica answer is
    autorizzazione, filed with the Genio Civile.'
- when: '{{ask.vincolo|is_art_134|not}}'
  else: 'The accertamento''s form names only art. 136 and art. 142: a property protected by the piano paesaggistico alone (art. 134) needs a person to choose.'
- when: '{{ask.titolo|is_locatario|not}}'
  else: 'The accertamento''s form offers only ownership, co-ownership, the condominio''s administrator or another real right: a tenant isn''t one.'
- when: '{{ask.paesaggio_accertamento|not}}'
  defect:
    id: pdc-36-paesaggio
    title: 'Permesso in sanatoria (art. 36) in a protected area: the landscape quadro has no line for the accertamento of art. 167'
    portal: 'Napoli''s SUE on impresainungiorno: the permesso''s asseverazione, quadro 16 (bene sottoposto ad autorizzazione paesaggistica), in the pratica that selects the permesso, its sanatoria and the
      accertamento di compatibilità paesaggistica together'
    what: For works that alter the place the quadro requires one of three procedures (semplificata, ordinaria, the accertamento of art. 36-bis), none of which is the accertamento of art. 167 that works
      done without the permesso need, though the portal lets that accertamento be selected with the permesso in the same pratica.
    law: Works done without the permesso (art. 36 DPR 380/2001) in a protected area are legalized only with their landscape compatibility found (art. 146 c. 4 D.Lgs. 42/2004), by the accertamento of art.
      167 c. 4-5; the binding parere of art. 36-bis c. 4 is for partial difformity and essential variations only.
    checked: '2026-11-02, a made-up run in the pane (rehearsals/pdc-sanatoria-accertamento-fittizio): with the alteration ticked and no procedure, Salva answered "il valore è obbligatorio" on all three'
    choices:
    - Ask the SUE (Comune di Napoli, Sportello Unico Edilizia) how they want the permesso's landscape quadro stated for an art. 36 sanatoria with the accertamento filed in the same pratica.
    - 'Report the defect to the portal''s operator (InfoCamere''s impresainungiorno support) or the SUE: docs/portal-defects.md says what and how it was checked.'
    - 'File it on the portal yourself, by hand, as the SUE tells you: Claude doesn''t fill this case.'
    report: docs/portal-defects.md
  else: 'The permesso''s asseverazione on the portal requires one of three landscape procedures (semplificata, ordinaria, the accertamento of art. 36-bis) for works that alter the place, and none is the
    accertamento of art. 167 an art. 36 sanatoria needs: a defect of the portal (docs/portal-defects.md); ask the SUE.'
- value: '{{ask.pdc_tipo}}'
  in:
  - nuova costruzione
  - ristrutturazione urbanistica
  - ristrutturazione edilizia
  - facolta scia
  - variante essenziale
  - variante sagoma
  - sottotetti
  - parcheggi
  - mutamento uso
  - altro
  else: The piano casa (L.R. Campania 19/2009) takes no new requests since 30 September 2022 (L.R. 31/2021 art. 28 c. 6; L.R. 13/2022 art. 4 c. 17 decides only those pending then). A variant to a permesso
    issued under it isn't mapped.
- if: '{{ask.pdc_tipo|is_mutamento_uso}}'
  value: '{{ask.scia_cambio_uso}}'
  in:
  - stessa categoria
  - tra categorie
  - intero immobile
  else: 'A change of use under art. 2 L.R. 19/2001 changes the use: say which (stessa categoria, tra categorie or intero immobile).'
- if: '{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia}} {{ask.pdc_procedura|is_deroga}}'
  value: '{{ask.deroga_densita,ask.deroga_altezza,ask.deroga_distanza,ask.deroga_destinazione|any}}'
  in:
  - 'true'
  else: 'A permesso in deroga (art. 14 DPR 380/2001) derogates from at least one limit: density, height, distance or use.'
- if: '{{ask.pdc_tipo|is_altro}}'
  value: '{{ask.pdc_procedura}}'
  in:
  - ordinaria
  else: 'Works no other line names are asked under art. 10 as such: not as a convenzionato or in deroga.'
- if: '{{ask.sanatoria_titolo|is_permesso}}'
  value: '{{ask.pdc_tipo}}'
  in:
  - nuova costruzione
  - ristrutturazione urbanistica
  - ristrutturazione edilizia
  - mutamento uso
  - altro
  else: 'A permesso in sanatoria (art. 36 DPR 380/2001) is mapped for art. 10 works and changes of use: not SCIA works asked as a permesso (the SCIA in sanatoria files them), a Campania kind or a variant.'
- if: '{{ask.sanatoria_titolo|is_permesso}}'
  value: '{{ask.pdc_procedura}}'
  in:
  - ordinaria
  else: 'A permesso in sanatoria (art. 36 DPR 380/2001) is asked as such: not as a convenzionato or in deroga.'
- if: '{{ask.stato_legittimo|is_titoli}}'
  value: '{{ask.prec_titolo_unico,ask.prec_permesso,ask.prec_autorizzazione,ask.prec_comunicazione,ask.prec_dia,ask.prec_dia_alternativa,ask.prec_scia,ask.prec_cel,ask.prec_condono,ask.prec_pdc_sanatoria,ask.prec_scia_sanatoria,ask.prec_scia_sanatoria_variante,ask.prec_altro|any}}'
  in:
  - 'true'
  else: A stato legittimo from the building's titles needs at least one title.
- if: '{{ask.stato_legittimo|in_epoca__prova}}'
  value: '{{ask.prova_catasto,ask.prova_altri|any}}'
  in:
  - 'true'
  else: A building with no title on file needs its catasto primo impianto or other documents.
- if: '{{ask.stato_legittimo|is_tolleranze}}'
  value: '{{ask.toll_prec_pratica,ask.toll_prec_atto|any}}'
  in:
  - 'true'
  else: A stato legittimo from tolerance declarations needs where they were made.
- if: '{{ask.tolleranze}}'
  value: '{{ask.toll_34bis_1,ask.toll_34bis_1bis,ask.toll_34bis_2,ask.toll_34bis_2bis,ask.toll_34ter_4|any}}'
  in:
  - 'true'
  else: Declared construction tolerances need at least one kind (art. 34-bis or 34-ter c. 4).
- if: '{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}}'
  value: '{{ask.toll_sismica}}'
  in:
  - autorizzazione
  - silenzio assenso
  else: 'A structural tolerance relevant for public safety (art. 94-bis c. 1 a) can be declared only with the Genio Civile''s seismic authorization (art. 94 c. 2) or its silenzio assenso (c. 2-bis): art.
    34-bis c. 3-bis DPR 380/2001.'
- if: '{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|in_minore_rilevanza__privo_di_rilevanza}}'
  value: '{{ask.toll_decorso}}'
  in:
  - 'true'
  else: 'A structural tolerance of minor or no relevance for public safety can be declared only once the regional control term has run out, with no open requests and no negative outcome: art. 34-bis c.
    3-bis DPR 380/2001.'
- if: '{{ask.urbanizzazione|not}}'
  value: '{{ask.urbanizzazione_attuazione}}'
  in:
  - convenzione
  else: 'Without primary urbanisation works the portal wants the date of a convenzione, even where the Comune plans the works itself within three years: that case can''t be stated on it as is; ask the SUE.'
- if: '{{ask.bollo_esenzione|is_onlus}}'
  when: '{{ask.bollo_onlus_esercizio}}'
  else: 'The ONLUS exemption ended with the ONLUS regime on 1 January 2026, except for a tax year begun before then: an ex-ONLUS in the RUNTS is exempt as an ets.'
