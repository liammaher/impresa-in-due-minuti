# A permesso di costruire in sanatoria (art. 36 DPR 380/2001) with the accertamento di compatibilità
# paesaggistica (artt. 167-181 D.Lgs. 42/2004) in one pratica on Napoli's SUE: the two operations
# selected together in the wizard, the permesso's sanatoria answered Sì. In a protected area the
# building sanatoria holds only with the landscape compatibility found (art. 146 c. 4; Cass. pen.
# Sez. III n. 15726/2026), and that can't be found for works that made new usable surface or volume
# (art. 167 c. 4 a): the rules table refuses those. gen.py takes each one's sections from the
# catalogue and the order from the combination's crawl
# (catalogue/F839/sections/sue-combo-pdc-sanatoria-accertamento.json, 2026-11-02); every section is
# one of theirs. Everything else is pdc-sanatoria-fittizio's recipe and what the accertamento adds
# (parts/accertamento-paesaggistico.yaml).
extends: [pdc-sanatoria-fittizio, parts/accertamento-paesaggistico]
procedure: napoli/comune/permesso-in-sanatoria-con-accertamento-paesaggistico
title: "Permesso di costruire in sanatoria con accertamento di compatibilità paesaggistica, SUE Napoli (tecnico con procura)"
crawl: sue-combo-pdc-sanatoria-accertamento
asks:
  descrizione: {default: "PdC sanatoria e accertamento {{c:identity.last_name}}"}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC, j) diritti di terzi, consapevolezza (artt. 46-47), informativa privacy, art. 181 (PER PRESA VISIONE), tasse comunali, art. 75 DPR 445/2000"
  - "Come progettista, verifica ogni asseverazione di questa pagina: il portale ne ricava la Relazione tecnica di asseverazione che firmi. Il quadro paesaggistico dichiara che i lavori alterano i luoghi e non spunta alcuna procedura: la compatibilità è nell'accertamento presentato insieme (scrivilo nella relazione tecnica)"
  - "Nell'asseverazione, «non interessa aree percorse dal fuoco» e la dichiarazione sui terreni sono una sola scelta sul portale (un suo difetto): Claude spunta quella sui terreni. Le aree bruciate le dichiari nella relazione tecnica, se il SUE lo chiede"
  - "{{ask.bollo_marche,ask.bollo_esenzione|bollo_yours}}"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
  - "Il Comune decide prima sulla compatibilità, con il parere vincolante della Soprintendenza: se è accertata, paga la somma che stabilisce (art. 167 c. 5 D.Lgs. 42/2004, la maggiore tra il danno arrecato e il profitto conseguito); in caso contrario, le opere devono essere rimosse e il permesso in sanatoria non può essere rilasciato"
  - "Una volta concesso il permesso: paga l'oblazione che il SUE determina (il doppio del contributo di costruzione, art. 36 c. 2) e ritira il permesso in sanatoria"
# The permesso's landscape quadro wants one of its three procedures once the works alter the place,
# and none is the accertamento of art. 167 (the run of 2026-11-02 stopped there): a known defect,
# refused with it. The rest of the pratica fills; the mapping stays for the day the quadro has the line.
supports:
  - when: "{{ask.paesaggio_accertamento|not}}"
    defect: pdc-36-paesaggio
    else: "Sanatoria dell'art. 36 in area tutelata: il quadro paesaggistico del permesso non ha la voce dell'accertamento dell'art. 167. È un difetto del portale; chiedi al SUE."
# The case: the main pratica's P6 answers, the part's, then these (a null drops one);
# `gen.py --answers` writes answers-p6.json.
answers:
  descrizione: PROVA NON INVIARE - PdC sanatoria e accertamento
  oggetto: "Permesso di costruire in sanatoria (art. 36 DPR 380/2001) e accertamento di compatibilità paesaggistica delle modifiche al prospetto di un edificio vincolato, eseguite nel 2020 senza titolo."
  dettaglio_intervento: "Ristrutturazione edilizia (art. 10 c. 1 c DPR 380/2001) del prospetto su strada di un edificio sotto tutela paesaggistica, eseguita nell'ottobre 2020 senza permesso né autorizzazione paesaggistica: due finestre allargate a porte-finestre, intonaco a calce sostituito con intonaco silossanico color ocra. Nessuna nuova superficie utile né volume, nessun intervento sulle strutture. Conforme alla disciplina urbanistica ed edilizia vigente allora e oggi. Dati inventati per la prova."
  intervento: ristrutturazione_pesante
  pdc_tipo: ristrutturazione edilizia
  nuova_costruzione_tipo: null
  sanatoria_data: "2020-10-15"
  superficie_mq: "110"
  volume_mc: "330"
  piani_n: "4"
  superficie_coperta_mq: "110"
  accertamento_descrizione: "Due finestre del prospetto su strada allargate a porte-finestre (da m 1,00 a m 1,20 di larghezza, fino a terra) e intonaco a calce sostituito con intonaco silossanico color ocra. Nessuna nuova superficie utile né volume."
  accertamento_effetti: "Il prospetto su strada cambia nel ritmo delle aperture e nel colore; è visibile dalla strada pubblica."
  accertamento_data: "2020-10-15"
