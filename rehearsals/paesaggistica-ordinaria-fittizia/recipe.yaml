# Autorizzazione paesaggistica ordinaria (art. 146 D.Lgs. 42/2004) from the Comune of Napoli, on
# its SUE, as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/sue-autorizzazione-paesaggistica-ordinaria.json). The CILA
# rehearsal's architect (with procura) and client (rehearsals/cila-fittizia).
procedure: napoli/comune/autorizzazione-paesaggistica-ordinaria
title: "Autorizzazione paesaggistica ordinaria (art. 146 D.Lgs. 42/2004), SUE Napoli (tecnico con procura)"
comune: F839
sportello: sue
crawl: sue-autorizzazione-paesaggistica-ordinaria
operation: Autorizzazione paesaggistica ordinaria (art.146 del D.Lgs 42/2004 - Comune)
scelte: [IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE]
first: [Scheda anagrafica, Qualifica e dati del procuratore]
after: [Pagamento degli oneri, Gestione degli allegati]
attachments:
  Gestione degli allegati:
    # The relazione paesaggistica takes a plain PDF; the portal requires it (a first run left it
    # empty and stopped there, 2026-11-03). The combinations take it from parts/paesaggistica-ordinaria.
    - {kind: file, label: Relazione paesaggistica (redatta ai sensi del D.P.C.M, value: "{{ask.relazione_paesaggistica}}"}
asks:
  diritti_euro: {default: "401", why: "Voce SUE 2 del tariffario 2026 dei diritti SUE del Comune (G.C. 239/2026): 401 € per un'autorizzazione paesaggistica richiesta autonomamente"}
  # Napoli's own annexes, attached by the second run under Allegati liberi (DD 603/2025; L.R. 59/2018).
  modello_dp: {default: "true"}
  descrizione: {default: "paesaggistica ordinaria {{c:identity.last_name}}"}
  oggetto: {question: "I lavori in una frase (300 caratteri)"}
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Spunti le dichiarazioni del dichiarante: consapevolezza (artt. 46-47), informativa privacy, tasse comunali"
  - "{{ask.bollo_marche,ask.bollo_esenzione|bollo_yours}}"
  - "Firmi e invii (Firma e invio); conservi la ricevuta"
# Which pratica a case is: the library's rules table (rules/sue-napoli.yaml) decides, and pre-flight
# refuses a case it gives to another pratica, or that needs a pratica this one doesn't file with it.
rules:
  table: sue-napoli
  question: "Quali di queste cose valgono per i lavori? Spunti quelle vere, anche nessuna."
  facts: {permesso_per_scelta: "false", parere_esonero: "false"}
supports:
  - when: "{{ask.vincolo|is_art_134|not}}"
    else: "Il modulo dell'ordinaria indica solo l'art. 136 e l'art. 142: per un immobile tutelato dal solo piano paesaggistico (art. 134) deve scegliere una persona."
  - when: "{{ask.titolo|is_locatario|not}}"
    else: "Il modulo dell'ordinaria prevede solo proprietà, comproprietà, amministratore del condominio o altro diritto reale: un conduttore (inquilino) non rientra in nessuno di questi."
