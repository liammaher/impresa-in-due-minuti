# Cambio d'intestazione of a CILA, SCIA or DIA on Napoli's SUE, as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/sue-cambio-intestazione-cia-scia-dia.json). The CILA rehearsal's architect (with procura) and
# client (rehearsals/cila-fittizia).
procedure: napoli/comune/cambio-intestazione-cila-scia
title: "Cambio d'intestazione of a CILA, SCIA or DIA, SUE Napoli (tecnico con procura)"
comune: F839
sportello: sue
crawl: sue-cambio-intestazione-cia-scia-dia
operation: Cambio intestazione CIA / SCIA / DIA
scelte:
  - {option: "è stato incaricato un nuovo Direttore dei Lavori", when: "{{ask.soggetti_cambiati}} {{ask.cambio_dl}}"}
  - {option: "i lavori sono stati affidati ad una nuova ditta esecutrice", when: "{{ask.soggetti_cambiati}} {{ask.cambio_ditta}}"}
  - {option: ci sono cointestatari, when: "{{ask.cointestatario}}"}
  - IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE
first: [Scheda anagrafica, Qualifica e dati del procuratore]
after: [Pagamento degli oneri, Gestione degli allegati]
asks:
  diritti_euro: {default: "0", why: "Non presente nel tariffario 2026 dei diritti SUE del Comune (G.C. 239/2026): nessun diritto (non previsti dal tariffario)"}
  descrizione: {default: "cambio intestazione {{c:identity.last_name}}"}
  cambio_dl: {type: yes_no, question: "Subentra un nuovo direttore dei lavori?"}
  cambio_ditta: {type: yes_no, question: "Subentra una nuova impresa nell'esecuzione dei lavori?"}
supports:
  # The co-holders' section holds one person and has no "+" (crawled 2026-10-28): a portal
  # defect, not a mapping gap.
  - {if: "{{ask.cointestatario}}", when: "{{ask.altri_cointestatari|not}}", defect: coholders-one, else: "La sezione dei cointestatari del portale (ci sono cointestatari, nella procedura guidata) contiene una sola persona e non ha il \"+\": un cambio di intestatario a favore di più cointestatari non può essere presentato completo sul portale, che deve indicare ogni nuovo intestatario."}
  - {if: "{{ask.soggetti_cambiati}} {{ask.cambio_dl|not}}", when: "{{ask.cambio_ditta}}", else: "Cambia il direttore o l'impresa: indichi quale (un nuovo direttore dei lavori, una nuova impresa, o entrambi)."}
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Spunti le dichiarazioni del dichiarante: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, e le prese visione a nome del committente"
  - "Nessuna imposta di bollo da pagare con questo modulo: il modulo del portale per questa pratica non ha una sezione né uno spazio per il bollo"
  - "Firmi e invii (Firma e invio); conservi la ricevuta"
