# Cambio d'intestazione of a CILA, SCIA or DIA on Napoli's SUE, as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/sue-cambio-intestazione-cia-scia-dia.json). The CILA rehearsal's architect (with procura) and
# client (rehearsals/cila-fittizia).
procedure: napoli/comune/cambio-intestazione-cila-scia
title: "Cambio d'intestazione of a CILA, SCIA or DIA, SUE Napoli (tecnico con procura)"
comune: F839
sportello: sue
crawl: sue-cambio-intestazione-cia-scia-dia
operation: Cambio intestazione CIA / SCIA / DIA
scelte:
  - {option: "è stato incaricato un nuovo Direttore dei Lavori", when: "{{ask.soggetti_cambiati}} {{ask.cambio_dl}}"}
  - {option: "i lavori sono stati affidati ad una nuova ditta esecutrice", when: "{{ask.soggetti_cambiati}} {{ask.cambio_ditta}}"}
  - {option: ci sono cointestatari, when: "{{ask.cointestatario}}"}
  - IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE
first: [Scheda anagrafica, Qualifica e dati del procuratore]
asks:
  descrizione: {default: "PROVA NON INVIARE - cambio intestazione {{c:identity.last_name}}"}
  cambio_dl: {type: yes_no, question: "Is a new direttore dei lavori taking over?"}
  cambio_ditta: {type: yes_no, question: "Is a new firm taking over the works?"}
supports:
  # The co-holders' section holds one person and has no "+" (crawled 2026-10-28).
  - {if: "{{ask.cointestatario}}", when: "{{ask.altri_cointestatari|not}}", else: "The portal's co-holders section (the wizard's ci sono cointestatari) holds one person: more than one co-holder isn't mapped."}
  - {if: "{{ask.soggetti_cambiati}} {{ask.cambio_dl|not}}", when: "{{ask.cambio_ditta}}", else: "The direttore or the firm changes: say which (a new direttore dei lavori, a new firm, or both)."}
yours:
  - "Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page"
  - "Tick the dichiarante's declarations: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, and the acknowledgements in the client's name"
  - "On Allega documenti: download the portal's procura, have the client sign it, sign it digitally (.p7m) and attach it"
  - "No imposta di bollo to pay on this form: the portal's form for this pratica has no bollo section or slot"
  - "Sign and send (Firma e invio); keep the receipt"
