  - {id: 'r5c2p7reg:radio:1_clone', kind: radio, when: '{{ask.bollo_marche|not}} {{ask.bollo_esenzione|is_no}}', label: 'Due marche da €16,00 ciascuna'}
  - {id: 'r8c1p14reg:radio:1_clone', kind: radio, when: '{{ask.bollo_marche}} {{ask.bollo_esenzione|is_no}}', label: Il pagamento è dovuto e si intende assolvere l'obbligo con marche da bollo}
  - {id: 'r13c2p30reg:radio:2_clone', kind: radio, when: '{{ask.bollo_marche}} {{ask.bollo_esenzione|is_no}}', label: 'Marca da €16,00 per l''autorizzazione'}
  - {kind: text, value: '{{ask.bollo_seriale}}', when: '{{ask.bollo_marche}} {{ask.bollo_esenzione|is_no}}', max: 14, label: numero seriale (1)}
  - {kind: date, value: '{{ask.bollo_data|date_it}}', when: '{{ask.bollo_marche}} {{ask.bollo_esenzione|is_no}}', label: data}
  - {kind: text, label: numero seriale (1), nth: 2, value: '{{ask.bollo_seriale_2}}', when: '{{ask.bollo_marche}} {{ask.bollo_esenzione|is_no}}'}
  - {kind: date, label: data, nth: 2, value: '{{ask.bollo_data_2|date_it}}', when: '{{ask.bollo_marche}} {{ask.bollo_esenzione|is_no}}'}
