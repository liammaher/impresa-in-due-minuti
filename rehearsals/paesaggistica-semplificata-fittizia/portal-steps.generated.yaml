  - {kind: file, value: '{{ask.bollo_virtuale_autorizzazione}}', when: '{{ask.bollo_esenzione|is_virtuale}}', label: dichiarazione relativa all'assolvimento dell'imposta di bollo}
  - {kind: radio, when: '{{ask.bollo_esenzione|bollo_esente}}', label: Il pagamento non è dovuto poiché esentati}
  - {kind: select, value: '{{ask.bollo_esenzione|bollo_motivo}}', when: '{{ask.bollo_esenzione|bollo_esente}}', label: per la seguente motivazione}
- section: Pagamento degli oneri
  go: Prosegui
  save: false
  fields: []
- section: Gestione degli allegati
  go: Prosegui
  step: Allega Documenti
  theirs:
  - Procura speciale
  - Quadro riepilogativo della documentazione
  - Scarica il documento
  - Allegati liberi
  - copia attestazione versamento oneri, diritti e spese
  - Relazione Paesaggistica Semplificata
  fields:
  - {kind: file, label: Procura speciale, value: '{{ask.procura_firmata}}', accepts: jpg.p7m;pdf.p7m, after_declarations: true}
  - {kind: file, label: Allegati liberi, value: '{{ask.napoli_allegato_a_firmato}}', describe: Allegato A Programma 100, when: '{{ask.napoli_allegato_a}}', after_declarations: true, accepts: dwf.p7m;svg.p7m;jpg.p7m;pdf.p7m;pdf;xml;dwf;svg;jpg}
  - {kind: file, label: Allegati liberi, value: '{{ask.modello_dp_firmato}}', describe: Modello DP (L.R. Campania 59/2018), when: '{{ask.modello_dp}}', after_declarations: true, accepts: dwf.p7m;svg.p7m;jpg.p7m;pdf.p7m;pdf;xml;dwf;svg;jpg}
  - {kind: file, label: 'copia attestazione versamento oneri, diritti e spese', value: '{{ask.ricevuta_diritti}}', when: '{{ask.diritti_euro|positive}}', after_declarations: true, accepts: dwf.p7m;svg.p7m;jpg.p7m;pdf.p7m}
  - {kind: file, label: Relazione Paesaggistica Semplificata, value: '{{ask.relazione_semplificata_firmata}}', accepts: dwf.p7m;svg.p7m;jpg.p7m;pdf.p7m, after_declarations: true}
  - {kind: file, label: Elaborati di progetto individuati nell'Allegata Relazione Paesaggistica Semplificata, value: '{{ask.elaborati_paesaggistici}}', accepts: dwf.p7m;svg.p7m;jpg.p7m;pdf.p7m}
  - {kind: file, label: Fotocopia di un documento di identita' del soggetto che conferisce, value: '{{ask.documento_identita_cliente}}', accepts: pdf;pdf.p7m}
