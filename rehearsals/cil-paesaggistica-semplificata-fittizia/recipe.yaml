# A CIL for temporary works with its autorizzazione paesaggistica semplificata in one pratica on
# Napoli's SUE: the CIL rehearsal's people (rehearsals/cil-fittizia) with a removable timber
# platform and canopy kept for 150 days on the terrace of a protected building: a temporary
# occupation over 120 days a year (DPR 31/2017 Allegato B, B.25; up to 120 days it would be free,
# A.16). Two operations: gen.py takes each one's sections from the catalogue and the order from
# the combination's crawl (catalogue/F839/sections/sue-combo-cil-paesaggistica-semplificata.json).
# Everything else is cil-fittizia's recipe and what the semplificata adds (parts/paesaggistica-semplificata.yaml).
extends: [cil-fittizia, parts/paesaggistica-semplificata]
procedure: napoli/comune/cil-con-paesaggistica-semplificata
title: "CIL opere temporanee con autorizzazione paesaggistica semplificata, SUE Napoli (tecnico con procura)"
crawl: sue-combo-cil-paesaggistica-semplificata
asks:
  descrizione: {default: "CIL e paesaggistica {{c:identity.last_name}}"}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC (domicilio elettronico), consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "Paga i diritti di {{ask.diritti_euro}} € prima della seconda compilazione: la ricevuta firmata va allegata lì; il bollo prima dell'invio"
  - "I lavori iniziano solo quando il SUE comunica che l'autorizzazione paesaggistica è stata acquisita: la data di inizio è la prima possibile"
  - "Se è dovuta la notifica preliminare (art. 99 D.Lgs. 81/2008): allegala in Allegati liberi, firmata digitalmente (solo .p7m): la CIL non ha uno spazio di caricamento apposito"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
attachments:
  Gestione degli allegati:
    # The semplificata's second relazione slot opens from the SCIA's and the permesso's asseverazione
    # ("Si allega la relazione paesaggistica semplificata"): the CIL has no such box.
    - {label: Relazione paesaggistica semplificata e documentazione necessaria, drop: true}
# The case: the main pratica's P6 answers, the part's, then these (a null drops one);
# `gen.py --answers` writes answers-p6.json.
answers:
  descrizione: PROVA NON INVIARE - CIL e semplificata P6 generato
  oggetto: "Installazione temporanea di una pedana e copertura leggera smontabile sul terrazzo dell'appartamento, per 150 giorni, rimossa a fine periodo, in area vincolata (dati inventati per la prova)."
  data_inizio_lavori: '2027-01-11'
  data_fine_prevista: '2027-06-09'
  dettaglio_intervento: "Pedana in legno e copertura leggera in tela su struttura smontabile in alluminio, appoggiate senza ancoraggi sul terrazzo, per 150 giorni; rimozione integrale entro il 09/06/2027 con ripristino dello stato dei luoghi. Dati inventati per la prova."
  allegato_b:
  - paes_b25
