# Apertura di un'attività di acconciatore, SUAP Napoli (ditta individuale) (rehearsals/acconciatore-fittizio) filed by a tecnico for the client with a procura speciale:
# see rehearsals/ristorante-procura-fittizio (gen.py `as_client`, route.py `via`).
extends: acconciatore-fittizio
title: Apertura di un'attività di acconciatore, SUAP Napoli (ditta individuale), presentata da un tecnico con procura, SUAP Napoli
as_client: true
first:
- Scheda anagrafica
- Qualifica e dati del procuratore
scelte:
- IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE
wizard:
- screen: Assegna una descrizione alla pratica
  fill:
    css: input[placeholder^="Inserire la descrizione"]
    value: '{{ask.descrizione}}'
  confirm: CONFERMA
- screen: Controlla l'accesso alla pratica
  confirm: CONFERMA
- screen: Scelta settore attività
  tree:
  - leaf: Acconciatore, barbiere, estetista, tatuatore e piercer
    nth: 1
  confirm: CONFERMA
- screen: Scelta operazioni
  tree:
  - Aprire l'attività di acconciatore
  confirm: CONFERMA
- screen: Scelta interventi eventuali
  confirm: CONFERMA
- screen: Scelta del destinatario della pratica
  confirm: CONFERMA
- screen: Scelte eventuali
  confirm: CONFERMA
  tree:
  - IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE
# The attachments screen as this pratica's draft shows it (read 2026-11-11, crawl.js slotsOf, before the declarations):
slots:
  Gestione degli allegati:
    - {"title": "Procura speciale", "accepts": "jpg.p7m;pdf.p7m", "required": true, "portal_document": true}
    - {"title": "Fotocopia di un documento di identita' del soggetto che conferisce la procura speciale", "accepts": "pdf;pdf.p7m", "required": true, "portal_document": false}
    - {"title": "copia attestazione versamento oneri, diritti e spese", "accepts": "dwf.p7m;svg.p7m;jpg.p7m;pdf.p7m", "required": false, "portal_document": false}
    - {"title": "Planimetria quotata dei locali in scala minima 1:100 con layout superfici di vendita, attrezzature, arredi. (SEMPRE OBBLIGATORIA eccettuato il caso di affitto d", "accepts": "dwf.p7m;svg.p7m;jpg.p7m;pdf.p7m", "required": false, "portal_document": false}
    - {"title": "Relazione descrittiva delle caratteristiche dei locali medesimi, della loro localizzazione e attrezzatura utilizzata per il servizio (SEMPRE OBBLIGATORIA eccett", "accepts": "dwf.p7m;svg.p7m;jpg.p7m;pdf.p7m", "required": false, "portal_document": false}
    - {"title": "Allegati liberi", "accepts": "dwf.p7m;svg.p7m;jpg.p7m;pdf.p7m;pdf;xml;dwf;svg;jpg", "required": false, "portal_document": false}
yours:
- Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina
- 'Spunta tu le dichiarazioni: la casella di presa d''atto sotto la PEC, la dichiarazione antimafia, consapevolezza (artt. 46-47), informativa privacy, altre dichiarazioni, tasse comunali, art. 75 DPR 445/2000'
- 'Scarica dal portale la procura speciale (Allega documenti, Scarica il documento), dopo aver spuntato le dichiarazioni; fai firmare la procura al cliente (a mano e digitalmente) e mandamela: la allego con una seconda compilazione'
- 'In Allega documenti: la planimetria quotata e la relazione descrittiva dei locali, firmate digitalmente (.p7m)'
- Firma e invia (Firma e invio); conserva la ricevuta
rules:
  via: procura
