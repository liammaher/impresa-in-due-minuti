# CILA con autorizzazione paesaggistica ordinaria and a dichiarazione di utilizzo delle terre e rocce da scavo
# (art. 21 DPR 120/2017), three operations in one pratica on Napoli's SUE: rehearsals/cila-paesaggistica-ordinaria-fittizia's case
# with excavated soil that leaves a small site as a by-product. The dichiarazione adds two adempimenti
# and no section (catalogue/F839/sue-wizard.json `pairs`); the crawl is catalogue/F839/sections/sue-combo-cila-paesaggistica-ordinaria-dichiarazione-utilizzo.json.
# Everything else is cila-paesaggistica-ordinaria-fittizia's recipe and what the dichiarazione adds (parts/dichiarazione-utilizzo-terre.yaml).
extends: [cila-paesaggistica-ordinaria-fittizia, parts/dichiarazione-utilizzo-terre]
procedure: napoli/comune/cila-con-paesaggistica-ordinaria-e-dichiarazione-utilizzo-terre
title: "CILA con autorizzazione paesaggistica ordinaria e dichiarazione di utilizzo delle terre e rocce da scavo, SUE Napoli (tecnico con procura)"
crawl: sue-combo-cila-paesaggistica-ordinaria-dichiarazione-utilizzo
asks:
  descrizione: {default: "CILA ord. e terre e rocce {{c:identity.last_name}}"}
# cila-paesaggistica-ordinaria-fittizia's steps for the person (a recipe's `yours` replaces the one it extends), then the dichiarazione's.
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC (domicilio elettronico), c) PER PRESA VISIONE, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "Paga i diritti prima della seconda compilazione (dopo le dichiarazioni): la ricevuta, firmata, va allegata in quella; il bollo prima dell'invio. La sanzione della CILA tardiva si paga prima della prima compilazione: la sua ricevuta è nel quadro d)"
  - "La pergola si realizza solo quando il SUE comunica che l'autorizzazione paesaggistica è stata rilasciata"
  - "La dichiarazione di utilizzo (Allegato 6 DPR 120/2017) è il documento del portale in Allega documenti dopo aver spuntato le dichiarazioni: la firma il produttore, Claude la allega nella seconda compilazione (dopo le dichiarazioni); lo scavo inizia almeno 15 giorni dopo l'invio"
  - "Quando tutte le terre e rocce da scavo saranno state utilizzate, entro la validità della dichiarazione, presenta sul SUE la dichiarazione di avvenuto utilizzo (art. 7 DPR 120/2017)"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
answers:
  descrizione: PROVA NON INVIARE - CILA ord. e terre e rocce P6
  # Works not begun: the dichiarazione goes before the excavation (the P6 CILA is a late one).
  cila_stato: da iniziare
  # With the landscape authorization the works start once the SUE says it is in.
  inizio_dopo_assensi: true
  data_inizio_lavori: null
