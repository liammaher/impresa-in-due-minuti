# Variazioni soggetti (Vicinato - settore merceologico Alimentare o Misto), as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-017-variazioni-soggetti.json), for the made-up business of this folder's fixture.json.
# Derived from rehearsals/variazione-negozio-fittizio; no `rules:` (the table has no entry for it, or one recipe already holds the case) and no `after:`: the attachments and payment screens are not read.
procedure: napoli/comune/variazioni-attivita
title: "Variazioni soggetti, negozio alimentare o misto, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-017-variazioni-soggetti
subject: impresa
operation: Variazioni soggetti
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Vicinato - settore merceologico Alimentare o Misto], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Variazioni soggetti"], confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per l'attività? Spunta tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "variazione {{business.denominazione}}"}
  var_altro:
    group: variazioni
    type: yes_no
    item: "Altro: quote cedute, un nuovo legale rappresentante, nuovi soci, un nuovo preposto"
    why: "Si tratta di modifiche della società, o richiedono una dichiarazione del nuovo gestore: caso non ancora previsto."
  diritti_euro: {type: number, question: "I diritti SUAP in euro (colonna VPF del tariffario 2026: verifica la voce; 0 se non dovuti)"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta tu le dichiarazioni: consapevolezza (artt. 46-47), informativa privacy, altre dichiarazioni, tasse comunali"
  - "Paga i diritti di segreteria, se dovuti, con pagoPA nella schermata di pagamento"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
  - {when: "{{ask.var_altro|not}}", else: "Per ora sono gestiti solo il cambio di denominazione o il trasferimento della sede legale."}
  - value: "{{ask.var_denominazione}}-{{ask.var_sede_legale}}"
    in: [true-false, false-true]
    else: "Una modifica alla volta: il modulo per i negozi ripete i suoi riquadri per ciascuna, quindi presenta separatamente il cambio di denominazione e quello della sede."
