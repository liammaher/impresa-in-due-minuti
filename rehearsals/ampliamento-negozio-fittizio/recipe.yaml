# A non-food shop's bigger sales area (variazioni strutturali), as gen.py writes its steps file
# from the batch crawl (catalogue/F839/sections/suap-016-variazioni-strutturali.json), for the
# shop rehearsal's made-up ditta individuale (rehearsals/negozio-fittizio/fixture.json).
procedure: napoli/comune/scia-esercizio-vicinato
title: "Ampliamento della superficie di vendita di un negozio di vicinato non alimentare, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-016-variazioni-strutturali
subject: impresa
operation: Variazioni strutturali
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
after: [Pagamento degli oneri, Gestione degli allegati]
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Vicinato - settore merceologico NON alimentare], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: [Variazioni strutturali], confirm: CONFERMA}
  - {screen: Scelta interventi eventuali, confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per il negozio? Spunta tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "ampliamento {{business.denominazione}}"}
  settori: {group: extras, type: yes_no, item: "Aggiunge, elimina o sostituisce un settore o prodotti speciali (tabacchi, medicinali, carburanti)", why: "Per ora preparo solo un ampliamento della superficie negli stessi settori."}
  insegna_esterna: {group: extras, type: yes_no, item: "Una nuova insegna esterna", why: "Un'insegna esterna include in questa la SCIA dell'insegna: per ora non la preparo."}
  diritti_euro: {type: number, question: "I diritti SUAP in euro (colonna VCA del tariffario 2026 per un negozio non alimentare, S1: verifica)"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta tu le dichiarazioni: consapevolezza (artt. 46-47), informativa privacy, requisiti di onorabilità, altre dichiarazioni, tasse comunali, art. 75 DPR 445/2000"
  - "Paga i diritti di segreteria (€ {{ask.diritti_euro}}) con pagoPA nella schermata di pagamento"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
# Which pratica a case is: the library's rules table (rules/suap-napoli.yaml) decides, and pre-flight
# refuses a case it gives to another pratica or that needs a pratica this one doesn't file.
rules:
  table: suap-napoli
  facts: {attivita: vicinato_non_alimentare, evento: ampliamento}
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
  - {when: "{{ask.settori|not}}", else: "Per ora preparo solo un ampliamento della superficie negli stessi settori."}
  - {when: "{{ask.insegna_esterna|not}}", else: "Un'insegna esterna non la preparo ancora."}
  - {when: "{{ask.superficie_alimentare_mq|positive|not}}", else: "Questa è la pratica del negozio non alimentare."}
