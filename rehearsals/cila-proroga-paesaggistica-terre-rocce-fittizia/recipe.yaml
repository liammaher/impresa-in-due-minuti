# CILA e proroga paesaggistica e terre e rocce: 3 operations in one pratica on Napoli's SUE (catalogue/F839/sue-pairs.yaml, reason
# authorization-keeps-pace). The case: cila-paesaggistica-semplificata-terre-rocce-fittizia's, with what proroga-paesaggistica-fittizia adds; the other's answers fill
# what the main's don't say (gen.py combo_answers). The rules table sue-napoli routes it.
extends:
- cila-paesaggistica-semplificata-terre-rocce-fittizia
- proroga-paesaggistica-fittizia
procedure: napoli/comune/cila-lavori-edilizi-con-proroga-autorizzazione-paesaggistica-e-utilizzo-materiale-scavo-fuori-sito
title: CILA e proroga paesaggistica e terre e rocce in una pratica, SUE Napoli (tecnico con procura)
comune: F839
sportello: sue
crawl: sue-combo-cila-proroga-paesaggistica-dichiarazione-utilizzo
operation:
- Comunicazione Inizio Lavoro Asseverata (C.I.L.A.)
- Proroga autorizzazione paesaggistica (art. 10 septies, Legge 51/2022 - Comune)
- Dichiarazione di utilizzo del materiale di scavo fuori del sito di produzione ai sensi dell'art. 21 del DPR n.120/2017
  (da trasmettere almeno 15 giorni prima dell'inizio dei lavori di scavo)
scelte:
- IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE
first:
- Scheda anagrafica
- Qualifica e dati del procuratore
after:
- Pagamento degli oneri
- Gestione degli allegati
asks:
  descrizione:
    default: PROVA NON INVIARE - CILA + proroga paes. + terre e rocce {{c:identity.last_name}}
  diritti_euro:
    default: '{{ask.cila_stato|diritti_cila}}'
    why: 'Line SUE 13 of the Comune''s 2026 table of SUE diritti (G.C. 239/2026): 151 € for a CILA; SUE 15: 166
      € for one filed once the works started (mancata CILA)'
yours:
- Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page
- 'Tick the dichiarante''s declarations: the awareness box under the PEC (domicilio elettronico), c) PER PRESA VISIONE,
  consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000'
- 'Pay the diritti before the second run (after the declarations): its receipt, signed, goes with it; the bollo
  before sending. A late CILA''s penalty is paid before the first run: its receipt is in quadro d)'
- 'The dichiarazione di utilizzo (Allegato 6 DPR 120/2017) is the portal''s document on Allega documenti once the
  declarations are ticked: the producer signs it, Claude attaches it in the second run; the excavation starts at
  least 15 days after sending'
- When the soil has all been used, within the dichiarazione's validity, file the dichiarazione di avvenuto utilizzo
  (art. 7 DPR 120/2017) on the SUE
- 'Tick the dichiarante''s declarations: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, and
  any acknowledgement in the client''s name'
- Sign and send (Firma e invio); keep the receipt
