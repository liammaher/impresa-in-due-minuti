# A SCIA in sanatoria of works still under way (art. 37 c. 5 DPR 380/2001) with the autorizzazione
# paesaggistica ordinaria for the works not yet done, in one pratica on Napoli's SUE: the SCIA and
# the ordinaria selected together in the wizard, the SCIA's sanatoria scelta answered Sì. The
# landscape authorization can't be given for works already done (art. 146 c. 4 D.Lgs. 42/2004):
# those go through the art. 36-bis sanatoria alone (rehearsals/scia-sanatoria-fittizia,
# answers-paesaggio.json). gen.py takes the sections from the catalogue and the order from the
# combination's crawl with the sanatoria answered Sì
# (catalogue/F839/sections/sue-combo-scia-sanatoria-paesaggistica-ordinaria.json).
# Everything else is scia-sanatoria-fittizia's recipe and what the ordinaria adds (parts/paesaggistica-ordinaria.yaml).
extends: [scia-sanatoria-fittizia, parts/paesaggistica-ordinaria]
procedure: napoli/comune/scia-in-sanatoria-con-paesaggistica-ordinaria
title: "SCIA in sanatoria con autorizzazione paesaggistica ordinaria, SUE Napoli (tecnico con procura)"
crawl: sue-combo-scia-sanatoria-paesaggistica-ordinaria
asks:
  descrizione: {default: "SCIA in sanatoria e paesaggistica {{c:identity.last_name}}"}
  # The landscape works are still to come: the asseverazione names the ordinaria procedure.
  sanatoria_paesaggio: {default: "false"}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC, b) PER PRESA VISIONE, m) diritti di terzi, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "In qualità di progettista, verifica ogni asseverazione di questa pagina: sono tue, e le firmi con la pratica"
  - "Prima dell'inizio dei lavori, nomina chi la pratica lascia da nominare (il direttore dei lavori, il direttore dei lavori strutturali, l'impresa) con la comunicazione di nomina del SUE"
  - "I lavori in corso si sospendono finché il SUE non comunica che l'autorizzazione paesaggistica è stata acquisita; solo allora iniziano i lavori sulla facciata"
  - "Paga la sanzione di 516 € (art. 37 c. 5) prima della compilazione, che ne allega la ricevuta, e i diritti prima della seconda compilazione (dopo le dichiarazioni), che allega la relativa ricevuta"
  - "{{ask.bollo_marche,ask.bollo_esenzione|bollo_yours}}"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
supports:
  # The authorization is only for works not yet done (art. 146 c. 4): a sanatoria of works all done
  # (art. 36-bis) has none left, and takes the landscape compatibility on its own.
  - value: "{{ask.sanatoria_caso}}"
    in: [in corso]
    else: "Con l'autorizzazione paesaggistica sono previsti solo i lavori ancora in corso (art. 37 c. 5): per i lavori già eseguiti non restano lavori da autorizzare (art. 146 c. 4 D.Lgs. 42/2004); la loro compatibilità paesaggistica rientra nella sola sanatoria dell'art. 36-bis (c. 4)."
# The case: the main pratica's P6 answers, the part's, then these (a null drops one);
# `gen.py --answers` writes answers-p6.json. Interior works begun without the SCIA, the facade
# redesigned with new openings still to do (beyond Allegato B: the ordinaria).
answers:
  oggetto: "SCIA presentata spontaneamente a lavori in corso (art. 37 c. 5 DPR 380/2001) con autorizzazione paesaggistica ordinaria: tramezzi interni, nuovo bagno, impianti; ridisegno del prospetto su strada con nuove aperture ancora da eseguire (dati inventati per la prova)."
  dettaglio_intervento: "All'interno, lavori iniziati senza SCIA: demolizione e ricostruzione di due tramezzi con nuova distribuzione di cucina e bagno; nuovo bagno; rifacimento degli impianti idrico ed elettrico. In facciata, da eseguire dopo l'autorizzazione paesaggistica: ridisegno del prospetto su strada con due nuove aperture e nuove persiane e ringhiere. Opere non strutturali. Dati inventati per la prova."
  descrizione: PROVA NON INVIARE - SCIA sanatoria e ordinaria
  diritti_euro: '441'
  sanatoria_caso: in corso
  sanatoria_data: '2026-10-05'
  sanatoria_estremi: IUV 0000000000000000 (inventato)
  sanatoria_oblazione: null
  sanatoria_catasto: invariato
  sanatoria_catasto_protocollo: null
  sanatoria_catasto_data: null
  paesaggio_eseguiti: 'false'
