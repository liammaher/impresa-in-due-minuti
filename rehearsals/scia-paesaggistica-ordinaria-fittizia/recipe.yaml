# A SCIA edilizia with its autorizzazione paesaggistica ordinaria in one pratica on Napoli's SUE (a
# SCIA condizionata): the two operations selected together in the wizard, as b) says. gen.py
# takes each one's sections from the catalogue and the order from the combination's crawl
# (catalogue/F839/sections/sue-combo-scia-paesaggistica-ordinaria.json); every section is one of
# theirs. The SCIA's people and cases are rehearsals/scia-fittizia's; the asseverazione names
# the ordinaria procedure and the works start once the SUE says the authorization is in.
# Everything else is scia-fittizia's recipe and what the ordinaria adds (parts/paesaggistica-ordinaria.yaml):
# a slot or a refusal mapped on either reaches this one.
extends: [scia-fittizia, parts/paesaggistica-ordinaria]
procedure: napoli/comune/scia-con-paesaggistica-ordinaria
title: "SCIA edilizia con autorizzazione paesaggistica ordinaria, SUE Napoli (tecnico con procura)"
comune: F839
sportello: sue
crawl: sue-combo-scia-paesaggistica-ordinaria
operation:
  - Segnalazione Certificata di Inizio Attività Edilizia (S.C.I.A.)
  - Autorizzazione paesaggistica ordinaria (art.146 del D.Lgs 42/2004 - Comune)
asks:
  descrizione: {default: "PROVA NON INVIARE - SCIA e paesaggistica {{c:identity.last_name}}"}
  # No start date: the works start once the SUE says the authorization is in.
  data_inizio_lavori: null
yours:
  - "Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page"
  - "Tick the dichiarante's declarations: the awareness box under the PEC, b) PER PRESA VISIONE, m) diritti di terzi, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "As progettista, check every asseverazione on this page: they are yours, signed with the pratica"
  - "Before the works start, name whoever the pratica leaves to be named (the direttore dei lavori, the structural one, the firm) with the SUE's comunicazione di nomina"
  - "On Allega documenti: the portal's procura signed by the client, the stato legittimo documents (signed files only), the ordinaria's drawings and photos (signed files only), then everything signed digitally (.p7m)"
  - "No start date: the works start once the SUE says the landscape authorization (and any other assent) is in"
  - "Pay the imposta di bollo and the diritti; upload the receipts"
  - "Sign and send (Firma e invio); keep the receipt"
rules:
  main: napoli/comune/scia-edilizia
# The case: the main pratica's P6 answers, the part's, then these (a null drops one);
# `gen.py --answers` writes answers-p6.json.
answers:
  data_inizio_lavori: null
  contributo_normativa: null
  scia_cambio_uso: null
  oggetto: Mutamento di destinazione d'uso di una singola unità nella stessa categoria funzionale, senza opere, in area vincolata (dati inventati per la prova).
  dettaglio_intervento: Mutamento di destinazione d'uso di una singola unità immobiliare all'interno della stessa categoria funzionale, senza opere, con pergola sul terrazzo soggetta ad autorizzazione paesaggistica ordinaria. Dati inventati per la prova.
  descrizione: PROVA NON INVIARE - SCIA cambio uso e ordinaria
  scia_tipo: cambio uso
  cambio_uso_tipo: unita senza opere stessa categoria
  scia_onerosa: 'true'
  contributo_pagamento: in corso d'opera
  contributo_calcolo: sportello
  documentazione_calcolo_contributo: rehearsals/scia-fittizia/files/documentazione-calcolo-contributo.pdf
  intervento: nessuna_opera
  cambio_uso: stessa_categoria
  fatti:
  - uso_ammesso_prg
