# proroga inizio e proroga paesaggistica: 2 operations in one pratica on Napoli's SUE (catalogue/F839/sue-pairs.yaml, reason
# authorization-keeps-pace). The case: proroga-inizio-fittizia's, with what proroga-paesaggistica-fittizia adds; the other's answers fill
# what the main's don't say (gen.py combo_answers). The rules table sue-napoli-adempimenti routes it.
extends:
- proroga-inizio-fittizia
- proroga-paesaggistica-fittizia
procedure: napoli/comune/proroga-inizio-lavori-con-proroga-autorizzazione-paesaggistica
title: Proroga inizio e proroga paesaggistica in una pratica, SUE Napoli (tecnico con procura)
comune: F839
sportello: sue
crawl: sue-combo-proroga-inizio-proroga-paesaggistica
operation:
- Proroga inizio lavori
- Proroga autorizzazione paesaggistica (art. 10 septies, Legge 51/2022 - Comune)
scelte:
- option: in assenza di titolarità esclusiva all'esecuzione dell'intervento edilizio, si dispone della dichiarazione
    di assenso dei terzi titolari di altri diritti reali o obbligatori
  when: '{{ask.titolo_esclusivo|not}}'
- IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE
first:
- Scheda anagrafica
- Qualifica e dati del procuratore
after:
- Pagamento degli oneri
- Gestione degli allegati
asks:
  descrizione:
    default: PROVA NON INVIARE - proroga inizio + proroga paes. {{c:identity.last_name}}
  diritti_euro:
    propose: '{{ask.titolo_tipo|diritti_proroga_pdc}}'
    why: 'Line SUE 11 of the Comune''s 2026 table of SUE diritti (G.C. 239/2026): 501 € for a proroga of a permesso
      di costruire'
yours:
- Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page
- 'Tick the dichiarante''s declarations: the awareness box under the PEC (domicilio elettronico), consapevolezza
  (artt. 46-47), informativa privacy, tasse comunali'
- '{{ask.bollo_marche,ask.bollo_esenzione|bollo_yours}}'
- 'Tick the dichiarante''s declarations: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, and
  any acknowledgement in the client''s name'
- Sign and send (Firma e invio); keep the receipt
rules:
  table: sue-napoli-adempimenti
  question: Quali di queste cose valgono per i lavori? Spunta quelle vere, anche nessuna.
  facts:
    adempimento: proroga_inizio
    proroga: ordinaria
    paesaggistica: proroga
  main: napoli/comune/proroga-inizio-lavori
  handles:
  - napoli/comune/proroga-autorizzazione-paesaggistica
answers:
  descrizione: PROVA NON INVIARE - proroga inizio + proroga paes. P6
