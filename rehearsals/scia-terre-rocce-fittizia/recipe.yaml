# SCIA edilizia con dichiarazione di utilizzo delle terre e rocce da scavo in one pratica on Napoli's SUE: the scia-fittizia rehearsal's case with excavated soil that leaves the site
# as a by-product (a small site: art. 21 DPR 120/2017). Two operations selected together in the
# wizard; the dichiarazione adds two adempimenti (the SUE's, ARPA Campania's) and no section, so the
# combination's crawl (catalogue/F839/sections/sue-combo-scia-dichiarazione-utilizzo.json) has the main pratica's sections and the
# dichiarazione's slot. Everything else is scia-fittizia's recipe and what the dichiarazione adds
# (parts/dichiarazione-utilizzo-terre.yaml): a slot or a refusal mapped on either reaches this one.
extends: [scia-fittizia, parts/dichiarazione-utilizzo-terre]
procedure: napoli/comune/scia-con-dichiarazione-utilizzo-terre
title: "SCIA edilizia con dichiarazione di utilizzo delle terre e rocce da scavo, SUE Napoli (tecnico con procura)"
crawl: sue-combo-scia-dichiarazione-utilizzo
asks:
  descrizione: {default: "SCIA e terre e rocce {{c:identity.last_name}}"}
# Its main pratica's steps for the person (a recipe's `yours` replaces the one it extends), then the dichiarazione's.
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC, b) PER PRESA VISIONE, m) diritti di terzi, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "In qualità di progettista, verifica ogni asseverazione di questa pagina: sono tue, e le firmi con la pratica"
  - "Prima dell'inizio dei lavori, nomina chi la pratica lascia da nominare (il direttore dei lavori, il direttore dei lavori strutturali, l'impresa) con la comunicazione di nomina del SUE"
  - "Una SCIA che richiede atti di assenso (la Soprintendenza, un parco, un vincolo): nessuna data di inizio; i lavori iniziano quando il SUE comunica che gli atti di assenso sono stati acquisiti"
  - "La dichiarazione di utilizzo (Allegato 6 DPR 120/2017) è il documento del portale in Allega documenti dopo aver spuntato le dichiarazioni: la firma il produttore, Claude la allega nella seconda compilazione (dopo le dichiarazioni); lo scavo inizia almeno 15 giorni dopo l'invio"
  - "Quando tutte le terre e rocce da scavo saranno state utilizzate, entro la validità della dichiarazione, presenta sul SUE la dichiarazione di avvenuto utilizzo (art. 7 DPR 120/2017)"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
answers:
  descrizione: PROVA NON INVIARE - SCIA e terre e rocce P6
  oggetto: "Manutenzione straordinaria non strutturale con modifica dei prospetti (persiane e ringhiere in facciata), nuovo bagno e nuovo allaccio fognario nel cortile, con scavo di 40 m³ di terre portate a un altro cantiere come sottoprodotto (dati inventati per la prova)."
  # The asseverazione says what the dichiarazione files: by-products from a small site.
  scavo: sottoprodotti
  scavo_piano_utilizzo: "false"
