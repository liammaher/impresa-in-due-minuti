# A beautician's (estetista) structural change to its premises (variazioni strutturali: the area enlarged,
# reduced or laid out otherwise, the equipment, the workstations), as gen.py writes its steps file from
# the batch crawl (catalogue/F839/sections/suap-011-variazioni-strutturali-in-attivita-di-estetista.json),
# for the shop rehearsal's made-up ditta individuale (rehearsals/negozio-fittizio/fixture.json) as a
# salon. Its own sections were written from the crawl's text (the national schema is the opening's);
# the statements (the premises' compliance, the rules, the antimafia, the technical manager's presence)
# are the person's. A comunicazione within 30 days for Napoli's regolamento (artt. 16 and 32), whatever
# the form's own word "SCIA".
procedure: napoli/comune/scia-acconciatore-estetista
title: "Variazioni strutturali di un'attività di estetista, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-011-variazioni-strutturali-in-attivita-di-estetista
subject: impresa
operation: Variazioni strutturali in attività di estetista
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
# The payment and attachments screens: its slots read on a filled draft (2026-11-10).
after: [Pagamento degli oneri, Gestione degli allegati]
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  # The sector sits twice in Napoli's tree; both lead to the same pratica.
  - {screen: Scelta settore attività, tree: [{leaf: "Acconciatore, barbiere, estetista, tatuatore e piercer", nth: 1}], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Variazioni strutturali in attività di estetista"], confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per l'attività? Spunta tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  responsabile_tecnico_altro: {group: extras, type: yes_no, item: "Il responsabile tecnico non è il titolare", why: "La casella della procedura guidata e la sua dichiarazione non le preparo ancora."}
  impatto_acustico: {group: extras, type: yes_no, item: "La modifica richiede una valutazione di impatto acustico (art. 4 DPR 227/2011)", why: "La casella della procedura guidata non la preparo ancora."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "variazione {{business.denominazione}}"}
  diritti_euro: {type: number, question: "I diritti SUAP in euro (la riga della tabella 2026 per la variazione di un'estetista: controllala)"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta tu le dichiarazioni: consapevolezza (artt. 46-47), informativa privacy, antimafia (D.Lgs. 159/2011), la conformità dei locali (edilizia, urbanistica, igiene, accessibilità), le leggi e le regole del Comune, la presenza del responsabile tecnico, tasse comunali, art. 75 DPR 445/2000"
  - "Paga i diritti di segreteria (€ {{ask.diritti_euro}}) con pagoPA nella schermata di pagamento"
  - "Allega, firmato con la tua firma digitale (.p7m), quanto chiede la schermata degli allegati dopo aver spuntato le dichiarazioni (la nuova planimetria, i documenti su attrezzature e postazioni di lavoro)"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
  - {when: "{{ask.responsabile_tecnico_altro|not}}", else: "Un responsabile tecnico diverso dal titolare per ora non lo preparo su questo modulo."}
  - {when: "{{ask.impatto_acustico|not}}", else: "Una valutazione di impatto acustico per ora non la preparo su questo modulo."}
# Which pratica a case is: the library's rules table (rules/suap-napoli.yaml) decides.
rules:
  table: suap-napoli
  facts: {attivita: estetista, evento: ampliamento}
