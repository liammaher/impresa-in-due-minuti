# A SCIA edilizia with its autorizzazione paesaggistica semplificata in one pratica on Napoli's SUE (a
# SCIA condizionata): the two operations selected together in the wizard, as b) says. gen.py
# takes each one's sections from the catalogue and the order from the combination's crawl
# (catalogue/F839/sections/sue-combo-scia-paesaggistica-semplificata.json); every section is one of
# theirs. The SCIA's people and cases are rehearsals/scia-fittizia's; the asseverazione names
# the semplificata procedure and the works start once the SUE says the authorization is in.
# Everything else is scia-fittizia's recipe and what the semplificata adds (parts/paesaggistica-semplificata.yaml):
# a slot or a refusal mapped on either reaches this one.
extends: [scia-fittizia, parts/paesaggistica-semplificata]
procedure: napoli/comune/scia-con-paesaggistica-semplificata
title: "SCIA edilizia con autorizzazione paesaggistica semplificata, SUE Napoli (tecnico con procura)"
crawl: sue-combo-scia-paesaggistica-semplificata
asks:
  descrizione: {default: "SCIA e paesaggistica {{c:identity.last_name}}"}
  # No start date: the works start once the SUE says the authorization is in.
  data_inizio_lavori: null
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC, b) PER PRESA VISIONE, m) diritti di terzi, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "In qualità di progettista, verifica ogni asseverazione di questa pagina: sono tue, e le firmi con la pratica"
  - "Prima dell'inizio dei lavori, nomina chi la pratica lascia da nominare (il direttore dei lavori, il direttore dei lavori strutturali, l'impresa) con la comunicazione di nomina del SUE"
  - "Nessuna data di inizio: i lavori iniziano quando il SUE comunica che l'autorizzazione paesaggistica (e ogni altro assenso) è stata acquisita"
  - "Paga i diritti prima della seconda compilazione (dopo le dichiarazioni): la ricevuta, firmata, va allegata in quella"
  - "{{ask.bollo_marche,ask.bollo_esenzione|bollo_yours}}"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
# The case: the main pratica's P6 answers, the part's, then these (a null drops one);
# `gen.py --answers` writes answers-p6.json.
answers:
  data_inizio_lavori: null
  contributo_normativa: null
  scia_cambio_uso: null
  cambio_uso: null
  oggetto: 'Variante in corso d''opera alla SCIA: nuova apertura in facciata e unità esterna di climatizzazione sul balcone (dati inventati per la prova).'
  dettaglio_intervento: 'Variante non essenziale alla SCIA in corso: nuova finestra sul prospetto interno e unità esterna di climatizzazione sul balcone. Dati inventati per la prova.'
  descrizione: PROVA NON INVIARE - SCIA variante e semplificata
  scia_tipo: variante scia
  allegato_b:
  - paes_b2
  - paes_b7
  scia_variata_numero: PG/2026/0888888
  scia_variata_data: '2026-09-01'
  scia_onerosa: 'true'
  contributo_pagamento: rateizzazione
  contributo_calcolo: prospetto
  prospetto_contributo: rehearsals/cila-fittizia/files/prospetto-contributo.pdf
  intervento: variante_scia
  fatti: []
