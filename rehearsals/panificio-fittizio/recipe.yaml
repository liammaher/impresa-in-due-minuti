# The SUAP's opening of a bakery (SCIA di panificazione with the Reg. 852/2004 notifica), as
# gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-004-aprire-l-attivita.json), for this folder's made-up ditta
# individuale (fixture.json). Its own sections (the bakery's data, who runs production) were
# written from the crawl and mod_panifici_apertura; the 852 activity list now has the bakery lines.
procedure: napoli/comune/scia-panificio
title: "SCIA: apertura di un panificio con notifica sanitaria, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-004-aprire-l-attivita
subject: impresa
operation: Aprire l'attività
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
after: [Pagamento degli oneri, Gestione degli allegati]
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Panificio], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Aprire l'attività"], confirm: CONFERMA}
  - {screen: Scelta interventi eventuali, confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per il panificio? Spunti tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), non ancora mappata."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "panificio {{business.denominazione}}"}
  caldaia: {group: extras, type: yes_no, item: "Forni o riscaldamento oltre 116 kW, o alimentati a combustibile solido o liquido", why: "Ciò comporta la documentazione di prevenzione incendi, un caso non ancora gestito."}
  farina: {group: extras, type: yes_no, item: "Più di 300 kg di farina al giorno", why: "Ciò comporta la documentazione di prevenzione incendi, un caso non ancora gestito."}
  sotterraneo: {group: extras, type: yes_no, item: "Locali interrati (sotterranei o semisotterranei)", why: "Ciò comporta l'autorizzazione ASL per il lavoro in locali sotterranei, un caso non ancora gestito."}
  insegna_esterna: {group: extras, type: yes_no, item: "Avrà un'insegna esterna", why: "Un'insegna esterna include in questa la SCIA dell'insegna, un ramo non ancora mappato."}
  diritti_euro: {type: number, question: "I diritti SUAP in euro (voce del tariffario 2026 per un panificio con notifica sanitaria)"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Spunti Lei le dichiarazioni: consapevolezza (artt. 46-47), informativa privacy, requisiti antimafia e quanto garantisce il responsabile della produzione, altre dichiarazioni, art. 75 DPR 445/2000, art. 6 Reg. 852/2004, tasse comunali"
  - "Paghi i diritti di segreteria (€ {{ask.diritti_euro}}) con pagoPA nella schermata di pagamento, e la tariffa forfettaria ASL"
  - "Firmi e invii (Firma e invio); conservi la ricevuta"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non ancora gestito."}
  - {when: "{{ask.caldaia|not}}", else: "Forni o riscaldamento oltre 116 kW, o a combustibile solido o liquido, non sono ancora gestiti: comportano la prevenzione incendi."}
  - {when: "{{ask.farina|not}}", else: "Una lavorazione di più di 300 kg di farina al giorno non è ancora gestita: comporta la prevenzione incendi."}
  - {when: "{{ask.sotterraneo|not}}", else: "I locali interrati non sono ancora previsti: richiedono anche l'autorizzazione dell'ASL."}
  - {when: "{{ask.insegna_esterna|not}}", else: "Un'insegna esterna non è ancora gestita: include in questa la SCIA dell'insegna."}
  - {when: "{{ask.forno}}", else: "Questa è la pratica di un panificio: devono valere le voci della notifica relative al panificio."}
  - {when: "{{ask.ristorazione|not}}", else: "La somministrazione non rientra nel panificio: è la pratica del bar o ristorante."}
