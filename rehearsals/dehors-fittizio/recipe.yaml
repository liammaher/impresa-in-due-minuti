# A bar or restaurant's outdoor seating (dehors: occupazione di suolo pubblico per area annessa a
# un esercizio di somministrazione), as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-common-occupazione-suolo-pubblico-domanda-di-occupazione-suolo-pubb.json),
# for the pizzeria rehearsal's made-up ditta individuale (rehearsals/pizzeria-fittizia/fixture.json).
# Napoli's rules (the library's napoli/comune/concessione-suolo-pubblico-dehors) are facts the
# person confirms; the technician's project is theirs to attach.
procedure: napoli/comune/concessione-suolo-pubblico-dehors
title: "Domanda di occupazione di suolo pubblico per un dehors (tipo A o B), SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-common-occupazione-suolo-pubblico-domanda-di-occupazione-suolo-pubb
subject: impresa
operation: Domanda di occupazione suolo pubblico per area annessa ad esercizio di somministrazione di alimenti e bevande
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Esercizio di somministrazione di alimenti e bevande in zone NON tutelate], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: [Domanda di occupazione suolo pubblico per area annessa ad esercizio di somministrazione di alimenti e bevande], confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per il dehors? Spunti tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  coperto: {group: extras, type: yes_no, item: "Una struttura coperta: tende fisse, pedane o paraventi (tipo C), oppure chiusa su non più di tre lati (tipo D)", why: "I tipi C e D richiedono ulteriori documenti (e nel centro storico non sono ammessi): caso non ancora previsto."}
  centro_storico: {group: extras, type: yes_no, item: "Si trova nel centro storico (area UNESCO o buffer zone)", why: "Lì sono ammessi solo i tipi A e B, con ombrellone a palo centrale, e può essere coinvolta la Soprintendenza: caso non ancora previsto."}
  musica: {group: extras, type: yes_no, item: "Musica o impianto audio all'esterno", why: "Per il dehors si dichiara poi il rispetto dei limiti acustici; la domanda serve a spuntare la casella corretta."}
  nuovo_852: {group: extras, type: yes_no, item: "La notifica Reg. 852 dell'impresa non è ancora stata presentata", why: "In tal caso va presentato con questa pratica, un caso non ancora previsto."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "dehors {{business.denominazione}}"}
  diritti_euro: {type: number, question: "I diritti SUAP in euro", default: "250", why: "La voce del tariffario 2026 per il suolo pubblico annesso a pubblici esercizi (DGC 239/2026)."}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Faccia firmare a un tecnico il progetto del dehors (elaborati grafici e relazione) e lo alleghi"
  - "Spunti Lei le dichiarazioni e gli impegni: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, il montaggio certificato, il canone"
  - "Paghi i diritti di segreteria (€ {{ask.diritti_euro}}) con pagoPA"
  - "{{ask.bollo_marche,ask.bollo_esenzione|bollo_yours}}"
  - "Firmi e invii (Firma e invio); una volta concessa, paghi il canone unico con l'avviso che invia il Comune"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
  - {when: "{{ask.coperto|not}}", else: "I dehors coperti (tipo C o D) non sono ancora gestiti."}
  - {when: "{{ask.centro_storico|not}}", else: "Un dehors nel centro storico per ora non lo preparo."}
  - {when: "{{ask.nuovo_852|not}}", else: "Presentare la notifica Reg. 852 insieme al dehors per ora non lo preparo: presenti prima l'apertura dell'attività."}
