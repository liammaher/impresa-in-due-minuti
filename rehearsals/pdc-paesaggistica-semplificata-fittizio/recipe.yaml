# A permesso di costruire with its autorizzazione paesaggistica semplificata in one pratica on Napoli's
# SUE: the two operations selected together in the wizard, as for the SCIA
# (rehearsals/scia-paesaggistica-semplificata-fittizia). gen.py takes each one's sections from the
# catalogue and the order from the combination's crawl
# (catalogue/F839/sections/sue-combo-pdc-paesaggistica-semplificata.json); every section is one of
# theirs. The permesso's people and cases are rehearsals/pdc-fittizio's; its asseverazione names
# the semplificata procedure.
# Everything else is pdc-fittizio's recipe and what the semplificata adds (parts/paesaggistica-semplificata.yaml):
# a slot or a refusal mapped on either reaches this one.
extends: [pdc-fittizio, parts/paesaggistica-semplificata]
procedure: napoli/comune/permesso-di-costruire-con-paesaggistica-semplificata
title: "Permesso di costruire con autorizzazione paesaggistica semplificata, SUE Napoli (tecnico con procura)"
crawl: sue-combo-pdc-paesaggistica-semplificata
asks:
  descrizione: {default: "PdC e paesaggistica {{c:identity.last_name}}"}
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Spunti le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC, j) diritti di terzi, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "In qualità di progettista, verifichi ogni asseverazione di questa pagina: il portale ne ricava la Relazione tecnica di asseverazione che Lei firma con la richiesta"
  - "Nell'asseverazione, la voce \"non interessa aree percorse dal fuoco\" (qualità terreni) è sul portale un'unica scelta insieme alla dichiarazione sui terreni: Claude spunta la dichiarazione sui terreni e lascia non spuntata quella voce (un difetto del portale, docs/portal-defects.md); lo dichiari nella relazione tecnica se il SUE lo richiede"
  - "Paghi il bollo come chiede il portale, poi firmi e invii (Firma e invio); conservi la ricevuta"
  - "L'autorizzazione paesaggistica precede il permesso (art. 146 c. 4 D.Lgs. 42/2004): i lavori iniziano solo quando sono stati ottenuti entrambi"
  - "Una volta rilasciato il permesso: lo ritiri (pagando il contributo, se dovuto, come indica il quadro f)), nomini il progettista strutturale e i direttori dei lavori, e presenti la comunicazione di inizio lavori con la relazione energetica e i depositi strutturali"
# The case: the main pratica's P6 answers, the part's, then these (a null drops one);
# `gen.py --answers` writes answers-p6.json.
answers:
  oggetto: Ampliamento fuori sagoma di un edificio residenziale esistente, entro il 10% del volume e 60 m³, in area vincolata (dati inventati per la prova).
  dettaglio_intervento: Ampliamento al piano terra sul retro dell'edificio esistente, 60 m³ (meno del 10% del volume originario), struttura in cemento armato, nuovo impianto elettrico e idrico. Dati inventati per la prova.
  descrizione: PROVA NON INVIARE - PdC ampliamento e semplificata
  demolizioni: 'false'
  pdc_tipo: nuova costruzione
  intervento: nuova_costruzione
  allegato_b:
  - paes_b1
  nuova_costruzione_tipo: e1
