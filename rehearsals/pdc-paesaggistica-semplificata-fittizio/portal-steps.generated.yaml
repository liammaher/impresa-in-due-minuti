  - {id: 'r4c1p4reg:chk', kind: checkbox, when: '{{ask.fasce|is_no|not}} {{ask.fascia_stradale}}', label: stradale}
  - {id: 'r6c1p6reg:txt', kind: text, value: '{{ask.fascia_stradale_quale}}', when: '{{ask.fasce|is_no|not}} {{ask.fascia_stradale}}', max: 9999, label: 'Specificare:'}
  - {kind: checkbox, when: '{{ask.fasce|is_no|not}} {{ask.fascia_ferroviaria}}', label: ferroviario}
  - {kind: checkbox, when: '{{ask.fasce|is_no|not}} {{ask.fascia_elettrodotto}}', label: elettrodotto}
  - {kind: checkbox, when: '{{ask.fasce|is_no|not}} {{ask.fascia_gasdotto}}', label: gasdotto}
  - {kind: checkbox, when: '{{ask.fasce|is_no|not}} {{ask.fascia_militare}}', label: militare}
  - {kind: checkbox, when: '{{ask.fasce|is_no|not}} {{ask.fascia_aeroportuale}}', label: aeroportuale}
  - {kind: checkbox, when: '{{ask.fasce|is_no|not}} {{ask.fascia_altro}}', label: Altro}
  - {kind: text, value: '{{ask.fascia_altro_quale}}', when: '{{ask.fasce|is_no|not}} {{ask.fascia_altro}} {{ask.fascia_stradale|not}}', max: 9999, label: 'Specificare:'}
  - {id: 'r14c1p14reg:txt', kind: text, value: '{{ask.fascia_altro_quale}}', when: '{{ask.fasce|is_no|not}} {{ask.fascia_altro}} {{ask.fascia_stradale}}', max: 9999, label: 'Specificare:', nth: 2}
  - {kind: checkbox, when: '{{ask.fasce|is_autocertificazione}}', label: si allegano le autocertificazioni}
  - {kind: checkbox, when: '{{ask.fasce|is_assenso}}', label: si allega la documentazione necessaria ai fini del rilascio dei relativi atti di assenso}
- section: Dichiarazione relativa ai diritti
  fields:
  - {id: 'r2c1p2reg:radio:0_clone', kind: radio, when: '{{ask.diritti_euro|positive|not}}', label: non sono dovuti oneri}
  - {id: 'r3c1p3reg:radio:1_clone', kind: radio, when: '{{ask.diritti_euro|positive|not}}', label: poiché non previsti dal tariffario}
  - {id: 'r5c1p8reg:radio:3_clone', kind: radio, when: '{{ask.diritti_euro|positive}}', label: sono dovuti oneri quali diritti o spese}
  - {id: 'r7c1p10reg:real', kind: number, value: '{{ask.diritti_euro}}', when: '{{ask.diritti_euro|positive}}', max: 11, label: per un totale di Euro}
  - {id: 'r8c1p13reg:radio:4_clone', kind: radio, when: '{{ask.diritti_euro|positive}}', label: pagamento on line}
- section: Dichiarazione relativa all'assolvimento dell'imposta di bollo
  fields:
  - {id: 'r3c1p3reg:radio:0_clone', kind: radio, when: '{{ask.bollo_marche|not}}', label: Il pagamento è dovuto e si intende assolvere l'obbligo tramite il circuito digitale pagoPA}
  - {id: 'r5c2p7reg:radio:1_clone', kind: radio, when: '{{ask.bollo_marche|not}}', label: 'Due marche da €16,00 ciascuna'}
  - {id: 'r8c1p14reg:radio:1_clone', kind: radio, when: '{{ask.bollo_marche}}', label: Il pagamento è dovuto e si intende assolvere l'obbligo con marche da bollo}
  - {id: 'r13c2p30reg:radio:2_clone', kind: radio, when: '{{ask.bollo_marche}}', label: 'Marca da €16,00 per l''autorizzazione'}
  - {kind: text, value: '{{ask.bollo_seriale}}', when: '{{ask.bollo_marche}}', max: 14, label: numero seriale (1)}
  - {kind: date, value: '{{ask.bollo_data|date_it}}', when: '{{ask.bollo_marche}}', label: data}
  - {id: 'r15c2p34reg:txt', kind: text, value: '{{ask.bollo_seriale_2}}', on_page: true, when: '{{ask.bollo_marche}}', max: 14, label: numero seriale (1), nth: 2}
  - {id: 'r15c3p36reg:calendar_input', kind: date, value: '{{ask.bollo_data_2|date_it}}', on_page: true, when: '{{ask.bollo_marche}}', label: data, nth: 2}
- section: Pagamento degli oneri
  go: Prosegui
  save: false
  fields: []
- section: Gestione degli allegati
  go: Prosegui
  theirs:
  - Procura speciale
  - Quadro riepilogativo della documentazione
  - Scarica il documento
  - Documentazione dimostrativa dello stato legittimo
  - copia attestazione versamento oneri, diritti e spese
  - Relazione Paesaggistica Semplificata
  - Elaborati di progetto individuati nell'Allegata Relazione Pa
  - Elaborato dimostrativo dell'equipaggiamento di infrastruttur
  fields:
  - {kind: file, label: Fotocopia di un documento di identita' del soggetto che conferisce, value: '{{ask.documento_identita_cliente}}', accepts: pdf;pdf.p7m}
  - {kind: file, label: Copia dei documenti d'identità del/i titolare/i, value: '{{ask.documento_identita_cliente}}', when: '{{ask.titolo_esclusivo|not}}', accepts: xml;dwf;dwf.p7m;svg;svg.p7m;jpg;jpg.p7m;pdf;pdf.p7m}
  - {kind: file, label: Dichiarazione di assenso dei terzi titolari, value: '{{ask.assenso_proprietario}}', when: '{{ask.titolo_esclusivo|not}}', accepts: xml;dwf;dwf.p7m;svg;svg.p7m;jpg;jpg.p7m;pdf;pdf.p7m}
  - {kind: file, label: 'Elaborati grafici dello stato di fatto, di progetto e comparativi', value: '{{ask.elaborati_grafici}}', accepts: xml;dwf;dwf.p7m;svg;svg.p7m;jpg;jpg.p7m;pdf;pdf.p7m}
  - {kind: file, label: Documentazione fotografica dello stato di fatto, value: '{{ask.documentazione_fotografica}}', accepts: xml;dwf;dwf.p7m;svg;svg.p7m;jpg;jpg.p7m;pdf;pdf.p7m}
  - {kind: file, label: 'Progetto dell''impianto di produzione, trasformazione', value: '{{ask.progetto_elettrico_doc}}', when: '{{ask.progetto_impianti}} {{ask.impianti}} {{ask.impianto_elettrico}}'}
  - {kind: file, label: Progetto degli impianti radiotelevisivi, value: '{{ask.progetto_radiotv_doc}}', when: '{{ask.progetto_impianti}} {{ask.impianti}} {{ask.impianto_radiotv}}'}
  - {kind: file, label: Progetto dell'impianto di riscaldamento, value: '{{ask.progetto_termico_doc}}', when: '{{ask.progetto_impianti}} {{ask.impianti}} {{ask.impianto_termico}}'}
  - {kind: file, label: Progetto degli impianti idrici e sanitari, value: '{{ask.progetto_idrico_doc}}', when: '{{ask.progetto_impianti}} {{ask.impianti}} {{ask.impianto_idrico}}'}
  - {kind: file, label: Progetto dell'impianto per la distribuzione e l'utilizzazione di gas, value: '{{ask.progetto_gas_doc}}', when: '{{ask.progetto_impianti}} {{ask.impianti}} {{ask.impianto_gas}}'}
  - {kind: file, label: Progetto dell'impianto di sollevamento, value: '{{ask.progetto_ascensore_doc}}', when: '{{ask.progetto_impianti}} {{ask.impianti}} {{ask.impianto_ascensore}}'}
  - {kind: file, label: Progetto dell'impianto di protezione antincendio, value: '{{ask.progetto_antincendio_doc}}', when: '{{ask.progetto_impianti}} {{ask.impianti}} {{ask.impianto_antincendio}}'}
  - {kind: file, label: Progetto di altre tipologie di impianti, value: '{{ask.progetto_altro_doc}}', when: '{{ask.progetto_impianti}} {{ask.impianti}} {{ask.impianto_altro}}'}
  - {kind: file, label: Autorizzazione sismica, value: '{{ask.toll_sismica_doc}}', when: '{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}} {{ask.toll_sismica|is_autorizzazione}}'}
  - {kind: file, label: Ricevuta/e di versamento a titolo di sanzione, value: '{{ask.sanzione_ricevuta}}', when: '{{ask.stato_legittimo|is_sanzioni}} {{ask.sanzione_prova|is_ricevuta}}'}
  - {kind: file, label: Documentazione necessaria per la richiesta di autorizzazione all'allaccio in pubblica fognatura, value: '{{ask.allaccio_doc}}', when: '{{ask.scarichi|is_allaccio_da_richiedere}}'}
  - {kind: file, label: Allegati liberi, value: '{{ask.relazione_tecnica}}', describe: Relazione tecnica, accepts: dwf.p7m;svg.p7m;jpg.p7m;pdf.p7m;pdf;xml;dwf;svg;jpg}
  - {kind: file, label: Elaborati relativi al superamento delle barriere architettoniche, value: '{{ask.elaborati_barriere}}', when: '{{ask.barriere}}', accepts: xml;dwf;dwf.p7m;svg;svg.p7m;jpg;jpg.p7m;pdf;pdf.p7m}
  - {kind: file, label: Documentazione necessaria per il rilascio dell'autorizzazione sismica, value: '{{ask.sismica_doc}}', when: '{{ask.strutture}} {{ask.sismica|is_autorizzazione}}'}
  - {kind: file, label: Documentazione per il rilascio del parere/nulla osta da parte della Soprintendenza, value: '{{ask.soprintendenza_doc}}', when: '{{ask.bene_culturale}}'}
  - {kind: file, label: Deroga all'integrale osservanza delle regole tecniche di prevenzione incendi, value: '{{ask.antincendio_deroga_doc}}', when: '{{ask.antincendio_soggetto}} {{ask.antincendio_deroga}}'}
  - {kind: file, label: Documentazione per il rilascio del parere/nulla osta dell'ente competente, value: '{{ask.area_protetta_doc}}', when: '{{ask.area_protetta|is_nulla_osta}}'}
  - {kind: file, label: Documentazione per il rilascio dell'autorizzazione relativa al vincolo idrogeologico, value: '{{ask.idrogeologico_doc}}', when: '{{ask.idrogeologico|is_autorizzazione}}'}
  - {kind: file, label: Documentazione per il rilascio dell'autorizzazione relativa al vincolo idraulico, value: '{{ask.idraulico_doc}}', when: '{{ask.idraulico}}'}
  - {kind: file, label: Documentazione necessaria all'approvazione del progetto (VINCA), value: '{{ask.vinca_doc}}', when: '{{ask.vinca}}'}
  - {kind: file, label: Documentazione necessaria per la valutazione del progetto da parte del Comitato Tecnico Regionale, value: '{{ask.rir_doc}}', when: '{{ask.rir|is_in_area}}'}
  - {kind: file, label: Documentazione necessaria per la valutazione del progetto da parte del Comitato Tecnico Regionale, value: '{{ask.rir_doc}}', when: '{{ask.rir|is_non_individuata}}'}
  - {kind: file, label: Autocertificazioni relative alla conformità dell'intervento per i relativi vincoli (, value: '{{ask.altri_vincoli_eco_doc}}', when: '{{ask.altri_vincoli_eco|is_autocertificazione}}'}
  - {kind: file, label: Documentazione necessaria per il rilascio di atti di assenso relativi ad altri vincoli di tutela ecologica, value: '{{ask.altri_vincoli_eco_doc}}', when: '{{ask.altri_vincoli_eco|is_assenso}}'}
  - {kind: file, label: Autocertificazioni relative alla conformità dell'intervento per i relativi vincoli di tutela funzionale (stradale), value: '{{ask.fascia_stradale_doc}}', when: '{{ask.fasce|is_autocertificazione}}
      {{ask.fascia_stradale}}'}
  - {kind: file, label: Autocertificazioni relative alla conformità dell'intervento per i relativi vincoli di tutela funzionale (ferroviario), value: '{{ask.fascia_ferroviaria_doc}}', when: '{{ask.fasce|is_autocertificazione}}
      {{ask.fascia_ferroviaria}}'}
  - {kind: file, label: Autocertificazioni relative alla conformità dell'intervento per i relativi vincoli di tutela funzionale (elettrodotto), value: '{{ask.fascia_elettrodotto_doc}}', when: '{{ask.fasce|is_autocertificazione}}
      {{ask.fascia_elettrodotto}}'}
  - {kind: file, label: Autocertificazioni relative alla conformità dell'intervento per i relativi vincoli di tutela funzionale (gasdotto), value: '{{ask.fascia_gasdotto_doc}}', when: '{{ask.fasce|is_autocertificazione}}
      {{ask.fascia_gasdotto}}'}
  - {kind: file, label: Autocertificazioni relative alla conformità dell'intervento per i relativi vincoli di tutela funzionale (militare), value: '{{ask.fascia_militare_doc}}', when: '{{ask.fasce|is_autocertificazione}}
      {{ask.fascia_militare}}'}
  - {kind: file, label: Autocertificazioni relative alla conformità dell'intervento per i relativi vincoli di tutela funzionale (aeroportuale), value: '{{ask.fascia_aeroportuale_doc}}', when: '{{ask.fasce|is_autocertificazione}}
      {{ask.fascia_aeroportuale}}'}
  - {kind: file, label: Autocertificazioni relative alla conformità dell'intervento per i relativi vincoli di tutela funzionale (altro), value: '{{ask.fascia_altro_doc}}', when: '{{ask.fasce|is_autocertificazione}}
      {{ask.fascia_altro}}'}
  - {kind: file, label: Documentazione necessaria per il rilascio di atti di assenso relativi ai vincoli di tutela funzionale (stradale), value: '{{ask.fascia_stradale_doc}}', when: '{{ask.fasce|is_assenso}}
      {{ask.fascia_stradale}}'}
  - {kind: file, label: Documentazione necessaria per il rilascio di atti di assenso relativi ai vincoli di tutela funzionale (ferroviario), value: '{{ask.fascia_ferroviaria_doc}}', when: '{{ask.fasce|is_assenso}}
      {{ask.fascia_ferroviaria}}'}
  - {kind: file, label: Documentazione necessaria per il rilascio di atti di assenso relativi ai vincoli di tutela funzionale (elettrodotto), value: '{{ask.fascia_elettrodotto_doc}}', when: '{{ask.fasce|is_assenso}}
      {{ask.fascia_elettrodotto}}'}
  - {kind: file, label: Documentazione necessaria per il rilascio di atti di assenso relativi ai vincoli di tutela funzionale (gasdotto), value: '{{ask.fascia_gasdotto_doc}}', when: '{{ask.fasce|is_assenso}}
      {{ask.fascia_gasdotto}}'}
  - {kind: file, label: Documentazione necessaria per il rilascio di atti di assenso relativi ai vincoli di tutela funzionale (militare), value: '{{ask.fascia_militare_doc}}', when: '{{ask.fasce|is_assenso}}
      {{ask.fascia_militare}}'}
  - {kind: file, label: Documentazione necessaria per il rilascio di atti di assenso relativi ai vincoli di tutela funzionale (aeroportuale), value: '{{ask.fascia_aeroportuale_doc}}', when: '{{ask.fasce|is_assenso}}
      {{ask.fascia_aeroportuale}}'}
  - {kind: file, label: Documentazione necessaria per il rilascio di atti di assenso relativi ai vincoli di tutela funzionale (altro), value: '{{ask.fascia_altro_doc}}', when: '{{ask.fasce|is_assenso}}
      {{ask.fascia_altro}}'}
  - {kind: file, label: Documentazione di impatto acustico, value: '{{ask.acustica_impatto_doc}}', when: '{{ask.acustica}} {{ask.acustica_impatto}}'}
  - {kind: file, label: Dichiarazione sostitutiva, value: '{{ask.acustica_dichiarazione_doc}}', when: '{{ask.acustica}} {{ask.acustica_dichiarazione}}'}
  - {kind: file, label: Valutazione previsionale di clima acustico, value: '{{ask.acustica_clima_doc}}', when: '{{ask.acustica}} {{ask.acustica_clima}}'}
  - {kind: file, label: Documentazione di previsione di impatto acustico, value: '{{ask.acustica_misure_doc}}', when: '{{ask.acustica}} {{ask.acustica_misure}}'}
  - {kind: file, label: Documentazione necessaria al rilascio del parere progetto da parte dei Vigili del Fuoco, value: '{{ask.vvf_doc}}', when: '{{ask.vvf_valutazione}}'}
  - {kind: file, label: Documentazione per la richiesta di deroga alla conformità ai requisiti igienico sanitari, value: '{{ask.igienico_deroga_doc}}', when: '{{ask.igienico_conforme|not}}'}
  - {kind: file, label: Documentazione necessaria per la richiesta di deroga alla fascia di rispetto cimiteriale, value: '{{ask.cimiteriale_doc}}', when: '{{ask.fascia_cimiteriale|is_non_consentito}}'}
  - {kind: file, label: Risultati delle analisi ambientali sulla qualità dei terreni, value: '{{ask.indagini_analisi_doc}}', when: '{{ask.indagini_ambientali}} {{ask.indagini_esito|is_analisi}}'}
