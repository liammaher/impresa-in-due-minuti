  fascia_ferroviaria_doc: {type: file, question: 'The railway fascia''s document: the self-certification, or the request for its assent (PDF)'}
  fascia_elettrodotto_doc: {type: file, question: 'The power line''s fascia document: the self-certification, or the request for its assent (PDF)'}
  fascia_gasdotto_doc: {type: file, question: 'The gas pipeline''s fascia document: the self-certification, or the request for its assent (PDF)'}
  fascia_militare_doc: {type: file, question: 'The military fascia''s document: the self-certification, or the request for its assent (PDF)'}
  fascia_aeroportuale_doc: {type: file, question: 'The airport fascia''s document: the self-certification, or the request for its assent (PDF)'}
  fascia_altro_doc: {type: file, question: 'The other fascia''s document: the self-certification, or the request for its assent (PDF)'}
  diritti_euro: {type: number, question: The SUE's diritti for this pratica in euro (0 when none are due)}
  documento_identita_cliente: {type: file, question: The client's identity document (PDF)}
  assenso_proprietario: {type: file, question: The owner's signed assent to the works (PDF)}
  elaborati_grafici: {type: file, question: 'The drawings: stato di fatto, progetto, comparativo (PDF)'}
  relazione_tecnica: {type: file, question: The relazione tecnica (PDF)}
  documentazione_fotografica: {type: file, question: Photos of the state of the premises (PDF)}
  elaborati_barriere: {type: file, question: The drawings showing how the project meets the barriers rules (artt. 77-82 DPR 380/2001) (PDF)}
  intervento: {type: choice, question: 'Che lavori sono, secondo le definizioni dell''art. 3 DPR 380/2001?', options: [edilizia_libera, opere_temporanee, nessuna_opera, manutenzione_straordinaria, restauro,
      ristrutturazione, ristrutturazione_pesante, nuova_costruzione, ristrutturazione_urbanistica, variante_pdc, variante_essenziale_pdc, variante_scia, altro], labels: {edilizia_libera: 'Lavori senza titolo
        dell''art. 6 c. 1: manutenzione ordinaria (riparare, rinnovare e sostituire finiture, tenere in efficienza gli impianti), barriere architettoniche senza ascensori esterni né modifiche della sagoma,
        VEPA, tende e pergole a telo retrattile, pavimentazioni esterne e simili', opere_temporanee: 'Opere stagionali o per esigenze contingenti e temporanee, da rimuovere entro 180 giorni, montaggio e
        smontaggio compresi (art. 6 c. 1 e-bis)', nessuna_opera: 'Nessun lavoro: solo un cambio di destinazione d''uso', manutenzione_straordinaria: 'Manutenzione straordinaria (art. 3 c. 1 b): rinnovare
        e sostituire parti dell''edificio, servizi igienici e impianti, frazionare o accorpare unità', restauro: Restauro e risanamento conservativo (art. 3 c. 1 c), ristrutturazione: Ristrutturazione edilizia
        (art. 3 c. 1 d) che non è uno dei casi dell'art. 10 c. 1 c, ristrutturazione_pesante: 'Ristrutturazione edilizia dell''art. 10 c. 1 c: un organismo in parte o del tutto diverso con più volume, o
        con cambio d''uso in zona omogenea A, o che cambia sagoma, volume o prospetti di un immobile tutelato, o la demolizione e ricostruzione in un''area tutelata (artt. 136 c. 1 c e d, 142) con modifiche',
      nuova_costruzione: 'Nuova costruzione (art. 3 c. 1 e), compresi gli ampliamenti fuori sagoma', ristrutturazione_urbanistica: Ristrutturazione urbanistica (art. 3 c. 1 f), variante_pdc: Variante in
        corso d'opera a un permesso di costruire che non è una variazione essenziale, variante_essenziale_pdc: Variante in corso d'opera a un permesso di costruire che è una variazione essenziale, variante_scia: Variante
        in corso d'opera a una SCIA (essenziale o no), altro: 'Altro: il Piano casa (L.R. 19/2009), proroghe e volture. Il permesso in deroga (art. 14), il permesso convenzionato (art. 28-bis), i sottotetti
        (L.R. 15/2000), i parcheggi e i cambi d''uso della L.R. 19/2001 sono i lavori che fanno: scegli la loro voce dell''art. 3'}, how: Lo stabilisce il tecnico dalle definizioni dell'art. 3 e dall'elenco
      dell'art. 6 DPR 380/2001.}
  sanatoria: {group: fatti, type: yes_no, item: 'I lavori sono già iniziati, o già finiti, senza il titolo che serviva?'}
  prospetti: {group: fatti, type: yes_no, item: 'La manutenzione straordinaria modifica i prospetti (le facciate) dell''edificio?'}
  cambio_uso: {type: choice, question: 'I lavori cambiano la destinazione d''uso? Si sceglie il primo caso che vale.', options: ['no', zona_agricola, non_rilevante, stessa_categoria, tra_categorie, piano_terra,
      intero_immobile, intero_tra_categorie, altro], labels: {'no': 'No', zona_agricola: 'Sì, in una zona agricola (zona E del PRG)', non_rilevante: 'Sì, ma il cambio non aumenta il fabbisogno di standard
        urbanistici (aree per servizi e parcheggi): in Campania non è urbanisticamente rilevante', stessa_categoria: 'Sì, di una singola unità, restando nella stessa categoria funzionale', tra_categorie: 'Sì,
        di una singola unità in un immobile delle zone A, B o C del D.M. 1444/1968, tra le categorie residenziale, turistico-ricettiva, produttiva e direzionale, commerciale (art. 23-ter c. 1-ter), non
        al piano terra né seminterrata', piano_terra: 'Sì, di una singola unità al piano terra (primo piano fuori terra) o seminterrata, verso un''altra categoria funzionale', intero_immobile: 'Sì, di un
        intero immobile, restando nella stessa categoria funzionale', intero_tra_categorie: 'Sì, di un intero immobile, verso un''altra categoria funzionale', altro: 'Sì, in un altro modo: un''unità fuori
        delle zone A, B e C (o equipollenti) verso un''altra categoria, o verso o dalla categoria rurale fuori della zona E'}, how: 'Le categorie funzionali sono quelle dell''art. 23-ter c. 1 DPR 380/2001
      (residenziale, turistico-ricettiva, produttiva e direzionale, commerciale, rurale). Il fabbisogno di standard lo stabilisce il tecnico dalle dotazioni che il PRG chiede per la nuova destinazione (art.
      2 c. 4 L.R. Campania 13/2022, art. 27 c. 2 L.R. 31/2021).'}
  uso_ammesso_prg: {group: fatti, type: yes_no, item: 'La nuova destinazione d''uso è tra quelle che il PRG ammette in quella zona?'}
  verso_a2_tavola_7a: {group: fatti, type: yes_no, item: 'Il cambio porta un''abitazione ordinaria (a.1) a B&B, affittacamere, casa o appartamento per vacanze o locazione breve non imprenditoriale (a.2),
      in un edificio dell''area della tavola 7a del centro storico?', how: 'Le sottocategorie sono quelle dell''art. 21 delle norme della Variante generale come modificato dalla D.C.C. 129/2026; l''area
      è quella della tavola 7a "centro storico, area di salvaguardia dell''offerta abitativa ordinaria".'}
  cambio_uso_sagoma: {group: fatti, type: yes_no, item: 'Le opere che accompagnano il cambio d''uso dell''immobile incidono sulla sagoma o ne aumentano i volumi?'}
  paesaggio_eseguiti: {group: fatti, type: yes_no, item: 'Le opere che chiedono l''autorizzazione paesaggistica sono già state eseguite, anche in parte?'}
  paesaggio_volumi: {group: fatti, type: yes_no, item: 'Le opere già eseguite hanno creato superfici utili o volumi, o aumentato quelli legittimamente realizzati?'}
  demolizione_zona_a: {group: fatti, type: yes_no, item: 'I lavori demoliscono e ricostruiscono un edificio, o la variante cambia la sagoma, in zona A della Variante generale al PRG o della Variante occidentale?',
    how: La zona si legge nella tavola di zonizzazione del PRG di Napoli.}
  piano_planovolumetrico: {group: fatti, type: yes_no, item: 'La nuova costruzione o la ristrutturazione urbanistica è disciplinata da un piano attuativo con precise disposizioni plano-volumetriche dichiarate
      dal Comune, o (per una nuova costruzione) è in diretta esecuzione di uno strumento urbanistico generale che le contiene?'}
supports:
- value: '{{ask.incentivo_energetico}}'
  in:
  - art 14 c6
  - art 14 c7
  - bonus volumetrico
  else: 'The permesso''s form on the portal wants one energy incentive claimed (art. 14 c. 6 or 7 D.Lgs. 102/2014, or the 5% bonus of D.Lgs. 28/2011) even with no energy works: a project with none can''t
    be filed on it as is; ask the SUE.'
- if: '{{ask.scia_onerosa}}'
  value: '{{ask.contributo_pagamento}}'
  in:
  - prima dei lavori
  - rateizzazione
  - in corso d'opera
  else: 'A permesso''s contributo is paid when it''s collected, in instalments or during the works: never before filing.'
- when: '{{ask.paes_variante|not}}'
  else: 'So far only for a new authorization: the variant of one already issued isn''t run yet.'
- value: '{{ask.pdc_tipo}}'
  in:
  - nuova costruzione
  - ristrutturazione urbanistica
  - ristrutturazione edilizia
  - facolta scia
  - variante essenziale
  - variante sagoma
  - sottotetti
  - parcheggi
  - mutamento uso
  else: The piano casa (L.R. Campania 19/2009) takes no new requests since 30 September 2022 (L.R. 31/2021 art. 28 c. 6; L.R. 13/2022 art. 4 c. 17 decides only those pending then). A variant to a permesso
    issued under it isn't mapped.
- if: '{{ask.pdc_tipo|is_mutamento_uso}}'
  value: '{{ask.scia_cambio_uso}}'
  in:
  - stessa categoria
  - tra categorie
  - intero immobile
  else: 'A change of use under art. 2 L.R. 19/2001 changes the use: say which (stessa categoria, tra categorie or intero immobile).'
- if: '{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia}} {{ask.pdc_procedura|is_deroga}}'
  value: '{{ask.deroga_densita,ask.deroga_altezza,ask.deroga_distanza,ask.deroga_destinazione|any}}'
  in:
  - 'true'
  else: 'A permesso in deroga (art. 14 DPR 380/2001) derogates from at least one limit: density, height, distance or use.'
- if: '{{ask.sanatoria_titolo|is_permesso}}'
  value: '{{ask.pdc_tipo}}'
  in:
  - nuova costruzione
  - ristrutturazione urbanistica
  - ristrutturazione edilizia
  else: 'A permesso in sanatoria (art. 36 DPR 380/2001) is mapped for art. 10 works: not a Campania kind or a variant.'
- if: '{{ask.sanatoria_titolo|is_permesso}}'
  value: '{{ask.pdc_procedura}}'
  in:
  - ordinaria
  else: 'A permesso in sanatoria (art. 36 DPR 380/2001) is asked as such: not as a convenzionato or in deroga.'
- if: '{{ask.stato_legittimo|is_titoli}}'
  value: '{{ask.prec_titolo_unico,ask.prec_permesso,ask.prec_autorizzazione,ask.prec_comunicazione,ask.prec_dia,ask.prec_dia_alternativa,ask.prec_scia,ask.prec_cel,ask.prec_condono,ask.prec_pdc_sanatoria,ask.prec_scia_sanatoria,ask.prec_scia_sanatoria_variante,ask.prec_altro|any}}'
  in:
  - 'true'
  else: A stato legittimo from the building's titles needs at least one title.
- if: '{{ask.stato_legittimo|in_epoca__prova}}'
  value: '{{ask.prova_catasto,ask.prova_altri|any}}'
  in:
  - 'true'
  else: A building with no title on file needs its catasto primo impianto or other documents.
- if: '{{ask.stato_legittimo|is_tolleranze}}'
  value: '{{ask.toll_prec_pratica,ask.toll_prec_atto|any}}'
  in:
  - 'true'
  else: A stato legittimo from tolerance declarations needs where they were made.
- if: '{{ask.tolleranze}}'
  value: '{{ask.toll_34bis_1,ask.toll_34bis_1bis,ask.toll_34bis_2,ask.toll_34bis_2bis,ask.toll_34ter_4|any}}'
  in:
  - 'true'
  else: Declared construction tolerances need at least one kind (art. 34-bis or 34-ter c. 4).
- if: '{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}}'
  value: '{{ask.toll_sismica}}'
  in:
  - autorizzazione
  - silenzio assenso
  else: 'A structural tolerance relevant for public safety (art. 94-bis c. 1 a) can be declared only with the Genio Civile''s seismic authorization (art. 94 c. 2) or its silenzio assenso (c. 2-bis): art.
    34-bis c. 3-bis DPR 380/2001.'
- if: '{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|in_minore_rilevanza__privo_di_rilevanza}}'
  value: '{{ask.toll_decorso}}'
  in:
  - 'true'
  else: 'A structural tolerance of minor or no relevance for public safety can be declared only once the regional control term has run out, with no open requests and no negative outcome: art. 34-bis c.
    3-bis DPR 380/2001.'
- if: '{{ask.urbanizzazione|not}}'
  value: '{{ask.urbanizzazione_attuazione}}'
  in:
  - convenzione
  else: 'Without primary urbanisation works the portal wants the date of a convenzione, even where the Comune plans the works itself within three years: that case can''t be stated on it as is; ask the SUE.'
