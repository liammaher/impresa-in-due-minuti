# SCIA e proroga paesaggistica e terre e rocce: 3 operations in one pratica on Napoli's SUE (catalogue/F839/sue-pairs.yaml, reason
# authorization-keeps-pace). The case: scia-paesaggistica-semplificata-terre-rocce-fittizia's, with what proroga-paesaggistica-fittizia adds; the other's answers fill
# what the main's don't say (gen.py combo_answers). The rules table sue-napoli routes it.
extends:
- scia-paesaggistica-semplificata-terre-rocce-fittizia
- proroga-paesaggistica-fittizia
procedure: napoli/comune/scia-edilizia-con-proroga-autorizzazione-paesaggistica-e-utilizzo-materiale-scavo-fuori-sito
title: SCIA e proroga paesaggistica e terre e rocce in una pratica, SUE Napoli (tecnico con procura)
comune: F839
sportello: sue
crawl: sue-combo-scia-proroga-paesaggistica-dichiarazione-utilizzo
operation:
- Segnalazione Certificata di Inizio Attività Edilizia (S.C.I.A.)
- Proroga autorizzazione paesaggistica (art. 10 septies, Legge 51/2022 - Comune)
- Dichiarazione di utilizzo del materiale di scavo fuori del sito di produzione ai sensi dell'art. 21 del DPR n.120/2017
  (da trasmettere almeno 15 giorni prima dell'inizio dei lavori di scavo)
scelte:
- IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE
first:
- Scheda anagrafica
- Qualifica e dati del procuratore
after:
- Pagamento degli oneri
- Gestione degli allegati
asks:
  descrizione:
    default: PROVA NON INVIARE - SCIA + proroga paes. + terre e rocce {{c:identity.last_name}}
  diritti_euro:
    question: "The SUE's diritti in euro: an onerous SCIA is in no row of the Comune's 2026 table; ask the SUE"
    propose: "{{ask.scia_onerosa|diritti_gratuito}}"
    why: "Line SUE 10 of the Comune's 2026 table of SUE diritti (G.C. 239/2026): 401 € for a SCIA free of the contributo. An onerous SCIA (art. 22) is in no row: SUE 7-9's brackets name only the permesso a titolo oneroso and the SCIA alternativa, so it's asked (library pitfall, to confirm with the SUE)"
yours:
- Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page
- 'Tick the dichiarante''s declarations: the awareness box under the PEC, b) PER PRESA VISIONE, m) diritti di terzi,
  consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000'
- 'As progettista, check every asseverazione on this page: they are yours, signed with the pratica'
- Before the works start, name whoever the pratica leaves to be named (the direttore dei lavori, the structural
  one, the firm) with the SUE's comunicazione di nomina
- 'No start date: the works start once the SUE says the landscape authorization (and any other assent) is in'
- 'Pay the diritti before the second run (after the declarations): its receipt, signed, goes with it'
- 'The dichiarazione di utilizzo (Allegato 6 DPR 120/2017) is the portal''s document on Allega documenti once the
  declarations are ticked: the producer signs it, Claude attaches it in the second run; the excavation starts at
  least 15 days after sending'
- When the soil has all been used, within the dichiarazione's validity, file the dichiarazione di avvenuto utilizzo
  (art. 7 DPR 120/2017) on the SUE
- 'Tick the dichiarante''s declarations: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, and
  any acknowledgement in the client''s name'
- Sign and send (Firma e invio); keep the receipt
