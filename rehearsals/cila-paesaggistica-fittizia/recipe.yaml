# A CILA with its autorizzazione paesaggistica semplificata in one pratica on Napoli's SUE: the
# CILA rehearsal's P6 job (rehearsals/cila-fittizia) with an outdoor air-conditioning unit on a
# protected building. Two operations: gen.py takes each one's sections from the catalogue and
# the order from the combination's crawl (catalogue/F839/sections/sue-combo-cila-paesaggistica-semplificata.json).
# Everything else is cila-fittizia's recipe and what the semplificata adds (parts/paesaggistica-semplificata.yaml):
# a slot or a refusal mapped on either reaches this one.
extends: [cila-fittizia, parts/paesaggistica-semplificata]
procedure: napoli/comune/cila-con-paesaggistica-semplificata
title: "CILA con autorizzazione paesaggistica semplificata, SUE Napoli (tecnico con procura)"
comune: F839
sportello: sue
crawl: sue-combo-cila-paesaggistica-semplificata
operation:
  - Comunicazione Inizio Lavoro Asseverata (C.I.L.A.)
  - Autorizzazione paesaggistica semplificata (DPR 31/2017 - Comune)
asks:
  descrizione: {default: "PROVA NON INVIARE - CILA e paesaggistica {{c:identity.last_name}}"}
yours:
  - "Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page"
  - "Tick the dichiarante's declarations: the awareness box under the PEC (domicilio elettronico), c) PER PRESA VISIONE, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "Pay the diritti (and the CILA's late-filing penalty if due) and the bollo; upload the receipts"
  - "On Allega documenti: the CILA's documents (procura, CILA DSC summary, IDs, the owner's assent, drawings, relazione tecnica) and the landscape ones (relazione paesaggistica semplificata, Allegato D, with its drawings and photos), signed digitally, and for a structural tolerance relevant for public safety the Genio Civile's seismic authorization (Autorizzazione sismica)"
  - "Sign and send (Firma e invio); keep the receipt"
rules:
  main: napoli/comune/cila-lavori-edilizi
# The combination's attachments screen isn't read yet: the run stops before it.
after: null
attachments: null
# The case: the main pratica's P6 answers, the part's, then these (a null drops one);
# `gen.py --answers` writes answers-p6.json.
answers:
  descrizione: PROVA NON INVIARE - CILA e paesaggistica P6 generato
  oggetto: 'Manutenzione straordinaria non strutturale in appartamento: demolizione e ricostruzione di due tramezzi interni con nuova distribuzione di cucina e bagno, nuovo bagno, rifacimento degli impianti idrico ed elettrico; installazione di un''unità esterna di climatizzazione sul balcone.'
  allegato_b:
  - paes_b7
  paesaggio: semplificata
