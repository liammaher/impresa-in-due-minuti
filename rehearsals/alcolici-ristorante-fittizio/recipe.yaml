# A running bar or restaurant that starts selling alcohol (the Dogane notice, D.Lgs. 504/1995),
# as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-060-comunicazione-all-agenzia-delle-dogane-per-la-vend.json), for
# the pizzeria rehearsal's made-up ditta individuale (rehearsals/pizzeria-fittizia/fixture.json).
procedure: napoli/comune/vendita-alcolici
title: "Comunicazione all'Agenzia delle Dogane per la vendita o somministrazione di prodotti alcolici, bar o ristorante, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-060-comunicazione-all-agenzia-delle-dogane-per-la-vend
subject: impresa
operation: Comunicazione all'Agenzia delle Dogane per la vendita o somministrazione di prodotti alcolici
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
after: [Pagamento degli oneri, Gestione degli allegati]
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Esercizio di somministrazione di alimenti e bevande in zone NON tutelate], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Comunicazione all'Agenzia delle Dogane per la vendita o somministrazione di prodotti alcolici"], confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per l'attività? Spunti tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "alcolici {{business.denominazione}}"}
  diritti_euro: {type: number, question: "I diritti SUAP in euro (voce del tariffario 2026 per la sola comunicazione alle Dogane: verifichi; 0 se non dovuti)"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Spunti Lei le dichiarazioni: nessuna condanna per produzione illecita di alcolici, e avvio solo dopo la presentazione dell'avviso; poi consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "Paghi i diritti di segreteria, se dovuti, con pagoPA nella schermata di pagamento"
  - "Firmi e invii (Firma e invio); conservi la ricevuta"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
  - {when: "{{ask.alcol_con_scia|not}}", else: "Gli alcolici insieme alla SCIA di una nuova attività si dichiarano all'interno dell'apertura (una scelta della procedura guidata che non preparo ancora), non con questa comunicazione."}
  - {when: "{{ask.titolo_attivita_tipo|is_dia|not}}", else: "L'elenco dei titoli del portale qui non comprende la DIA: indichi quale sia, autorizzazione, comunicazione o SCIA."}
