# Accertamento di compatibilità paesaggistica (artt. 167 and 181 D.Lgs. 42/2004) from the Comune of
# Napoli, on its SUE: works that needed the landscape authorization and no building title, already
# done without it or differing from it, with no new usable surface or volume. As gen.py writes its
# steps file from the crawl (catalogue/F839/sections/sue-accertamento-di-compatibilita-
# paesaggistica.json); the CILA rehearsal's architect (with procura) and client.
procedure: napoli/comune/accertamento-compatibilita-paesaggistica
title: "Accertamento di compatibilità paesaggistica (artt. 167-181 D.Lgs. 42/2004), SUE Napoli (tecnico con procura)"
comune: F839
sportello: sue
crawl: sue-accertamento-di-compatibilita-paesaggistica
operation: Accertamento di compatibilità paesaggistica (artt. 167-181 D.Lgs. 42/2004 - Comune)
scelte: [IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE]
first: [Scheda anagrafica, Qualifica e dati del procuratore]
asks:
  descrizione: {default: "PROVA NON INVIARE - accertamento paesaggistico {{c:identity.last_name}}"}
  oggetto: {question: "The works in one sentence (300 characters)"}
yours:
  - "Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page"
  - "Tick the dichiarante's declarations: consapevolezza (artt. 46-47), informativa privacy, art. 181 (PER PRESA VISIONE), tasse comunali"
  - "On Allega documenti: the relazione paesaggistica (DPCM 12/12/2005), the drawings of the state as it is and the photos, signed digitally, and the scheda professionisti e imprese"
  - "If the Comune finds the works compatible: pay the sum it sets (art. 167 c. 5 D.Lgs. 42/2004, the greater of the damage and the profit)"
  - "On Allega documenti: download the portal's procura, have the client sign it, sign it digitally (.p7m) and attach it"
  - "Pay the imposta di bollo (two marche da 16 €) and any diritti on pagoPA after sending"
  - "Sign and send (Firma e invio); keep the receipt"
# Which pratica a case is: the library's rules table (rules/sue-napoli.yaml) decides, and pre-flight
# refuses a case it gives to another pratica, or that needs a pratica this one doesn't file with it.
rules:
  table: sue-napoli
  question: "Quali di queste cose valgono per i lavori? Spunta quelle vere, anche nessuna."
  facts: {permesso_per_scelta: "false"}
supports:
  - when: "{{ask.vincolo|is_art_134|not}}"
    else: "The form names only art. 136 and art. 142: a property protected by the piano paesaggistico alone (art. 134) needs a person to choose."
  - when: "{{ask.titolo|is_locatario|not}}"
    else: "The form offers only ownership, co-ownership, the condominio's administrator or another real right: a tenant isn't one."
  - when: "{{ask.bollo_marche|not}}"
    else: "So far only with the bollo paid on pagoPA: the marche route isn't run yet."
