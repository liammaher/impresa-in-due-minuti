# Accertamento di compatibilità paesaggistica (artt. 167 and 181 D.Lgs. 42/2004) from the Comune of
# Napoli, on its SUE: works that needed the landscape authorization and no building title, already
# done without it or differing from it, with no new usable surface or volume. As gen.py writes its
# steps file from the crawl (catalogue/F839/sections/sue-accertamento-di-compatibilita-
# paesaggistica.json); the CILA rehearsal's architect (with procura) and client.
procedure: napoli/comune/accertamento-compatibilita-paesaggistica
title: "Accertamento di compatibilità paesaggistica (artt. 167-181 D.Lgs. 42/2004), SUE Napoli (tecnico con procura)"
comune: F839
sportello: sue
crawl: sue-accertamento-di-compatibilita-paesaggistica
operation: Accertamento di compatibilità paesaggistica (artt. 167-181 D.Lgs. 42/2004 - Comune)
scelte: [IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE]
first: [Scheda anagrafica, Qualifica e dati del procuratore]
after: [Pagamento degli oneri, Gestione degli allegati]
asks:
  diritti_euro: {default: "441", why: "Voce SUE 3 del tariffario 2026 dei diritti SUE del Comune (G.C. 239/2026): 441 € per un'autorizzazione paesaggistica in sanatoria richiesta autonomamente"}
  # Napoli's own annexes, attached by the second run under Allegati liberi (DD 603/2025; L.R. 59/2018).
  modello_dp: {default: "true"}
  descrizione: {default: "accertamento paesaggistico {{c:identity.last_name}}"}
  oggetto: {question: "I lavori in una frase (300 caratteri)"}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta le dichiarazioni del dichiarante: consapevolezza (artt. 46-47), informativa privacy, art. 181 (PER PRESA VISIONE), tasse comunali"
  - "Se il Comune ritiene le opere compatibili: paga la somma che stabilisce (art. 167 c. 5 D.Lgs. 42/2004, la maggiore tra il danno arrecato e il profitto conseguito)"
  - "{{ask.bollo_marche,ask.bollo_esenzione|bollo_yours}}"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
# Which pratica a case is: the library's rules table (rules/sue-napoli.yaml) decides, and pre-flight
# refuses a case it gives to another pratica, or that needs a pratica this one doesn't file with it.
rules:
  table: sue-napoli
  question: "Quali di queste cose valgono per i lavori? Spunta quelle vere, anche nessuna."
  facts: {permesso_per_scelta: "false", parere_esonero: "false"}
supports:
  - when: "{{ask.vincolo|is_art_134|not}}"
    else: "Il modulo indica solo l'art. 136 e l'art. 142: per un immobile tutelato dal solo piano paesaggistico (art. 134) deve scegliere una persona."
  - when: "{{ask.titolo|is_locatario|not}}"
    else: "Il modulo prevede solo proprietà, comproprietà, amministratore del condominio o altro diritto reale: un conduttore (inquilino) non rientra in nessuno di questi."
