supports:
- value: '{{ask.fascia_cimiteriale}}'
  in:
  - 'no'
  - consentito
  else: Works not allowed in a cemetery's fascia di rispetto need a deroga, not mapped yet.
- value: '{{ask.acustica}}'
  in:
  - 'false'
  else: An acoustic impact or clima acustico report (art. 8 L. 447/1995) isn't mapped yet.
- value: '{{ask.vvf_valutazione}}'
  in:
  - 'false'
  else: A project for the Vigili del Fuoco's assessment isn't mapped yet.
- value: '{{ask.amianto}}'
  in:
  - 'false'
  else: Works on parts with asbestos aren't mapped yet.
- value: '{{ask.igienico_conforme}}'
  in:
  - 'true'
  else: A hygiene derogation isn't mapped yet.
- if: '{{ask.igienico_conforme}} {{ask.igienico_24_5bis}}'
  value: '{{ask.igienico_5bis_caso}}'
  in:
  - altezza
  - monostanza uno
  - monostanza due
  else: 'More than one case of art. 24 c. 5-bis isn''t mapped yet: each opens its own conditions.'
- if: '{{ask.igienico_conforme}} {{ask.igienico_24_5bis}}'
  value: '{{ask.igienico_adattabilita}}'
  in:
  - 'true'
  else: 'The form allows art. 24 c. 5-bis only with the adattabilità requirement met (art. 24 c. 5-ter): the unit doesn''t qualify.'
- value: '{{ask.barriere}}'
  in:
  - 'false'
  else: The barriers rules (artt. 77-82) aren't mapped yet.
- value: '{{ask.indagini_ambientali}}'
  in:
  - 'false'
  else: Soil needing environmental investigations (or already remediated) isn't mapped yet.
- value: '{{ask.urbanizzazione}}'
  in:
  - 'true'
  else: An area without its primary urbanisation works isn't mapped yet.
- if: '{{ask.scia_onerosa}}'
  value: '{{ask.contributo_pagamento}}'
  in:
  - prima dei lavori
  - rateizzazione
  - in corso d'opera
  else: 'A SCIA alternativa''s contributo is paid within 30 days of filing, in instalments or during the works: its form has no box for a receipt already paid.'
- if: '{{ask.stato_legittimo|is_titoli}} {{ask.prec_altro}} {{ask.prec_altro_2}} {{ask.prec_altro_3}} {{ask.prec_altro_4}} {{ask.prec_altro_5}}'
  value: '{{ask.prec_altro_6}}'
  in:
  - 'false'
  else: 'More than five "altro" lines (titles past one per kind, or of kinds not listed) aren''t mapped yet: each takes a "+" on the portal, and five have been prepared.'
- if: '{{ask.stato_legittimo|is_titoli}}'
  value: '{{ask.prec_titolo_unico,ask.prec_permesso,ask.prec_autorizzazione,ask.prec_comunicazione,ask.prec_dia,ask.prec_dia_alternativa,ask.prec_scia,ask.prec_cel,ask.prec_condono,ask.prec_pdc_sanatoria,ask.prec_scia_sanatoria,ask.prec_scia_sanatoria_variante,ask.prec_altro|any}}'
  in:
  - 'true'
  else: A stato legittimo from the building's titles needs at least one title.
- if: '{{ask.stato_legittimo|in_epoca__prova}}'
  value: '{{ask.prova_catasto,ask.prova_altri|any}}'
  in:
  - 'true'
  else: A building with no title on file needs its catasto primo impianto or other documents.
- if: '{{ask.stato_legittimo|is_tolleranze}}'
  value: '{{ask.toll_prec_pratica,ask.toll_prec_atto|any}}'
  in:
  - 'true'
  else: A stato legittimo from tolerance declarations needs where they were made.
- if: '{{ask.altri_tecnici}}'
  value: '{{ask.altri_tecnici_quanti}}'
  in:
  - uno
  - due
  - tre
  else: 'More than three other technicians aren''t mapped yet: each takes a "+" on the portal, and three have been prepared.'
- if: '{{ask.tolleranze}}'
  value: '{{ask.toll_34bis_1,ask.toll_34bis_1bis,ask.toll_34bis_2,ask.toll_34bis_2bis,ask.toll_34ter_4|any}}'
  in:
  - 'true'
  else: Declared construction tolerances need at least one kind (art. 34-bis or 34-ter c. 4).
- if: '{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}}'
  value: '{{ask.toll_sismica}}'
  in:
  - autorizzazione
  - silenzio assenso
  else: 'A structural tolerance relevant for public safety (art. 94-bis c. 1 a) can be declared only with the Genio Civile''s seismic authorization (art. 94 c. 2) or its silenzio assenso (c. 2-bis): art.
    34-bis c. 3-bis DPR 380/2001.'
- if: '{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|in_minore_rilevanza__privo_di_rilevanza}}'
  value: '{{ask.toll_decorso}}'
  in:
  - 'true'
  else: 'A structural tolerance of minor or no relevance for public safety can be declared only once the regional control term has run out, with no open requests and no negative outcome: art. 34-bis c.
    3-bis DPR 380/2001.'
