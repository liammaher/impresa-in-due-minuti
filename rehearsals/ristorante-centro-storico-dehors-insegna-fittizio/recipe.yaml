# Aprire l'attività (Esercizio di somministrazione di alimenti e bevande in zone tutelate), as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-061-aprire-l-attivita-dehors.json), for the made-up business of this folder's fixture.json.
# Derived from rehearsals/ristorante-centro-storico-fittizio (bench/derive_recipe.py): no `rules:` and no `after:`; the attachments and payment screens are not read.
procedure: napoli/comune/scia-somministrazione-alimenti-bevande
title: "Aprire l'attività, bar o ristorante, zone tutelate, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-061-aprire-l-attivita-dehors
subject: impresa
operation: Aprire l'attività
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
scelte: ["in caso di attività che preveda insegna esterna"]
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Esercizio di somministrazione di alimenti e bevande in zone tutelate], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Aprire l'attività", "Domanda di occupazione suolo pubblico per area annessa ad esercizio di somministrazione di alimenti e bevande"], confirm: CONFERMA}
  - {screen: Scelta interventi eventuali, tree: [{leaf: "in caso di attività che preveda insegna esterna", nth: 1}], confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per l'attività? Spunta tutte quelle che valgono, o nessuna."
  piano:
    question: "I requisiti del Piano 2026 per il centro storico: spunti ciascuno di quelli che i locali soddisfano (un tecnico li assevera in CS 1 e CG 1)."
asks:
  coperto: {group: extras, type: yes_no, item: "Una struttura coperta: tende fisse, pedane o paraventi (tipo C), oppure chiusa su non più di tre lati (tipo D)", why: "I tipi C e D richiedono ulteriori documenti (e nel centro storico non sono ammessi): caso non ancora previsto."}
  centro_storico: {group: extras, type: yes_no, item: "Si trova nel centro storico (area UNESCO o buffer zone)", why: "Lì sono ammessi solo i tipi A e B, con ombrellone a palo centrale, e può essere coinvolta la Soprintendenza: caso non ancora previsto."}
  nuovo_852: {group: extras, type: yes_no, item: "La notifica Reg. 852 dell'impresa non è ancora stata presentata", why: "In tal caso va presentato con questa pratica, un caso non ancora previsto."}
  insegna_consenso: {group: extras, type: yes_no, item: "L'insegna richiede il consenso di altri (il proprietario dell'edificio o il condominio)", why: "In quel caso il portale chiede i dati e l'assenso del proprietario: non lo preparo ancora."}
  insegna_vincolo: {group: extras, type: yes_no, item: "L'edificio è sotto tutela paesaggistica o monumentale", why: "In quel caso l'insegna ha bisogno di una propria autorizzazione: non la preparo ancora."}
  insegna_grande: {group: extras, type: yes_no, item: "Le insegne insieme superano i 5 m²", why: "Sopra i 5 m² è dovuto anche il canone unico: un pagamento a parte, che non preparo ancora."}
  insegna_zona_a: {group: extras, type: yes_no, item: "L'installazione ricade in zona A del PRG (il centro storico)", why: "In zona A la SCIA dell'insegna ha altre condizioni, che non preparo ancora."}
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "centro storico {{business.denominazione}}"}
  accessibile: {group: piano, type: yes_no, item: "I locali sono accessibili alle persone con disabilità"}
  sicurezza: {group: piano, type: yes_no, item: "C'è un sistema di sicurezza (videosorveglianza, allarme o sistemi passivi)"}
  punteggio: {group: piano, type: yes_no, item: "Il CG 1 del tecnico raggiunge il punteggio minimo di gestione previsto per la zona e l'area dei locali (secondo lo stradario del Comune)"}
  alcolici: {group: extras, type: yes_no, item: "Venderà bevande alcoliche", why: "Alcolici e nulla osta insieme non sono ancora stati rilevati sul portale."}
  diritti_euro: {type: number, question: "I diritti SUAP in euro (voci S74-S76 del tariffario 2026 per le zone tutelate: con la notifica 420, più il nulla osta acustico: verifica)"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Fai firmare a un tecnico il progetto del dehors (elaborati grafici e relazione) e allegalo"
  - "Spunta tu le dichiarazioni e gli impegni: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, il montaggio certificato, il canone"
  - "Spunta tu le dichiarazioni dell'insegna (ulteriori dichiarazioni, mezzi pubblicitari)"
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Fai firmare al tuo tecnico il CS 1 (criteri strutturali), il CG 1 (il punteggio gestionale) e i documenti acustici, e allegali con la nota di condivisione"
  - "Spunta tu le dichiarazioni: consapevolezza (artt. 46-47), informativa privacy, norme del Comune di Napoli (normative comunali), requisiti di onorabilità e professionali, altre dichiarazioni, art. 6 Reg. 852/2004, tasse comunali, art. 75 DPR 445/2000"
  - "Paga i diritti di segreteria (€ {{ask.diritti_euro}}) con pagoPA, e la tariffa forfettaria ASL"
  - "{{ask.bollo_marche,ask.bollo_esenzione|bollo_yours}}"
  - "Firma e invia (Firma e invio); non aprire prima che arrivi l'autorizzazione"
supports:
  - {when: "{{ask.coperto|not}}", else: "I dehors coperti (tipo C o D) non sono ancora gestiti."}
  - {when: "{{ask.centro_storico|not}}", else: "Un dehors nel centro storico per ora non lo preparo."}
  - {when: "{{ask.nuovo_852|not}}", else: "Presentare la notifica Reg. 852 insieme al dehors per ora non lo preparo: presenta prima l'apertura dell'attività."}
  - {when: "{{ask.insegna_consenso|not}}", else: "Un'insegna che richiede il consenso del proprietario o del condominio per ora non la preparo."}
  - {when: "{{ask.insegna_vincolo|not}}", else: "Un'insegna su un edificio tutelato richiede una propria autorizzazione: per ora non la preparo."}
  - {when: "{{ask.insegna_grande|not}}", else: "Le insegne sopra i 5 m² pagano anche il canone unico: per ora non lo preparo."}
  - {when: "{{ask.insegna_zona_a|not}}", else: "In zona A del PRG (il centro storico) la SCIA dell'insegna ha altre condizioni, che non preparo ancora."}
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
  - {when: "{{ask.superficie_somministrazione_mq|atleast_20}}", else: "Il Piano richiede nel centro storico almeno 20 m² destinati alla consumazione da parte dei clienti (art. 7): l'autorizzazione sarebbe negata."}
  - {when: "{{ask.accessibile}} {{ask.sicurezza}} {{ask.punteggio}}", else: "I requisiti del Piano (accessibilità, un sistema di sicurezza, il punteggio minimo della zona) devono essere soddisfatti tutti (artt. 7, 9, 12): l'autorizzazione sarebbe negata."}
  - {when: "{{ask.ristorazione}}", else: "Per ora solo bar o ristorante: le altre voci di attività della notifica non sono gestite."}
  - {when: "{{ask.forno|not}} {{ask.dettaglio_alimenti|not}}", else: "Un bar o ristorante che produce anche prodotti da forno o gestisce un negozio alimentare per ora non lo preparo."}
rules:
  table: suap-napoli
  facts: {attivita: somministrazione, evento: apertura, dehors: "true", somministrazione_particolare: false, insegna: "true"}
  handles: [napoli/comune/nulla-osta-impatto-acustico, napoli/asl-napoli-1/registrazione-attivita-alimentare, napoli/comune/concessione-suolo-pubblico-dehors, napoli/comune/insegna-esercizio]
