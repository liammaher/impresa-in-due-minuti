# A food (or mixed) shop moving to new premises (SCIA di trasferimento, esercizio di vicinato
# settore alimentare o misto, with the Reg. 852/2004 notifica for the new premises), as gen.py
# writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-017-trasferire-la-sede-dell-attivita.json), for the shop
# rehearsal's made-up ditta individuale (rehearsals/negozio-fittizio/fixture.json) as a grocer's:
# the vault's `locale` is the new premises, the old ones are asked. Nothing eaten on the spot (that
# is another operation here, and the protected zones' own sector there).
procedure: napoli/comune/scia-esercizio-vicinato
title: "SCIA: trasferimento di un negozio di vicinato alimentare con notifica sanitaria, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-017-trasferire-la-sede-dell-attivita
subject: impresa
operation: Trasferire la sede dell'attività
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
# The payment and attachments screens: its slots read on a filled draft (2026-11-10), every one
# but Allegati liberi taking only signed files: the person's.
after: [Pagamento degli oneri, Gestione degli allegati]
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Vicinato - settore merceologico Alimentare o Misto], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Trasferire la sede dell'attività"], confirm: CONFERMA}
  - {screen: Scelta interventi eventuali, confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per il negozio? Spunta tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "trasferimento {{business.denominazione}}"}
  speciali: {group: extras, type: yes_no, item: "Vende armi, metalli preziosi, prodotti fitosanitari, medicinali o mangimi", why: "Ciascuno aggiunge alla pratica una propria autorizzazione o SCIA: casi che non preparo ancora."}
  insegna_esterna: {group: extras, type: yes_no, item: "Avrai un'insegna esterna nei nuovi locali", why: "Un'insegna esterna include in questa la SCIA dell'insegna: per ora non la preparo."}
  in_centro_commerciale: {type: yes_no, question: "I nuovi locali sono dentro un centro commerciale?", default: "false", why: "Napoli chiede il tipo di centro commerciale: non lo preparo ancora."}
  diritti_euro: {type: number, question: "I diritti SUAP in euro (la colonna VCA della tabella 2026 per un negozio alimentare con la notifica sanitaria: controllala)"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta tu le dichiarazioni: consapevolezza (artt. 46-47), informativa privacy, requisiti di onorabilità e professionali, altre dichiarazioni, art. 6 Reg. 852/2004, tasse comunali, art. 75 DPR 445/2000"
  - "Paga i diritti di segreteria (€ {{ask.diritti_euro}}) con pagoPA nella schermata di pagamento, e la tariffa forfettaria ASL"
  - "Allega quanto chiede la schermata degli allegati dopo aver spuntato le dichiarazioni"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
rules:
  table: suap-napoli
  facts: {attivita: vicinato_alimentare, evento: trasferimento, consumo_sul_posto: false, insegna: "{{ask.insegna_esterna}}"}
  handles: [napoli/asl-napoli-1/registrazione-attivita-alimentare]
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
  - {when: "{{ask.speciali|not}}", else: "Armi, metalli preziosi, prodotti fitosanitari, medicinali o mangimi per ora non li preparo."}
  - {when: "{{ask.in_centro_commerciale|not}}", else: "Nuovi locali dentro un centro commerciale per ora non li preparo: Napoli chiede il tipo di centro."}
  - {when: "{{ask.in_factory_outlet|not}}", else: "Un negozio in un factory outlet per ora non lo preparo."}
  - {when: "{{ask.dettaglio_alimenti}}", else: "È la pratica di un negozio alimentare: deve valere la voce della notifica sul commercio al dettaglio di alimenti."}
  - {when: "{{ask.ristorazione|not}} {{ask.forno|not}}", else: "Un negozio che serve anche cibo o produce prodotti da forno per ora non lo preparo: queste voci della notifica non sono ancora mappate insieme."}
