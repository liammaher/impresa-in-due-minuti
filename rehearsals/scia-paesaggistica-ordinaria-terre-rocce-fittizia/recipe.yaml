# SCIA edilizia con autorizzazione paesaggistica ordinaria and a dichiarazione di utilizzo delle terre e rocce da scavo
# (art. 21 DPR 120/2017), three operations in one pratica on Napoli's SUE: rehearsals/scia-paesaggistica-ordinaria-fittizia's case
# with excavated soil that leaves a small site as a by-product. The dichiarazione adds two adempimenti
# and no section (catalogue/F839/sue-wizard.json `pairs`); the crawl is catalogue/F839/sections/sue-combo-scia-paesaggistica-ordinaria-dichiarazione-utilizzo.json.
# Everything else is scia-paesaggistica-ordinaria-fittizia's recipe and what the dichiarazione adds (parts/dichiarazione-utilizzo-terre.yaml).
extends: [scia-paesaggistica-ordinaria-fittizia, parts/dichiarazione-utilizzo-terre]
procedure: napoli/comune/scia-con-paesaggistica-ordinaria-e-dichiarazione-utilizzo-terre
title: "SCIA edilizia con autorizzazione paesaggistica ordinaria e dichiarazione di utilizzo delle terre e rocce da scavo, SUE Napoli (tecnico con procura)"
crawl: sue-combo-scia-paesaggistica-ordinaria-dichiarazione-utilizzo
asks:
  descrizione: {default: "PROVA NON INVIARE - SCIA ord. e terre e rocce {{c:identity.last_name}}"}
# scia-paesaggistica-ordinaria-fittizia's steps for the person (a recipe's `yours` replaces the one it extends), then the dichiarazione's.
yours:
  - "Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page"
  - "Tick the dichiarante's declarations: the awareness box under the PEC, b) PER PRESA VISIONE, m) diritti di terzi, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "As progettista, check every asseverazione on this page: they are yours, signed with the pratica"
  - "Before the works start, name whoever the pratica leaves to be named (the direttore dei lavori, the structural one, the firm) with the SUE's comunicazione di nomina"
  - "No start date: the works start once the SUE says the landscape authorization (and any other assent) is in"
  - "Pay the diritti before the second run (after the declarations): its receipt, signed, goes with it"
  - "{{ask.bollo_marche,ask.bollo_esenzione|bollo_yours}}"
  - "The dichiarazione di utilizzo (Allegato 6 DPR 120/2017) is the portal's document on Allega documenti once the declarations are ticked: the producer signs it, Claude attaches it in the second run; the excavation starts at least 15 days after sending"
  - "When the soil has all been used, within the dichiarazione's validity, file the dichiarazione di avvenuto utilizzo (art. 7 DPR 120/2017) on the SUE"
  - "Sign and send (Firma e invio); keep the receipt"
answers:
  descrizione: PROVA NON INVIARE - SCIA ord. e terre e rocce P6
  # Works, not the landscape case's change of use without works (nothing would be dug): the SCIA's
  # own case back, with the pergola and a sewer connection that digs.
  intervento: manutenzione_straordinaria
  scia_tipo: manutenzione straordinaria
  cambio_uso: "no"
  scia_cambio_uso: "no"
  cambio_uso_tipo: null
  fatti: [prospetti]
  scia_onerosa: "false"
  contributo_pagamento: null
  contributo_calcolo: null
  documentazione_calcolo_contributo: null
  contributo_normativa: art. 17, comma 3, d.P.R. 380/2001 (inventato per la prova)
  oggetto: "Manutenzione straordinaria non strutturale con modifica dei prospetti, pergola sul terrazzo in area vincolata e nuovo allaccio fognario nel cortile, con scavo di 40 m³ di terre portate a un altro cantiere come sottoprodotto (dati inventati per la prova)."
  dettaglio_intervento: "In facciata persiane e ringhiere di diverso disegno; pergola in legno di 45 m² sul terrazzo; nuovo allaccio fognario nel cortile con scavo di 40 m³. Opere non strutturali, senza modifiche di volume o destinazione d'uso. Dati inventati per la prova."
  # The asseverazione says what the dichiarazione files: by-products from a small site.
  scavo: sottoprodotti
  scavo_piano_utilizzo: "false"
