# proroga paesaggistica e terre e rocce: 2 operations in one pratica on Napoli's SUE (catalogue/F839/sue-pairs.yaml, reason
# dichiarazione-no-title). The case: proroga-paesaggistica-fittizia's, with what scavo-fuori-sito-fittizio adds; the other's answers fill
# what the main's don't say (gen.py combo_answers). The rules table sue-napoli routes it.
extends:
- proroga-paesaggistica-fittizia
- scavo-fuori-sito-fittizio
procedure: napoli/comune/proroga-autorizzazione-paesaggistica-con-utilizzo-materiale-scavo-fuori-sito
title: Proroga paesaggistica e terre e rocce in una pratica, SUE Napoli (tecnico con procura)
comune: F839
sportello: sue
crawl: sue-combo-proroga-paesaggistica-dichiarazione-utilizzo
operation:
- Proroga autorizzazione paesaggistica (art. 10 septies, Legge 51/2022 - Comune)
- Dichiarazione di utilizzo del materiale di scavo fuori del sito di produzione ai sensi dell'art. 21 del DPR n.120/2017
  (da trasmettere almeno 15 giorni prima dell'inizio dei lavori di scavo)
scelte:
- option: in assenza di titolarità esclusiva all'esecuzione dell'intervento edilizio, si dispone della dichiarazione
    di assenso dei terzi titolari di altri diritti reali o obbligatori
  when: '{{ask.titolo_esclusivo|not}}'
- IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE
first:
- Scheda anagrafica
- Qualifica e dati del procuratore
after:
- Pagamento degli oneri
- Gestione degli allegati
asks:
  descrizione:
    default: PROVA NON INVIARE - proroga paesaggistica + terre e rocce {{c:identity.last_name}}
  diritti_euro:
    why: "The Comune's 2026 table of SUE diritti (G.C. 239/2026) has no row for an art. 10-septies extension of a landscape authorization; whether SUE 2 (401 €, landscape authorizations asked on their own) covers it is for the SUE to say (library pitfall)"
yours:
- Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page
- 'Tick the dichiarante''s declarations: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, and
  any acknowledgement in the client''s name'
- 'No imposta di bollo to pay on this form: the portal''s form for this pratica has no bollo section or slot'
- Sign and send (Firma e invio); keep the receipt
rules:
  table: sue-napoli
  question: Quali di queste cose valgono per i lavori? Spunta quelle vere, anche nessuna.
  facts:
    permesso_per_scelta: 'false'
    parere_esonero: 'false'
  main: napoli/comune/proroga-autorizzazione-paesaggistica
  handles:
  - napoli/comune/utilizzo-materiale-scavo-fuori-sito
answers:
  descrizione: PROVA NON INVIARE - proroga paesaggistica + terre e rocce P6
  terre_rocce: dichiarazione
