# A non-food shop's change of name or registered office (variazioni soggetti), as gen.py writes
# its steps file from the batch crawl (catalogue/F839/sections/suap-016-variazioni-soggetti.json,
# its changes section crawled three deep), for the shop rehearsal's made-up ditta individuale
# (rehearsals/negozio-fittizio/fixture.json): the vault holds the new name and office, the old
# ones are asked.
procedure: napoli/comune/variazioni-attivita
title: "Variazione della denominazione o della sede legale di un negozio di vicinato, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-016-variazioni-soggetti
subject: impresa
operation: Variazioni soggetti
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Vicinato - settore merceologico NON alimentare], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: [Variazioni soggetti], confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per l'attività? Spunti tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), non ancora mappata."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "variazione {{business.denominazione}}"}
  var_altro:
    group: variazioni
    type: yes_no
    item: "Something else: shares sold, a new legal representative, new partners, a new professional manager (preposto)"
    why: "Si tratta di modifiche della società, o richiedono una dichiarazione del nuovo gestore: caso non ancora previsto."
  diritti_euro: {type: number, question: "I diritti SUAP in euro (colonna VPF del tariffario 2026: verifichi la voce; 0 se non dovuti)"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Spunti Lei le dichiarazioni: consapevolezza (artt. 46-47), informativa privacy, altre dichiarazioni, tasse comunali"
  - "Paghi i diritti di segreteria, se dovuti, con pagoPA nella schermata di pagamento"
  - "Firmi e invii (Firma e invio); conservi la ricevuta"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non ancora gestito."}
  - {when: "{{ask.var_altro|not}}", else: "Per ora sono gestiti solo il cambio di denominazione o il trasferimento della sede legale."}
  - value: "{{ask.var_denominazione}}-{{ask.var_sede_legale}}"
    in: [true-false, false-true]
    else: "Una modifica alla volta: il modulo per i negozi ripete i suoi riquadri per ciascuna, quindi presenti separatamente il cambio di denominazione e quello della sede."
