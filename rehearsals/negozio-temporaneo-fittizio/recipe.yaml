# A non-food shop open for a limited time (SCIA di vicinato in modalità temporanea), as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-016-inizio-attivita-per-l-esercizio-di-vicinato-nel-se.json),
# for the made-up ditta individuale of rehearsals/negozio-fittizio/fixture.json run as a pop-up stand.
# Its sections the dictionary had no entry for (SUAP sector 11 and the shops' extras, 2026-11-11) were written
# from the crawl's text; the attachments and payment screens are not read (no `after:`), as no run has filled the draft.
procedure: napoli/comune/scia-esercizio-vicinato
title: "SCIA: negozio di vicinato non alimentare aperto per un periodo limitato, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-016-inizio-attivita-per-l-esercizio-di-vicinato-nel-se
subject: impresa
operation: Inizio Attività per l'esercizio di vicinato nel settore NON alimentare (MODALITA' TEMPORANEA)
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Vicinato - settore merceologico NON alimentare], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Inizio Attività per l'esercizio di vicinato nel settore NON alimentare (MODALITA' TEMPORANEA)"], confirm: CONFERMA}
  - {screen: Scelta interventi eventuali, confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per il negozio? Spunta tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "negozio temporaneo {{business.denominazione}}"}
  diritti_euro: {type: number, question: "I diritti SUAP in euro (controlla la voce nel tariffario 2026; 0 se non dovuti)"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
  alcolici: {group: extras, type: yes_no, item: "Venderai bevande alcoliche", why: "La vendita di alcolici comporta la comunicazione alle Dogane: un caso che non preparo ancora."}
  speciali: {group: extras, type: yes_no, item: "Venderai armi, metalli preziosi, prodotti fitosanitari, medicinali o mangimi", why: "Ciascuna aggiunge alla pratica una propria autorizzazione o SCIA: rami non ancora mappati."}
  insegna_esterna: {group: extras, type: yes_no, item: "Avrai un'insegna esterna", why: "Un'insegna esterna include in questa la SCIA dell'insegna: per ora non la preparo."}
  in_centro_commerciale: {type: yes_no, question: "Il negozio si trova all'interno di un centro commerciale?", default: "false", why: "Napoli chiede il tipo di centro commerciale, che non preparo ancora."}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta tu le dichiarazioni: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, e quelle di conformità, antimafia e rispetto delle leggi nelle sezioni che le hanno"
  - "Paga i diritti di segreteria, se dovuti, con pagoPA nella schermata di pagamento"
  - "Allega quanto chiede la schermata degli allegati dopo aver spuntato le dichiarazioni"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
  - {when: "{{ask.alcolici|not}}", else: "La vendita di alcolici comporta la comunicazione alle Dogane: per ora non la preparo."}
  - {when: "{{ask.speciali|not}}", else: "Armi, metalli preziosi, prodotti fitosanitari, medicinali o mangimi non sono ancora previsti."}
  - {when: "{{ask.insegna_esterna|not}}", else: "Un'insegna esterna include in questa pratica la SCIA dell'insegna: per ora non la preparo."}
  - {when: "{{ask.in_centro_commerciale|not}}", else: "Un negozio all'interno di un centro commerciale per ora non lo preparo: Napoli chiede la tipologia del centro."}
  - {when: "{{ask.in_factory_outlet|not}}", else: "Un negozio in un factory outlet non lo preparo ancora."}
  - {when: "{{ask.superficie_alimentare_mq|positive|not}}", else: "Questa è la pratica del negozio non alimentare: un negozio che vende alimenti presenta quella del settore alimentare (con la notifica ai sensi del Reg. 852)."}
