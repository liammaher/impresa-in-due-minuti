# A CIL for temporary works with its autorizzazione paesaggistica ordinaria in one pratica on
# Napoli's SUE: the CIL rehearsal's people (rehearsals/cil-fittizia) with a 60 m² prefabricated
# site office and store standing for 170 days in the garden of a protected building, beyond the
# small mobile structures of DPR 31/2017 Allegato B (art. 146). Two operations: gen.py takes each
# one's sections from the catalogue and the order from the combination's crawl
# (catalogue/F839/sections/sue-combo-cil-paesaggistica-ordinaria.json).
# Everything else is cil-fittizia's recipe and what the ordinaria adds (parts/paesaggistica-ordinaria.yaml).
extends: [cil-fittizia, parts/paesaggistica-ordinaria]
procedure: napoli/comune/cil-con-paesaggistica-ordinaria
title: "CIL opere temporanee con autorizzazione paesaggistica ordinaria, SUE Napoli (tecnico con procura)"
comune: F839
sportello: sue
crawl: sue-combo-cil-paesaggistica-ordinaria
operation:
  - Comunicazione di Inizio Lavori per opere temporanee (C.I.L.)
  - Autorizzazione paesaggistica ordinaria (art.146 del D.Lgs 42/2004 - Comune)
asks:
  descrizione: {default: "PROVA NON INVIARE - CIL e paesaggistica {{c:identity.last_name}}"}
yours:
  - "Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page"
  - "Tick the dichiarante's declarations: the awareness box under the PEC (domicilio elettronico), consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "On Allega documenti: the portal's procura signed by the client, the ordinaria's drawings and photos (signed files only), signed digitally (.p7m)"
  - "Pay the {{ask.diritti_euro}} € diritti and the bollo before sending, and attach the receipts"
  - "The works start only once the SUE says the landscape authorization is in: the start date is the earliest"
  - "Sign and send (Firma e invio); keep the receipt"
attachments:
  Gestione degli allegati:
    # The ordinaria's second relazione slot opens from the SCIA's and the permesso's asseverazione
    # ("Si allega la relazione paesaggistica e la documentazione"): this form has no such box.
    - {label: Relazione paesaggistica e documentazione per il rilascio, drop: true}
rules:
  main: napoli/comune/cil-opere-temporanee
# The case: the main pratica's P6 answers, the part's, then these (a null drops one);
# `gen.py --answers` writes answers-p6.json.
answers:
  descrizione: PROVA NON INVIARE - CIL e ordinaria P6 generato
  oggetto: "Installazione temporanea di un modulo prefabbricato di 60 m² (ufficio e deposito) nel giardino dell'edificio, per 170 giorni, rimosso a fine periodo, in area vincolata (dati inventati per la prova)."
  data_inizio_lavori: '2027-02-01'
  data_fine_prevista: '2027-07-20'
  dettaglio_intervento: "Modulo prefabbricato di 60 m² appoggiato su piedini regolabili senza fondazioni nel giardino condominiale, per 170 giorni; rimozione integrale entro il 20/07/2027 con ripristino del prato. Dati inventati per la prova."
