# SCIA alternativa al permesso di costruire con dichiarazione di utilizzo delle terre e rocce da scavo in one pratica on Napoli's SUE: the scia-alternativa-fittizia rehearsal's case with excavated soil that leaves the site
# as a by-product (a small site: art. 21 DPR 120/2017). Two operations selected together in the
# wizard; the dichiarazione adds two adempimenti (the SUE's, ARPA Campania's) and no section, so the
# combination's crawl (catalogue/F839/sections/sue-combo-scia-alt-dichiarazione-utilizzo.json) has the main pratica's sections and the
# dichiarazione's slot. Everything else is scia-alternativa-fittizia's recipe and what the dichiarazione adds
# (parts/dichiarazione-utilizzo-terre.yaml): a slot or a refusal mapped on either reaches this one.
extends: [scia-alternativa-fittizia, parts/dichiarazione-utilizzo-terre]
procedure: napoli/comune/scia-alternativa-pdc-con-dichiarazione-utilizzo-terre
title: "SCIA alternativa al permesso di costruire con dichiarazione di utilizzo delle terre e rocce da scavo, SUE Napoli (tecnico con procura)"
crawl: sue-combo-scia-alt-dichiarazione-utilizzo
asks:
  descrizione: {default: "SCIA alt e terre e rocce {{c:identity.last_name}}"}
# Its main pratica's steps for the person (a recipe's `yours` replaces the one it extends), then the dichiarazione's.
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Spunti le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC, b) PER PRESA VISIONE, m) diritti di terzi, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "In qualità di progettista, verifichi ogni asseverazione di questa pagina: sono Sue, e le firma con la pratica"
  - "Prima dell'inizio dei lavori, nomini chi la pratica lascia da nominare (il direttore dei lavori, il direttore dei lavori strutturali, l'impresa) con la comunicazione di nomina del SUE"
  - "La dichiarazione di utilizzo (Allegato 6 DPR 120/2017) è il documento del portale in Allega documenti dopo aver spuntato le dichiarazioni: la firma il produttore, Claude la allega nella seconda compilazione (dopo le dichiarazioni); lo scavo inizia almeno 15 giorni dopo l'invio"
  - "Quando tutte le terre e rocce da scavo saranno state utilizzate, entro la validità della dichiarazione, presenti sul SUE la dichiarazione di avvenuto utilizzo (art. 7 DPR 120/2017)"
  - "Firmi e invii (Firma e invio); conservi la ricevuta. I lavori possono iniziare 30 giorni dopo la presentazione, una volta acquisiti gli assensi richiesti dalla SCIA (se ce ne sono); il contributo, se dovuto, si paga come indica il quadro g)"
answers:
  descrizione: PROVA NON INVIARE - SCIA alt e terre e rocce P6
  oggetto: "Ristrutturazione edilizia con modifica dei prospetti, aumento di volumetria e un nuovo piano interrato, scavo di 900 m³ di terre portate a un altro cantiere come sottoprodotto (dati inventati per la prova)."
  # The asseverazione says what the dichiarazione files: by-products from a small site.
  scavo: sottoprodotti
  scavo_piano_utilizzo: "false"
