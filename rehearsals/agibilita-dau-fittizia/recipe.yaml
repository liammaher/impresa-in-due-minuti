extends:
- agibilita-fittizia
- dau-fittizia
procedure: napoli/comune/agibilita-con-dichiarazione-avvenuto-utilizzo-terre
title: Agibilità e DAU in una pratica, SUE Napoli (tecnico con procura)
comune: F839
sportello: sue
crawl: sue-combo-agibilita-dau
operation:
- Segnalazione Certificata per l'Agibilità
- Dichiarazione di avvenuto utilizzo (D.A.U.) ai sensi dell'art. 7 del DPR n. 120/2017
scelte:
- IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE
first:
- Scheda anagrafica
- Qualifica e dati del procuratore
after:
- Pagamento degli oneri
- Gestione degli allegati
asks:
  descrizione:
    default: agibilità + DAU {{c:identity.last_name}}
  diritti_euro:
    default: '401'
    why: "Voce SUE 10 del tariffario 2026 dei diritti SUE del Comune (G.C. 239/2026): 401 € per una Segnalazione Certificata di Agibilità"
  strutture:
    type: yes_no
    question: I lavori toccano le parti strutturali dell'edificio?
yours:
- "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
- "Spunti le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC (domicilio elettronico), consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
- "In qualità di direttore dei lavori (o professionista abilitato), verifichi ogni attestazione di questa pagina: sono Sue, e le firma con la pratica"
- "Attestazione tecnica - Agibilità: il portale richiede una delle caselle dell'art. 24 c. 5-bis/5-ter o 5-quater; Claude spunta quella corrispondente al caso, e nessuna quando non ricorre nessuno dei due casi (in tal caso chieda al SUE)"
- "Spunti le dichiarazioni del dichiarante: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, e le eventuali prese visione a nome del committente"
- "Firmi e invii (Firma e invio); conservi la ricevuta"
