# agibilità e DAU: 2 operations in one pratica on Napoli's SUE (catalogue/F839/sue-pairs.yaml, reason
# dau-at-the-end). The case: agibilita-fittizia's, with what dau-fittizia adds; the other's answers fill
# what the main's don't say (gen.py combo_answers). The rules table sue-napoli-adempimenti routes it.
extends:
- agibilita-fittizia
- dau-fittizia
procedure: napoli/comune/agibilita-con-dichiarazione-avvenuto-utilizzo-terre
title: Agibilità e DAU in una pratica, SUE Napoli (tecnico con procura)
comune: F839
sportello: sue
crawl: sue-combo-agibilita-dau
operation:
- Segnalazione Certificata per l'Agibilità
- Dichiarazione di avvenuto utilizzo (D.A.U.) ai sensi dell'art. 7 del DPR n. 120/2017
scelte:
- IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE
first:
- Scheda anagrafica
- Qualifica e dati del procuratore
after:
- Pagamento degli oneri
- Gestione degli allegati
asks:
  descrizione:
    default: PROVA NON INVIARE - agibilità + DAU {{c:identity.last_name}}
  diritti_euro:
    default: '401'
    why: 'Line SUE 10 of the Comune''s 2026 table of SUE diritti (G.C. 239/2026): 401 € for a Segnalazione Certificata
      di Agibilità'
  strutture:
    type: yes_no
    question: I lavori toccano le parti strutturali dell'edificio?
yours:
- Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page
- 'Tick the dichiarante''s declarations: the awareness box under the PEC (domicilio elettronico), consapevolezza
  (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000'
- 'As direttore dei lavori (or professionista abilitato), check every attestation on this page: they are yours,
  signed with the pratica'
- 'Attestazione tecnica - Agibilità: the portal requires one of the art. 24 c. 5-bis/5-ter or 5-quater boxes; Claude
  ticks the one the case is, and none when it is neither (then ask the SUE)'
- 'Tick the dichiarante''s declarations: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, and
  any acknowledgement in the client''s name'
- Sign and send (Firma e invio); keep the receipt
rules:
  table: sue-napoli-adempimenti
  question: Quali di queste cose valgono per i lavori? Spunta quelle vere, anche nessuna.
  facts:
    adempimento: agibilita
    dau: 'true'
  main: napoli/comune/agibilita
  handles:
  - napoli/comune/dichiarazione-avvenuto-utilizzo-terre
answers:
  descrizione: PROVA NON INVIARE - agibilità + DAU P6
