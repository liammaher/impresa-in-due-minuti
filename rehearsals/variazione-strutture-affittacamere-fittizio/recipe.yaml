procedure: napoli/comune/avvio-bed-and-breakfast
title: "Comunicazione per la variazione nelle strutture ricettive (denominazione, periodo di apertura, legale rappresentante, altro), struttura ricettiva extralberghiera, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-056-comunicazione-per-la-variazione-nelle-strutture-ri
subject: impresa
operation: Comunicazione per la variazione nelle strutture ricettive (denominazione, periodo di apertura, legale rappresentante, altro)
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: ["Strutture ricettive extralberghiere (affittacamere, bed and breakfast, case e appartamenti per vacanze, case per ferie, case religiose di ospitalità, ostelli per la gioventù, residenze rurali o country house, rifugi di montagna)"], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Comunicazione per la variazione nelle strutture ricettive (denominazione, periodo di apertura, legale rappresentante, altro)"], confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, answers: {"la variazione riguarda il/la legale rappresentante": "No"}, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per la struttura ricettiva? Spunta tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "camere {{business.denominazione}}"}
  grande: {group: extras, type: yes_no, item: "Più di 25 posti letto, o soggetta ai controlli di prevenzione incendi", why: "Ciò comporta la SCIA di prevenzione incendi: un caso che non preparo ancora."}
  alcolici: {group: extras, type: yes_no, item: "Venderà bevande alcoliche", why: "La vendita di alcolici comporta la comunicazione alle Dogane: un caso che non preparo ancora."}
  insegna_esterna: {group: extras, type: yes_no, item: "Avrai un'insegna esterna", why: "Un'insegna esterna include in questa la SCIA dell'insegna: per ora non la preparo."}
  servizi: {group: extras, type: yes_no, item: "Una piscina, un centro estetico, una palestra o un negozio per gli ospiti o per il pubblico", why: "Those services aren't mapped yet."}
  diritti_euro: {type: number, question: "I diritti SUAP in euro", default: "200", why: "La voce S94 del tariffario 2026 per una struttura ricettiva extralberghiera senza notifica sanitaria."}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta tu le dichiarazioni: consapevolezza (artt. 46-47), informativa privacy, requisiti di onorabilità, altre dichiarazioni, tasse comunali, art. 75 DPR 445/2000"
  - "Paga i diritti di segreteria (€ {{ask.diritti_euro}}) con pagoPA nella schermata di pagamento"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
  - {when: "{{ask.grande|not}}", else: "Le strutture con più di 25 posti letto o soggette ai controlli di prevenzione incendi non sono ancora gestite."}
  - {when: "{{ask.alcolici|not}}", else: "La vendita di alcolici per ora non la preparo: aggiunge alla pratica la comunicazione alle Dogane."}
  - {when: "{{ask.insegna_esterna|not}}", else: "Un'insegna esterna per ora non la preparo: include in questa la SCIA dell'insegna."}
  - {when: "{{ask.servizi|not}}", else: "Piscina, centro estetico, palestra o negozio non sono ancora gestiti."}

