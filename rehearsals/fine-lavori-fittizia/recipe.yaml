# The Comunicazione di fine lavori as gen.py writes its steps file (portal-steps.generated.yaml),
# for the works the CILA rehearsal (rehearsals/cila-fittizia) filed: the same studio, client,
# owner and firms. Never walked by hand: its sections come from the crawl of an empty draft
# (catalogue/F839/sections/fine-lavori.json) and every field from dictionary/fnsuap.yaml.
procedure: napoli/comune/fine-lavori
title: "Comunicazione di fine lavori, SUE Napoli (tecnico con procura)"
comune: F839
sportello: sue
crawl: fine-lavori
operation: Comunicazione di fine lavori
scelte: [IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE]
first: [Scheda anagrafica, Qualifica e dati del procuratore]
after: [Pagamento degli oneri, Gestione degli allegati]
attachments:
  Gestione degli allegati:
    # Works finished in part ("in forma parziale come da planimetria allegata") add this required
    # slot; plain PDFs are taken (read on a partial draft, 2026-11-03).
    - {kind: file, label: Copia di elaborato planimetrico del progetto con eventuali varianti, value: "{{ask.planimetria_parziale}}", when: "{{ask.fine_completa|not}}", on_page: true}
asks:
  diritti_euro: {default: "0", why: "Not in the Comune's 2026 table of SUE diritti (G.C. 239/2026): no diritti (non previsti dal tariffario)"}
  descrizione: {default: "fine lavori {{c:identity.last_name}}"}
  oggetto: {question: "The pratica in one sentence (300 characters), e.g. the end of the works of the CILA"}
  planimetria_parziale: {type: file, question: "The planimetria of the part finished (PDF), signed digitally by the direttore dei lavori", when: "{{ask.fine_completa|not}}"}
yours:
  - "Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page"
  - "Tick the dichiarante's declarations: the awareness box under the PEC (domicilio elettronico), consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "Sign and send (Firma e invio); keep the receipt"
