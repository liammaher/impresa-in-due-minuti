# The Comunicazione di fine lavori as gen.py writes its steps file (portal-steps.generated.yaml),
# for the works the CILA rehearsal (rehearsals/cila-fittizia) filed: the same studio, client,
# owner and firms. Never walked by hand: its sections come from the crawl of an empty draft
# (catalogue/F839/sections/sue-comunicazione-di-fine-lavori.json) and every field from dictionary/fnsuap.yaml.
procedure: napoli/comune/fine-lavori
title: "Comunicazione di fine lavori, SUE Napoli (tecnico con procura)"
comune: F839
sportello: sue
crawl: sue-comunicazione-di-fine-lavori
operation: Comunicazione di fine lavori
scelte: [IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE]
first: [Scheda anagrafica, Qualifica e dati del procuratore]
after: [Pagamento degli oneri, Gestione degli allegati]
attachments:
  Gestione degli allegati:
    # Works finished in part ("in forma parziale come da planimetria allegata") add this required
    # slot; plain PDFs are taken (read on a partial draft, 2026-11-03).
    - {kind: file, label: Copia di elaborato planimetrico del progetto con eventuali varianti, value: "{{ask.planimetria_parziale}}", when: "{{ask.fine_completa|not}}", on_page: true}
asks:
  diritti_euro: {default: "0", why: "Non presente nel tariffario 2026 dei diritti SUE del Comune (G.C. 239/2026): nessun diritto (non previsti dal tariffario)"}
  descrizione: {default: "fine lavori {{c:identity.last_name}}"}
  oggetto: {question: "La pratica in una frase (300 caratteri), es. la fine dei lavori della CILA"}
  planimetria_parziale: {type: file, question: "La planimetria della parte ultimata (PDF), firmata digitalmente dal direttore dei lavori", when: "{{ask.fine_completa|not}}"}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC (domicilio elettronico), consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
# Routed by the rules table sue-napoli-adempimenti: what is filed on the title held.
rules:
  table: sue-napoli-adempimenti
  question: "Quali di queste cose valgono per i lavori? Spunta quelle vere, anche nessuna."
  facts: {adempimento: "fine_lavori"}
