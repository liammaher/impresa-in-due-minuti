# Giving a department of a food (or mixed) shop to another business to run (affidamento in gestione di reparto), as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-017-affidare-in-gestione-reparto.json),
# for the made-up ditta individuale of rehearsals/negozio-fittizio/fixture.json run as a food department store's owner.
# Its sections the dictionary had no entry for (SUAP sector 11 and the shops' extras, 2026-11-11) were written
# from the crawl's text; the attachments and payment screens are not read (no `after:`), as no run has filled the draft.
procedure: napoli/comune/scia-esercizio-vicinato
title: "Comunicazione: affidamento in gestione di un reparto di un negozio alimentare, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-017-affidare-in-gestione-reparto
subject: impresa
operation: Affidare in gestione reparto
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Vicinato - settore merceologico Alimentare o Misto], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Affidare in gestione reparto"], confirm: CONFERMA}
  - {screen: Scelta interventi eventuali, confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per il negozio? Spunta tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "reparto alimentari {{business.denominazione}}"}
  diritti_euro: {type: number, question: "I diritti SUAP in euro (controlla la voce nel tariffario 2026; 0 se non dovuti)"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
  in_centro_commerciale: {type: yes_no, question: "L'esercizio si trova all'interno di un centro commerciale?", default: "false", why: "Napoli chiede la denominazione, il provvedimento e l'ente: per ora non lo preparo."}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta tu le dichiarazioni: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, e quelle di conformità, antimafia e rispetto delle leggi nelle sezioni che le hanno"
  - "Paga i diritti di segreteria, se dovuti, con pagoPA nella schermata di pagamento"
  - "Allega quanto chiede la schermata degli allegati dopo aver spuntato le dichiarazioni"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
  - {when: "{{ask.in_centro_commerciale|not}}", else: "Un esercizio all'interno di un centro commerciale per ora non lo preparo: il modulo chiede il suo provvedimento."}
