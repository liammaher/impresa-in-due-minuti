# The CILA as gen.py writes its steps file (portal-steps.generated.yaml): which operation and
# scelte, the crawl of a draft of it, and what only this pratica says. Every field comes from
# claude/skills/pratica/portal/dictionary/fnsuap.yaml.
procedure: napoli/comune/cila-lavori-edilizi
title: "CILA: lavori interni non strutturali, SUE Napoli (tecnico con procura)"
comune: F839
sportello: sue
crawl: sue-comunicazione-inizio-lavoro-asseverata
operation: Comunicazione Inizio Lavoro Asseverata (C.I.L.A.)
scelte: [IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE]
# The portal lists the procuratore's section last; the run fills the dichiarante first.
first: [Scheda anagrafica, Qualifica e dati del procuratore]
after: [Pagamento degli oneri, Gestione degli allegati]
attachments:
  Gestione degli allegati:
    # The asseverazione's "allega l’autorizzazione sismica" (a structural tolerance relevant for
    # public safety) adds this required slot; plain PDFs are taken (seen on the SCIA 2026-10-30).
    - {kind: file, label: Autorizzazione sismica, value: "{{ask.toll_sismica_doc}}", when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}} {{ask.toll_sismica|is_autorizzazione}}", on_page: true}
    - {kind: file, label: Allegati liberi, value: "{{ask.relazione_tecnica}}", describe: Relazione tecnica}
    # On a bene culturale, the Soprintendenza's authorization already obtained, in the same slot's
    # next box (its "+"): the relazione's assents list is for assents still to acquire.
    - {kind: file, label: Allegati liberi, value: "{{ask.soprintendenza_autorizzazione}}", describe: Autorizzazione della Soprintendenza (art. 21 D.Lgs. 42/2004), when: "{{ask.bene_culturale}} {{ask.soprintendenza_autorizzata}}"}
    # An onerosa CILA's screen adds two slots: the contributo's prospetto di calcolo, and its
    # receipt once paid (quadro f's "allega la ricevuta di versamento").
    - {kind: file, label: Prospetto di calcolo preventivo del contributo, value: "{{ask.prospetto_contributo}}", when: "{{ask.cila_onerosa}}", on_page: true}
    - {kind: file, label: Ricevuta di versamento del contributo, value: "{{ask.ricevuta_contributo}}", when: "{{ask.cila_onerosa}} {{ask.contributo_pagato}}", on_page: true}
    # The relazione's items 2 and 3 (filings presented with the CILA, assents for the SUE to
    # acquire) each have their slot on every CILA's screen (read on the P6 run, 2026-10-28).
    - {kind: file, label: "Documentazione necessaria per la presentazione di altre comunicazioni, segnalazioni", value: "{{ask.comunicazioni_doc}}", when: "{{ask.comunicazioni_contestuali}}"}
    - {kind: file, label: Documentazione necessaria per il rilascio di atti di assenso obbligatori, value: "{{ask.atti_doc}}", when: "{{ask.atti_da_acquisire}}"}
asks:
  diritti_euro: {default: "{{ask.cila_stato|diritti_cila}}", why: "Voce SUE 13 del tariffario 2026 dei diritti SUE del Comune (G.C. 239/2026): 151 € per una CILA; SUE 15: 166 € per una CILA presentata a lavori iniziati (mancata CILA)"}
  # Napoli's own annexes, attached by the second run under Allegati liberi (DD 603/2025; L.R. 59/2018).
  napoli_allegato_a: {default: "true"}
  modello_dp: {default: "true"}
  # In the facts checklist, as the rules table asks it: the supports read it too (the
  # Soprintendenza's authorization first).
  bene_culturale: {group: fatti, item: "L'edificio è un bene culturale tutelato dalla Parte II del D.Lgs. 42/2004 (vincolo storico-artistico)?"}
  descrizione: {default: "CILA {{c:identity.last_name}}"}
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Spunti le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC (domicilio elettronico), c) PER PRESA VISIONE, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "Paghi i diritti di {{ask.diritti_euro}} € prima della seconda compilazione (come, è indicato sotto): la ricevuta firmata va allegata lì. La sanzione della CILA tardiva si paga prima della prima compilazione: la sua ricevuta è nel quadro d)"
  - "Per la DSC della CILA può usare quella che compila Claude (un riquadro per ogni documento caricato) invece di quella del portale: firmata e in PDF/A, va nella seconda compilazione"
  - "Se è un bene culturale: i lavori iniziano solo dopo l'autorizzazione della Soprintendenza (art. 21 c. 4 D.Lgs. 42/2004). È allegata in Allegati liberi: la conservi con la pratica"
  - "Firmi e invii (Firma e invio); conservi la ricevuta"
# Which pratica a case is: the library's rules table (rules/sue-napoli.yaml) decides, and pre-flight
# refuses a case it gives to another pratica, or that needs a pratica this one doesn't file with it.
rules:
  table: sue-napoli
  question: "Quali di queste cose valgono per i lavori? Spunti quelle vere, anche nessuna."
  facts: {sanatoria: "{{ask.cila_stato|in_in_corso__realizzato}}", permesso_per_scelta: "false", parere_esonero: "false"}
supports:
  # A firm still to be chosen: the CILA's quadro h) has no line for it, and the portal requires the
  # firm's details whatever its site-safety quadro says (a CILA case stopped on them, 2026-11-01).
  - {if: "{{ask.lavori_in_proprio|not}}", value: "{{ask.impresa_dopo}}", in: ["false"], defect: cila-impresa-dopo, else: "La CILA indica la sua impresa esecutrice: il suo quadro h) non prevede un'impresa ancora da scegliere, e il portale richiede i dati dell'impresa (verificato il 01/11/2026). Presenti la CILA una volta scelta l'impresa."}
  # A bene culturale: the Soprintendenza's authorization first, obtained apart (rules:
  # soprintendenza-cila-*), then attached under Allegati liberi. The relazione's assents list is
  # for assents the SUE is still to acquire (art. 23-bis), so one already obtained isn't listed.
  - {if: "{{ask.intervento|in_manutenzione_straordinaria__restauro}} {{ask.cila_stato|is_da_iniziare}} {{ask.bene_culturale}}", value: "{{ask.soprintendenza_autorizzata}}", in: ["true"], else: "Su un bene culturale serve prima l'autorizzazione della Soprintendenza (art. 21 c. 4 D.Lgs. 42/2004), e il SUE non la chiede con questa pratica. La chieda alla Soprintendenza ABAP di Napoli (PEC sabap-na@pec.cultura.gov.it, bollo da 16 €, fino a 120 giorni), poi presenti questa pratica."}
  # Assents the SUE acquires (art. 23-bis c. 2-3 DPR 380/2001): the works start only once it says
  # they are in, so quadro d) gives no start date.
  - {if: "{{ask.cila_stato|is_da_iniziare}} {{ask.atti_da_acquisire}}", value: "{{ask.inizio_dopo_assensi}}", in: ["true"], else: "Con assensi che il SUE deve acquisire, i lavori iniziano solo quando il SUE comunica che sono stati acquisiti (art. 23-bis c. 2 DPR 380/2001): risponda che i lavori iniziano dopo la sua comunicazione, non a una data."}
  # Works under way or done can't wait for an assent: one still missing makes them unlawful.
  - {if: "{{ask.cila_stato|is_da_iniziare|not}}", value: "{{ask.atti_da_acquisire}}", in: ["false"], else: "I lavori già in corso o eseguiti non possono avere assensi ancora da acquisire (art. 23-bis c. 2 DPR 380/2001: i lavori iniziano solo una volta acquisiti): chieda al SUE come regolarizzarli."}
