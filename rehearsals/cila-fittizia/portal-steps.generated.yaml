  piano_planovolumetrico: {group: fatti, type: yes_no, item: 'La nuova costruzione o la ristrutturazione urbanistica è disciplinata da un piano attuativo con precise disposizioni plano-volumetriche dichiarate
      dal Comune, o (per una nuova costruzione) è in diretta esecuzione di uno strumento urbanistico generale che le contiene?'}
supports:
- if: '{{ask.lavori_in_proprio|not}}'
  value: '{{ask.impresa_dopo}}'
  in:
  - 'false'
  defect:
    id: cila-impresa-dopo
    title: 'CILA and CIL: the firm can''t be left to be named later, though the form offers it'
    portal: 'Napoli''s SUE on impresainungiorno: the CILA''s quadro i) and the CIL''s quadro g) (salute e sicurezza), and their firm''s quadro (h, f)'
    what: The safety quadro offers "ricade nell'ambito di applicazione del d.lgs. 81/2008 ma si riserva di presentare le dichiarazioni di cui al presente quadro prima dell'inizio lavori", yet the firm's
      quadro has no line for a firm still to be chosen and the portal requires the firm's details (16 required boxes, the DURC ones among them) whatever the safety quadro says.
    law: The committente sends the firm's documents (DURC, the notifica preliminare, the check of the firm's fitness) before the works start (art. 90 c. 9 c D.Lgs. 81/2008), not necessarily with the filing;
      the permesso's and the SCIA's forms on the same portal let the firm be named later.
    checked: 2026-11-01, a run of a made-up CILA in the pane (rehearsals/cila-fittizia, answers-impresa-dopo) stopped on the firm's required boxes; InfoCamere's national CILA form has no such reservation
      (schema/sue-choices.json 009-012)
    choices:
    - 'File the CILA or CIL once the firm is chosen: Claude fills it then.'
    - Ask the SUE whether a CILA may be filed before the firm is chosen, and how.
    - 'Report the defect to the portal''s operator (InfoCamere''s impresainungiorno support) or the SUE: docs/portal-defects.md says what and how it was checked.'
    report: docs/portal-defects.md
  else: 'The CILA names its building firm: its quadro h) has no line for a firm still to be chosen, and the portal requires the firm''s details (seen 2026-11-01). File the CILA once the firm is chosen.'
- if: '{{ask.intervento|in_manutenzione_straordinaria__restauro}} {{ask.cila_stato|is_da_iniziare}} {{ask.bene_culturale}}'
  value: '{{ask.soprintendenza_autorizzata}}'
  in:
  - 'true'
  else: 'On a bene culturale the works need the Soprintendenza''s authorization first (art. 21 c. 4 D.Lgs. 42/2004), and Napoli''s SUE portal has no procedure to ask for it with this pratica: request it
    from the Soprintendenza ABAP per il Comune di Napoli (by PEC to sabap-na@pec.cultura.gov.it, on its form ''Istanza per opere su immobili vincolati'', 16 euro bollo; up to 120 days, art. 22), then file
    this.'
- if: '{{ask.cila_stato|is_da_iniziare}} {{ask.atti_da_acquisire}}'
  value: '{{ask.inizio_dopo_assensi}}'
  in:
  - 'true'
  else: 'With assents for the SUE to acquire, the works start only once the SUE says they are in (art. 23-bis c. 2 DPR 380/2001): answer that the works start after its communication, not on a date.'
- if: '{{ask.cila_stato|is_da_iniziare|not}}'
  value: '{{ask.atti_da_acquisire}}'
  in:
  - 'false'
  else: 'Works already under way or done can''t have assents still to be acquired (art. 23-bis c. 2 DPR 380/2001: works start only once they are in): ask the SUE how to regularize them.'
- if: '{{ask.tolleranze}}'
  value: '{{ask.toll_34bis_1,ask.toll_34bis_1bis,ask.toll_34bis_2,ask.toll_34bis_2bis,ask.toll_34ter_4|any}}'
  in:
  - 'true'
  else: Declared construction tolerances need at least one kind (art. 34-bis or 34-ter c. 4).
- if: '{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}}'
  value: '{{ask.toll_sismica}}'
  in:
  - autorizzazione
  - silenzio assenso
  else: 'A structural tolerance relevant for public safety (art. 94-bis c. 1 a) can be declared only with the Genio Civile''s seismic authorization (art. 94 c. 2) or its silenzio assenso (c. 2-bis): art.
    34-bis c. 3-bis DPR 380/2001.'
- if: '{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|in_minore_rilevanza__privo_di_rilevanza}}'
  value: '{{ask.toll_decorso}}'
  in:
  - 'true'
  else: 'A structural tolerance of minor or no relevance for public safety can be declared only once the regional control term has run out, with no open requests and no negative outcome: art. 34-bis c.
    3-bis DPR 380/2001.'
