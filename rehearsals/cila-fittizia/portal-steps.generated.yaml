yours:
- Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page
- 'Tick the dichiarante''s declarations: the awareness box under the PEC (domicilio elettronico), c) PER PRESA VISIONE, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000'
- 'Upload the receipt of the 151 € diritti on Pagamento oneri (how Napoli takes them is below; a late CILA''s penalty is paid before the run: its receipt is in quadro d)'
- 'On Allega documenti, once the declarations are ticked (the portal gives the procura only then): download the procura (Scarica il documento), have the client sign it, sign it digitally (.p7m) and attach
  it'
- 'Attach the CILA DSC that fill.py filled (form quadro-riepilogativo-dsc: a box per document uploaded) in its slot, as PDF/A signed digitally'
- 'On a bene culturale: the works start only once the Soprintendenza has authorized them (art. 21 c. 4 D.Lgs. 42/2004); attach its authorization under Allegati liberi, signed digitally (.p7m), and keep
  it with the pratica'
- Sign and send (Firma e invio); keep the receipt
