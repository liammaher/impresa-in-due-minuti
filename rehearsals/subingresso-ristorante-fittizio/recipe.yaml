# Taking over a bar or restaurant outside the protected zones (subingresso with the Reg.
# 852/2004 update), as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-060-subentrare-nell-esercizio-dell-attivita.json), for the
# pizzeria rehearsal's made-up ditta individuale (rehearsals/pizzeria-fittizia/fixture.json)
# taking over an existing pizzeria.
procedure: napoli/comune/subingresso-attivita-commerciale
title: "Subingresso in un bar o ristorante con notifica sanitaria, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-060-subentrare-nell-esercizio-dell-attivita
subject: impresa
operation: Subentrare nell'esercizio dell'attività
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
after: [Pagamento degli oneri, Gestione degli allegati]
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Esercizio di somministrazione di alimenti e bevande in zone NON tutelate], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Subentrare nell'esercizio dell'attività"], confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per l'attività? Spunti tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "subingresso {{business.denominazione}}"}
  diritti_euro: {type: number, question: "I diritti SUAP in euro", default: "96", why: "La colonna VCA del tariffario 2026 per un bar o ristorante fuori dalle zone tutelate con notifica sanitaria (S72)."}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Spunti Lei le dichiarazioni: consapevolezza (artt. 46-47), informativa privacy, norme del Comune di Napoli (normative comunali), requisiti di onorabilità e professionali, art. 6 Reg. 852/2004, altre dichiarazioni, tasse comunali, art. 75 DPR 445/2000"
  - "Paghi i diritti di segreteria (€ {{ask.diritti_euro}}) con pagoPA nella schermata di pagamento, e la tariffa propria dell'ASL"
  - "Firmi e invii (Firma e invio) entro 90 giorni dall'atto; conservi la ricevuta"
# Which pratica a case is: the library's rules table (rules/suap-napoli.yaml) decides, and pre-flight
# refuses a case it gives to another pratica or that needs a pratica this one doesn't file.
rules:
  table: suap-napoli
  facts: {attivita: somministrazione, evento: subingresso}
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
  - {when: "{{ask.atto_registrato}}", else: "Un atto ancora in corso di registrazione per ora non lo preparo: in quel caso il portale accetta la sua copia firmata, che spetta a Lei caricare. Presenti la pratica dopo la registrazione."}
