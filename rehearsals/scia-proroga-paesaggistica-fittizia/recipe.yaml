# SCIA e proroga paesaggistica: 2 operations in one pratica on Napoli's SUE (catalogue/F839/sue-pairs.yaml, reason
# authorization-keeps-pace). The case: scia-paesaggistica-semplificata-fittizia's, with what proroga-paesaggistica-fittizia adds; the other's answers fill
# what the main's don't say (gen.py combo_answers). The rules table sue-napoli routes it.
extends:
- scia-paesaggistica-semplificata-fittizia
- proroga-paesaggistica-fittizia
procedure: napoli/comune/scia-edilizia-con-proroga-autorizzazione-paesaggistica
title: SCIA e proroga paesaggistica in una pratica, SUE Napoli (tecnico con procura)
comune: F839
sportello: sue
crawl: sue-combo-scia-proroga-paesaggistica
operation:
- Segnalazione Certificata di Inizio Attività Edilizia (S.C.I.A.)
- Proroga autorizzazione paesaggistica (art. 10 septies, Legge 51/2022 - Comune)
scelte:
- IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE
first:
- Scheda anagrafica
- Qualifica e dati del procuratore
after:
- Pagamento degli oneri
- Gestione degli allegati
asks:
  descrizione:
    default: SCIA + proroga paesaggistica {{c:identity.last_name}}
  diritti_euro:
    question: "I diritti del SUE in euro: una SCIA onerosa non è in alcuna voce della tabella 2026 del Comune; chiedi al SUE"
    propose: "{{ask.scia_onerosa|diritti_gratuito}}"
    why: "Voce SUE 10 del tariffario 2026 dei diritti SUE del Comune (G.C. 239/2026): 401 € per una SCIA non soggetta al contributo. Una SCIA onerosa (art. 22) non è in alcuna voce: le fasce SUE 7-9 nominano solo il permesso a titolo oneroso e la SCIA alternativa, quindi l'importo si chiede (da confermare con il SUE)"
yours:
- "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
- "Spunta le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC, b) PER PRESA VISIONE, m) diritti di terzi, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
- 'In qualità di progettista, verifica ogni asseverazione di questa pagina: sono tue, e le firmi con la pratica'
- "Prima dell'inizio dei lavori, nomina chi la pratica lascia da nominare (il direttore dei lavori, il direttore dei lavori strutturali, l'impresa) con la comunicazione di nomina del SUE"
- 'Nessuna data di inizio: i lavori iniziano quando il SUE comunica che l''autorizzazione paesaggistica (e ogni altro assenso) è stata acquisita'
- 'Paga i diritti prima della seconda compilazione (dopo le dichiarazioni): la ricevuta, firmata, va allegata in quella'
- "Spunta le dichiarazioni del dichiarante: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, e le eventuali prese visione a nome del committente"
- "Firma e invia (Firma e invio); conserva la ricevuta"
rules:
  table: sue-napoli
  question: Quali di queste cose valgono per i lavori? Spunta quelle vere, anche nessuna.
  facts:
    permesso_per_scelta: 'false'
    parere_esonero: 'false'
  main: napoli/comune/scia-edilizia
  handles:
  - napoli/comune/proroga-autorizzazione-paesaggistica
answers:
  descrizione: PROVA NON INVIARE - SCIA + proroga paesaggistica P6
  paesaggio: proroga
