# SCIA alternativa e proroga paesaggistica e terre e rocce: 3 operations in one pratica on Napoli's SUE (catalogue/F839/sue-pairs.yaml, reason
# authorization-keeps-pace). The case: scia-alt-paesaggistica-semplificata-terre-rocce-fittizia's, with what proroga-paesaggistica-fittizia adds; the other's answers fill
# what the main's don't say (gen.py combo_answers). The rules table sue-napoli routes it.
extends:
- scia-alt-paesaggistica-semplificata-terre-rocce-fittizia
- proroga-paesaggistica-fittizia
procedure: napoli/comune/scia-alternativa-pdc-con-proroga-autorizzazione-paesaggistica-e-utilizzo-materiale-scavo-fuori-sito
title: SCIA alternativa e proroga paesaggistica e terre e rocce in una pratica, SUE Napoli (tecnico con procura)
comune: F839
sportello: sue
crawl: sue-combo-scia-alt-proroga-paesaggistica-dichiarazione-utilizzo
operation:
- Segnalazione Certificata Inizio Attività alternativa al Permesso di Costruire (S.C.I.A. alternativa P.d.C.)
- Proroga autorizzazione paesaggistica (art. 10 septies, Legge 51/2022 - Comune)
- Dichiarazione di utilizzo del materiale di scavo fuori del sito di produzione ai sensi dell'art. 21 del DPR n.120/2017
  (da trasmettere almeno 15 giorni prima dell'inizio dei lavori di scavo)
scelte:
- IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE
first:
- Scheda anagrafica
- Qualifica e dati del procuratore
after:
- Pagamento degli oneri
- Gestione degli allegati
asks:
  descrizione:
    default: SCIA alt. + pror. paes. + terre {{c:identity.last_name}}
  diritti_euro:
    question: "I diritti del SUE in euro: la tabella 2026 non indica la voce per questo caso (il contributo lo calcola il SUE, o è esattamente 5.000 €). Pratica onerosa, SUE 7-9 in base al contributo: 1003 fino a 5.000 €, 1505 da 5.000 a 30.000 €, 1998 oltre"
    propose: "{{ask.scia_onerosa,ask.contributo_fascia|diritti_scia_alt}}"
    why: "Voci del tariffario 2026 dei diritti SUE del Comune (G.C. 239/2026): SUE 10, 401 € se non soggetta al contributo; se onerosa, SUE 7-9 in base al contributo (oneri di urbanizzazione + costo di costruzione): 1.003 € fino a 5.000 €, 1.505 € da 5.000 a 30.000 €, 1.998 € oltre"
yours:
- "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
- "Spunti le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC, b) PER PRESA VISIONE, m) diritti di terzi, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
- 'In qualità di progettista, verifichi ogni asseverazione di questa pagina: sono Sue, e le firma con la pratica'
- "Prima dell'inizio dei lavori, nomini chi la pratica lascia da nominare (il direttore dei lavori, il direttore dei lavori strutturali, l'impresa) con la comunicazione di nomina del SUE"
- "La dichiarazione di utilizzo (Allegato 6 DPR 120/2017) è il documento che il portale genera in Allega documenti una volta spuntate le dichiarazioni: la firma il produttore, Claude la allega nella seconda compilazione; lo scavo inizia almeno 15 giorni dopo l'invio"
- "Quando le terre sono state tutte utilizzate, entro la validità della dichiarazione, presenti al SUE la dichiarazione di avvenuto utilizzo (art. 7 DPR 120/2017)"
- "Paghi il bollo come chiede il portale, poi firmi e invii (Firma e invio); conservi la ricevuta"
- "I 30 giorni prima dell'inizio dei lavori decorrono dal rilascio dell'autorizzazione paesaggistica, non dalla presentazione (art. 23 c. 3 DPR 380/2001); il contributo, se dovuto, si paga come indica il quadro g)"
- "Spunti le dichiarazioni del dichiarante: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, e le eventuali prese visione a nome del committente"
- "Firmi e invii (Firma e invio); conservi la ricevuta"
