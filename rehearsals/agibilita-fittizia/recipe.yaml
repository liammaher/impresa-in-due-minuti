# The Segnalazione Certificata per l'Agibilità after the CILA rehearsal's works, as gen.py writes
# its steps file. Never walked: crawl catalogue/F839/sections/sue-segnalazione-certificata-per-l-agibilita.json, every field from
# dictionary/fnsuap.yaml. The architect attests, as direttore dei lavori or, where none was named,
# as professionista abilitato (art. 24 c. 5 DPR 380/2001); the client is
# the tenant of the CILA (rehearsals/cila-fittizia). Works on structures (collaudo statico or
# dichiarazione di regolare esecuzione), energy (AQE), house numbers, fire safety (the fire
# SCIA, a SCIA Unica), lifts and every system with each of its certificates are mapped; partial
# agibilità and art. 24 c. 5-bis/5-quater too.
procedure: napoli/comune/agibilita
title: "Segnalazione certificata per l'agibilità, SUE Napoli (tecnico con procura)"
comune: F839
sportello: sue
crawl: sue-segnalazione-certificata-per-l-agibilita
operation: Segnalazione Certificata per l'Agibilità
scelte: [IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE]
first: [Scheda anagrafica, Qualifica e dati del procuratore]
after: [Pagamento degli oneri, Gestione degli allegati]
asks:
  diritti_euro: {default: "401", why: "Voce SUE 10 del tariffario 2026 dei diritti SUE del Comune (G.C. 239/2026): 401 € per una Segnalazione Certificata di Agibilità"}
  # Napoli's own annexes, attached by the second run under Allegati liberi (DD 603/2025; L.R. 59/2018).
  modello_dp: {default: "true"}
  descrizione: {default: "agibilità {{c:identity.last_name}}"}
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Spunti le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC (domicilio elettronico), consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "In qualità di direttore dei lavori (o professionista abilitato), verifichi ogni attestazione di questa pagina: sono Sue, e le firma con la pratica"
  - "Attestazione tecnica - Agibilità: il portale richiede una delle caselle dell'art. 24 c. 5-bis/5-ter o 5-quater; Claude spunta quella corrispondente al caso, e nessuna quando non ricorre nessuno dei due casi (in tal caso chieda al SUE)"
  - "Firmi e invii (Firma e invio); conservi la ricevuta"
supports:
  # Art. 24 c. 5-bis only with c. 5-ter's adattabilità met; the one-room flat also names its
  # c. 5-ter condition.
  - {if: "{{ask.igienico_24_5bis}}", value: "{{ask.igienico_adattabilita}}", in: ["true"], else: "L'art. 24 c. 5-bis si applica solo se è soddisfatto il requisito di adattabilità (art. 24 c. 5-ter): l'unità non ne ha i requisiti."}
# Each "si allega" of the attestazione adds its own required slot (read on the portal 2026-10-30).
attachments:
  Gestione degli allegati:
    - {kind: file, label: Certificato di collaudo statico, value: "{{ask.collaudo_doc}}", when: "{{ask.strutture}} {{ask.collaudo|is_certificato_allegato}}", on_page: true}
    - {kind: file, label: Dichiarazione di regolare esecuzione, value: "{{ask.collaudo_doc}}", when: "{{ask.strutture}} {{ask.collaudo|is_regolare_esecuzione_allegata}}", on_page: true}
    - {kind: file, label: Attestato di qualificazione energetica (AQE), value: "{{ask.aqe_doc}}", when: "{{ask.prestazione_energetica}}", on_page: true}
    - {kind: file, label: Documentazione necessaria per l'assegnazione o aggiornamento di numerazione civica, value: "{{ask.civici_doc}}", when: "{{ask.civici_variazione}} {{ask.civici_richiesta|is_allegata}}", on_page: true}
    - {kind: file, label: SCIA ai sensi dell’art. 4 comma 1 del d.P.R. n. 151/2011, value: "{{ask.antincendio_scia_doc}}", when: "{{ask.antincendio_variazione}}", on_page: true}
    - {kind: file, label: "Copia di elaborato planimetrico, del progetto ed eventuali varianti", value: "{{ask.elaborato_parziale_doc}}", when: "{{ask.agibilita_parziale|in_edificio__unita}}", on_page: true}
    # Opened by a system's collaudo or atto notorio, and required then (read on the portal 2026-10-31).
    - {kind: file, label: "Certificato di collaudo ove previsto, degli impianti installati", value: "{{ask.impianti_collaudo_doc}}", when: "{{ask.impianti}} {{ask.impianti_certificazione|is_altro}} {{ask.impianto_elettrico_collaudo,ask.impianto_radiotv_collaudo,ask.impianto_termico_collaudo,ask.impianto_idrico_collaudo,ask.impianto_gas_collaudo,ask.impianto_ascensore_collaudo,ask.impianto_antincendio_collaudo,ask.impianto_scariche_collaudo,ask.impianto_linee_vita_collaudo,ask.impianto_altro_collaudo|any}}", on_page: true}
    - {kind: file, label: "Atto notorio relativo alla conformità degli impianti", value: "{{ask.impianti_atto_notorio_doc}}", when: "{{ask.impianti}} {{ask.impianti_certificazione|is_altro}} {{ask.impianto_elettrico_atto_notorio,ask.impianto_radiotv_atto_notorio,ask.impianto_termico_atto_notorio,ask.impianto_idrico_atto_notorio,ask.impianto_gas_atto_notorio,ask.impianto_ascensore_atto_notorio,ask.impianto_antincendio_atto_notorio,ask.impianto_scariche_atto_notorio|any}}", on_page: true}
# Routed by the rules table sue-napoli-adempimenti: what is filed on the title held.
rules:
  table: sue-napoli-adempimenti
  question: "Quali di queste cose valgono per i lavori? Spunti quelle vere, anche nessuna."
  facts: {adempimento: "agibilita"}
