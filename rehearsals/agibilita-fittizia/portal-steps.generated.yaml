  - {kind: file, label: Dichiarazione di regolare esecuzione, value: '{{ask.collaudo_doc}}', when: '{{ask.strutture}} {{ask.collaudo|is_regolare_esecuzione_allegata}}'}
  - {kind: file, label: Attestato di qualificazione energetica (AQE), value: '{{ask.aqe_doc}}', when: '{{ask.prestazione_energetica}}'}
  - {kind: file, label: Documentazione necessaria per l'assegnazione o aggiornamento di numerazione civica, value: '{{ask.civici_doc}}', when: '{{ask.civici_variazione}} {{ask.civici_richiesta|is_allegata}}'}
  - {kind: file, label: SCIA ai sensi dell’art. 4 comma 1 del d.P.R. n. 151/2011, value: '{{ask.antincendio_scia_doc}}', when: '{{ask.antincendio_variazione}}'}
  - {kind: file, label: 'Copia di elaborato planimetrico, del progetto ed eventuali varianti', value: '{{ask.elaborato_parziale_doc}}', when: '{{ask.agibilita_parziale|in_edificio__unita}}'}
  - {kind: file, label: 'Certificato di collaudo ove previsto, degli impianti installati', value: '{{ask.impianti_collaudo_doc}}', when: '{{ask.impianti}} {{ask.impianti_certificazione|is_altro}} {{ask.impianto_elettrico_collaudo,ask.impianto_radiotv_collaudo,ask.impianto_termico_collaudo,ask.impianto_idrico_collaudo,ask.impianto_gas_collaudo,ask.impianto_ascensore_collaudo,ask.impianto_antincendio_collaudo,ask.impianto_scariche_collaudo,ask.impianto_linee_vita_collaudo,ask.impianto_altro_collaudo|any}}'}
  - {kind: file, label: Atto notorio relativo alla conformità degli impianti, value: '{{ask.impianti_atto_notorio_doc}}', when: '{{ask.impianti}} {{ask.impianti_certificazione|is_altro}} {{ask.impianto_elettrico_atto_notorio,ask.impianto_radiotv_atto_notorio,ask.impianto_termico_atto_notorio,ask.impianto_idrico_atto_notorio,ask.impianto_gas_atto_notorio,ask.impianto_ascensore_atto_notorio,ask.impianto_antincendio_atto_notorio,ask.impianto_scariche_atto_notorio|any}}'}
