supports:
- if: '{{ask.igienico_24_5bis}}'
  value: '{{ask.igienico_5bis_caso}}'
  in:
  - altezza
  - monostanza uno
  - monostanza due
  else: 'More than one case of art. 24 c. 5-bis isn''t mapped yet: each opens its own boxes.'
- if: '{{ask.igienico_24_5bis}}'
  value: '{{ask.igienico_adattabilita}}'
  in:
  - 'true'
  else: 'Art. 24 c. 5-bis applies only with the adattabilità requirement met (art. 24 c. 5-ter): the unit doesn''t qualify.'
