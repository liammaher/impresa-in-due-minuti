procedure: napoli/comune/agibilita
title: Segnalazione certificata per l'agibilità, SUE Napoli (tecnico con procura)
generated: gen.py from agibilita (2026-10-31) and dictionary/fnsuap.yaml
yours:
- Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page
- 'Tick the dichiarante''s declarations: the awareness box under the PEC (domicilio elettronico), consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000'
- 'As direttore dei lavori, check every attestation on this page: they are yours, signed with the pratica'
- 'Attestazione tecnica - Agibilità: the portal requires one of the art. 24 c. 5-bis/5-ter or 5-quater boxes; Claude ticks the one the case is, and none when it is neither (then ask the SUE)'
- 'On Allega documenti: the portal''s procura signed by the client, then everything signed digitally (.p7m)'
- Sign and send (Firma e invio); keep the receipt
groups:
  impianti_dichiarazione:
    question: Which systems have their dichiarazione di conformità or di rispondenza (DM 37/2008) attached? Tick every one.
  impianti_depositato:
    question: Which systems' certificate (the dichiarazione, or the collaudo) is already filed with the Comune, so the form gives its protocol (P.G.) number instead? Tick every one.
  impianti_collaudo:
    question: Which systems have a collaudo, where one is required (a lift's, a fire-protection system's, ...)? Tick every one.
  impianti_atto_notorio:
    question: 'Which systems are certified by an atto di notorietà (art. 6 DPR 392/1994: older systems brought up to L. 46/1990)? Tick every one.'
