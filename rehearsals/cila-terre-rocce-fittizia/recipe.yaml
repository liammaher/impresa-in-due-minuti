# CILA con dichiarazione di utilizzo delle terre e rocce da scavo in one pratica on Napoli's SUE: the cila-fittizia rehearsal's case with excavated soil that leaves the site
# as a by-product (a small site: art. 21 DPR 120/2017). Two operations selected together in the
# wizard; the dichiarazione adds two adempimenti (the SUE's, ARPA Campania's) and no section, so the
# combination's crawl (catalogue/F839/sections/sue-combo-cila-dichiarazione-utilizzo.json) has the main pratica's sections and the
# dichiarazione's slot. Everything else is cila-fittizia's recipe and what the dichiarazione adds
# (parts/dichiarazione-utilizzo-terre.yaml): a slot or a refusal mapped on either reaches this one.
extends: [cila-fittizia, parts/dichiarazione-utilizzo-terre]
procedure: napoli/comune/cila-con-dichiarazione-utilizzo-terre
title: "CILA con dichiarazione di utilizzo delle terre e rocce da scavo, SUE Napoli (tecnico con procura)"
crawl: sue-combo-cila-dichiarazione-utilizzo
asks:
  descrizione: {default: "CILA e terre e rocce {{c:identity.last_name}}"}
# Its main pratica's steps for the person (a recipe's `yours` replaces the one it extends), then the dichiarazione's.
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Spunti le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC (domicilio elettronico), c) PER PRESA VISIONE, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "Paghi i diritti di {{ask.diritti_euro}} € prima della seconda compilazione (come, è indicato sotto): la ricevuta firmata va allegata lì. La sanzione della CILA tardiva si paga prima: la sua ricevuta è nel quadro d)"
  - "Per la DSC della CILA può usare quella che compila Claude (un riquadro per ogni documento caricato) invece di quella del portale: firmata e in PDF/A, va nella seconda compilazione"
  - "Se è un bene culturale: i lavori iniziano solo dopo l'autorizzazione della Soprintendenza (art. 21 c. 4 D.Lgs. 42/2004). È allegata in Allegati liberi: la conservi con la pratica"
  - "La dichiarazione di utilizzo (Allegato 6 DPR 120/2017) è il documento del portale in Allega documenti dopo aver spuntato le dichiarazioni: la firma il produttore, Claude la allega nella seconda compilazione (dopo le dichiarazioni); lo scavo inizia almeno 15 giorni dopo l'invio"
  - "Quando tutte le terre e rocce da scavo saranno state utilizzate, entro la validità della dichiarazione, presenti sul SUE la dichiarazione di avvenuto utilizzo (art. 7 DPR 120/2017)"
  - "Firmi e invii (Firma e invio); conservi la ricevuta"
answers:
  descrizione: PROVA NON INVIARE - CILA e terre e rocce P6
  # Works not begun: the dichiarazione goes before the excavation (the P6 CILA is a late one).
  cila_stato: da iniziare
  inizio_dopo_assensi: false
  data_inizio_lavori: '2027-01-11'
  oggetto: "Manutenzione straordinaria non strutturale: rifacimento degli impianti e nuovo allaccio fognario nel cortile, con scavo di 30 m³ di terre portate a un altro cantiere come sottoprodotto (dati inventati per la prova)."
