# CILA con dichiarazione di utilizzo delle terre e rocce da scavo in one pratica on Napoli's SUE: the cila-fittizia rehearsal's case with excavated soil that leaves the site
# as a by-product (a small site: art. 21 DPR 120/2017). Two operations selected together in the
# wizard; the dichiarazione adds two adempimenti (the SUE's, ARPA Campania's) and no section, so the
# combination's crawl (catalogue/F839/sections/sue-combo-cila-dichiarazione-utilizzo.json) has the main pratica's sections and the
# dichiarazione's slot. Everything else is cila-fittizia's recipe and what the dichiarazione adds
# (parts/dichiarazione-utilizzo-terre.yaml): a slot or a refusal mapped on either reaches this one.
extends: [cila-fittizia, parts/dichiarazione-utilizzo-terre]
procedure: napoli/comune/cila-con-dichiarazione-utilizzo-terre
title: "CILA con dichiarazione di utilizzo delle terre e rocce da scavo, SUE Napoli (tecnico con procura)"
comune: F839
sportello: sue
crawl: sue-combo-cila-dichiarazione-utilizzo
operation:
  - Comunicazione Inizio Lavoro Asseverata (C.I.L.A.)
  - "Dichiarazione di utilizzo del materiale di scavo fuori del sito di produzione ai sensi dell'art. 21 del DPR n.120/2017 (da trasmettere almeno 15 giorni prima dell'inizio dei lavori di scavo)"
asks:
  descrizione: {default: "CILA e terre e rocce {{c:identity.last_name}}"}
# Its main pratica's steps for the person (a recipe's `yours` replaces the one it extends), then the dichiarazione's.
yours:
  - "Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page"
  - "Tick the dichiarante's declarations: the awareness box under the PEC (domicilio elettronico), c) PER PRESA VISIONE, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "Pay the {{ask.diritti_euro}} € diritti before the second run (after the declarations; how Napoli takes them is below): its receipt, signed, goes with it. A late CILA's penalty is paid before the first run: its receipt is in quadro d)"
  - "The CILA DSC may be the one fill.py fills (form quadro-riepilogativo-dsc: a box per document uploaded) instead of the portal's: signed, as PDF/A, it goes with the second run"
  - "On a bene culturale: the works start only once the Soprintendenza has authorized them (art. 21 c. 4 D.Lgs. 42/2004); its authorization is attached under Allegati liberi: keep it with the pratica"
  - "The dichiarazione di utilizzo (Allegato 6 DPR 120/2017) is the portal's document on Allega documenti once the declarations are ticked: the producer signs it, Claude attaches it in the second run; the excavation starts at least 15 days after sending"
  - "When the soil has all been used, within the dichiarazione's validity, file the dichiarazione di avvenuto utilizzo (art. 7 DPR 120/2017) on the SUE"
  - "Sign and send (Firma e invio); keep the receipt"
rules:
  main: napoli/comune/cila-lavori-edilizi
answers:
  descrizione: PROVA NON INVIARE - CILA e terre e rocce P6
  # Works not begun: the dichiarazione goes before the excavation (the P6 CILA is a late one).
  cila_stato: da iniziare
  inizio_dopo_assensi: false
  data_inizio_lavori: '2027-01-11'
  oggetto: "Manutenzione straordinaria non strutturale: rifacimento degli impianti e nuovo allaccio fognario nel cortile, con scavo di 30 m³ di terre portate a un altro cantiere come sottoprodotto (dati inventati per la prova)."
