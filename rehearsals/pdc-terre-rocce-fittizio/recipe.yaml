# Permesso di costruire con dichiarazione di utilizzo delle terre e rocce da scavo in one pratica on Napoli's SUE: the pdc-fittizio rehearsal's case with excavated soil that leaves the site
# as a by-product (a small site: art. 21 DPR 120/2017). Two operations selected together in the
# wizard; the dichiarazione adds two adempimenti (the SUE's, ARPA Campania's) and no section, so the
# combination's crawl (catalogue/F839/sections/sue-combo-pdc-dichiarazione-utilizzo.json) has the main pratica's sections and the
# dichiarazione's slot. Everything else is pdc-fittizio's recipe and what the dichiarazione adds
# (parts/dichiarazione-utilizzo-terre.yaml): a slot or a refusal mapped on either reaches this one.
extends: [pdc-fittizio, parts/dichiarazione-utilizzo-terre]
procedure: napoli/comune/permesso-di-costruire-con-dichiarazione-utilizzo-terre
title: "Permesso di costruire con dichiarazione di utilizzo delle terre e rocce da scavo, SUE Napoli (tecnico con procura)"
crawl: sue-combo-pdc-dichiarazione-utilizzo
asks:
  descrizione: {default: "PROVA NON INVIARE - PdC e terre e rocce {{c:identity.last_name}}"}
# Its main pratica's steps for the person (a recipe's `yours` replaces the one it extends), then the dichiarazione's.
yours:
  - "Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page"
  - "Tick the dichiarante's declarations: the awareness box under the PEC, j) diritti di terzi, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "As progettista, check every asseverazione on this page: the portal makes them the Relazione tecnica di asseverazione you sign with the request"
  - "The asseverazione's \"non interessa aree percorse dal fuoco\" (qualità terreni) is one choice with the soil statement on the portal: Claude ticks the soil statement and leaves it (a portal defect, docs/portal-defects.md); state it in the relazione tecnica if the SUE wants it"
  - "The dichiarazione di utilizzo (Allegato 6 DPR 120/2017) is the portal's document on Allega documenti once the declarations are ticked: the producer signs it, Claude attaches it in the second run; the excavation starts at least 15 days after sending"
  - "When the soil has all been used, within the dichiarazione's validity, file the dichiarazione di avvenuto utilizzo (art. 7 DPR 120/2017) on the SUE"
  - "Pay the bollo as the portal asks, then sign and send (Firma e invio); keep the receipt"
  - "Once the permesso is issued: collect it (paying the contributo, if due, as quadro f) says), name the structural designer and whoever else the permesso leaves to be named (the direttori dei lavori, the firm), and file the comunicazione di inizio lavori with the energy report and the structural filings"
answers:
  descrizione: PROVA NON INVIARE - PdC e terre e rocce P6
  oggetto: "Ristrutturazione edilizia con demolizione e ricostruzione di un edificio residenziale di tre piani con aumento di volumetria e un nuovo piano interrato, scavo di 2.500 m³ di terre portate a un altro cantiere come sottoprodotto, opera non soggetta a VIA (dati inventati per la prova)."
  # The asseverazione says what the dichiarazione files: by-products from a small site.
  scavo: sottoprodotti
  scavo_piano_utilizzo: "false"
