# Permesso di costruire con dichiarazione di utilizzo delle terre e rocce da scavo in one pratica on Napoli's SUE: the pdc-fittizio rehearsal's case with excavated soil that leaves the site
# as a by-product (a small site: art. 21 DPR 120/2017). Two operations selected together in the
# wizard; the dichiarazione adds two adempimenti (the SUE's, ARPA Campania's) and no section, so the
# combination's crawl (catalogue/F839/sections/sue-combo-pdc-dichiarazione-utilizzo.json) has the main pratica's sections and the
# dichiarazione's slot. Everything else is pdc-fittizio's recipe and what the dichiarazione adds
# (parts/dichiarazione-utilizzo-terre.yaml): a slot or a refusal mapped on either reaches this one.
extends: [pdc-fittizio, parts/dichiarazione-utilizzo-terre]
procedure: napoli/comune/permesso-di-costruire-con-dichiarazione-utilizzo-terre
title: "Permesso di costruire con dichiarazione di utilizzo delle terre e rocce da scavo, SUE Napoli (tecnico con procura)"
crawl: sue-combo-pdc-dichiarazione-utilizzo
asks:
  descrizione: {default: "PdC e terre e rocce {{c:identity.last_name}}"}
# Its main pratica's steps for the person (a recipe's `yours` replaces the one it extends), then the dichiarazione's.
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Spunti le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC, j) diritti di terzi, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "In qualità di progettista, verifichi ogni asseverazione di questa pagina: il portale ne ricava la Relazione tecnica di asseverazione che Lei firma con la richiesta"
  - "Nell'asseverazione, «non interessa aree percorse dal fuoco» e la dichiarazione sui terreni sono una sola scelta sul portale (un suo difetto): Claude spunta quella sui terreni. Le aree bruciate le dichiari nella relazione tecnica, se il SUE lo chiede"
  - "La dichiarazione di utilizzo (Allegato 6 DPR 120/2017) è il documento del portale in Allega documenti dopo aver spuntato le dichiarazioni: la firma il produttore, Claude la allega nella seconda compilazione (dopo le dichiarazioni); lo scavo inizia almeno 15 giorni dopo l'invio"
  - "Quando tutte le terre e rocce da scavo saranno state utilizzate, entro la validità della dichiarazione, presenti sul SUE la dichiarazione di avvenuto utilizzo (art. 7 DPR 120/2017)"
  - "Paghi il bollo come chiede il portale, poi firmi e invii (Firma e invio); conservi la ricevuta"
  - "Una volta rilasciato il permesso: lo ritiri (pagando il contributo, se dovuto, come indica il quadro f)), nomini il progettista strutturale e chiunque altro il permesso lasci da nominare (i direttori dei lavori, l'impresa), e presenti la comunicazione di inizio lavori con la relazione energetica e i depositi strutturali"
answers:
  descrizione: PROVA NON INVIARE - PdC e terre e rocce P6
  oggetto: "Ristrutturazione edilizia con demolizione e ricostruzione di un edificio residenziale di tre piani con aumento di volumetria e un nuovo piano interrato, scavo di 2.500 m³ di terre portate a un altro cantiere come sottoprodotto, opera non soggetta a VIA (dati inventati per la prova)."
  # The asseverazione says what the dichiarazione files: by-products from a small site.
  scavo: sottoprodotti
  scavo_piano_utilizzo: "false"
