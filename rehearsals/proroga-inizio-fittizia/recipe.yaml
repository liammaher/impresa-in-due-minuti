procedure: napoli/comune/proroga-inizio-lavori
title: "Proroga del termine di inizio lavori (permesso di costruire), SUE Napoli (tecnico con procura)"
comune: F839
sportello: sue
crawl: sue-proroga-inizio-lavori
operation: Proroga inizio lavori
scelte: [IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE]
first: [Scheda anagrafica, Qualifica e dati del procuratore]
after: [Pagamento degli oneri, Gestione degli allegati]
asks:
  diritti_euro: {propose: "{{ask.titolo_tipo|diritti_proroga_pdc}}", why: "Voce SUE 11 del tariffario 2026 dei diritti SUE del Comune (G.C. 239/2026): 501 € per la proroga di un permesso di costruire"}
  descrizione: {default: "proroga inizio {{c:identity.last_name}}"}
  titolo: {question: "Il titolo dell'intestatario del permesso sull'immobile (proprietario, locatario, ...)"}
  proroga_data_prevista: {question: "La nuova data prevista di inizio dei lavori"}
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Spunti le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC (domicilio elettronico), consapevolezza (artt. 46-47), informativa privacy, tasse comunali"
  - "{{ask.bollo_marche,ask.bollo_esenzione|bollo_yours}}"
  - "Firmi e invii (Firma e invio); conservi la ricevuta"
supports:
  - when: "{{ask.titolo_tipo|is_permesso_di_costruire}}"
    else: "Per ora solo per un permesso di costruire: il caso della DIA non è ancora stato provato."
