# SCIA in sanatoria e rinnovo paesaggistica: 2 operations in one pratica on Napoli's SUE (catalogue/F839/sue-pairs.yaml,
# reason authorization-keeps-pace). A SCIA filed of one's own accord for works still under way (art. 37 c. 5 DPR 380/2001)
# on a property whose landscape authorization for the works not yet done expired less than a year ago: the SCIA carries
# its renewal (art. 7 DPR 31/2017), as a new title would (rules/sue-napoli.yaml, paesaggistica-rinnovo). The case:
# scia-sanatoria-paesaggistica-semplificata-fittizia's, with what rinnovo-paesaggistica-fittizia adds; the other's answers
# fill what the main's don't say (gen.py combo_answers). gen.py takes the order from the combination's crawl with the
# sanatoria answered Sì (catalogue/F839/sections/sue-combo-scia-sanatoria-rinnovo-paesaggistica.json).
extends:
- scia-sanatoria-paesaggistica-semplificata-fittizia
- rinnovo-paesaggistica-fittizia
procedure: napoli/comune/scia-in-sanatoria-con-rinnovo-autorizzazione-paesaggistica-semplificata
title: SCIA in sanatoria e rinnovo paesaggistica in una pratica, SUE Napoli (tecnico con procura)
comune: F839
sportello: sue
crawl: sue-combo-scia-sanatoria-rinnovo-paesaggistica
operation:
- Segnalazione Certificata di Inizio Attività Edilizia (S.C.I.A.)
- Rinnovo Autorizzazione Paesaggistica Semplificata  (DPR 31/2017 - Comune)
scelte:
- IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE
first:
- Scheda anagrafica
- Qualifica e dati del procuratore
after:
- Pagamento degli oneri
- Gestione degli allegati
asks:
  descrizione:
    default: SCIA sanatoria + rinnovo {{c:identity.last_name}}
  # The main pratica's: the rinnovo's own would win the merge, and the Comune's table charges a landscape
  # authorization only "quando oggetto di autonoma istanza".
  diritti_euro:
    propose: "{{ask.sanatoria_caso|diritti_sanatoria_scia}}"
    why: "Voce SUE 16 del tariffario 2026 dei diritti SUE del Comune (G.C. 239/2026): 441 € alla presentazione per un accertamento di conformità (art. 36-bis) o una regolarizzazione (art. 34-ter), il resto una volta determinato; art. 36-bis c. 5 b, SUE 17-18. I lavori ancora in corso (art. 37 c. 5) non sono nel tariffario: chiedi al SUE"
yours:
- "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
- "Spunta le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC, b) PER PRESA VISIONE, m) diritti di terzi, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
- "In qualità di progettista, verifica ogni asseverazione di questa pagina: sono tue, e le firmi con la pratica"
- "Prima dell'inizio dei lavori, nomina chi la pratica lascia da nominare (il direttore dei lavori, il direttore dei lavori strutturali, l'impresa) con la comunicazione di nomina del SUE"
- "I lavori paesaggistici attendono che il SUE confermi il rinnovo: l'autorizzazione è scaduta"
- "Paga la sanzione di 516 € (art. 37 c. 5) prima della compilazione, che ne allega la ricevuta, e i diritti prima della seconda compilazione (dopo le dichiarazioni), che allega la relativa ricevuta"
- "{{ask.bollo_marche,ask.bollo_esenzione|bollo_yours}}"
- "Firma e invia (Firma e invio); conserva la ricevuta"
rules:
  table: sue-napoli
  question: Quali di queste cose valgono per i lavori? Spunta quelle vere, anche nessuna.
  # A combination's facts replace its parents' whole: the main pratica's, restated.
  facts:
    permesso_per_scelta: 'false'
    sanatoria: 'true'
    parere_esonero: 'false'
  main: napoli/comune/scia-in-sanatoria
  handles:
  - napoli/comune/rinnovo-autorizzazione-paesaggistica-semplificata
# The case: the main pratica's P6 answers, the other's, then these (a null drops one); `gen.py --answers` writes
# answers-p6.json. Interior works begun without the SCIA; the facade works, authorized and not begun, still to do.
answers:
  descrizione: PROVA NON INVIARE - SCIA sanatoria + rinnovo paes. P6
  paesaggio: rinnovo
  oggetto: "SCIA a lavori in corso (art. 37 c. 5 DPR 380/2001) con rinnovo dell'autorizzazione paesaggistica scaduta da meno di un anno (art. 7 DPR 31/2017): tramezzi interni, nuovo bagno, impianti; persiane e ringhiere in facciata da installare (dati inventati)."
  dettaglio_intervento: "All'interno, lavori iniziati senza SCIA: demolizione e ricostruzione di due tramezzi con nuova distribuzione di cucina e bagno; nuovo bagno; rifacimento degli impianti idrico ed elettrico. In facciata, da eseguire dopo il rinnovo dell'autorizzazione paesaggistica, invariate rispetto a quella scaduta: sostituzione di persiane e ringhiere con altre di diverso disegno. Opere non strutturali. Dati inventati per la prova."
  allegato_b: null
