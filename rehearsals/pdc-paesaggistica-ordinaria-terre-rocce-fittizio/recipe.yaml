# Permesso di costruire con autorizzazione paesaggistica ordinaria and a dichiarazione di utilizzo delle terre e rocce da scavo
# (art. 21 DPR 120/2017), three operations in one pratica on Napoli's SUE: rehearsals/pdc-paesaggistica-ordinaria-fittizio's case
# with excavated soil that leaves a small site as a by-product. The dichiarazione adds two adempimenti
# and no section (catalogue/F839/sue-wizard.json `pairs`); the crawl is catalogue/F839/sections/sue-combo-pdc-paesaggistica-ordinaria-dichiarazione-utilizzo.json.
# Everything else is pdc-paesaggistica-ordinaria-fittizio's recipe and what the dichiarazione adds (parts/dichiarazione-utilizzo-terre.yaml).
extends: [pdc-paesaggistica-ordinaria-fittizio, parts/dichiarazione-utilizzo-terre]
procedure: napoli/comune/permesso-di-costruire-con-paesaggistica-ordinaria-e-dichiarazione-utilizzo-terre
title: "Permesso di costruire con autorizzazione paesaggistica ordinaria e dichiarazione di utilizzo delle terre e rocce da scavo, SUE Napoli (tecnico con procura)"
crawl: sue-combo-pdc-paesaggistica-ordinaria-dichiarazione-utilizzo
asks:
  descrizione: {default: "PdC ord. e terre e rocce {{c:identity.last_name}}"}
# pdc-paesaggistica-ordinaria-fittizio's steps for the person (a recipe's `yours` replaces the one it extends), then the dichiarazione's.
yours:
  - "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
  - "Spunti le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC, j) diritti di terzi, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "In qualità di progettista, verifichi ogni asseverazione di questa pagina: il portale ne ricava la Relazione tecnica di asseverazione che Lei firma con la richiesta"
  - "Nell'asseverazione, «non interessa aree percorse dal fuoco» e la dichiarazione sui terreni sono una sola scelta sul portale (un suo difetto): Claude spunta quella sui terreni. Le aree bruciate le dichiari nella relazione tecnica, se il SUE lo chiede"
  - "La dichiarazione di utilizzo (Allegato 6 DPR 120/2017) è il documento del portale in Allega documenti dopo aver spuntato le dichiarazioni: la firma il produttore, Claude la allega nella seconda compilazione (dopo le dichiarazioni); lo scavo inizia almeno 15 giorni dopo l'invio"
  - "Quando tutte le terre e rocce da scavo saranno state utilizzate, entro la validità della dichiarazione, presenti sul SUE la dichiarazione di avvenuto utilizzo (art. 7 DPR 120/2017)"
  - "Paghi il bollo come chiede il portale, poi firmi e invii (Firma e invio); conservi la ricevuta"
  - "L'autorizzazione paesaggistica precede il permesso (art. 146 c. 4 D.Lgs. 42/2004): i lavori iniziano solo quando sono stati ottenuti entrambi"
  - "Una volta rilasciato il permesso: lo ritiri (pagando il contributo, se dovuto, come indica il quadro f)), nomini il progettista strutturale e i direttori dei lavori, e presenti la comunicazione di inizio lavori con la relazione energetica e i depositi strutturali"
answers:
  descrizione: PROVA NON INVIARE - PdC ord. e terre e rocce P6
  # The asseverazione says what the dichiarazione files: by-products from a small site.
  scavo: sottoprodotti
  scavo_piano_utilizzo: "false"
