# Trasferire la sede dell'attività di acconciatore (Acconciatore, barbiere, estetista, tatuatore e piercer), as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-011-trasferire-la-sede-dell-attivita-di-acconciatore.json), for the made-up business of this folder's fixture.json.
# Derived from rehearsals/trasferimento-acconciatore-fittizio (bench/derive_recipe.py): no `rules:` and no `after:`; the attachments and payment screens are not read.
procedure: napoli/comune/scia-acconciatore-estetista
title: "Trasferire la sede dell'attività di acconciatore, Acconciatore, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-011-trasferire-la-sede-dell-attivita-di-acconciatore
subject: impresa
operation: Trasferire la sede dell'attività di acconciatore
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
scelte: ["in caso di attività che preveda insegna esterna"]
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  # The sector sits twice in Napoli's tree; both lead to the same pratica.
  - {screen: Scelta settore attività, tree: [{leaf: "Acconciatore, barbiere, estetista, tatuatore e piercer", nth: 1}], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Trasferire la sede dell'attività di acconciatore"], confirm: CONFERMA}
  - {screen: Scelta interventi eventuali, tree: [{leaf: "in caso di attività che preveda insegna esterna", nth: 1}], confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per l'attività? Spunta tutte quelle che valgono, o nessuna."
asks:
  insegna_consenso: {group: extras, type: yes_no, item: "L'insegna richiede il consenso di altri (il proprietario dell'edificio o il condominio)", why: "In quel caso il portale chiede i dati e l'assenso del proprietario: non lo preparo ancora."}
  insegna_vincolo: {group: extras, type: yes_no, item: "L'edificio è sotto tutela paesaggistica o monumentale", why: "In quel caso l'insegna ha bisogno di una propria autorizzazione: non la preparo ancora."}
  insegna_grande: {group: extras, type: yes_no, item: "Le insegne insieme superano i 5 m²", why: "Sopra i 5 m² è dovuto anche il canone unico: un pagamento a parte, che non preparo ancora."}
  insegna_zona_a: {group: extras, type: yes_no, item: "L'installazione ricade in zona A del PRG (il centro storico)", why: "In zona A la SCIA dell'insegna ha altre condizioni, che non preparo ancora."}
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "trasferimento {{business.denominazione}}"}
  trasferisce_acconciatore: {type: yes_no, question: "Si trasferisce l'attività di acconciatore?", default: "true", why: "È il trasferimento dell'acconciatore: l'operazione che sceglie la procedura guidata."}
  trasferisce_estetista: {type: yes_no, question: "Si trasferisce anche l'attività di estetista, nella stessa pratica?", propose: "false"}
  diritti_euro: {type: number, question: "I diritti SUAP in euro (la colonna VCA della tabella 2026 per un acconciatore: controllala)"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Spunta tu le dichiarazioni dell'insegna (ulteriori dichiarazioni, mezzi pubblicitari)"
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta tu le dichiarazioni: consapevolezza (artt. 46-47), informativa privacy, le Dichiarazioni (igiene, regole del Comune, sicurezza, norme edilizie e ambientali), tasse comunali, art. 75 DPR 445/2000"
  - "Paga i diritti di segreteria (€ {{ask.diritti_euro}}) con pagoPA nella schermata di pagamento"
  - "Allega, firmato con la tua firma digitale (.p7m), quanto chiede la schermata degli allegati dopo aver spuntato le dichiarazioni"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
supports:
  - {when: "{{ask.insegna_consenso|not}}", else: "Un'insegna che richiede il consenso del proprietario o del condominio per ora non la preparo."}
  - {when: "{{ask.insegna_vincolo|not}}", else: "Un'insegna su un edificio tutelato richiede una propria autorizzazione: per ora non la preparo."}
  - {when: "{{ask.insegna_grande|not}}", else: "Le insegne sopra i 5 m² pagano anche il canone unico: per ora non lo preparo."}
  - {when: "{{ask.insegna_zona_a|not}}", else: "In zona A del PRG (il centro storico) la SCIA dell'insegna ha altre condizioni, che non preparo ancora."}
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
  - {when: "{{ask.trasferisce_estetista|not}}", else: "Trasferire entrambe le attività spunta entrambe le operazioni nella procedura guidata: una combinazione che non preparo ancora."}
# Which pratica a case is: the library's rules table (rules/suap-napoli.yaml) decides. Since
# pratiche-napoli split `acconciatore_estetista` (2026-11-10), the hairdresser's and the beautician's
# moves are told apart by the activity their recipes fix.
rules:
  table: suap-napoli
  facts: {attivita: acconciatore, evento: trasferimento, insegna: "true"}
  handles: [napoli/comune/insegna-esercizio]
