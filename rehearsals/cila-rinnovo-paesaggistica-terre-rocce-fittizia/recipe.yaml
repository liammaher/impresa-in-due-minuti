# CILA e rinnovo paesaggistica e terre e rocce: 3 operations in one pratica on Napoli's SUE (catalogue/F839/sue-pairs.yaml, reason
# authorization-keeps-pace). The case: cila-paesaggistica-semplificata-terre-rocce-fittizia's, with what rinnovo-paesaggistica-fittizia adds; the other's answers fill
# what the main's don't say (gen.py combo_answers). The rules table sue-napoli routes it.
extends:
- cila-paesaggistica-semplificata-terre-rocce-fittizia
- rinnovo-paesaggistica-fittizia
procedure: napoli/comune/cila-lavori-edilizi-con-rinnovo-autorizzazione-paesaggistica-semplificata-e-utilizzo-materiale-scavo-fuori-sito
title: CILA e rinnovo paesaggistica e terre e rocce in una pratica, SUE Napoli (tecnico con procura)
comune: F839
sportello: sue
crawl: sue-combo-cila-rinnovo-paesaggistica-dichiarazione-utilizzo
operation:
- Comunicazione Inizio Lavoro Asseverata (C.I.L.A.)
- Rinnovo Autorizzazione Paesaggistica Semplificata  (DPR 31/2017 - Comune)
- Dichiarazione di utilizzo del materiale di scavo fuori del sito di produzione ai sensi dell'art. 21 del DPR n.120/2017
  (da trasmettere almeno 15 giorni prima dell'inizio dei lavori di scavo)
scelte:
- IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE
first:
- Scheda anagrafica
- Qualifica e dati del procuratore
after:
- Pagamento degli oneri
- Gestione degli allegati
asks:
  descrizione:
    default: CILA + rinnovo paes. + terre e rocce {{c:identity.last_name}}
  diritti_euro:
    default: '{{ask.cila_stato|diritti_cila}}'
    why: "Voce SUE 13 del tariffario 2026 dei diritti SUE del Comune (G.C. 239/2026): 151 € per una CILA; SUE 15: 166 € per una CILA presentata a lavori iniziati (mancata CILA)"
yours:
- "Apra la bozza in Pratiche in bozza ({{ask.descrizione}}) e la confronti con questa pagina"
- "Spunti le dichiarazioni del dichiarante: la casella di presa d'atto sotto la PEC (domicilio elettronico), c) PER PRESA VISIONE, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
- "Paghi i diritti prima della seconda compilazione (dopo le dichiarazioni): la ricevuta, firmata, va allegata in quella; il bollo prima dell'invio. La sanzione della CILA tardiva si paga prima della prima compilazione: la sua ricevuta è nel quadro d)"
- "La dichiarazione di utilizzo (Allegato 6 DPR 120/2017) è il documento che il portale genera in Allega documenti una volta spuntate le dichiarazioni: la firma il produttore, Claude la allega nella seconda compilazione; lo scavo inizia almeno 15 giorni dopo l'invio"
- "Quando le terre sono state tutte utilizzate, entro la validità della dichiarazione, presenti al SUE la dichiarazione di avvenuto utilizzo (art. 7 DPR 120/2017)"
- "Spunti le dichiarazioni del dichiarante: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, e le prese visione a nome del committente"
- "Firmi e invii (Firma e invio); conservi la ricevuta"
