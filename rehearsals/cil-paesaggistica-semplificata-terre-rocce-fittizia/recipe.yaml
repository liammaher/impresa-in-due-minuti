# CIL opere temporanee con autorizzazione paesaggistica semplificata and a dichiarazione di utilizzo delle terre e rocce da scavo
# (art. 21 DPR 120/2017), three operations in one pratica on Napoli's SUE: rehearsals/cil-paesaggistica-semplificata-fittizia's case
# with excavated soil that leaves a small site as a by-product. The dichiarazione adds two adempimenti
# and no section (catalogue/F839/sue-wizard.json `pairs`); the crawl is catalogue/F839/sections/sue-combo-cil-paesaggistica-semplificata-dichiarazione-utilizzo.json.
# Everything else is cil-paesaggistica-semplificata-fittizia's recipe and what the dichiarazione adds (parts/dichiarazione-utilizzo-terre.yaml).
extends: [cil-paesaggistica-semplificata-fittizia, parts/dichiarazione-utilizzo-terre]
procedure: napoli/comune/cil-con-paesaggistica-semplificata-e-dichiarazione-utilizzo-terre
title: "CIL opere temporanee con autorizzazione paesaggistica semplificata e dichiarazione di utilizzo delle terre e rocce da scavo, SUE Napoli (tecnico con procura)"
comune: F839
sportello: sue
crawl: sue-combo-cil-paesaggistica-semplificata-dichiarazione-utilizzo
operation:
  - "Comunicazione di Inizio Lavori per opere temporanee (C.I.L.)"
  - "Autorizzazione paesaggistica semplificata (DPR 31/2017 - Comune)"
  - "Dichiarazione di utilizzo del materiale di scavo fuori del sito di produzione ai sensi dell'art. 21 del DPR n.120/2017 (da trasmettere almeno 15 giorni prima dell'inizio dei lavori di scavo)"
asks:
  descrizione: {default: "CIL sempl. e terre e rocce {{c:identity.last_name}}"}
# cil-paesaggistica-semplificata-fittizia's steps for the person (a recipe's `yours` replaces the one it extends), then the dichiarazione's.
yours:
  - "Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page"
  - "Tick the dichiarante's declarations: the awareness box under the PEC (domicilio elettronico), consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000"
  - "Pay the {{ask.diritti_euro}} € diritti before the second run (after the declarations): its receipt, signed, goes with it; the bollo before sending"
  - "The works start only once the SUE says the landscape authorization is in: the start date is the earliest"
  - "If a notifica preliminare is due (art. 99 D.Lgs. 81/2008): attach it under Allegati liberi, signed digitally (.p7m only): the CIL has no slot of its own for it"
  - "The dichiarazione di utilizzo (Allegato 6 DPR 120/2017) is the portal's document on Allega documenti once the declarations are ticked: the producer signs it, Claude attaches it in the second run; the excavation starts at least 15 days after sending"
  - "When the soil has all been used, within the dichiarazione's validity, file the dichiarazione di avvenuto utilizzo (art. 7 DPR 120/2017) on the SUE"
  - "Sign and send (Firma e invio); keep the receipt"
# `rules` merge key by key: both pratiche filed with the main one.
rules:
  handles: [napoli/comune/autorizzazione-paesaggistica-semplificata, napoli/comune/utilizzo-materiale-scavo-fuori-sito]
answers:
  descrizione: PROVA NON INVIARE - CIL sempl. e terre e rocce P6
