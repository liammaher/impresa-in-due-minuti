# Taking over a bakery (SCIA di subingresso in attività di panificazione), as gen.py writes its steps
# file from the batch crawl (catalogue/F839/sections/suap-004-subentrare-nell-esercizio-dell-attivita.json),
# for the bakery rehearsal's made-up ditta individuale (rehearsals/panificio-fittizio/fixture.json)
# taking over an existing bakery at via Foria 120 by a notary's sale. Its own sections were written
# from the crawl's text (no national schema for the bakery): the title to the premises, how and from
# when the business changes hands, whom from, the TARI declaration, the ovens, what else it sells, the
# production manager (the titolare), fire prevention (outside DPR 151/2011). The library's rules table
# has no bakery yet, so no `rules:`.
procedure: napoli/comune/subingresso-attivita-commerciale
title: "SCIA: subingresso in un panificio, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-004-subentrare-nell-esercizio-dell-attivita
subject: impresa
operation: Subentrare nell'esercizio dell'attività
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
# The payment and attachments screens: its slots read on a filled draft (2026-11-10).
after: [Pagamento degli oneri, Gestione degli allegati]
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Panificio], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Subentrare nell'esercizio dell'attività"], confirm: CONFERMA}
  - {screen: Scelta interventi eventuali, confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per il panificio? Spunta tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "subingresso {{business.denominazione}}"}
  caldaia: {group: extras, type: yes_no, item: "Forni o riscaldamento sopra i 116 kW, o che bruciano combustibile solido o liquido", why: "Si aggiunge la prevenzione incendi (DPR 151/2011): un caso che non preparo ancora."}
  farina: {group: extras, type: yes_no, item: "Più di 300 kg di farina al giorno", why: "Si aggiunge la prevenzione incendi (DPR 151/2011): un caso che non preparo ancora."}
  altra_attivita: {group: extras, type: yes_no, item: "Un'altra attività negli stessi locali, oltre al panificio e al suo negozio", why: "Le sue caselle (l'altro titolo) non le preparo ancora."}
  ritorno_disponibilita: {group: extras, type: yes_no, item: "L'attività torna al proprietario alla fine di un affitto (ritorno in disponibilità)", why: "Le caselle di quella causa non le preparo ancora."}
  diritti_euro: {type: number, question: "I diritti SUAP in euro (la riga della tabella 2026 per il subingresso di un panificio: controllala)"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta tu le dichiarazioni: consapevolezza (artt. 46-47), informativa privacy, antimafia (D.Lgs. 159/2011), le regole del Comune (Regolamenti del Comune), tasse comunali, art. 75 DPR 445/2000"
  - "L'aggiornamento della registrazione ai sensi del Reg. 852/2004 per il nuovo titolare si presenta a parte (la casella degli interventi per la notifica nella procedura guidata non la preparo ancora)"
  - "Paga i diritti di segreteria (€ {{ask.diritti_euro}}) con pagoPA nella schermata di pagamento"
  - "Allega quanto chiede la schermata degli allegati dopo aver spuntato le dichiarazioni"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
  - {when: "{{ask.caldaia|not}}", else: "Forni o riscaldamento sopra i 116 kW, o a combustibile solido o liquido, per ora non li preparo: aggiungono la prevenzione incendi."}
  - {when: "{{ask.farina|not}}", else: "Più di 300 kg di farina al giorno per ora non li preparo: aggiungono la prevenzione incendi."}
  - {when: "{{ask.altra_attivita|not}}", else: "Un'altra attività negli stessi locali per ora non la preparo."}
  - {when: "{{ask.ritorno_disponibilita|not}}", else: "Un'attività che torna al proprietario alla fine di un affitto per ora non la preparo."}
  - {when: "{{ask.responsabile_produzione_altro|not}}", else: "Un responsabile della produzione diverso dal titolare per ora non lo preparo sul modulo del subingresso."}
