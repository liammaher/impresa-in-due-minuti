# Whether the plugin ships Impresa in un minuto's archive (pvault). Flip it and rebuild; nothing else changes.
#
# false: the plugin carries no setup skill and no installer, its texts say nothing of an archive,
#        and a release builds no pvault (release.yml). A job's details live in files in the
#        tecnico's folder of jobs, and still reach the portal sealed under the on-screen code.
# true:  the setup skill installs pvault (checked against the release's checksums), and each
#        pratica reads its details from the archive with one Touch ID or Windows Hello approval.
#
# The skills' and README's parts for each are marked <!-- vault --> ... <!-- /vault --> and
# <!-- no-vault --> ... <!-- /no-vault -->; build.py keeps one set and drops the markers.
vault: false

# Whether the skill's launcher (skills/pratiche/py) may fetch a Python where the computer
# has none.
#
# false: it uses the computer's own Python 3.9+ only; where there is none it says how to install
#        one (on a Mac it opens Apple's installer of the developer tools, which bring Python) and
#        stops. Nothing in the plugin downloads anything.
# true:  where there is none it downloads python-build-standalone 3.12 once (about 25 MB, checked
#        by its pinned SHA-256) into ~/.cache/impresa-in-un-minuto.
#
# Its parts are <!-- download --> / <!-- no-download --> in the texts, `# <download>` /
# `# <no-download>` in the launcher.
python_download: false

# The sportelli whose pratiche the plugin carries. Impresa in un minuto carries the SUE's: the steps files
# of its rehearsals, its rules tables (rules/<sportello>-*.yaml), and the library's procedures
# those name. The SUAP's rehearsals and tables stay in the repo, unchanged, out of the plugin.
sportelli: [sue]
