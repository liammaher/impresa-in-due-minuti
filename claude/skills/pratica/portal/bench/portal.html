<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>Pratica (portale finto)</title></head>
<body>
<!-- A fake portal for test_inpage.py: two sections in a dynaForm-style form, upload boxes
     that send a file as soon as it's chosen, a Salva that stores every text box on the
     server, and what was stored shown again on every load. ?banner=1 puts a consent banner
     over everything; ?rename=1 renames the second section's label, as a portal update would;
     ?fade=1 opens a suggestion list over Impresa esecutrice as Dati tecnici opens, whose
     widget's hide() fades it out slowly, as PrimeFaces 11's does; ?slot=signed (or =plain) adds
     an attachments slot the portal says is required, taking only signed files (or plain ones);
     ?off=1 switches Impresa esecutrice off, greyed until a choice the steps don't make; ?deroga=1
     adds two tick boxes, each with a box of no text of its own beside it, titled "(specificare)",
     as the permesso's deroga draws them: the cell before it is the tick box's label; ?req=1 adds
     an empty box the portal flags, its title and cell "Il valore è obbligatorio"; ?offradio=1 adds
     a radio drawn as PrimeFaces draws one, greyed (its input disabled, its drawn box ignoring the
     mouse), as the permesso's opere a scomputo until "a titolo oneroso"; ?liste=1 adds two lists
     to Dati tecnici, each with its own "+" after its rows (the CILA relazione's filings, then its
     assents): a "+" adds a row to its own list, a row after the first has no text of its own,
     and the rows saved come back on a load. -->
<nav>
  <a class="linkmenu" href="#allega">Allega documenti</a>
  <a class="linkmenu" href="#tecnici">Dati tecnici</a>
</nav>
<form id="form">
  <h1 id="allega">Allega documenti</h1>
  <table>
    <tr><td><label class="labelDynaFormControl">Denominazione</label></td>
        <td><input type="text" id="form:r0c1:dynaForm:den_txt"></td></tr>
    <tr><td><label class="labelDynaFormControl">Planimetria quotata</label></td>
        <td><input type="file" id="form:r1c1:dynaForm:planimetria_input"></td></tr>
    <tr><td><label class="labelDynaFormControl">Ricevuta ASL</label></td>
        <td><input type="file" id="form:r2c1:dynaForm:ricevuta_input"></td></tr>
  </table>
  <h2>File caricati</h2>
  <ul id="uploaded"></ul>
  <h1 id="tecnici">Dati tecnici</h1>
  <table>
    <tr><td><label class="labelDynaFormControl" id="impresa-label">Impresa esecutrice</label></td>
        <td><input type="text" id="form:r4c1:dynaForm:impresa_txt"></td></tr>
  </table>
  <button type="button" id="salva">Salva</button>
  <button type="button" id="invia">Firma e invio</button>
  <div id="saved"></div>
</form>
<div id="consenso" hidden style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10">
  <div style="background:#fff;margin:30vh auto;padding:16px;width:320px">
    Questo sito usa cookie. <button type="button">Accetta tutti</button> <button type="button">Rifiuta</button>
  </div>
</div>
<script>
if (location.search.includes("banner=1")) document.getElementById("consenso").hidden = false;
// By its label's row: the server's ?flaky=1 cut checks that box's id is gone from the whole page.
if (location.search.includes("off=1")) document.getElementById("impresa-label").closest("tr").querySelector("input").disabled = true;
if (location.search.includes("rename=1")) document.getElementById("impresa-label").textContent = "Ditta esecutrice";
if (location.search.includes("deroga=1")) {
  for (const [k, label] of [["dens", "alla densità edilizia"], ["alt", "all'altezza"]]) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><input type="checkbox" id="form:r5c1:dynaForm:${k}_chk"> ${label}</td>` +
      `<td><input type="text" title="(specificare)" id="form:r5c2:dynaForm:${k}_txt"></td>`;
    document.querySelector("#tecnici + table").tBodies[0].append(tr);
  }
}
if (location.search.includes("offradio=1")) {
  const tr = document.createElement("tr");
  tr.innerHTML = '<td><div id="form:r7c1:dynaForm:scomputo:opt" title="opt"><div class="ui-radiobutton ui-state-disabled">' +
    '<div style="position:absolute;width:1px;height:1px;overflow:hidden"><input type="radio" disabled ' +
    'id="form:r7c1:dynaForm:scomputo:radio:1_clone" name="scomputo"></div><div class="ui-radiobutton-box ui-state-disabled" ' +
    'style="display:inline-block;width:14px;height:14px;border:1px solid #888;pointer-events:none"></div></div>' +
    '<label>NO</label></div></td>';
  document.querySelector("#tecnici + table").tBodies[0].append(tr);
}
if (location.search.includes("req=1")) {
  const tr = document.createElement("tr");
  tr.innerHTML = '<td><label class="labelDynaFormControl">Ragione sociale</label></td><td><input type="text" ' +
    'id="form:r6c1:dynaForm:rs_txt" title="Il valore è obbligatorio"><span class="error-message-text">Il valore è obbligatorio</span></td>';
  document.querySelector("#tecnici + table").tBodies[0].append(tr);
}
const slot = new URLSearchParams(location.search).get("slot");
if (slot) {
  const tr = document.createElement("tr");
  tr.innerHTML = '<td><label class="labelDynaFormControl">Procura speciale</label></td><td><div id="form:r3c1:dynaForm:procura">' +
    '<input type="file" id="form:r3c1:dynaForm:procura_input"> Tipologie ammesse: ' + (slot === "signed" ? "jpg.p7m;pdf.p7m" : "pdf;pdf.p7m") +
    ' <span class="error-message-text">Il valore è obbligatorio</span></div></td>';
  document.querySelector("#allega + table").tBodies[0].append(tr);
}
if (location.search.includes("fade=1")) {
  const panel = document.createElement("div");
  panel.className = "ui-autocomplete-panel";
  panel.style.cssText = "position:absolute;display:none;background:#fff;border:1px solid #888;z-index:5";
  panel.innerHTML = "<ul><li class='ui-autocomplete-item'>VIA ESEMPIO</li></ul>";
  document.body.append(panel);
  window.PrimeFaces = { widgets: { via: { panel: [panel], hide() { setTimeout(() => { panel.style.display = "none"; }, 3000); } } } };
  document.querySelector('a[href="#tecnici"]').addEventListener("click", () => {
    const r = document.getElementById("impresa-label").closest("tr").querySelector("input").getBoundingClientRect();
    Object.assign(panel.style, { display: "block", left: `${r.left + scrollX - 10}px`, top: `${r.top + scrollY - 10}px`,
      width: `${r.width + 20}px`, height: `${r.height + 20}px` });
  });
}
// ?decl=1: a declarations section (its link in the menu, its text and a tick box in li#corrente
// as the real portal shows the open section) and a Visualizza anteprima button. ?decl=1&stuck=1:
// the declarations link opens nothing, as when the portal doesn't answer.
if (location.search.includes("decl=1")) {
  const cur = document.createElement("ul");
  cur.innerHTML = "<li id='corrente'></li>";
  document.body.append(cur);
  const link = document.createElement("a");
  link.className = "linkmenu";
  link.href = "#consapevolezza";
  link.textContent = "Dichiarazione di consapevolezza ex artt. 46 e 47 DPR 445/2000";
  document.querySelector("nav").append(link);
  const open = (a) => {
    const li = document.getElementById("corrente");
    li.textContent = a.textContent;
    if (a === link) {
      li.insertAdjacentHTML("beforeend", "<p>Il sottoscritto, consapevole delle sanzioni penali previste dall'art. 76\n" +
        "del D.P.R. 445/2000, dichiara quanto segue.</p><label><input type='checkbox' id='form:r9c1:dynaForm:consap_chk'" +
        (location.search.includes("ticked=1") ? " checked" : "") + "> Per presa visione</label>" +
        // As PrimeFaces draws a radio: the real input hidden, its clone in the visible button, the
        // label beside it in a titled div; and the section's own Salva button.
        "<div title='opt'><span><input type='radio' id='form:r9c1:dynaForm:sorv:radio:0' name='sorv'></span>" +
        "<div class='ui-radiobutton'><input type='radio' id='form:r9c1:dynaForm:sorv:radio:0_clone' name='sorv'></div>" +
        "<label>che i locali possiedono i requisiti di sorvegliabilità</label></div><button type='button'>SALVA</button>");
    }
  };
  for (const a of document.querySelectorAll("a.linkmenu")) {
    a.addEventListener("click", () => { if (!(a === link && location.search.includes("stuck=1"))) open(a); });
  }
  const preview = document.createElement("button");
  preview.type = "button";
  preview.textContent = "VISUALIZZA ANTEPRIMA";
  preview.addEventListener("click", () => window.open("/anteprima.pdf"));
  document.getElementById("form").append(preview);
}
const liste = {};
if (location.search.includes("liste=1")) {
  const div = document.createElement("div");
  div.id = "form:r6c1:dynaForm:liste";
  document.querySelector("#tecnici + table").after(div);
  for (const [k, label] of [["com", "Comunicazioni"], ["atto", "Tipologia di atto"]]) {
    const t = document.createElement("table");
    div.append(t);
    // As the portal draws them: the first row's box is titled by the column, the later rows'
    // have no text of their own and read the header above.
    liste[k] = () => {
      const tr = t.insertRow();
      const first = t.rows.length === 1;
      tr.innerHTML = `<td>${first ? `<label class="labelDynaFormControl">${label}</label>` : ""}</td>` +
        `<td><input type="text"${first ? ` title="${label}"` : ""} id="form:r6c1:dynaForm:${k}${t.rows.length}_txt"></td>`;
    };
    liste[k]();
    const plus = document.createElement("button");
    plus.type = "button";
    plus.textContent = "+";
    plus.addEventListener("click", liste[k]);
    div.append(plus);
  }
}
const texts = () => [...document.querySelectorAll("input[type=text]")];
const list = (name) => {
  const li = document.createElement("li");
  li.textContent = name;
  document.getElementById("uploaded").append(li);
};
fetch("/state").then((r) => r.json()).then((st) => {
  for (const id of Object.keys(st.fields)) {
    const m = id.match(/dynaForm:(com|atto)(\d+)_txt$/);
    while (m && liste[m[1]] && !document.getElementById(id)) liste[m[1]]();
  }
  for (const t of texts()) t.value = st.fields[t.id] || "";
  for (const c of document.querySelectorAll("input[type=checkbox]")) c.checked = st.fields[c.id] === "on";
  st.files.forEach(list);
  // As the portal does, a slot's cell names the file in it.
  for (const [id, name] of Object.entries(st.boxes || {})) {
    const box = document.getElementById(id);
    if (box) box.after(" " + name + " Rimuovi");
  }
});
for (const box of document.querySelectorAll("input[type=file]")) {
  box.addEventListener("change", () => {
    const f = box.files[0];
    if (!f) return;
    const fd = new FormData();
    fd.append(box.id, f, f.name);
    fetch("/upload", { method: "POST", body: fd }).then(() => { list(f.name); box.value = ""; box.after(" " + f.name + " Rimuovi"); });
  });
}
document.getElementById("salva").addEventListener("click", () => {
  const fields = Object.fromEntries(texts().map((t) => [t.id, t.value]));
  for (const c of document.querySelectorAll("input[type=checkbox]")) if (c.checked) fields[c.id] = "on";
  fetch("/save", { method: "POST", body: JSON.stringify({ fields }) })
    .then(() => { document.getElementById("saved").textContent = "Dati salvati"; });
});
document.getElementById("invia").addEventListener("click", () => fetch("/sent", { method: "POST" }));
</script>
</body>
</html>
