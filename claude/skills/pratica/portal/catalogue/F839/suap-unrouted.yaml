# SUAP rehearsals that route.py does not reach, and why (bench/test_route.py holds this list to the facts: every
# SUAP recipe is reached by some case of the rules table, or is named here with a reason; a recipe that becomes
# reached must leave the list). Written 2026-11-12. A reason is a rule of the table (a refusal) or something
# the library lacks (a procedure with sourced claims): never a guess about the portal.
