reasons:
  parere-refused:
    verdict: refused
    status: verified
    why: "Napoli's Comune doesn't issue the exemption parere (direttiva sul paesaggio, D.D. 154/2024 § 3.2: the technician asseverates the exclusion in the building pratica): the rules table refuses it, so it goes with nothing."
    cites:
      - {procedure: napoli/comune/parere-esonero-autorizzazione-paesaggistica, source: direttiva-paesaggio}
  piano-apart:
    verdict: apart
    status: verified
    why: "The piano di utilizzo goes to the VIA authority (in Campania the Regione's Staff Valutazioni Ambientali) before the VIA ends (art. 9 DPR 120/2017), never in a SUE pratica."
    cites:
      - {procedure: napoli/valutazioni-ambientali/piano-utilizzo-terre-rocce, source: dpr120-art9}
      - {procedure: napoli/valutazioni-ambientali/piano-utilizzo-terre-rocce, source: procedurale-via-campania}
  piano-or-dichiarazione:
    verdict: never
    status: verified
    why: "A site takes one or the other: the dichiarazione for sites up to 6,000 m³ or larger ones with no VIA or AIA (artt. 21-22 DPR 120/2017), the piano for larger ones under VIA or AIA (art. 9)."
    cites:
      - {procedure: napoli/comune/utilizzo-materiale-scavo-fuori-sito, source: dpr120-art2}
      - {procedure: napoli/comune/utilizzo-materiale-scavo-fuori-sito, source: dpr120-art21}
      - {procedure: napoli/comune/utilizzo-materiale-scavo-fuori-sito, source: dpr120-art22}
  dau-after:
    verdict: apart
    status: verified
    why: "The DAU attests the soil's use once it is over, within the dichiarazione's or the piano's validity (art. 7 DPR 120/2017): it comes after the title, the dichiarazione and the start of works, never with them."
    cites:
      - {procedure: napoli/comune/dichiarazione-avvenuto-utilizzo-terre, source: dpr120-art7}
  dau-at-the-end:
    verdict: together
    status: reading
    why: "The DAU is due when the soil's use is over (art. 7 DPR 120/2017), and the end of works (art. 23 c. 7 DPR 380/2001) or the agibilità (art. 24) is the filing at that moment: one pratica carries both. The law doesn't require them together."
    cites:
      - {procedure: napoli/comune/dichiarazione-avvenuto-utilizzo-terre, source: dpr120-art7}
      - {procedure: napoli/comune/fine-lavori, source: dpr380-art23}
      - {procedure: napoli/comune/agibilita, source: dpr380-art24}
  dau-no-tie:
    verdict: each_alone
    status: reading
    why: "No rule ties the DAU (art. 7 DPR 120/2017) to this filing: each goes alone, and each alone is mapped."
    cites:
      - {procedure: napoli/comune/dichiarazione-avvenuto-utilizzo-terre, source: dpr120-art7}
  dichiarazione-with-title:
    verdict: together
    status: verified
    why: "The dichiarazione goes at least 15 days before the excavation (art. 21 c. 1 DPR 120/2017), and the SUE takes it in the title's pratica (the rules table, terre-rocce-dichiarazione)."
    cites:
      - {procedure: napoli/comune/utilizzo-materiale-scavo-fuori-sito, source: dpr120-art21}
      - {procedure: napoli/comune/utilizzo-materiale-scavo-fuori-sito, source: portale-sue-operazioni}
  dichiarazione-with-start:
    verdict: together
    status: reading
    why: "The dichiarazione goes at least 15 days before the excavation (art. 21 c. 1 DPR 120/2017), and a permesso's works start with the comunicazione di inizio lavori (art. 15 DPR 380/2001): a dichiarazione not filed with the permesso goes with the start of works."
    cites:
      - {procedure: napoli/comune/utilizzo-materiale-scavo-fuori-sito, source: dpr120-art21}
      - {procedure: napoli/comune/inizio-lavori-pdc, source: dpr380-art15}
  dichiarazione-no-title:
    verdict: together
    status: reading
    why: "Works that need no building title in a protected area take the landscape procedure alone (artt. 146, 149 D.Lgs. 42/2004); if they dig and the soil leaves the site, the dichiarazione is due before the excavation too (art. 21 c. 1 DPR 120/2017): one pratica carries both."
    cites:
      - {procedure: napoli/comune/autorizzazione-paesaggistica-semplificata, source: dlgs42-art149}
      - {procedure: napoli/comune/utilizzo-materiale-scavo-fuori-sito, source: dpr120-art21}
  dichiarazione-before:
    verdict: never
    status: verified
    why: "The dichiarazione precedes the excavation (art. 21 c. 1 DPR 120/2017): never with works that are over or already done."
    cites:
      - {procedure: napoli/comune/utilizzo-materiale-scavo-fuori-sito, source: dpr120-art21}
  dichiarazione-no-tie:
    verdict: each_alone
    status: reading
    why: "No rule ties the dichiarazione (art. 21 DPR 120/2017) to this communication about a title held: it goes with the title or the start of works, or alone; each alone is mapped."
    cites:
      - {procedure: napoli/comune/utilizzo-materiale-scavo-fuori-sito, source: dpr120-art21}
  authorization-with-title:
    verdict: together
    status: verified
    why: "The landscape authorization goes in the title's pratica (the rules table: the title with its semplificata or ordinaria)."
    cites:
      - {procedure: napoli/comune/autorizzazione-paesaggistica-semplificata, source: portale-sue-operazioni}
      - {procedure: napoli/comune/autorizzazione-paesaggistica-ordinaria, source: portale-sue-operazioni}
  authorization-keeps-pace:
    verdict: together
    status: reading
    why: "The landscape authorization lasts five years from the building title's efficacy, plus one to finish works begun (art. 146 c. 4 D.Lgs. 42/2004); a new title or an extension of a title's terms doesn't extend it. When the works' new term passes the authorization's, the filing that sets it carries what keeps the authorization in force: its art. 10-septies extension, before it expires; its renewal (art. 7 DPR 31/2017), expired no more than a year, the works unchanged and not or only partly done; or a new authorization, past that."
    cites:
      - {procedure: napoli/comune/proroga-autorizzazione-paesaggistica, source: dlgs42-art146}
      - {procedure: napoli/comune/proroga-autorizzazione-paesaggistica, source: dl21-art10septies}
      - {procedure: napoli/comune/rinnovo-autorizzazione-paesaggistica-semplificata, source: dpr31-art7}
  accertamento-with-permesso:
    verdict: together
    status: verified
    why: "Works done in a protected area that needed a permesso: the permesso in sanatoria and the accertamento in one pratica (the rules table, accertamento-permesso-sanatoria)."
    cites:
      - {procedure: napoli/comune/accertamento-compatibilita-paesaggistica, source: dlgs42-art167}
  accertamento-rules:
    verdict: rules
    status: verified
    why: "The rules table decides every case of works done in a protected area (the SCIA in sanatoria takes the compatibility within itself, art. 36-bis c. 4 DPR 380/2001; works with no title take the accertamento alone), and none sends this title with the accertamento."
    cites:
      - {procedure: napoli/comune/accertamento-compatibilita-paesaggistica, source: dlgs42-art167}
  accertamento-first:
    verdict: apart
    status: reading
    why: "Works done against the landscape rules are regularized by the accertamento (art. 167 D.Lgs. 42/2004) with the building sanatoria they need (the rules table), before any communication about the title held: an extension, the end of works or the agibilità presume the works lawful."
    cites:
      - {procedure: napoli/comune/accertamento-compatibilita-paesaggistica, source: dlgs42-art167}
  authorization-not-a-communication:
    verdict: each_alone
    status: reading
    why: "A landscape procedure goes with the title of the works or the extension of its terms (authorization-keeps-pace), or alone; this communication about a title held (its firm, its direttore dei lavori, its holder, its start or end) carries none. Each alone is mapped."
    cites:
      - {procedure: napoli/comune/proroga-autorizzazione-paesaggistica, source: dlgs42-art146}
