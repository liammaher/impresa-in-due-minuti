# Every two operations Napoli's SUE wizard accepts in one pratica (sue-wizard.json `pairs`, probed
# 2026-11-03), and whether a case files them together, from the law. bench/test_pairs.py holds it to
# the wizard (every accepted pair once) and to the rehearsals (a `together` pair's rehearsals select
# exactly those operations; none listed means it is still to map). Verdicts:
#   together    a case files both in one pratica: a steps file each (rehearsals)
#   apart       the law sends one elsewhere or at another time: each alone (or elsewhere)
#   never       no case needs both
#   refused     the law refuses one of them in Napoli
#   rules       the rules table decides the cases another way
#   each_alone  nothing ties them: each goes alone, and each alone is mapped
# A reason's status: `verified` restates the library's verified claims; `reading` is this file's reading
# of them (when two filings fall due at one moment), for an architect to confirm.
