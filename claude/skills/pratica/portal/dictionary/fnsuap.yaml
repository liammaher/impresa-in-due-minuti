      - {kind: radio, label: avere titolarità esclusiva all'esecuzione dell'intervento}
  - section: Caratteristiche del manufatto da installare
    fields:
      - {kind: select, label: Tipologia, value: "insegna d'esercizio"}
      - {kind: text, label: numero progressivo del mezzo pubblicitario, value: "1"}
      - {kind: text, label: precisare in caso di insegna di esercizio o altro, value: "{{ask.insegna_descrizione}}"}
      - {kind: text, label: larghezza (mt), value: "{{ask.insegna_larghezza_m}}"}
      - {kind: text, label: altezza (mt), value: "{{ask.insegna_altezza_m}}"}
      - {kind: text, label: superficie (mq), value: "{{ask.insegna_superficie_mq}}"}
      - {kind: radio, label: si, nth: 1, when: "{{ask.insegna_monofacciale}}"}
      - {kind: radio, label: "no", nth: 1, when: "{{ask.insegna_monofacciale|not}}"}
      - {kind: radio, label: si, nth: 2, when: "{{ask.insegna_monofacciale|not}}"}
      - {kind: radio, label: "no", nth: 2, when: "{{ask.insegna_monofacciale}}"}
      - {kind: radio, label: si, nth: 3, when: "{{ask.insegna_luce|is_opaca}}"}
      - {kind: radio, label: "no", nth: 3, when: "{{ask.insegna_luce|is_opaca|not}}"}
      - {kind: radio, label: si, nth: 4, when: "{{ask.insegna_luce|is_luminosa}}"}
      - {kind: radio, label: "no", nth: 4, when: "{{ask.insegna_luce|is_luminosa|not}}"}
      - {kind: radio, label: si, nth: 5, when: "{{ask.insegna_luce|is_illuminata}}"}
      - {kind: radio, label: "no", nth: 5, when: "{{ask.insegna_luce|is_illuminata|not}}"}
      - {kind: radio, label: "no", nth: 6}
      - {kind: radio, label: "no", nth: 7}
      - {kind: radio, label: "no", nth: 8}
      - {kind: textarea, label: Caratteri restanti, value: "{{ask.insegna_testo}}"}
  - section: dichiarazione relativa al vincolo ambientale
    fields:
      - {kind: radio, label: Non soggetta a tutela ambientale}
  - section: dichiarazione relativa al vincolo monumentale
    fields:
      - {kind: radio, label: Non soggetta a tutela monumentale}
  - section: DICHIARAZIONE RELATIVA alle opere in cemento armato
    fields:
      - {kind: radio, label: non prevede la realizzazione di opere di conglomerato}
  - section: luogo dell'installazione
    leave: [Coordinate GPS]
    fields:
      - {kind: select, label: Tipologia, value: "insegna d'esercizio"}
      - {kind: text, label: Num. progressivo, value: "1"}
      - {kind: text, label: Specificare (solo nel caso, value: "{{ask.insegna_descrizione}}"}
