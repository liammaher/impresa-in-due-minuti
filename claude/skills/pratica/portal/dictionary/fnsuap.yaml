  # Imposta di bollo, 16 € on the application and 16 € on the provvedimento the Comune issues:
  # paid on pagoPA (the payment is the person's, after sending) or with two marche, each its
  # serial number and date (the marche are then cancelled and kept by the person). The second
  # marca's line, which "per l'autorizzazione" opens below it, copies the first's: its serial
  # box is titled "numero seriale (1)" too (read on the portal 2026-10-30), so crawl.js took it
  # for the first's, moved. Both lines go by label, the first then the second (nth).
  # A client exempt (a reason from the dropdown "esentati" opens) or authorized to pay virtually
  # (with the authorization, uploaded here) is a body: an ETS, a public body, a sports club, a
  # party; a SUE client can be one since company and condominium clients (`c:` business.*). The
  # ways to pay come first in each `when`, so each radio keeps its own branch.
  # "Only the 16 € for the application" (silenzio assenso) takes one of its dropdown's procedures:
  # fire brigade, emissions, renewables, hotels, drains, public land, the structural deposits
  # (the Genio Civile's in Campania). None is one of Napoli's 27 SUE operations (sue-wizard.json).
  - section: Dichiarazione relativa all'assolvimento dell'imposta di bollo
    aliases: [dichiarazione relativa all'imposta di bollo]
    supports:
      - {if: "{{ask.bollo_esenzione|is_onlus}}", when: "{{ask.bollo_onlus_esercizio}}", else: "L'esenzione ONLUS è cessata con il regime ONLUS il 1° gennaio 2026, salvo per un periodo d'imposta iniziato prima di tale data: un'ex ONLUS iscritta al RUNTS è esente come ets."}
    suap_only: ["Solo la marca da €16,00 per la domanda; non è richiesta alcuna marca da bollo per l'autorizzazione", "Non è richiesta alcuna marca da bollo per l'autorizzazione perché il procedimento può concludersi con il silenzio assenso"]
    fields:
      - {kind: radio, label: "Il pagamento è dovuto e si intende assolvere l'obbligo tramite il circuito digitale pagoPA", when: "{{ask.bollo_marche|not}} {{ask.bollo_esenzione|is_no}}"}
      - {kind: radio, label: "Due marche da €16,00 ciascuna", when: "{{ask.bollo_marche|not}} {{ask.bollo_esenzione|is_no}}"}
      - {kind: radio, label: "Il pagamento è dovuto e si intende assolvere l'obbligo con marche da bollo", when: "{{ask.bollo_marche}} {{ask.bollo_esenzione|is_no}}"}
      # Ticked before the serials and dates: it moves them down.
      - {kind: radio, label: "Marca da €16,00 per l'autorizzazione", when: "{{ask.bollo_marche}} {{ask.bollo_esenzione|is_no}}"}
      - {kind: text, label: numero seriale (1), nth: 1, value: "{{ask.bollo_seriale}}", by_label: true, when: "{{ask.bollo_marche}} {{ask.bollo_esenzione|is_no}}"}
      - {kind: date, label: data, nth: 1, value: "{{ask.bollo_data|date_it}}", by_label: true, when: "{{ask.bollo_marche}} {{ask.bollo_esenzione|is_no}}"}
      - {kind: text, label: numero seriale (1), nth: 2, value: "{{ask.bollo_seriale_2}}", on_page: true, when: "{{ask.bollo_marche}} {{ask.bollo_esenzione|is_no}}"}
      - {kind: date, label: data, nth: 2, value: "{{ask.bollo_data_2|date_it}}", on_page: true, when: "{{ask.bollo_marche}} {{ask.bollo_esenzione|is_no}}"}
      - {kind: radio, label: "Per gli Enti autorizzati, l'imposta di bollo è assolta in modo virtuale", when: "{{ask.bollo_esenzione|is_virtuale}}"}
      - {kind: file, label: "dichiarazione relativa all'assolvimento dell'imposta di bollo", value: "{{ask.bollo_virtuale_autorizzazione}}", when: "{{ask.bollo_esenzione|is_virtuale}}"}
      - {kind: radio, label: "Il pagamento non è dovuto poiché esentati", when: "{{ask.bollo_esenzione|bollo_esente}}"}
      - {kind: select, label: per la seguente motivazione, value: "{{ask.bollo_esenzione|bollo_motivo}}", when: "{{ask.bollo_esenzione|bollo_esente}}"}

  # Agibilità (SCA): the title the works ran under, the fine lavori, what the segnalazione is
