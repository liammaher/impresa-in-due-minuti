      - {kind: text, label: "Via, Piazza", value: "{{business.sede_legale_indirizzo|upper}}", when: "{{ask.progettista_altro|not}}"}
      - {kind: text, label: "N.", value: "{{business.sede_legale_civico}}", when: "{{ask.progettista_altro|not}}"}
