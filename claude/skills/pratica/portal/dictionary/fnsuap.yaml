# What goes in each field of the impresainungiorno front office (fnsuap: the SUAP and the SUE),
# by section and label, for gen.py. A section here serves every pratica that has it: the CILA,
# the SCIA and the fine lavori share the Scheda anagrafica, the procuratore, the domicilio and
# the diritti. Ids are not here: they come from each pratica's crawl (catalogue/<comune>/sections).
#
# A field: kind and label (the start of one of its first texts on the page: its own cell, the
# row above, the cell to its left, as inpage.js reads them), `nth` when several share the label,
# the value (vault fields by role, {{ask.x}} for pre-flight's questions) and `when`; an entry's
# `branches` repeats its boxes once per condition of a first choice that renumbers them. A radio or a
# checkbox listed is ticked, and what it opens is found in the crawl. `via: <option>` is a field
# a templated dropdown opens only on that option (its `when` says when). `leave:` names what the
# section shows that stays empty; `omit:` a section that is the person's alone; `plus:` why a "+"
# its crawl saw is no list here (`kind: each` maps one; test_gen holds every crawled "+"
# to one of the two: the co-holders' "+" was crawled and unread for a week; a block's asks are
# templates, `#N` "" in the first, so `pdc#N_protocollo` keeps an older single-title ask,
# `pdc_protocollo`, as its first block and the existing cases' answers stand). `kind: tick`
# is a radio in one pratica and a checkbox in another; `if_present` a field only some pratiche
# show; `on_page` one the crawl can't see (shown by two choices together), found by label on
# the page; `by_label` one the crawl sees but whose id another answer moves, found the same way;
# `anchor`/`block` a field inside the block that starts at another field, and an entry's `shift`
# ({when, anchor}) a block that choice opens above the others of `anchor`; `slot` on a "si allega"
# box, what it adds on Allega documenti as read on the portal (gen.py `unslotted`). A `when`'s
# words gate each other in order: pre-flight asks a later one only once the earlier hold.
# A `when` has no "or": `|in_<a>__<b>` is true for any of those answers; two fields on one box,
# each with its own `when`, tick it under either (a box ticked twice under one `when` is once).
# A `when`'s first term is its branch: a box a choice opens is found only in the state that
# choice left, so it starts with that choice's first term (h1's si/no under the director's tick).
# An ask's `default` answers it silently: only where no answer can be a wrong statement (a
# blank optional date, the bollo's payment method, Napoli's own constants). A fact of the case,
# however usual, is `propose`d: pre-flight shows it for the person to confirm.
# `aliases:` are other forms' names for the same section: the entry's fields, `supports` and
# `law` reach each of them, so a refusal only one form needs goes in that form's recipe (the
# SCIA's excavated earth over 6000 m³, which only its form lacks a line for, 2026-11-02). `law:`
# names boxes the law closes to new cases (the piano casa, l.r. 19/2009; a repealed rule, the
# SCIA's DM 161/2012 line): a case that takes one is refused as the law's. `defect:` names, by
# defects.yaml id, the boxes of a case a portal defect blocks (the recipe refuses the case with it).
# `made_up:` on a box says why made-up data can't pass it (the portal checks it against a real
# register): pre-flight --made-up warns, so a rehearsal's stop or the portal's warning there (the
# run's `alerts`) isn't read as a regression. `made_up_stops: true` where the portal refuses to save
# it (not just flags it): pre-flight lists it in `made_up_stops`, and bench/rerun.py won't send the case.
#
# Roles (answers.json "people"): no prefix and `t:` are the studio's own (the business and its
# titolare, the architect), `c:` the client (a person, or a company or condominium with
# business.*: its property and procura are its own), `cr:` the person declaring for a client
# company or condominium (its legale rappresentante or administrator), `o:` the owner company, `r:` its legale
# rappresentante, `f1:`, `f2:`, `f3:` ... the firms, `s:` the structural designer, `d:` a direttore dei
# lavori who isn't the architect, `p:` the architectural designer when it isn't the architect
# presenting the pratica, `a:`/`a2:`/`a3:` other technicians appointed for the works
# and `ad:`/`ad2:`/`ad3:` the firm each is employed by.

# Yes/no asks with a `group` are asked as one checklist (`item`), the answer the list of
# items that apply.
groups:
  audiovisivi:
    question: "Cosa farà con film o musica su dischi o nastri? Spunti tutte le voci che valgono."
  alcolici:
    question: "Quali prodotti alcolici venderà? Spunti tutte le voci che valgono."
  variazioni:
    question: "Cosa è cambiato? Spunti tutte le voci che valgono."
  attivita_852:
    question: "Che cosa fa l'attività alimentare? Spunti tutte le voci che valgono."
  allegato_b:
    question: "In quali voci dell'Allegato B del DPR 31/2017 rientrano i lavori? Spunti tutte quelle che valgono."
  cila_interventi:
    question: "Quali sono i lavori, per la relazione tecnica della CILA? Spunti tutte le voci che valgono."
  tolleranze_tipi:
    question: "Quali tolleranze costruttive dichiara la relazione? Spunti tutte quelle che valgono."
  fasce_funzionali:
    question: "In quali fasce di rispetto ricade l'immobile? Spunti tutte quelle che valgono."
  barriere_requisiti:
    question: "Quali requisiti della normativa sulle barriere architettoniche soddisfa il progetto (D.M. 236/1989)? Spunti tutti quelli che valgono."
  acustica_documenti:
    question: "Quali documenti acustici sono allegati (art. 8 L. 447/1995, art. 4 DPR 227/2011)? Spunti tutti quelli che valgono."
  precedenti:
    question: "Quali titoli edilizi o pratiche costituiscono lo stato legittimo dell'edificio (art. 9-bis c. 1-bis DPR 380/2001: quello che lo ha costruito o che per ultimo lo ha interessato per intero, e quelli parziali successivi)? Spunti tutti quelli che valgono. Il modulo ha una voce per ciascun tipo: un secondo titolo di un tipo già spuntato (due DIA) va in \"Un altro titolo o pratica\"."
  prova_documenti:
    question: "Cosa documenta lo stato originario dell'edificio? Spunti tutte le voci che valgono."
  tolleranze_precedenti:
    question: "Dove sono state rese le dichiarazioni di tolleranza costruttiva (art. 34-bis o 34-ter c. 4)? Spunti tutte quelle che valgono."
  strumenti:
    question: "Quali strumenti urbanistici, oltre al PRG, interessano l'area dell'immobile? Spunti tutti quelli che valgono."
  deroga_parametri:
    question: "Da quali limiti dello strumento urbanistico deroga il permesso (art. 14 c. 3 DPR 380/2001)? Spunti tutti quelli che valgono."
  impianti_dichiarazione:
    question: "Per quali impianti è allegata la dichiarazione di conformità o di rispondenza (DM 37/2008)? Spunti tutti quelli che valgono."
  impianti_depositato:
    question: "Per quali impianti il certificato (la dichiarazione, o il collaudo) è già depositato al Comune, così che il modulo ne riporta invece il numero di protocollo (P.G.)? Spunti tutti quelli che valgono."
  impianti_collaudo:
    question: "Quali impianti hanno un collaudo, dove è richiesto (quello di un ascensore, di un impianto antincendio, ...)? Spunti tutti quelli che valgono."
  impianti_atto_notorio:
    question: "Quali impianti sono certificati da un atto di notorietà (art. 6 DPR 392/1994: impianti preesistenti adeguati alla L. 46/1990)? Spunti tutti quelli che valgono."

asks:
  descrizione:
    type: text
    question: "Nome della bozza in Pratiche in bozza"
    default: "{{c:identity.last_name}}"
  titolo:
    type: text
    question: "Il titolo del committente sull'immobile, in una parola (proprietario, comproprietario, usufruttuario, amministratore di condominio, locatario, comodatario, ...)"
    propose: "{{c:immobile.titolo}}"
  # A client company or condominium (`c:` with business.*): who declares for it (`cr:`), in the
  # Scheda anagrafica's Carica, and whether it is in the Registro delle imprese when it has no REA.
  cliente_carica:
    type: choice
    question: "Che ruolo ha chi dichiara per la società o il condominio committente? legale rappresentante; amministratore unico; amministratore delegato; presidente cda (presidente del consiglio di amministrazione); amministratore di condominio (l'amministratore di un condominio)"
    options: [legale rappresentante, amministratore unico, amministratore delegato, presidente cda, amministratore di condominio]
    propose: "{{c:business.forma_giuridica|carica_proposta}}"
  cliente_registro:
    type: choice
    question: "La società committente non ha un numero REA nel suo archivio: non ancora iscritta (in corso di iscrizione nel Registro delle imprese); non necessita (mai iscritta: un condominio, un'associazione, un ente)?"
    options: [non ancora iscritta, non necessita]
    propose: "{{c:business.forma_giuridica|registro_proposto}}"
  # Whether anyone else's assent is needed (a.1 or a.2): an owner usually holds it alone, a
  # tenant or a co-owner doesn't.
  titolo_esclusivo:
    type: yes_no
    question: "Il committente ha il titolo da solo, senza altri (comproprietari, il proprietario locatore) il cui assenso sia necessario per i lavori? In caso contrario, l'altro titolare va indicato tra i soggetti della pratica come legale rappresentante della proprietà, e la sua società come società proprietaria se l'immobile appartiene a una società"
    propose: "{{ask.titolo|titolo_solo}}"
  # The other holders (a.2's rows, one each by "+"): `r:`, `r2:`, `r3:` ... in the job's people
  # (with `o:`, `o2:` ... where one is a company). One unasked while the job names no `r2:`.
  altri_titolari:
    type: number
    question: "Quanti altri titolari danno il loro assenso (comproprietari, il proprietario locatore)? Se l'immobile è di una società, conti il suo legale rappresentante"
    default: "{{r2:identity.last_name|empty|single_unit}}"
    propose: "{{r:identity.last_name,r2:identity.last_name,r3:identity.last_name,r4:identity.last_name,r5:identity.last_name,r6:identity.last_name,r7:identity.last_name,r8:identity.last_name,r9:identity.last_name|filled_count}}"
  # The building firms on site (Impresa esecutrice's blocks, one each by "+"): `f1:`, `f2:`,
  # `f3:` ... in the job's people. One unasked while the job names no `f2:`.
  imprese_quante:
    type: number
    question: "Quante imprese esecutrici lavorano in cantiere?"
    default: "{{f2:business.denominazione|empty|single_unit}}"
    propose: "{{f1:business.denominazione,f2:business.denominazione,f3:business.denominazione,f4:business.denominazione,f5:business.denominazione,f6:business.denominazione,f7:business.denominazione,f8:business.denominazione,f9:business.denominazione|filled_count}}"
  # The landscape form's technicians when the architect presenting isn't the designer: `p:`,
  # then `p2:`, `p3:` ... (one block each by "+"). One unasked while the job names no `p2:`.
  progettisti_quanti:
    type: number
    question: "Quanti tecnici indica il modulo paesaggistico?"
    default: "{{p2:identity.last_name|empty|single_unit}}"
    propose: "{{p:identity.last_name,p2:identity.last_name,p3:identity.last_name,p4:identity.last_name,p5:identity.last_name,p6:identity.last_name,p7:identity.last_name,p8:identity.last_name,p9:identity.last_name|filled_count}}"
  # A unit with a categoria in the vault is in the Catasto Fabbricati: asked only without one.
  # One per unit (catasto_terreni, catasto_terreni2 ...): each unit's own catasto.
  catasto_terreni#N:
    type: yes_no
    question: "L'unità catastale #K è censita solo al Catasto Terreni (un lotto da edificare, senza subalterno né categoria), anziché al Catasto Fabbricati?"
    default: "{{c:immobile#N.catasto_categoria|filled|not}}"
  # The cadastral units the works touch (merging or splitting flats, a whole building, a plot of
  # several particelle): the client's immobile, immobile2, immobile3 ... in the vault, one block
  # each in Dati catastali. One unasked while the vault holds no second; with one, asked.
  unita_catastali:
    type: number
    question: "Quante unità catastali indica la pratica? (quelle dello stesso catasto una dopo l'altra)"
    default: "{{c:immobile2.catasto_foglio|empty|single_unit}}"
    propose: "{{c:immobile.catasto_foglio,c:immobile2.catasto_foglio,c:immobile3.catasto_foglio,c:immobile4.catasto_foglio,c:immobile5.catasto_foglio,c:immobile6.catasto_foglio,c:immobile7.catasto_foglio,c:immobile8.catasto_foglio,c:immobile9.catasto_foglio|filled_count}}"
  # A voltura's or cambio d'intestazione's co-holders: the wizard's "ci sono cointestatari"
  # adds a section for one (`a:`), and its "+" one more each (`a2:`, `a3:` ...).
  cointestatario:
    type: yes_no
    question: "Il nuovo titolare condivide il titolo con un'altra persona (un cointestatario)? In tal caso, il cointestatario va indicato tra i soggetti della pratica"
    propose: "false"
    yours: "Nella sezione del cointestatario sono spuntate entrambe le caselle del sesso: il portale non la salva in altro modo (due gruppi obbligatori); il suo codice fiscale indica quale vale"
  # One unasked while the job names no `a2:`.
  cointestatari_quanti:
    type: number
    question: "Quanti cointestatari hanno il titolo insieme al nuovo titolare?"
    default: "{{a2:identity.last_name|empty|single_unit}}"
    propose: "{{a:identity.last_name,a2:identity.last_name,a3:identity.last_name,a4:identity.last_name,a5:identity.last_name,a6:identity.last_name,a7:identity.last_name,a8:identity.last_name,a9:identity.last_name|filled_count}}"
  parti_comuni:
    type: choice
    question: "I lavori interessano parti comuni dell'edificio? nessuna; condominio (parti comuni di un condominio); comproprieta (un edificio di più proprietari che non è un condominio, con la loro approvazione); art 1102 (parti comuni usate a spese del committente senza alterarne la destinazione, art. 1102 c.c.: non serve alcun assenso)"
    options: [nessuna, condominio, comproprieta, art 1102]
    propose: "nessuna"
  # The CILA's quadro d: works to start (d.1), under way (d.2, 333 € penalty) or done (d.3,
  # 1,000 €): art. 6-bis c. 5 DPR 380/2001.
  cila_stato:
    type: choice
    question: "I lavori sono iniziati? da iniziare (non ancora); in corso (in esecuzione: CILA tardiva con la sanzione di 333 €); realizzato (già ultimati: la sanzione di 1.000 €)"
    options: [da iniziare, in corso, realizzato]
  inizio_dopo_assensi:
    type: yes_no
    question: "I lavori inizieranno solo quando il SUE comunicherà che gli altri assensi (ad es. l'autorizzazione paesaggistica) sono stati acquisiti, anziché a una data stabilita?"
    propose: "false"
  data_lavori_realizzati: {type: date, question: "Quando sono stati ultimati i lavori (CILA per lavori già eseguiti, d.3)"}
  cila_onerosa:
    type: yes_no
    question: "È dovuto un contributo di costruzione (manutenzione straordinaria che aumenta il carico urbanistico e la superficie calpestabile)?"
    propose: "false"
  contributo_pagato: {type: yes_no, question: "Il contributo è già stato pagato (con la ricevuta allegata), anziché da pagare prima dell'inizio dei lavori?"}
  ricevuta_contributo: {type: file, question: "La ricevuta di pagamento del contributo di costruzione (PDF)"}
  prospetto_contributo: {type: file, question: "Il prospetto di calcolo preventivo del contributo di costruzione (PDF)"}
  # The architect presents the pratica with the client's procura; the works' designer is her, or
  # another technician (`p:`), whose block, asseverazione and signature they then are. An ask's
  # `yours` is a step of the person's when it's answered yes.
  progettista_altro:
    type: yes_no
    question: "Il progettista architettonico è un tecnico diverso dal tecnico che presenta la pratica? In tal caso va indicato tra le persone della pratica come progettista architettonico: il modulo lo indica come progettista e come autore dell'asseverazione"
    propose: "false"
    yours: "L'asseverazione è del progettista architettonico: prima di Firma e invio, gli faccia firmare digitalmente la pratica, oltre al procuratore"
  direttore_lavori:
    type: choice
    question: "Chi dirige i lavori? progettista (il progettista dei lavori: il tecnico che presenta la pratica, o il progettista architettonico se è un altro tecnico); da nominare (nessun direttore dei lavori indicato nella pratica: va nominato prima dell'inizio dei lavori); altro tecnico (un altro tecnico, indicato come direttore dei lavori tra i soggetti dell'incarico)"
    options: [progettista, da nominare, altro tecnico]
    propose: "progettista"
  # The agibilità's attestazione tecnica is the direttore dei lavori's or, where none was
  # named, a professionista abilitato's (art. 24 c. 5 DPR 380/2001): the architect either way.
  agibilita_attestante:
    type: choice
    question: "In quale veste il tecnico firma l'attestazione tecnica dell'agibilità? direttore dei lavori; professionista abilitato (per i lavori non è stato nominato un direttore dei lavori)"
    options: [direttore dei lavori, professionista abilitato]
    propose: "direttore dei lavori"
  # The SCIA's h1: the structural direttore dei lavori is the structural designer (the form's
  # "diverso dal progettista delle opere strutturali": no), or named before the works start.
  dl_strutture:
    type: yes_no
    question: "Il progettista strutturale dirige anche i lavori strutturali? In caso contrario, quel direttore dei lavori va nominato prima dell'inizio dei lavori"
    propose: "true"
  altri_tecnici:
    type: yes_no
    question: "Sono già incaricati altri tecnici (strutture, impianti, acustica, sicurezza) per questi lavori?"
    propose: "false"
  altri_tecnici_dopo:
    type: yes_no
    question: "Saranno nominati altri tecnici (strutture, impianti, coordinatore per la sicurezza) prima dell'inizio dei lavori, oltre a quelli eventualmente indicati qui?"
    propose: "false"
  # The other technicians are `a:`, `a2:`, `a3:` ... in the job's people, as many as there are
  # (the national form sets no limit); an employee's firm is `ad:`, `ad2:` ...
  altri_tecnici_quanti:
    type: number
    question: "Quanti altri tecnici? (si indicano tra i soggetti della pratica come altro tecnico, altro tecnico 2 e così via)"
    propose: "1"
  altro_tecnico#N_incarico: {type: text, question: "Per che cosa è incaricato l'altro tecnico #K (l'\"Incaricato della\" del modulo, ad es. progettazione strutturale)?"}
  altro_tecnico#N_dipendente: {type: yes_no, question: "L'altro tecnico #K lavora come dipendente di un'impresa o di uno studio (l'\"alle dipendenze di\" del modulo: l'impresa va indicata tra i soggetti della pratica come quella da cui questo tecnico dipende)?", propose: "false"}
  lavori_in_proprio:
    type: yes_no
    question: "I lavori sono di entità tale che il committente li esegue senza impresa (opere di modesta entità, eseguite in proprio)?"
    propose: "false"
  # The firm named after filing, before the works start (the SUE's comunicazione di nomina
  # dell'impresa esecutrice); the site-safety declarations wait for it (d.lgs. 81 "si riserva").
  impresa_dopo:
    type: yes_no
    question: "L'impresa esecutrice è ancora da scegliere (da indicare prima dell'inizio dei lavori, con la comunicazione di nomina dell'impresa esecutrice)?"
    propose: "false"
  # The CILA's relazione tecnica: what the works are (art. 6-bis DPR 380/2001 and Tabella A of
  # D.Lgs. 222/2016), the progettista's to say.
  cila_manutenzione: {type: yes_no, group: cila_interventi, item: "Manutenzione straordinaria (art. 3 c.1 b DPR 380/2001), senza interventi sulle parti strutturali"}
  cila_restauro: {type: yes_no, group: cila_interventi, item: "Restauro e risanamento conservativo (art. 3 c.1 c), senza interventi sulle parti strutturali"}
  cila_barriere: {type: yes_no, group: cila_interventi, item: "Eliminazione delle barriere architettoniche con ascensori esterni o opere che alterano la sagoma dell'edificio"}
  cila_sottosuolo: {type: yes_no, group: cila_interventi, item: "Opere temporanee per indagini geognostiche nel sottosuolo"}
  cila_terra: {type: yes_no, group: cila_interventi, item: "Movimenti di terra non a fini agricoli"}
  cila_serre: {type: yes_no, group: cila_interventi, item: "Serre stagionali agricole con parti in muratura"}
  cila_pertinenze: {type: yes_no, group: cila_interventi, item: "Pertinenze minori che il PRG non considera nuova costruzione"}
  cila_altri: {type: yes_no, group: cila_interventi, item: "Altri interventi non elencati negli artt. 6, 10 e 22 DPR 380/2001 (CILA residuale)"}
  cila_altri_tipo: {type: text, question: "Quali altri lavori (la riga 'specificare il tipo di intervento')"}
  # Construction tolerances (art. 34-bis and 34-ter DPR 380/2001, as the 2024 Salva Casa changed them).
  tolleranze:
    type: yes_no
    question: "La relazione dichiara tolleranze costruttive (art. 34-bis / 34-ter DPR 380/2001) sull'immobile?"
    propose: "false"
  toll_34bis_1: {type: yes_no, group: tolleranze_tipi, item: "Art. 34-bis c. 1 e 1-ter, secondo periodo (2% delle misure)"}
  toll_34bis_1bis: {type: yes_no, group: tolleranze_tipi, item: "Art. 34-bis c. 1-bis e 1-ter, primo periodo (2–6% secondo la superficie utile dell'unità, interventi anteriori al 24 maggio 2024)"}
  toll_34bis_2: {type: yes_no, group: tolleranze_tipi, item: "Art. 34-bis c. 2 (irregolarità geometriche ed esecutive)"}
  toll_34bis_2bis: {type: yes_no, group: tolleranze_tipi, item: "Art. 34-bis c. 2-bis (lavori anteriori al 24 maggio 2024: irregolarità esecutive di minore entità)"}
  toll_34ter_4: {type: yes_no, group: tolleranze_tipi, item: "Art. 34-ter c. 4 (varianti in corso d'opera anteriori al 1977)"}
  toll_superficie:
    type: choice
    question: "La superficie utile dell'unità, per la tolleranza dell'art. 34-bis c. 1-bis: oltre 500 (oltre 500 m², 2%); 300-500 (3%); 100-300 (4%); 60-100 (5%); sotto 60 (sotto 60 m², 6%)"
    options: [oltre 500, 300-500, 100-300, 60-100, sotto 60]
  toll_strutturale: {type: yes_no, question: "La tolleranza è strutturalmente rilevante (e in tal caso rispetta le norme tecniche per le costruzioni)?"}
  # A structurally relevant one in zones 1-2 (art. 34-bis c. 3-bis): its art. 94-bis class, and
  # what proves the seismic check (the form's boxes, read on the portal 2026-10-30).
  toll_classe:
    type: choice
    question: "La sua classe ai sensi dell'art. 94-bis c. 1 DPR 380/2001: rilevante (a: rilevante per la pubblica incolumità, richiede l'autorizzazione del Genio Civile); minore rilevanza (b); privo di rilevanza (c)"
    options: [rilevante, minore rilevanza, privo di rilevanza]
    when: "{{ask.toll_strutturale}}"
  toll_sismica:
    type: choice
    question: "Cosa attesta la verifica sismica di una tolleranza rilevante: autorizzazione (l'autorizzazione del Genio Civile, art. 94 c. 2, allegata); silenzio assenso (formatosi sulla richiesta di autorizzazione, art. 94 c. 2-bis); nessuno (né l'una né l'altro per ora: la tolleranza non può essere dichiarata finché uno dei due non esiste)"
    options: [autorizzazione, silenzio assenso, nessuno]
    when: "{{ask.toll_classe|is_rilevante}}"
  toll_sismica_data: {type: date, question: "L'autorizzazione: data di rilascio (nel modulo \"rilasciata in data\")", when: "{{ask.toll_sismica|is_autorizzazione}}"}
  toll_sismica_protocollo: {type: text, question: "Il suo prot. n.", when: "{{ask.toll_sismica|is_autorizzazione}}"}
  toll_sismica_doc: {type: file, question: "L'autorizzazione sismica del Genio Civile (PDF): in Allega documenti, \"Autorizzazione sismica\"", when: "{{ask.toll_sismica|is_autorizzazione}}"}
  toll_silenzio_data: {type: date, question: "Il silenzio assenso: la data richiesta dal modulo (\"in data\")", when: "{{ask.toll_sismica|is_silenzio_assenso}}"}
  toll_silenzio_protocollo: {type: text, question: "Il suo prot. n.", when: "{{ask.toll_sismica|is_silenzio_assenso}}"}
  toll_decorso:
    type: yes_no
    question: "Il termine del controllo regionale per questa tolleranza è decorso, senza richieste di integrazione documentale rimaste senza risposta e senza esito negativo dei controlli (la dichiarazione del modulo)?"
    when: "{{ask.toll_classe|in_minore_rilevanza__privo_di_rilevanza}}"
  # The CILA relazione's two lists, as the national form words them (Accordo 4 May 2017, CILA
  # relazione items 2 and 3): other filings presented with this CILA, and assents the SUE is to
  # acquire from the documents attached (art. 23-bis c. 1-3 DPR 380/2001); each has its slot on
  # Allega documenti. Two rows each on the page, more by "+" (the national form's
  # altre_comunicazioni and atti_di_assenso are unbounded). The CIL's quadro e is the first list.
  comunicazioni_contestuali: {type: yes_no, question: "Insieme a questa pratica si presentano altri adempimenti (una segnalazione, comunicazione o notifica a un altro ufficio, necessaria per i lavori)?", propose: "false"}
  comunicazioni_quante: {type: number, question: "Quanti?"}
  comunicazione_1: {type: text, question: "Il primo: cosa si presenta insieme (es. SCIA antincendio)?"}
  comunicazione_1_autorita: {type: text, question: "L'ente competente (es. Comando provinciale dei Vigili del Fuoco di Napoli)"}
  comunicazione_#K: {type: text, question: "Adempimento #K: che cosa si presenta con esso?"}
  comunicazione_#K_autorita: {type: text, question: "Adempimento #K: l'autorità competente"}
  comunicazioni_doc: {type: file, question: "I documenti necessari per quelle presentazioni, in un unico PDF (la voce 'Documentazione necessaria per la presentazione di altre comunicazioni, segnalazioni')"}
  atti_da_acquisire: {type: yes_no, question: "I lavori richiedono atti di assenso non ancora ottenuti (un nulla osta, un'autorizzazione, una deroga) che il SUE deve acquisire sulla base dei documenti che Lei allega (art. 23-bis DPR 380/2001)? In tal caso i lavori iniziano solo quando il SUE comunica di averli acquisiti. Un atto di assenso già ottenuto non rientra qui: va allegato", propose: "false"}
  atti_quanti: {type: number, question: "Quanti?"}
  atto_1: {type: text, question: "Il primo: quale atto (es. parere igienico-sanitario, deroga)?"}
  atto_1_autorita: {type: text, question: "Quale ente lo rilascia (ad es. ASL Napoli 1 Centro)?"}
  atto_#K: {type: text, question: "Atto di assenso #K: quale atto?"}
  atto_#K_autorita: {type: text, question: "Atto di assenso #K: chi lo rilascia?"}
  atti_doc: {type: file, question: "I documenti di cui il SUE ha bisogno per acquisire quegli assensi, in un unico PDF (la voce 'Documentazione necessaria per il rilascio di atti di assenso obbligatori')"}
  oggetto:
    type: text
    question: "I lavori in una frase (300 caratteri)"
  data_inizio_lavori: {type: date, question: "Quando iniziano, o sono iniziati, i lavori"}
  ricevuta_sanzione: {type: file, question: "La ricevuta della sanzione (PDF): 333 € per lavori in corso, 1.000 € per lavori già eseguiti"}
  dettaglio_intervento:
    type: text
    question: "I lavori per la relazione tecnica (500 caratteri)"
  dlgs81: {type: yes_no, question: "Si applicano le norme sulla sicurezza nei cantieri del D.Lgs. 81/2008 (lavori eseguiti da un'impresa, non in proprio dal committente)?", propose: "true"}
  sotto_200: {type: yes_no, question: "Il cantiere è inferiore a 200 uomini-giorno?", propose: "true"}
  notifica_dovuta: {type: yes_no, question: "È dovuta la notifica preliminare (più di un'impresa in cantiere, oppure oltre 200 uomini-giorno)?"}
  notifica_allegata: {type: yes_no, question: "La notifica preliminare (art. 99 D.Lgs. 81/2008) è allegata ora, anziché inviata prima dell'inizio dei lavori?"}
  verificato_idoneita: {type: yes_no, question: "Il committente ha verificato i documenti delle imprese (DURC e idoneità tecnico-professionale, art. 90 c. 9 D.Lgs. 81/2008)?"}
  data_fine_prevista: {type: date, question: "Quando termineranno i lavori (opere temporanee: entro 180 giorni)"}
  pdc_numero: {type: text, question: "Il numero del permesso di costruire"}
  pdc_data: {type: date, question: "La sua data di rilascio"}
  pdc_protocollo: {type: text, question: "Il suo numero di protocollo generale"}
  pdc_anno: {type: text, question: "Il suo anno di protocollo generale"}
  pdc_interventi: {type: text, question: "Cosa consente, in poche parole (per interventi di ...)"}
  fine_presentata: {type: yes_no, question: "La comunicazione di fine lavori è già stata presentata?"}
  titolo_tipo:
    type: choice
    question: "Il titolo dei lavori: cosa è stato presentato o rilasciato"
    options: [permesso di costruire, SCIA, DIA, CILA, variante, autorizzazione paesaggistica]
    propose: permesso di costruire
  # The cambio d'intestazione's further titles (a SCIA and its variante filed as a SCIA of its
  # own pass together): one row each by the title "+". The first is titolo_tipo, pdc_protocollo
  # and pdc_data above; these template asks make the second and later ones.
  titoli_quanti:
    type: number
    question: "Quanti titoli trasferisce il cambio d'intestazione? Di solito uno; con una variante presentata come pratica a sé (una SCIA in variante), il titolo e ciascuna variante"
    propose: "1"
  titolo#N_tipo:
    type: choice
    question: "Titolo #K trasferito con il cambio: che cosa è stato presentato"
    options: [SCIA, DIA, CILA]
  pdc#N_protocollo: {type: text, question: "Titolo #K: il numero di protocollo generale"}
  pdc#N_data: {type: date, question: "Titolo #K: la sua data"}
  titolo_id_pratica: {type: text, question: "Il numero di pratica del titolo sul SUAP/SUE (ID pratica)"}
  data_nomina: {type: date, question: "Da quando subentra il nuovo direttore dei lavori"}
  nomina_aggiunta: {type: yes_no, question: "L'impresa viene nominata in aggiunta a una nominata in precedenza (anziché come prima impresa nominata)?", propose: "false"}
  paes_protocollo: {type: text, question: "Il numero P.G. (protocollo) dell'autorizzazione paesaggistica"}
  paes_data: {type: date, question: "La sua data"}
  paes_scadenza: {type: date, question: "La data in cui avrebbe dovuto cessare la validità"}
  titolo_con_paesaggistica: {type: yes_no, question: "Il permesso o la SCIA era accompagnato da un'autorizzazione paesaggistica (con numero di P.G. e data)?", only_if: [titolo_tipo]}
  # The autorizzazione paesaggistica semplificata (DPR 31/2017): the protection the property
  # is under (art. 136: a declaration by D.M. or D.G.R.; art. 142: by law, e.g. the coast) and
  # what the works are in the decree's Allegato B, the architect's to say.
  vincolo:
    type: choice
    question: "Cosa tutela il paesaggio dell'immobile? (art. 136: una dichiarazione con D.M./D.G.R.; art. 142: per legge, ad es. la costa; art. 134: solo il piano paesaggistico)"
    options: [art 136, art 142, art 136 and 142, art 134]
  vincolo_136_lettera: {type: text, question: "Quale lettera o quali lettere dell'art. 136 c.1 (a, b, c, d)?"}
  vincolo_136_provvedimento: {type: text, question: "Il D.M. o la D.G.R. che lo ha dichiarato (es. D.M. 28/03/1985)"}
  vincolo_142_lettera: {type: text, question: "Quale lettera o quali lettere dell'art. 142 c.1 (a: costa entro 300 m, c: fiumi, f: parchi, g: boschi, m: zone archeologiche)?"}
  paes_variante: {type: yes_no, question: "Si tratta di una variante a un'autorizzazione paesaggistica già rilasciata?", propose: "false"}
  paes_b1: {type: yes_no, group: allegato_b, item: "B.1 Incremento di volume fino al 10% dell'edificio originario, e comunque non oltre 100 m³"}
  paes_b2: {type: yes_no, group: allegato_b, item: "B.2 Nuove aperture esterne o finestre a tetto, o loro modifica, su edifici vincolati ai sensi dell'art. 136 c.1 a), b), c)"}
  paes_b3: {type: yes_no, group: allegato_b, item: "B.3 Modifiche ai prospetti che alterano l'aspetto esteriore dell'edificio (diverse da B.2)"}
  paes_b4: {type: yes_no, group: allegato_b, item: "B.4 Modifiche alle coperture che alterano l'aspetto esteriore dell'edificio (diverse da B.2)"}
  paes_b5: {type: yes_no, group: allegato_b, item: "B.5 Interventi di adeguamento sismico o di efficientamento energetico che modificano l'aspetto esteriore dell'edificio"}
  paes_b6: {type: yes_no, group: allegato_b, item: "B.6 Interventi per l'accessibilità: rampe oltre 60 cm, ascensori esterni o volumi visibili dall'esterno"}
  paes_b7: {type: yes_no, group: allegato_b, item: "B.7 Impianti tecnologici esterni a servizio di un singolo edificio: condizionatori, caldaie, serbatoi e simili"}
  paes_b8: {type: yes_no, group: allegato_b, item: "B.8 Pannelli solari (termici o fotovoltaici) a servizio di un singolo edificio"}
  paes_b9: {type: yes_no, group: allegato_b, item: "B.9 Microgeneratori eolici di altezza fino a 1,50 m e diametro fino a 1,00 m"}
  paes_b10: {type: yes_no, group: allegato_b, item: "B.10 Cabine o colonnine modulari per servizi a rete, o loro sostituzione con altre diverse"}
  paes_b11: {type: yes_no, group: allegato_b, item: "B.11 Modifiche alla viabilità locale: rotatorie, incroci, piazzole, marciapiedi"}
  paes_b12: {type: yes_no, group: allegato_b, item: "B.12 Arredo urbano sistematico, illuminazione pubblica compresa"}
  paes_b13: {type: yes_no, group: allegato_b, item: "B.13 Opere di urbanizzazione primaria in piani attuativi già sottoposti a valutazione paesaggistica"}
  paes_b14: {type: yes_no, group: allegato_b, item: "B.14 Interventi della voce A.12 (Allegato A) nelle aree di pertinenza di un edificio vincolato"}
  paes_b15: {type: yes_no, group: allegato_b, item: "B.15 Demolizione senza ricostruzione di edifici privi di valore architettonico, storico o testimoniale"}
  paes_b16: {type: yes_no, group: allegato_b, item: "B.16 Autorimesse fuori terra o parzialmente interrate, fino a 50 m³ fuori terra"}
  paes_b17: {type: yes_no, group: allegato_b, item: "B.17 Tettoie, porticati e chioschi da giardino permanenti, aperti su più lati, di dimensioni limitate"}
  paes_b18: {type: yes_no, group: allegato_b, item: "B.18 Sistemazione organica delle aree di pertinenza di un edificio: nuove pavimentazioni, rampe, scale (diverse da B.14)"}
  paes_b19: {type: yes_no, group: allegato_b, item: "B.19 Tettoie aperte a servizio di capannoni produttivi, o di collegamento tra essi"}
  paes_b20: {type: yes_no, group: allegato_b, item: "B.20 Impianti tecnologici esterni per edifici produttivi esistenti: stoccaggi, condotte e simili"}
  paes_b21: {type: yes_no, group: allegato_b, item: "B.21 Cancelli, recinzioni, muri di cinta o di contenimento, elementi anti-intrusione"}
  paes_b22: {type: yes_no, group: allegato_b, item: "B.22 Taglio di alberi senza sostituzione; sostituzione o messa a dimora di alberi e arbusti"}
  paes_b23: {type: yes_no, group: allegato_b, item: "B.23 Opere fuori terra per reti locali di servizi o fognature"}
  paes_b24: {type: yes_no, group: allegato_b, item: "B.24 Serbatoi e cisterne interrati che modificano in modo permanente il terreno"}
  paes_b25: {type: yes_no, group: allegato_b, item: "B.25 Occupazione temporanea di suolo con strutture semplicemente ancorate al terreno"}
  paes_b26: {type: yes_no, group: allegato_b, item: "B.26 Verande e strutture esterne chiuse (dehors) per attività come bar e ristoranti"}
  paes_b27: {type: yes_no, group: allegato_b, item: "B.27 Strutture fuori terra per pozzi domestici e prese d'acqua"}
  paes_b28: {type: yes_no, group: allegato_b, item: "B.28 Piccoli ponti su corsi d'acqua, o loro parziale copertura, per consentire l'accesso"}
  paes_b29: {type: yes_no, group: allegato_b, item: "B.29 Ricoveri in muratura per attrezzi agricoli, fino a 10 m²"}
  paes_b30: {type: yes_no, group: allegato_b, item: "B.30 Nuove strutture per la pesca fino a 30 m²"}
  paes_b31: {type: yes_no, group: allegato_b, item: "B.31 Adeguamento della viabilità vicinale e poderale"}
  paes_b32: {type: yes_no, group: allegato_b, item: "B.32 Ripristino di attività agricole o pastorali su terreni rurali invasi da vegetazione arbustiva o arborea"}
  paes_b33: {type: yes_no, group: allegato_b, item: "B.33 Diradamento boschivo per introdurre colture di radura"}
  paes_b34: {type: yes_no, group: allegato_b, item: "B.34 Riduzione di superfici boscate nelle aree di pertinenza di un edificio esistente, fino a 2.000 m²"}
  paes_b35: {type: yes_no, group: allegato_b, item: "B.35 Viabilità forestale in assenza di un piano forestale regionale approvato"}
  paes_b36: {type: yes_no, group: allegato_b, item: "B.36 Insegne e cartelli pubblicitari permanenti inferiori a 18 m² (art. 153 c.1)"}
  paes_b37: {type: yes_no, group: allegato_b, item: "B.37 Linee elettriche e telefoniche su palo a servizio di singole utenze"}
  paes_b38: {type: yes_no, group: allegato_b, item: "B.38 Impianti di comunicazione elettronica o radioelettrici (diversi da quelli esenti)"}
  paes_b39: {type: yes_no, group: allegato_b, item: "B.39 Modifiche alle opere di difesa idraulica sulle sponde di fiumi e laghi"}
  paes_b40: {type: yes_no, group: allegato_b, item: "B.40 Interventi sistematici di ingegneria naturalistica per la difesa idraulica, del suolo o dalle frane"}
  paes_b41: {type: yes_no, group: allegato_b, item: "B.41 Demolizione e ricostruzione con la stessa volumetria, sagoma e area di sedime"}
  paes_b42: {type: yes_no, group: allegato_b, item: "B.42 Ripascimenti, dune artificiali, ripristino di opere costiere"}
  # The title's holders until now (the cambio d'intestazione takes several, one row each by "+").
  precedenti_quanti:
    type: number
    question: "Quanti erano finora i titolari (i precedenti titolari a cui subentra il nuovo)?"
    propose: "1"
  precedente#N_cognome: {type: text, question: "Il titolare #K finora: cognome, o denominazione della società"}
  precedente#N_nome: {type: text, question: "Il suo nome (nessuno per una società)", default: ""}
  precedente#N_cf: {type: text, question: "Il suo codice fiscale o la partita IVA"}
  atto_tipo: {type: text, question: "L'atto con cui è stato trasferito l'immobile (es. atto di compravendita)"}
  atto_data: {type: date, question: "La sua data"}
  atto_notaio: {type: text, question: "Il nome del notaio"}
  atto_notaio_sede: {type: text, question: "Il comune sede del notaio"}
  atto_repertorio: {type: text, question: "Numero di repertorio"}
  atto_raccolta: {type: text, question: "Numero di raccolta (rogito)"}
  atto_registrato_a: {type: text, question: "Dove è stato registrato (ufficio dell'Agenzia delle Entrate)"}
  atto_registrazione_data: {type: date, question: "Data di registrazione"}
  atto_registrazione_numero: {type: text, question: "Numero di registrazione"}
  zona_prg: {type: text, question: "La zona dell'immobile nel PRG (es. zona B)"}
  prg_nta: {type: text, question: "L'articolo delle NTA del PRG per quella zona (es. art. 33)"}
  proprietario_nome: {type: text, question: "Il nome o la denominazione del proprietario (il committente è titolare di un altro diritto reale)"}
  titolo_atto:
    type: choice
    question: "Cosa prova il titolo del committente: un atto notarile (rogito), un contratto registrato all'Agenzia delle Entrate, o uno trascritto alla Conservatoria?"
    options: [rogito, agenzia entrate, conservatoria]
  atto_trascrizione_sede: {type: text, question: "La Conservatoria (servizio di pubblicità immobiliare) presso cui è stato trascritto"}
  atto_trascrizione_numero: {type: text, question: "Il suo numero di registro generale"}
  atto_trascrizione_data: {type: date, question: "La sua data di trascrizione"}
  paes_interessa:
    type: choice
    question: "I lavori riguardano un edificio o un'area (terreno senza edifici)?"
    options: [immobile, area]
    propose: immobile
  atti_gravanti: {type: yes_no, question: "Gravano sull'immobile atti trascritti: servitù, atti unilaterali d'obbligo, convenzioni?", propose: "false"}
  atti_gravanti_quali: {type: text, question: "Quale atto o quali atti, con la denominazione riportata nell'atto"}
  paes_ente: {type: text, question: "L'ente che ha rilasciato l'autorizzazione paesaggistica", default: "Comune di Napoli"}
  paes_rinnovo_di:
    type: choice
    question: "Cosa si rinnova: una semplificata (DPR 31/2017) o un'ordinaria (art. 146 D.Lgs. 42/2004)?"
    options: [semplificata, ordinaria]
  paes_rinnovo_variazioni: {type: yes_no, question: "Il rinnovo modifica il progetto, oppure sono intervenute nuove prescrizioni di tutela dopo l'autorizzazione?", yours: "Nella sezione del rinnovo, alleghi la relazione paesaggistica semplificata per le modifiche, firmata digitalmente (.p7m)"}
  paes_variante_numero: {type: text, question: "Il numero di quell'autorizzazione"}
  paes_variante_data: {type: date, question: "La sua data"}
  paes_variante_ente: {type: text, question: "L'ente di rilascio (es. Comune di Napoli)", propose: "Comune di Napoli"}
  attivita_svolta: {type: text, question: "L'attività o professione del nuovo intestatario (60 caratteri)"}
  soggetti_cambiati: {type: yes_no, question: "Con il nuovo titolare cambiano il direttore dei lavori o l'impresa esecutrice?", propose: "false"}
  nuovo_dl: {type: text, question: "Il nome del nuovo direttore dei lavori"}
  nuovo_esecutore: {type: text, question: "La denominazione della nuova impresa"}
  nuovo_csp: {type: text, question: "Il nome del nuovo coordinatore per la sicurezza (se non c'è: lasci vuoto)", default: ""}
  proroga_giorni: {type: text, question: "Quanti giorni di proroga si chiedono (ad es. 365)"}
  proroga_motivo: {type: text, question: "Perché serve la proroga: i fatti estranei alla volontà del titolare (500 caratteri)"}
  proroga_tipo_lavori: {type: text, question: "I lavori ancora da completare, in poche parole (30 caratteri)"}
  proroga_data_prevista: {type: date, question: "La nuova data prevista di inizio (o fine) dei lavori"}
  fine_termine: {type: date, question: "La data entro cui, secondo il permesso, i lavori dovevano terminare"}
  # Proposed, never assumed: the declaration says how the person pays.
  # Communicating the INAD address is optional: the Comune reads INAD itself (art. 6-quater
  # CAD), so it is filled only when the person asks for it.
  domicilio_inad: {type: yes_no, question: "La PEC del committente è il suo domicilio digitale in INAD, da comunicare nel modulo?", default: "false"}
  domicilio_inipec: {type: yes_no, question: "La PEC della società committente è il suo domicilio digitale in INI-PEC, da comunicare nel modulo?", default: "false"}
  # Asked once the client is known to pay it (bollo_esenzione "no"): the proposal waits for it.
  bollo_marche:
    type: yes_no
    question: "L'imposta di bollo è assolta con marche da bollo fisiche (anziché con pagoPA)?"
    default: "{{ask.bollo_esenzione|bollo_non_dovuto}}"
    propose: "{{ask.bollo_esenzione|is_no|not}}"
  # Proposed "no" for every client: most exemptions are a body's, but a piccola proprietà
  # contadina can be a person's.
  bollo_esenzione:
    type: choice
    question: "Il committente è esente dall'imposta di bollo, o autorizzato a pagarla in modo virtuale? no (la paga); ets (un ente del Terzo settore iscritto al RUNTS: art. 82 c. 5 D.Lgs. 117/2017); cooperativa sociale (nominata espressamente dallo stesso articolo); pubblica (lo Stato, una Regione, Provincia, Comune o i loro consorzi: All. B art. 16 DPR 642/1972); sportiva (un ente sportivo senza scopo di lucro riconosciuto dal CONI: All. B art. 27-bis); onlus (il regime ONLUS è cessato il 1° gennaio 2026: solo un'ONLUS il cui periodo d'imposta è iniziato prima di tale data); partito (un partito politico, per gli adempimenti previsti dalla legge: art. 27-ter); contadina (piccola proprietà contadina: art. 21); virtuale (autorizzato dall'Agenzia delle Entrate al pagamento in modo virtuale: D.M. 10/11/2011, art. 15 DPR 642/1972)"
    options: ["no", ets, cooperativa sociale, pubblica, sportiva, onlus, partito, contadina, virtuale]
    propose: "no"
  bollo_onlus_esercizio: {type: yes_no, question: "Il periodo d'imposta in corso della ONLUS è iniziato prima del 1° gennaio 2026 (un periodo d'imposta non coincidente con l'anno solare)? Il regime ONLUS è cessato a quella data (D.Lgs. 117/2017 art. 102 c. 2 e art. 104 c. 2): una ex ONLUS iscritta al RUNTS è un ets", propose: "false"}
  bollo_virtuale_autorizzazione: {type: file, question: "La dichiarazione relativa all'assolvimento dell'imposta di bollo del committente: che la assolve in modo virtuale, con l'autorizzazione dell'Agenzia delle Entrate (numero e data), firmata (PDF)"}
