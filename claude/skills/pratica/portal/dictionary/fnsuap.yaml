  # Soil, urbanisation and drains: no investigations needed, an urbanised area, and drains that
  # need no authorisation, or one authorisation (got, or asked with its documents): a discharge
  # into the sewer or into surface water (D.Lgs. 152/2006), or the sewer connection. Each
  # opens its own "con prot." and "in data", in that order, after the bonifica's "in data".
  - section: Asseverazione PdC - qualità terreni
    aliases: ["Asseverazione SCIA Alternativa - Qualità terreni"]
    plus: "an upload box's own \"+\" (a document in several files): one file is attached"
    # The permesso's "non interessa aree percorse dal fuoco" is one choice with the soil
    # investigations' radios on the portal (ticking it unticks them, read 2026-11-01): left, a
    # defect (defects.yaml pdc-aree-fuoco).
    leave: [in data, con prot., non interessa aree percorse dal fuoco]
    # The portal requires "stipulata in data" with "non è dotata" (seen on the SCIA alternativa
    # 2026-11-01), though the form puts it only after "ovvero ... convenzione".
    supports:
      - {if: "{{ask.urbanizzazione|not}}", value: "{{ask.urbanizzazione_attuazione}}", in: [convenzione], else: "Senza opere di urbanizzazione primaria il portale chiede la data di una convenzione, anche dove il Comune prevede di realizzarle direttamente entro tre anni: quel caso non si può dichiarare sul portale così com'è; chieda al SUE."}
    fields:
      - {kind: radio, label: non richiede indagini ambientali preventive, when: "{{ask.indagini_ambientali|not}}"}
      # Analyses done, no remediation: the SCIA alternativa ticks "si allegano i risultati" (its
      # slot on the attachments screen); the permesso takes the file here, in the quadro.
      - {kind: radio, label: a seguito delle preventive analisi ambientali effettuate, when: "{{ask.indagini_ambientali}} {{ask.indagini_esito|is_analisi}}"}
      - {kind: checkbox, label: si allegano i risultati delle analisi ambientali, if_present: true, when: "{{ask.indagini_ambientali}} {{ask.indagini_esito|is_analisi}}"}
      - {kind: file, label: Tipologie ammesse, if_present: true, value: "{{ask.indagini_analisi_doc}}", when: "{{ask.indagini_ambientali}} {{ask.indagini_esito|is_analisi}}"}
      - {kind: radio, label: è stata oggetto di bonifica dei terreni, when: "{{ask.indagini_ambientali}} {{ask.indagini_esito|is_bonifica}}"}
      - {kind: text, label: "rilasciata da:", value: "{{ask.bonifica_ente}}", when: "{{ask.indagini_ambientali}} {{ask.indagini_esito|is_bonifica}}"}
      - {kind: date, label: in data, anchor: "rilasciata da:", block: 1, value: "{{ask.bonifica_data|date_it}}", when: "{{ask.indagini_ambientali}} {{ask.indagini_esito|is_bonifica}}"}
      - {kind: radio, label: è dotata delle opere di urbanizzazione primaria, when: "{{ask.urbanizzazione}}"}
      # One radio for both: the Comune within three years, "ovvero" an agreement, its date.
      - {kind: radio, label: non è dotata delle opere di urbanizzazione primaria, when: "{{ask.urbanizzazione|not}}"}
      - {kind: date, label: stipulata in data, value: "{{ask.urbanizzazione_convenzione_data|date_it}}", when: "{{ask.urbanizzazione|not}} {{ask.urbanizzazione_attuazione|is_convenzione}}"}
      - {kind: radio, label: non necessita di autorizzazione allo scarico, when: "{{ask.scarichi|is_nessuna_autorizzazione}}"}
      - {kind: radio, label: necessita di autorizzazione, nth: 2, when: "{{ask.scarichi|is_nessuna_autorizzazione|not}}"}
      - {kind: checkbox, label: allo scarico in pubblica fognatura, when: "{{ask.scarichi|in_fognatura_ottenuta__fognatura_da_richiedere}}"}
      - {kind: checkbox, label: la relativa autorizzazione è stata ottenuta, when: "{{ask.scarichi|is_fognatura_ottenuta}}"}
      - {kind: text, label: con prot., value: "{{ask.scarico_protocollo}}", when: "{{ask.scarichi|is_fognatura_ottenuta}}"}
      - {kind: date, label: in data, nth: 2, value: "{{ask.scarico_data|date_it}}", when: "{{ask.scarichi|is_fognatura_ottenuta}}"}
      - {kind: checkbox, label: si allega la documentazione necessaria ai fini del rilascio dell'autorizzazione, when: "{{ask.scarichi|is_fognatura_da_richiedere}}"}
      - {kind: checkbox, label: allo scarico in acque superficiali, when: "{{ask.scarichi|in_superficiali_ottenuta__superficiali_da_richiedere}}"}
      - {kind: checkbox, label: la relativa autorizzazione è stata ottenuta, nth: 2, when: "{{ask.scarichi|is_superficiali_ottenuta}}"}
      - {kind: text, label: con prot., nth: 2, value: "{{ask.scarico_protocollo}}", when: "{{ask.scarichi|is_superficiali_ottenuta}}"}
      - {kind: date, label: in data, nth: 3, value: "{{ask.scarico_data|date_it}}", when: "{{ask.scarichi|is_superficiali_ottenuta}}"}
      - {kind: checkbox, label: si allega la documentazione necessaria ai fini del rilascio dell'autorizzazione, nth: 2, when: "{{ask.scarichi|is_superficiali_da_richiedere}}"}
      - {kind: checkbox, label: all'allaccio in pubblica fognatura, when: "{{ask.scarichi|in_allaccio_ottenuto__allaccio_da_richiedere}}"}
      - {kind: checkbox, label: la relativa autorizzazione è stata ottenuta, nth: 3, when: "{{ask.scarichi|is_allaccio_ottenuto}}"}
      - {kind: text, label: con prot., nth: 3, value: "{{ask.allaccio_protocollo}}", when: "{{ask.scarichi|is_allaccio_ottenuto}}"}
      - {kind: date, label: in data, nth: 4, value: "{{ask.allaccio_data|date_it}}", when: "{{ask.scarichi|is_allaccio_ottenuto}}"}
      - {kind: checkbox, label: si allega la documentazione necessaria ai fini del rilascio dell'autorizzazione, nth: 3, when: "{{ask.scarichi|is_allaccio_da_richiedere}}"}

  # The SCIA alternativa's other ecological vincoli are checkboxes (the SCIA's are radios).
  - section: Asseverazione SCIA Alternativa - Altri Vincoli
    fields:
      - {kind: radio, label: nel comune NON è presente, when: "{{ask.rir|is_no}}"}
      - {kind: radio, label: "nel comune E' presente un'attività a rischio d'incidente rilevante e la relativa “area di danno” è individuata", when: "{{ask.rir|is_fuori_area}}"}
      - {kind: radio, label: l'intervento NON ricade nell'area di danno, when: "{{ask.rir|is_fuori_area}}"}
      - {kind: radio, label: "nel comune E' presente un'attività a rischio d'incidente rilevante e la relativa “area di danno” è individuata", when: "{{ask.rir|is_in_area}}"}
      - {kind: radio, label: l'intervento ricade in area di danno, when: "{{ask.rir|is_in_area}}"}
      - {kind: checkbox, label: si allega la documentazione necessaria alla valutazione del progetto, when: "{{ask.rir|is_in_area}}"}
      - {kind: radio, label: "nel comune E' presente un'attività a rischio d'incidente rilevante e la relativa “area di danno” non è individuata", when: "{{ask.rir|is_non_individuata}}"}
      - {kind: checkbox, label: si allega la documentazione necessaria alla valutazione del progetto, nth: 2, when: "{{ask.rir|is_non_individuata}}"}
      - {kind: checkbox, label: fascia di rispetto dei depuratori, when: "{{ask.altri_vincoli_eco|is_nessuno|not}} {{ask.altri_vincoli_eco_tipo|is_depuratori}}"}
      - {kind: checkbox, label: fascia di rispetto per pozzi, when: "{{ask.altri_vincoli_eco|is_nessuno|not}} {{ask.altri_vincoli_eco_tipo|is_pozzi}}"}
      - {kind: checkbox, label: Altro, when: "{{ask.altri_vincoli_eco|is_nessuno|not}} {{ask.altri_vincoli_eco_tipo|is_altro}}"}
      - {kind: text, label: "Specificare:", value: "{{ask.altri_vincoli_eco_quale}}", when: "{{ask.altri_vincoli_eco|is_nessuno|not}} {{ask.altri_vincoli_eco_tipo|is_altro}}"}
      - {kind: checkbox, label: si allegano le autocertificazioni, when: "{{ask.altri_vincoli_eco|is_autocertificazione}}"}
      - {kind: checkbox, label: si allega la documentazione necessaria ai fini del rilascio dei relativi atti di assenso, when: "{{ask.altri_vincoli_eco|is_assenso}}"}

  # The permesso di costruire (art. 10 DPR 380/2001): one kind of works, each art. 10 one with
  # whether it changes the use; or a SCIA's works asked as a permesso, an art. 36 sanatoria, a
  # deroga (each limit with its specificare, found from its own box: the boxes it opens shift),
  # or an essential variant to a title. Napoli's form puts the Campania kinds and the
  # convenzionato under "procedimento ordinario" (a SUAP article, as the portal words it).
  - section: Qualificazione pratica dell'intervento
    leave: [n., del, (specificare)]
    # Closed to new requests since 30 September 2022 (L.R. 31/2021 art. 28 c. 6): only those
    # pending then are decided, under the old rules (L.R. 13/2022 art. 4 c. 17).
    law: ["piano casa, ai sensi della l.r. n. 19/2009", interventi di ampliamento (articolo 4), interventi di demolizione e ricostruzione (articolo 5), interventi edilizi in zona agricola, riqualificazione di aree urbane degradate (articolo 7)]
    supports:
      - {value: "{{ask.pdc_tipo}}", in: [nuova costruzione, ristrutturazione urbanistica, ristrutturazione edilizia, facolta scia, variante essenziale, variante sagoma, sottotetti, parcheggi, mutamento uso, altro], else: "Il piano casa (L.R. Campania 19/2009) non accetta nuove richieste dal 30 settembre 2022 (L.R. 31/2021 art. 28 c. 6; la L.R. 13/2022 art. 4 c. 17 disciplina solo quelle pendenti a quella data). Una variante a un permesso rilasciato in base al piano casa per ora non la preparo."}
      - {if: "{{ask.pdc_tipo|is_mutamento_uso}}", value: "{{ask.scia_cambio_uso}}", in: [stessa categoria, tra categorie, intero immobile, altro], else: "Un mutamento di destinazione d'uso ai sensi dell'art. 2 L.R. 19/2001 cambia la destinazione d'uso: indichi quale (stessa categoria, tra categorie, intero immobile o altro)."}
      - {if: "{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia}} {{ask.pdc_procedura|is_deroga}}", value: "{{ask.deroga_densita,ask.deroga_altezza,ask.deroga_distanza,ask.deroga_destinazione|any}}", in: ["true"], else: "Un permesso in deroga (art. 14 DPR 380/2001) deroga ad almeno un limite: densità, altezza, distanza o destinazione d'uso."}
      - {if: "{{ask.pdc_tipo|is_altro}}", value: "{{ask.pdc_procedura}}", in: [ordinaria], else: "I lavori che nessun'altra voce indica si chiedono ai sensi dell'art. 10 in quanto tali: non come convenzionato né in deroga."}
      # A change of use that needed a SCIA alternativa or a permesso, done without it, is legalized by
      # the permesso in sanatoria too (art. 36 c. 1 names the SCIA of art. 23 c. 01): the asseverazione
      # states it as an L.R. 19/2001 change of use, or as "altro" (a whole building, L.R. 13/2022).
      - {if: "{{ask.sanatoria_titolo|is_permesso}}", value: "{{ask.pdc_tipo}}", in: [nuova costruzione, ristrutturazione urbanistica, ristrutturazione edilizia, mutamento uso, altro], else: "Il permesso in sanatoria (art. 36 DPR 380/2001) lo preparo per gli interventi dell'art. 10 e i mutamenti di destinazione d'uso: non per interventi da SCIA richiesti come permesso (si presentano con la SCIA in sanatoria), per una tipologia regionale campana o per una variante."}
      - {if: "{{ask.sanatoria_titolo|is_permesso}}", value: "{{ask.pdc_procedura}}", in: [ordinaria], else: "Un permesso in sanatoria (art. 36 DPR 380/2001) si richiede come tale: non come convenzionato né in deroga."}
    fields:
      - {kind: radio, label: interventi di cui all'articolo 10, when: "{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia__altro}} {{ask.pdc_procedura|is_ordinaria}} {{ask.sanatoria_titolo|is_permesso|not}}"}
      - {kind: radio, label: non comporta mutamento di destinazione d’uso, when: "{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia__altro}} {{ask.pdc_procedura|is_ordinaria}} {{ask.sanatoria_titolo|is_permesso|not}} {{ask.scia_cambio_uso|is_no}}"}
      - {kind: radio, label: comporta mutamento di destinazione d’uso di una singola unità immobiliare all’interno, when: "{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia__altro}} {{ask.pdc_procedura|is_ordinaria}} {{ask.sanatoria_titolo|is_permesso|not}} {{ask.scia_cambio_uso|is_stessa_categoria}}"}
      - {kind: radio, label: "comporta mutamento di destinazione d’uso di una singola unità immobiliare, ubicata", when: "{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia__altro}} {{ask.pdc_procedura|is_ordinaria}} {{ask.sanatoria_titolo|is_permesso|not}} {{ask.scia_cambio_uso|is_tra_categorie}}"}
      - {kind: radio, label: comporta mutamento di destinazione d’uso di un intero immobile, when: "{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia__altro}} {{ask.pdc_procedura|is_ordinaria}} {{ask.sanatoria_titolo|is_permesso|not}} {{ask.scia_cambio_uso|is_intero_immobile}}"}
      - {kind: radio, label: interventi assoggettati a Segnalazione Certificata di Inizio Attività, when: "{{ask.pdc_tipo|is_facolta_scia}}"}
      - {kind: text, label: (specificare), value: "{{ask.intervento_tipo}}", when: "{{ask.pdc_tipo|is_facolta_scia}}"}
      # In sanatoria the art. 36 line is quadro a)'s one answer, a change of use's too (2026-11-02).
      - {kind: radio, label: "intervento realizzato, ai sensi dell'articolo 36", when: "{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia__mutamento_uso__altro}} {{ask.sanatoria_titolo|is_permesso}}"}
      - {kind: radio, label: intervento in deroga alle previsioni, when: "{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia}} {{ask.pdc_procedura|is_deroga}}"}
      - {kind: checkbox, label: alla densità edilizia, when: "{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia}} {{ask.pdc_procedura|is_deroga}} {{ask.deroga_densita}}"}
      - {kind: text, label: (specificare), anchor: alla densità edilizia, value: "{{ask.deroga_densita_quale}}", when: "{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia}} {{ask.pdc_procedura|is_deroga}} {{ask.deroga_densita}}"}
      - {kind: checkbox, label: all'altezza, when: "{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia}} {{ask.pdc_procedura|is_deroga}} {{ask.deroga_altezza}}"}
      - {kind: text, label: (specificare), anchor: all'altezza, value: "{{ask.deroga_altezza_quale}}", when: "{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia}} {{ask.pdc_procedura|is_deroga}} {{ask.deroga_altezza}}"}
      - {kind: checkbox, label: alla distanza tra i fabbricati, when: "{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia}} {{ask.pdc_procedura|is_deroga}} {{ask.deroga_distanza}}"}
      - {kind: text, label: (specificare), anchor: alla distanza tra i fabbricati, value: "{{ask.deroga_distanza_quale}}", when: "{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia}} {{ask.pdc_procedura|is_deroga}} {{ask.deroga_distanza}}"}
      - {kind: checkbox, label: alla destinazione d'uso, when: "{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia}} {{ask.pdc_procedura|is_deroga}} {{ask.deroga_destinazione}}"}
      - {kind: text, label: (specificare), anchor: alla destinazione d'uso, value: "{{ask.deroga_destinazione_quale}}", when: "{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia}} {{ask.pdc_procedura|is_deroga}} {{ask.deroga_destinazione}}"}
      - {kind: radio, label: variazione essenziale e/o sostanziale, when: "{{ask.pdc_tipo|in_variante_essenziale__variante_sagoma}}"}
      - {kind: radio, label: titolo unico, when: "{{ask.pdc_tipo|is_variante_essenziale}} {{ask.pdc_variante_di|is_titolo_unico}}"}
      - {kind: text, label: n., value: "{{ask.pdc_numero}}", when: "{{ask.pdc_tipo|is_variante_essenziale}} {{ask.pdc_variante_di|is_titolo_unico}}"}
      - {kind: date, label: del, value: "{{ask.pdc_data|date_it}}", when: "{{ask.pdc_tipo|is_variante_essenziale}} {{ask.pdc_variante_di|is_titolo_unico}}"}
      - {kind: radio, label: permesso di costruire, when: "{{ask.pdc_tipo|is_variante_sagoma}}"}
      - {kind: radio, label: permesso di costruire, when: "{{ask.pdc_tipo|is_variante_essenziale}} {{ask.pdc_variante_di|is_permesso}}"}
      - {kind: text, label: n., nth: 2, value: "{{ask.pdc_numero}}", when: "{{ask.pdc_tipo|is_variante_sagoma}}"}
      - {kind: date, label: del, nth: 2, value: "{{ask.pdc_data|date_it}}", when: "{{ask.pdc_tipo|is_variante_sagoma}}"}
      - {kind: text, label: n., nth: 2, value: "{{ask.pdc_numero}}", when: "{{ask.pdc_tipo|is_variante_essenziale}} {{ask.pdc_variante_di|is_permesso}}"}
      - {kind: date, label: del, nth: 2, value: "{{ask.pdc_data|date_it}}", when: "{{ask.pdc_tipo|is_variante_essenziale}} {{ask.pdc_variante_di|is_permesso}}"}
      - {kind: radio, label: segnalazione certificata/denuncia di inizio attività alternativa, when: "{{ask.pdc_tipo|is_variante_essenziale}} {{ask.pdc_variante_di|is_scia_alternativa}}"}
      - {kind: text, label: n., nth: 3, value: "{{ask.pdc_numero}}", when: "{{ask.pdc_tipo|is_variante_essenziale}} {{ask.pdc_variante_di|is_scia_alternativa}}"}
      - {kind: date, label: del, nth: 3, value: "{{ask.pdc_data|date_it}}", when: "{{ask.pdc_tipo|is_variante_essenziale}} {{ask.pdc_variante_di|is_scia_alternativa}}"}
      - {kind: radio, label: attività che rientrano nell'ambito del procedimento ordinario, when: "{{ask.pdc_tipo|in_sottotetti__parcheggi__mutamento_uso}} {{ask.sanatoria_titolo|is_permesso|not}}"}
