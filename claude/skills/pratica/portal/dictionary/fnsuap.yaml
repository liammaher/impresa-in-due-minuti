# The screens after the form, reached with their button. The attachments go by slot title; a
# slot the pratica's crawl doesn't list is left out, a required one nothing fills stops gen.py.
after:
  - section: Pagamento degli oneri
    go: Prosegui
    save: false
    fields: []

  # What a pratica adds of its own (the CILA's relazione tecnica in Allegati liberi) is in its
  # recipe's `attachments`. A slot that takes only signed files takes the person's signed .p7m
  # (the portal checks each signature on upload: a rehearsal's made-up ones are left out, run.py
  # --made-up). A document the portal makes from the pratica once the declarations are ticked
  # ("Scarica il documento" by its box: the procura, the DSC, the portal's own forms) is attached
  # by the second run (run.py --after-declarations), as is the diritti receipt, paid before
  # sending; gen.py marks the first kind from the crawl, the receipt is marked here.
  # Napoli's own annexes (the Allegato A Programma 100, the Modello DP) have no slot: they go under
  # Allegati liberi, with the second run, signed like the procura (fill.py fills both from the
  # library's CILA entry, the same Comune forms for every title). A recipe whose pratica takes them
  # sets napoli_allegato_a or modello_dp to true.
  - section: Gestione degli allegati
    go: Prosegui
    step: Allega Documenti
    theirs: [Procura speciale, Quadro riepilogativo della documentazione, Scarica il documento]
    fields:
      - {kind: file, label: Procura speciale, value: "{{ask.procura_firmata}}"}
      - {kind: file, label: Allegati liberi, value: "{{ask.napoli_allegato_a_firmato}}", describe: Allegato A Programma 100, when: "{{ask.napoli_allegato_a}}", after_declarations: true}
      - {kind: file, label: Allegati liberi, value: "{{ask.modello_dp_firmato}}", describe: Modello DP (L.R. Campania 59/2018), when: "{{ask.modello_dp}}", after_declarations: true}
      - {kind: file, label: Quadro riepilogativo della documentazione, value: "{{ask.dsc_firmato}}"}
      - {kind: file, label: "copia attestazione versamento oneri, diritti e spese", value: "{{ask.ricevuta_diritti}}", when: "{{ask.diritti_euro|positive}}", after_declarations: true}
      - {kind: file, label: "Copia del documento di identità del/i titolare/i e/o del tecnico", value: "{{ask.documento_identita_cliente}}"}
      # The landscape authorization's own documents (the ordinaria's, the semplificata's; each
      # signed only), and the portal's Allegato D of a semplificata.
      - {kind: file, label: Relazione Paesaggistica Semplificata, value: "{{ask.relazione_semplificata_firmata}}"}
      - {kind: file, label: Elaborati di progetto individuati nell'Allegata Relazione Paesaggistica Semplificata, value: "{{ask.elaborati_paesaggistici}}"}
      - {kind: file, label: elaborati grafici comprensivi di stato attuale, value: "{{ask.elaborati_paesaggistici}}"}
      - {kind: file, label: documentazione fotografica a colori del contesto, value: "{{ask.foto_paesaggistiche}}"}
      - {kind: file, label: copia della precedente autorizzazione paesaggistica, value: "{{ask.paes_variante_doc}}", when: "{{ask.paes_variante}}"}
      - {kind: file, label: relazione dettagliata relativa all'inserimento dell'intervento, value: "{{ask.relazione_paesaggistica}}"}
      - {kind: file, label: scheda professionisti e imprese, value: "{{ask.scheda_professionisti}}"}
      # A new building or a heavy renovation carries the broadband drawing (art. 135-bis DPR 380/2001).
      - {kind: file, label: Elaborato dimostrativo dell'equipaggiamento di infrastruttura fisica, value: "{{ask.banda_ultralarga_doc}}", when: "{{ask.banda_ultralarga}}"}
      # A title passing to a new holder: the deed, and the guarantee for the contributo's
      # instalments still due; a new direttore after the old one's resignation; a firm's notifica.
      - {kind: file, label: fotocopia con estremi di registrazione dell'atto di alienazione, value: "{{ask.atto_trasferimento}}"}
      - {kind: file, label: polizza fidejussoria a garanzia del pagamento delle quote residue, value: "{{ask.polizza_rate_residue}}", when: "{{ask.rate_residue}}"}
      - {kind: file, label: dichiarazione di rinuncia del precedente direttore dei lavori, value: "{{ask.rinuncia_dl}}", when: "{{ask.dl_rinuncia}}"}
      - {kind: file, label: Copia notifica preliminare all'ASL, value: "{{ask.notifica_preliminare}}", when: "{{ask.notifica_dovuta}}"}
      # The committente's statement that the firm's papers were checked (art. 90 c. 9 a-b D.Lgs.
      # 81/2008); the new holder's that they have the right to the title.
      - {kind: file, label: "Dichiarazione sostitutiva dell'atto di notorietà, attestante l'avvenuta verifica", value: "{{ask.verifica_impresa_dsan}}"}
      - {kind: file, label: "dichiarazione sostitutiva dell'atto di notorietà corredata da copia di documento di identità", value: "{{ask.titolo_subentrante_dsan}}"}
      - {kind: file, label: "Attestazione in merito all'apposizione dell'etichetta", value: "{{ask.etichetta_banda_doc}}", when: "{{ask.banda_ultralarga}}"}
      - {kind: file, label: estremi di atti assenso già acquisiti, value: "{{ask.atti_assenso_acquisiti_doc}}", when: "{{ask.atti_assenso_acquisiti}}"}
      # The terre e rocce filings' own form, made by the portal from the pratica.
      - {kind: file, label: Dichiarazione di utilizzo di cui all'art. 21, value: "{{ask.modulo_portale_firmato}}"}
      - {kind: file, label: Allegato 5 al DPR 210/2017, value: "{{ask.modulo_portale_firmato}}"}
      - {kind: file, label: Dichiarazione di avvenuto utilizzo delle terre e rocce, value: "{{ask.modulo_portale_firmato}}"}
      - {kind: file, label: "Fotocopia di un documento di identita' del soggetto che conferisce", value: "{{ask.documento_identita_cliente}}"}
      - {kind: file, label: "Copia dei documenti d'identità del/i titolare/i", value: "{{ask.documento_identita_cliente}}", when: "{{ask.titolo_esclusivo|not}}"}
      # The other holder's assent only without an exclusive title (a.2); the notifica only when due.
      - {kind: file, label: Dichiarazione di assenso dei terzi titolari, value: "{{ask.assenso_proprietario}}", when: "{{ask.titolo_esclusivo|not}}"}
      - {kind: file, label: Notifica preliminare, value: "{{ask.notifica_preliminare}}", when: "{{ask.dlgs81}} {{ask.impresa_dopo|not}} {{ask.notifica_dovuta}}"}
      - {kind: file, label: Elaborati grafici dello stato di fatto e progetto, value: "{{ask.elaborati_grafici}}"}
      - {kind: file, label: "Elaborati grafici dello stato di fatto, di progetto e comparativi", value: "{{ask.elaborati_grafici}}"}
      - {kind: file, label: Documentazione fotografica dello stato di fatto, value: "{{ask.documentazione_fotografica}}"}
      - {kind: file, label: Documentazione dimostrativa dello stato legittimo, value: "{{ask.stato_legittimo_doc}}"}
      - {kind: file, label: Dichiarazione di conformità degli impianti, value: "{{ask.dichiarazione_conformita}}", when: "{{ask.impianti}} {{ask.impianti_dichiarazioni|any}}"}
