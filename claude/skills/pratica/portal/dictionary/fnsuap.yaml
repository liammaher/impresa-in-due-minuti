  esonero_ente_sede: {type: text, question: "Il comune in cui ha sede"}
  esonero_ente_pec: {type: text, question: "Il suo indirizzo PEC"}
  esonero_note: {type: text, question: "Eventuali note per l'ente (800 caratteri; si può lasciare vuoto)", default: ""}
  relazione_illustrativa: {type: file, question: "La relazione illustrativa dei lavori: in cosa consistono, dove si svolgono e perché rientrano nella voce dell'Allegato A (PDF)"}
  # The SCIA or permesso in sanatoria (artt. 36, 36-bis, 37 c. 5 DPR 380/2001): the wizard's
  # sanatoria question answered Sì, set by the sanatoria recipes (rehearsals/scia-sanatoria-fittizia,
  # rehearsals/pdc-sanatoria-fittizio).
  sanatoria_titolo:
    type: choice
    question: "Questa pratica è presentata in sanatoria? nessuna (no); scia (una SCIA in sanatoria); permesso (un permesso di costruire in sanatoria)"
    options: [nessuna, scia, permesso]
    default: nessuna
  # A new construction's case (art. 3 c. 1 e DPR 380/2001): the permesso's form asks one.
  nuova_costruzione_tipo:
    type: choice
    question: "Quale nuova costruzione (art. 3 c. 1 e DPR 380/2001)? e1 (nuovi manufatti fuori terra o interrati, o ampliamento di quelli esistenti all'esterno della sagoma); e2 (opere di urbanizzazione eseguite da soggetti diversi dal Comune); e3 (infrastrutture e impianti che trasformano suolo inedificato); e4 (torri e tralicci per impianti radio e di telecomunicazione); e5 (strutture leggere o prefabbricate usate come abitazioni, ambienti di lavoro o depositi, non temporanee); e6 (pertinenze che lo strumento urbanistico qualifica come nuova costruzione, o superiori al 20% del volume dell'edificio principale); e7 (depositi di merci o impianti per attività produttive all'aperto che trasformano suolo inedificato)"
    options: [e1, e2, e3, e4, e5, e6, e7]
    when: "{{ask.pdc_tipo|is_nuova_costruzione}}"
  pdc_sanatoria_caso:
    type: choice
    question: "Quale permesso in sanatoria? assenza (lavori eseguiti senza permesso o SCIA alternativa, o in totale difformità, conformi alla disciplina urbanistica ed edilizia sia al momento della realizzazione sia oggi: art. 36 DPR 380/2001, oblazione pari al doppio del contributo di costruzione); parziale (lavori in parziale difformità dal permesso o dalla SCIA alternativa (art. 34) o con variazioni essenziali: art. 36-bis)"
    options: [assenza, parziale]
    when: "{{ask.sanatoria_titolo|is_permesso}}"
  pdc_sanatoria_conformita:
    type: choice
    question: "Per l'art. 36-bis, le opere sono conformi: urbanistica (alla disciplina urbanistica vigente oggi e a quella edilizia vigente al momento della realizzazione) o doppia (alla disciplina urbanistica ed edilizia sia di allora sia di oggi)?"
    options: [urbanistica, doppia]
    when: "{{ask.sanatoria_titolo|is_permesso}} {{ask.pdc_sanatoria_caso|is_parziale}}"
  sanatoria_caso:
    type: choice
    question: "Quale caso della SCIA in sanatoria? in corso (lavori ancora in corso, SCIA presentata spontaneamente: sanzione di 516, € art. 37 c. 5 DPR 380/2001); doppia conformita (lavori eseguiti senza SCIA o in difformità da essa, conformi alla disciplina urbanistica ed edilizia sia al momento della realizzazione sia oggi: oblazione da 516 € a 5,164, € art. 36-bis c. 5 b); conformita urbanistica (conformi alla disciplina urbanistica vigente oggi e a quella edilizia vigente al momento della realizzazione: da 1.032 € a 10,328, € art. 36-bis c. 1); variante pre 1977 (una variante realizzata durante i lavori di un titolo rilasciato prima della L. 10/1977, in parziale difformità da esso e non rientrante nelle tolleranze dell'art. 34-bis: art. 34-ter c. 1-3, oblazione ai sensi dell'art. 36-bis c. 5)"
    options: [in corso, doppia conformita, conformita urbanistica, variante pre 1977]
    when: "{{ask.sanatoria_titolo|is_scia}}"
  sanatoria_data: {type: date, question: "Quando sono stati eseguiti i lavori (per lavori ancora in corso: quando sono iniziati)", when: "{{ask.sanatoria_titolo|in_scia__permesso}}"}
  # The sanction or oblazione is paid before filing (art. 37 c. 5, art. 36-bis c. 5: the SCIA is
  # "subordinata al pagamento"): the quadro gives the payment by its estremi or attaches its receipt.
  sanatoria_prova:
    type: choice
    question: "Come dimostra il quadro della sanatoria la sanzione o l'oblazione, pagata prima della presentazione? estremi (i suoi estremi: importo, data e, per la sanzione di 516 €, il riferimento); ricevuta (la ricevuta, che Lei allega firmata)"
    options: [estremi, ricevuta]
    when: "{{ask.sanatoria_titolo|is_scia}}"
  sanatoria_estremi: {type: text, question: "Il riferimento del pagamento della sanzione di 516 € (IUV o numero di transazione)", when: "{{ask.sanatoria_titolo|is_scia}} {{ask.sanatoria_caso|is_in_corso}} {{ask.sanatoria_prova|is_estremi}}"}
  sanatoria_oblazione: {type: number, question: "L'oblazione determinata dal tecnico e pagata dal committente prima della presentazione, in euro (art. 36-bis c. 5 b: da 516 € a 5.164 € con doppia conformità); il SUE può rideterminarla", when: "{{ask.sanatoria_titolo|is_scia}} {{ask.sanatoria_caso|is_doppia_conformita}}"}
  sanatoria_pagamento_data: {type: date, question: "La data di pagamento della sanzione o dell'oblazione", when: "{{ask.sanatoria_titolo|is_scia}} {{ask.sanatoria_prova|is_estremi}}"}
  sanatoria_catasto:
    type: choice
    question: "Il catasto per le opere da sanare: invariato (nessuna variazione dell'accatastamento); presentata (DOCFA già presentato: il suo protocollo e la data); dopo (da presentare quando la sanatoria avrà efficacia)"
    options: [invariato, presentata, dopo]
    when: "{{ask.sanatoria_titolo|in_scia__permesso}}"
  sanatoria_catasto_protocollo: {type: text, question: "Il numero di protocollo del DOCFA", when: "{{ask.sanatoria_titolo|in_scia__permesso}} {{ask.sanatoria_catasto|is_presentata}}"}
  sanatoria_catasto_data: {type: date, question: "La data del DOCFA", when: "{{ask.sanatoria_titolo|in_scia__permesso}} {{ask.sanatoria_catasto|is_presentata}}"}
  # The SCIA edilizia's quadro c) and the asseverazione's tipologia: works of art. 22 c. 1 a)
  # to c), a variant in corso d'opera, or a change of use (art. 23-ter, as the 2024 Salva Casa
  # changed it).
  scia_tipo:
    type: choice
    question: "Che cosa presenta la SCIA? manutenzione straordinaria (art. 3 c. 1 b: su parti strutturali o sui prospetti); restauro (c: restauro e risanamento conservativo su parti strutturali); ristrutturazione (d: una ristrutturazione edilizia che non rientra nell'art. 10 c. 1 c); variante pdc (una variante in corso d'opera a un permesso di costruire, art. 22 c. 2 e 2-bis); variante scia (una variante a una SCIA che non costituisce variazione essenziale); variante scia essenziale (una che lo è, art. 32); cambio uso (il solo cambio di destinazione d'uso, art. 23-ter)"
    options: [manutenzione straordinaria, restauro, ristrutturazione, variante pdc, variante scia, variante scia essenziale, cambio uso]
    # From the SUE rules table's answers (rules/sue-napoli.yaml), for the person to confirm.
    propose: "{{ask.intervento,ask.strutture,ask.prospetti,ask.cambio_uso|sue_scia_tipo}}"
  scia_cambio_uso:
    type: choice
    question: "I lavori comportano un mutamento della destinazione d'uso? no; stessa categoria (una singola unità, nell'ambito della stessa categoria funzionale); tra categorie (una singola unità in un edificio in zona A, B o C del DM 1444/1968, tra le categorie residenziale, turistico-ricettiva, produttiva e direzionale, commerciale: art. 23-ter c. 1-ter, oppure al piano terra ai sensi della legge regionale campana); intero immobile (un intero edificio, nell'ambito della stessa categoria: art. 23-ter c. 3); altro (un mutamento per cui i moduli nazionali non prevedono una voce: un intero edificio verso un'altra categoria, un'unità fuori dalle zone A, B e C, verso o dalla categoria rurale)"
    options: ["no", stessa categoria, tra categorie, intero immobile, altro]
    propose: "{{ask.cambio_uso|sue_scia_cambio_uso}}"
  cambio_uso_tipo:
    type: choice
    question: "Quale cambio d'uso, da solo? unita senza opere stessa categoria / unita senza opere tra categorie (una unità, senza opere o con sola edilizia libera, art. 6); unita opere 6bis stessa categoria / unita opere 6bis tra categorie (una unità, con lavori soggetti a CILA, art. 6-bis); immobile senza opere / immobile opere 6bis (un intero edificio, all'interno della stessa categoria)"
    options: [unita senza opere stessa categoria, unita senza opere tra categorie, unita opere 6bis stessa categoria, unita opere 6bis tra categorie, immobile senza opere, immobile opere 6bis]
    propose: "{{ask.intervento,ask.cambio_uso|sue_cambio_uso_tipo}}"
  # The permesso di costruire (art. 10 DPR 380/2001) and the SCIA alternativa to it (art. 23):
  # what they file, in quadro a) / c) and the progettista's asseverazione.
  pdc_tipo:
    type: choice
    question: "Che cosa chiede il permesso di costruire? nuova costruzione (art. 3 c. 1 e); ristrutturazione urbanistica (f); ristrutturazione edilizia (una di quelle dell'art. 10 c. 1 c: un organismo edilizio diverso con aumento di volume, un cambio d'uso in zona A, o modifiche di sagoma, volumi o prospetti di un edificio vincolato); facolta scia (lavori che si potrebbero presentare con SCIA, chiesti per scelta con permesso, art. 22 c. 7); variante essenziale (una variante in corso d'opera a un permesso, a una SCIA alternativa o a un titolo unico che costituisce variazione essenziale); variante sagoma (una variante a un permesso che modifica la sagoma nel centro storico, Tab. A n. 38 D.Lgs. 222/2016); sottotetti (un sottotetto reso abitabile, L.R. Campania 15/2000); parcheggi (parcheggi su aree libere, L.R. Campania 19/2001); mutamento uso (un cambio d'uso ai sensi dell'art. 2 L.R. Campania 19/2001); piano casa (L.R. Campania 19/2009, artt. 4, 5, 6-bis, 7); altro (altri lavori soggetti a permesso che nessuna di queste voci indica: quelli previsti da una legge regionale, art. 10 c. 3, indicati come li indica la relazione)"
    options: [nuova costruzione, ristrutturazione urbanistica, ristrutturazione edilizia, facolta scia, variante essenziale, variante sagoma, sottotetti, parcheggi, mutamento uso, piano casa, altro]
    propose: "{{ask.intervento,ask.cambio_uso,ask.demolizione_zona_a|sue_pdc_tipo}}"
  # How an art. 10 permesso is asked (quadro a): as such, convenzionato (art. 28-bis: a
  # convenzione with the Comune), or in deroga to the plan (art. 14: a building of public
  # interest, with the Consiglio comunale's deliberation).
  pdc_procedura:
    type: choice
    question: "Come si richiede il permesso? ordinaria (ai sensi dell'art. 10); convenzionato (permesso di costruire convenzionato, art. 28-bis DPR 380/2001); deroga (in deroga allo strumento urbanistico, art. 14: un edificio di interesse pubblico, previa deliberazione del Consiglio comunale)"
    options: [ordinaria, convenzionato, deroga]
    propose: ordinaria
    when: "{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia__altro}}"
  deroga_densita: {type: yes_no, group: deroga_parametri, item: "La densità edilizia", when: "{{ask.pdc_procedura|is_deroga}}"}
  deroga_altezza: {type: yes_no, group: deroga_parametri, item: "L'altezza", when: "{{ask.pdc_procedura|is_deroga}}"}
  deroga_distanza: {type: yes_no, group: deroga_parametri, item: "La distanza tra i fabbricati", when: "{{ask.pdc_procedura|is_deroga}}"}
  deroga_destinazione: {type: yes_no, group: deroga_parametri, item: "La destinazione d'uso", when: "{{ask.pdc_procedura|is_deroga}}"}
  deroga_densita_quale: {type: text, question: "La deroga alla densità: quanto consente il piano e quanto chiede il progetto (una riga)", when: "{{ask.pdc_procedura|is_deroga}} {{ask.deroga_densita}}"}
  deroga_altezza_quale: {type: text, question: "La deroga all'altezza: quanto consente il piano e quanto chiede il progetto (una riga)", when: "{{ask.pdc_procedura|is_deroga}} {{ask.deroga_altezza}}"}
  deroga_distanza_quale: {type: text, question: "La deroga alla distanza tra edifici: quanto consente il piano e quanto chiede il progetto (una riga)", when: "{{ask.pdc_procedura|is_deroga}} {{ask.deroga_distanza}}"}
  deroga_destinazione_quale: {type: text, question: "La deroga alla destinazione d'uso: la destinazione prevista dal piano e quella del progetto (una riga)", when: "{{ask.pdc_procedura|is_deroga}} {{ask.deroga_destinazione}}"}
  pdc_variante_di:
    type: choice
    question: "La variante essenziale si riferisce a: permesso (un permesso di costruire); scia alternativa (una SCIA o DIA alternativa al permesso); titolo unico (un titolo unico del SUAP)?"
    options: [permesso, scia alternativa, titolo unico]
    propose: permesso
    when: "{{ask.pdc_tipo|is_variante_essenziale}}"
  # Art. 2 L.R. Campania 19/2001: the asseverazione asks which.
  mutamento_lr_tipo:
    type: choice
    question: "Quale cambio d'uso ai sensi dell'art. 2 L.R. 19/2001? aumento volumetrico (con opere che aumentano la consistenza plano-volumetrica, compatibile con le categorie edilizie del piano); sagoma (con opere su sagoma, volumi e superfici, che cambiano la categoria edilizia); zona agricola (in zona E, art. 2 c. 8 e relativo regolamento)"
    options: [aumento volumetrico, sagoma, zona agricola]
    when: "{{ask.pdc_tipo|is_mutamento_uso}}"
  scia_alt_tipo:
    type: choice
    question: "Quali lavori presenta la SCIA alternativa al permesso (art. 23 c. 1 DPR 380/2001)? ristrutturazione edilizia (una di quelle dell'art. 10 c. 1 c); nuova costruzione piano attuativo (nuova costruzione o ristrutturazione urbanistica in base a un piano attuativo con precise disposizioni plano-volumetriche); nuova costruzione strumento generale (nuova costruzione direttamente in base alle precise disposizioni plano-volumetriche dello strumento urbanistico generale); regionale (lavori che la Campania aggiunge, L.R. 13/2022 art. 2 c. 6 ai sensi dell'art. 23 c. 01: un cambio d'uso urbanisticamente rilevante, con o senza opere, o un sottotetto reso abitabile; indicati come li indica la relazione tecnico-illustrativa)"
    options: [ristrutturazione edilizia, nuova costruzione piano attuativo, nuova costruzione strumento generale, regionale]
    propose: "{{ask.intervento|sue_scia_alt_tipo}}"
  intervento_tipo: {type: text, question: "Il tipo di intervento come lo indica la relazione tecnico-illustrativa (una riga)"}
  superficie_coperta_mq: {type: number, question: "La superficie coperta dell'edificio in m²"}
  barriere_accessibilita: {type: yes_no, group: barriere_requisiti, item: "Accessibilità"}
  barriere_visitabilita: {type: yes_no, group: barriere_requisiti, item: "Visitabilità"}
  barriere_adattabilita: {type: yes_no, group: barriere_requisiti, item: "Adattabilità"}
  rinnovabili: {type: yes_no, question: "Si applica l'obbligo sulle fonti rinnovabili (D.Lgs. 28/2011: un edificio nuovo o una ristrutturazione rilevante), con il suo rispetto dimostrato negli elaborati grafici e nella relazione tecnica?"}
  rinnovabili_obblighi:
    type: choice
    question: "Gli obblighi sulle fonti rinnovabili sono rispettati? rispettati (integralmente, come mostrano gli elaborati grafici); in parte (in parte: l'impossibilità tecnica per il resto è dimostrata nella relazione tecnica dell'art. 125); impossibili (tecnicamente impossibili per intero, come dimostrato nella stessa relazione)"
    options: [rispettati, in parte, impossibili]
    propose: "rispettati"
    when: "{{ask.rinnovabili}}"
  incentivo_energetico:
    type: choice
    question: "Quale incentivo energetico usa il progetto, certificato nella relazione tecnica? nessuno; art 14 c6 (D.Lgs. 102/2014: maggiori spessori di murature e coperture non computati, indice di prestazione energetica inferiore di almeno il 20%); art 14 c7 (deroga alle distanze e alle altezze, limite di trasmittanza inferiore di almeno il 10%); bonus volumetrico (D.Lgs. 28/2011 art. 12: 5% di volume in più, fonti rinnovabili che coprono più dell'obbligo)"
    options: [nessuno, art 14 c6, art 14 c7, bonus volumetrico]
    propose: "nessuno"
  acustica_passiva: {type: yes_no, question: "Si applica il DPCM 5/12/1997 sui requisiti acustici passivi degli edifici (edificio nuovo o ricostruito)?"}
  vvf_valutazione: {type: yes_no, question: "Il progetto richiede la valutazione dei Vigili del Fuoco (un'attività del DPR 151/2011 di cat. B o C, ad es. un edificio residenziale di altezza superiore a 24 m)?", propose: "false"}
  # The quadro's third line: a variant to a project the Vigili del Fuoco already approved.
  vvf_variante: {type: yes_no, question: "Si tratta di una variante a un progetto già approvato dai Vigili del Fuoco (il loro parere: protocollo e data), con modifiche che non alterano i requisiti di sicurezza antincendio approvati?", propose: "false", when: "{{ask.vvf_valutazione|not}}"}
  vvf_parere_protocollo: {type: text, question: "Il parere dei Vigili del Fuoco sul progetto: il suo numero di protocollo"}
  vvf_parere_data: {type: date, question: "La sua data"}
  scavo:
    type: choice
    question: "I lavori producono terre e rocce da scavo? nessuno (nessuno scavo soggetto alla disciplina); sottoprodotti (riutilizzate altrove come sottoprodotti, DPR 120/2017); riutilizzo in sito (riutilizzate nel sito in cui sono scavate); rifiuti (gestite come rifiuti)"
    options: [nessuno, sottoprodotti, riutilizzo in sito, rifiuti]
    # By-products are what the rules table's terre_rocce files a dichiarazione or a piano for.
    propose: "{{ask.terre_rocce|scavo_proposto}}"
  # By-products: a large site (over 6000 m³) under VIA or AIA has its Piano di Utilizzo approved
  # with them (DPR 120/2017 art. 9); any other site files the dichiarazione di utilizzo (artt. 21-22),
  # a small one even under VIA or AIA (art. 2 c. 1 t).
  scavo_piano_utilizzo: {type: yes_no, question: "Si tratta di un cantiere di grandi dimensioni (oltre 6000 m³ di terre scavate) soggetto a VIA o AIA, per cui le terre sono utilizzate secondo il Piano di Utilizzo approvato nell'ambito di tali procedure (DPR 120/2017 art. 9)? In caso contrario vale la dichiarazione di utilizzo (artt. 21-22)", when: "{{ask.scavo|is_sottoprodotti}}", propose: "{{ask.terre_rocce|piano_proposto}}"}
  scavo_via_ente: {type: text, question: "Chi ha rilasciato la VIA o l'AIA che approva il Piano di Utilizzo (ad es. Regione Campania)?"}
  scavo_via_protocollo: {type: text, question: "Il suo numero di protocollo"}
  scavo_via_data: {type: date, question: "La sua data"}
  indagini_ambientali: {type: yes_no, question: "L'area richiede prima indagini ambientali sul suolo (usi precedenti che potrebbero averlo inquinato)?", propose: "false"}
  # The permesso's and the SCIA alternativa's quadro 13: the investigations' outcome.
  indagini_esito:
    type: choice
    question: "Qual è stato l'esito delle indagini sul terreno? analisi (le analisi sono state eseguite e non serve alcuna bonifica: se ne allegano i risultati); bonifica (il terreno è stato bonificato, come attesta la certificazione di avvenuta bonifica, artt. 248 c. 2 e 242-bis c. 4 D.Lgs. 152/2006)"
    options: [analisi, bonifica]
    when: "{{ask.indagini_ambientali}}"
  indagini_analisi_doc: {type: file, question: "I risultati delle analisi ambientali del terreno (PDF)", when: "{{ask.indagini_ambientali}} {{ask.indagini_esito|is_analisi}}"}
  bonifica_ente: {type: text, question: "Chi ha rilasciato la certificazione di avvenuta bonifica (il \"rilasciata da\" del modulo, ad es. Città Metropolitana di Napoli)?", when: "{{ask.indagini_ambientali}} {{ask.indagini_esito|is_bonifica}}"}
  bonifica_data: {type: date, question: "La sua data", when: "{{ask.indagini_ambientali}} {{ask.indagini_esito|is_bonifica}}"}
  urbanizzazione: {type: yes_no,question: "L'area è dotata delle opere di urbanizzazione primaria (strade, fognature, rete idrica, energia elettrica)?", propose: "true"}
  urbanizzazione_attuazione:
    type: choice
    question: "In loro assenza, chi le realizza? comune (il Comune ne prevede la realizzazione nei prossimi tre anni); convenzione (una convenzione con il Comune ne prevede la realizzazione: la sua data)"
    options: [comune, convenzione]
    when: "{{ask.urbanizzazione|not}}"
  urbanizzazione_convenzione_data: {type: date, question: "La data di stipula della convenzione", when: "{{ask.urbanizzazione|not}} {{ask.urbanizzazione_attuazione|is_convenzione}}"}
  scarichi:
    type: choice
    question: "Gli scarichi dell'intervento: nessuna autorizzazione (non ne serve alcuna); allaccio ottenuto (l'allaccio alla fognatura pubblica è autorizzato: protocollo e data); allaccio da richiedere (si allegano i documenti della richiesta); fognatura ottenuta, fognatura da richiedere (uno scarico in pubblica fognatura autorizzato ai sensi del D.Lgs. 152/2006, ad es. acque reflue industriali: protocollo e data, oppure si allegano i documenti della richiesta); superficiali ottenuta, superficiali da richiedere (uno scarico in acque superficiali, sul suolo o nel sottosuolo, D.Lgs. 152/2006)"
    options: [nessuna autorizzazione, allaccio ottenuto, allaccio da richiedere, fognatura ottenuta, fognatura da richiedere, superficiali ottenuta, superficiali da richiedere]
    propose: "nessuna autorizzazione"
  allaccio_protocollo: {type: text, question: "L'autorizzazione all'allaccio fognario: il suo numero di protocollo"}
  allaccio_data: {type: date, question: "La sua data"}
  allaccio_doc: {type: file, question: "I documenti per l'autorizzazione all'allaccio in fognatura (PDF)"}
  scarico_protocollo: {type: text, question: "L'autorizzazione allo scarico (D.Lgs. 152/2006): il suo numero di protocollo"}
  scarico_data: {type: date, question: "La sua data"}
  scarico_doc: {type: file, question: "I documenti per l'autorizzazione allo scarico (D.Lgs. 152/2006) (PDF)"}
  autorita_bacino:
    type: choice
    question: "Secondo i piani dell'Autorità di Bacino (PSAI: rischio frana e idraulico), l'immobile è: no (in nessuna area vincolata); vincolata (soggetto a vincoli: indicati sotto); costa (soggetto alle tutele costiere: descritte sotto)"
    options: ["no", vincolata, costa]
    propose: "no"
  autorita_bacino_quale: {type: text, question: "I vincoli dell'Autorità di Bacino sull'immobile"}
  scia_variata_numero: {type: text, question: "La SCIA modificata dalla variante: il suo numero"}
  scia_variata_data: {type: date, question: "La sua data"}
  # Quadro g): the contributo di costruzione, free (the rule why) or due, how it's paid, and
  # who works it out.
  scia_onerosa: {type: yes_no, question: "È dovuto un contributo di costruzione (ad es. per un mutamento di destinazione d'uso tra categorie, o per lavori che aumentano il carico urbanistico)?", propose: "false"}
  # Art. 16 c. 2 DPR 380/2001: the holder builds the urbanisation works, a scomputo of the oneri.
  scomputo: {type: yes_no, question: "Il titolare chiede di realizzare direttamente le opere di urbanizzazione, a scomputo degli oneri dovuti (art. 16 c. 2 DPR 380/2001), allegando il progetto proposto?", propose: "false", when: "{{ask.scia_onerosa}}"}
  scomputo_doc: {type: file, question: "Il progetto proposto delle opere di urbanizzazione da realizzare a scomputo (PDF)"}
  contributo_normativa: {type: text, question: "Perché i lavori sono esenti dal contributo di costruzione (la norma, ad es. art. 17 c. 3 DPR 380/2001)"}
  contributo_pagamento:
    type: choice
    question: "Come si paga il contributo: pagato (già pagato: ricevuta allegata); prima dei lavori (ricevuta trasmessa prima dell'inizio dei lavori; per un permesso, pagato al ritiro; per una SCIA alternativa, entro 30 giorni dalla presentazione); rateizzazione (a rate, come stabilisce il Comune); in corso d'opera (il costo di costruzione pagato durante i lavori)"
    options: [pagato, prima dei lavori, rateizzazione, in corso d'opera]
  contributo_calcolo:
    type: choice
    question: "Chi calcola il contributo: prospetto (il prospetto di calcolo preventivo del progettista, allegato); sportello (il SUE, sulla base dei documenti tecnici allegati)"
    options: [prospetto, sportello]
  documentazione_calcolo_contributo: {type: file, question: "I documenti tecnici di cui il SUE ha bisogno per calcolare il contributo (PDF)"}
  # Asked only for the diritti's line (an ask's `propose` reads it; run.py needed): no box on the
  # forms takes either. A choice, not an amount, so the diritti come in the same message, one
  # proposal per answer (run.py conditional_proposals waits a round for a number).
  contributo_fascia:
    type: choice
    question: "Il contributo di costruzione (oneri di urbanizzazione + costo di costruzione), come risulta dal prospetto di calcolo"
    options: [fino_5000, "5000", da_5000_a_30000, oltre_30000]
    labels: {fino_5000: "Fino a 5.000 €", "5000": "Esattamente 5.000 €", da_5000_a_30000: "Da 5.000 a 30.000 €", oltre_30000: "Oltre 30.000 €"}
    when: "{{ask.scia_onerosa}} {{ask.contributo_calcolo|is_prospetto}}"
    why: "Le voci SUE 7-9 della tabella 2026 dei diritti SUE del Comune (G.C. 239/2026) dipendono dal contributo: fino a 5.000 € (1.003 €), da 5.000 a 30.000 € (1.505 €), oltre 30.000 € (1.998 €); esattamente 5.000 € è in due voci, quindi i diritti si chiedono"
  parcheggio_fascia:
    type: choice
    question: "La superficie del parcheggio, come indicata nella relazione tecnica"
    options: [fino_300, da_301_a_1000, oltre_1001, altro]
    labels: {fino_300: "Fino a 300 m²", da_301_a_1000: "Da 301 a 1.000 m²", oltre_1001: "Oltre 1.001 m²", altro: "Altro (tra 300 e 301 m², o tra 1.000 e 1.001 m²)"}
    when: "{{ask.pdc_tipo|is_parcheggi}}"
    why: "Le voci SUE 4-6 della tabella 2026 dei diritti SUE del Comune (G.C. 239/2026) dipendono dalla superficie del parcheggio: fino a 300 m² (677 €), da 301 a 1.000 m² (1.129 €), oltre 1.001 m² (1.998 €); la tabella non dice se lorda o netta, e tra le voci restano scoperti i decimali"
  # The SCIA's f), the SCIA alternativa's f) and the permesso's e): how the stato legittimo is
  # shown. The national form (ent_regolarita_urbanistica_scia/pdc) takes one of the five, then
  # "pienamente conforme" or "conforme ... unitamente alla sanatoria" (quadro c's sanatoria and
  # this pratica's tolerances). The permesso adds a sixth: a new construction on free land (its
  # recipes add the option).
  stato_legittimo:
    type: choice
    question: "Come dimostra il quadro f) (e) per il permesso) lo stato legittimo dell'edificio? Il modulo ne ammette una sola modalità: titoli (dai titoli edilizi o dalle pratiche dell'edificio: li elencherà); epoca (costruito quando non era richiesto alcun titolo: il catasto di primo impianto o altri documenti); prova (il titolo è andato perduto o è sconosciuto, ma ne esiste una prova documentale); sanzioni (sono state irrogate e interamente pagate sanzioni pecuniarie ai sensi degli artt. 33, 34, 37 o 38 DPR 380/2001); tolleranze (dichiarazioni di tolleranze costruttive, art. 34-bis o 34-ter c. 4)"
    options: [titoli, epoca, prova, sanzioni, tolleranze]
    propose: "titoli"
