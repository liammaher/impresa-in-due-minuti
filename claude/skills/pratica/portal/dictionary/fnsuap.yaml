    question: "La pratica sismica dei lavori (art. 93-94 DPR 380/2001, L.R. 9/1983, Reg. 4/2010)? deposito (lavori da denunciare: si allegano i documenti della denuncia); autorizzazione (si allegano i documenti per l'autorizzazione sismica); variante (una variante non sostanziale a un progetto strutturale già depositato, art. 12 Reg. 4/2010)"
    options: [deposito, autorizzazione, variante]
