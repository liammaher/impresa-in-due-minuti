  # The systems, the energy report (filed with the comunicazione di inizio lavori) and the
  # renewables obligation; never the piano casa (closed to new requests since 30 September
  # 2022, L.R. 31/2021 art. 28 c. 6).
  - section: Asseverazione PdC - sicurezza impianti
    law: ["rientra tra quelli previsti dalla l.r. n. 19/2009", si allega la valutazione della sostenibilità energetico-ambientale]
    fields:
      - {kind: radio, label: Non comporta l'installazione, when: "{{ask.impianti|not}}"}
      - {kind: radio, label: "Comporta l'installazione, la trasformazione", when: "{{ask.impianti}}"}
