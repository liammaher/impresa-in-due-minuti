  accertamento_data: {type: date, question: "Quando sono stati eseguiti i lavori"}
  # The domanda di parere per esonero dall'autorizzazione paesaggistica (Allegato A of DPR
  # 31/2017): the building's lawful state, the item the works fall under, the ente asked.
  esonero_lotto:
    type: choice
    question: "Il lotto è libero (non edificato) o esiste un titolo edilizio precedente? libero; precedente (tipo, numero di P.G. e data vengono chiesti subito dopo)"
    options: [libero, precedente]
  precedente_tipo: {type: text, question: "Il titolo dell'edificio stesso: il tipo (licenza edilizia, concessione, permesso di costruire, ...)"}
  esonero_altri_titoli: {type: yes_no, question: "L'edificio ha più di un titolo precedente?", propose: "false"}
  esonero_conformita:
    type: choice
    question: "Lo stato attuale dei luoghi corrisponde allo stato legittimo? conforme (nulla è cambiato dall'ultimo titolo); non conforme (opere difformi, la cui data viene chiesta subito dopo); altro (un altro caso, in poche parole)"
    options: [conforme, non conforme, altro]
    when: "{{ask.esonero_lotto|is_precedente}}"
  esonero_difformi_data: {type: date, question: "Quando sono state eseguite le opere difformi"}
  esonero_conformita_altro: {type: text, question: "L'altro caso, in poche parole (100 caratteri)"}
  esonero_prova:
    type: choice
    question: "Cos'altro attesta lo stato legittimo? titoli (nient'altro: non esiste alcun altro titolo edilizio); documentazione (altri documenti probanti, allegati ed elencati di seguito); catasto (gli atti di primo accatastamento, allegati ed elencati di seguito)"
    options: [titoli, documentazione, catasto]
  esonero_prova_elenco: {type: text, question: "L'elenco dei documenti allegati (350 caratteri)"}
