  # The other technicians (`a:`, `a2:` ...), each registered with an order or a firm's
  # employee: the block "di aver incaricato" opens, the G1 block's labels after "Incaricato
  # della", then two si/no (registered: the order's boxes; a firm's employee: the firm's) and
  # the abilitazione, left empty for a registered technician. With none appointed nothing is
  # ticked, as before: "saranno individuati" says some will be (with or without those named).
  - section: G2) Altri tecnici incaricati
    leave: [fax, "Estremi dell'abilitazione"]
    fields:
      - {kind: checkbox, label: che gli altri tecnici incaricati saranno individuati, when: "{{ask.altri_tecnici_dopo}}"}
      - {kind: checkbox, label: di aver incaricato in qualità di altri tecnici, when: "{{ask.altri_tecnici}}"}
      # One block per technician, each after the first by "+". An employee's studio is the
      # employer's seat (ad, ad2 ...: the firm of "alle dipendenze di").
      - kind: each
        count: "{{ask.altri_tecnici_quanti}}"
        when: "{{ask.altri_tecnici}}"
        block:
          - {kind: text, label: Incaricato della, value: "{{ask.altro_tecnico#N_incarico}}"}
          - {kind: text, label: Cognome, value: "{{a#N:identity.last_name|upper}}"}
          - {kind: text, label: Nome, value: "{{a#N:identity.first_name|upper}}"}
          - {kind: text, label: C.F., value: "{{a#N:identity.codice_fiscale}}"}
          - {kind: date, label: Data di nascita, value: "{{a#N:identity.date_of_birth|date_it}}"}
          - {kind: select, label: Cittadinanza, value: ITALIA}
          - {kind: select, label: Sesso, value: "{{a#N:identity.sex|sesso}}"}
          - {kind: select, label: Stato, value: ITALIA}
          - {kind: select, label: Provincia, value: "{{a#N:identity.birth_province}}"}
          - {kind: text, label: Comune italiano, value: "{{a#N:identity.birth_comune|upper}}"}
          - {kind: select, label: Stato, nth: 2, value: ITALIA}
          - {kind: select, label: Provincia, nth: 2, value: "{{a#N:residenza.provincia}}"}
          - {kind: text, label: Comune italiano, nth: 2, value: "{{a#N:residenza.comune|upper}}"}
          - {kind: text, label: "Via, Piazza", value: "{{a#N:residenza.indirizzo|upper}}"}
          - {kind: text, label: "N.", value: "{{a#N:residenza.civico}}"}
          - {kind: text, label: C.A.P., value: "{{a#N:residenza.cap}}"}
          - {kind: select, label: Stato, nth: 3, value: ITALIA}
          - {kind: select, label: Provincia, nth: 3, value: "{{a#N:business.sede_legale_provincia}}", when: "{{ask.altro_tecnico#N_dipendente|not}}"}
          - {kind: text, label: Comune italiano, nth: 3, value: "{{a#N:business.sede_legale_comune|upper}}", when: "{{ask.altro_tecnico#N_dipendente|not}}"}
          - {kind: text, label: "Via, Piazza", nth: 2, value: "{{a#N:business.sede_legale_indirizzo|upper}}", when: "{{ask.altro_tecnico#N_dipendente|not}}"}
          - {kind: text, label: "N.", nth: 2, value: "{{a#N:business.sede_legale_civico}}", when: "{{ask.altro_tecnico#N_dipendente|not}}"}
          - {kind: text, label: C.A.P., nth: 2, value: "{{a#N:business.sede_legale_cap}}", when: "{{ask.altro_tecnico#N_dipendente|not}}"}
          - {kind: select, label: Provincia, nth: 3, value: "{{ad#N:business.sede_legale_provincia}}", when: "{{ask.altro_tecnico#N_dipendente}}"}
          - {kind: text, label: Comune italiano, nth: 3, value: "{{ad#N:business.sede_legale_comune|upper}}", when: "{{ask.altro_tecnico#N_dipendente}}"}
          - {kind: text, label: "Via, Piazza", nth: 2, value: "{{ad#N:business.sede_legale_indirizzo|upper}}", when: "{{ask.altro_tecnico#N_dipendente}}"}
          - {kind: text, label: "N.", nth: 2, value: "{{ad#N:business.sede_legale_civico}}", when: "{{ask.altro_tecnico#N_dipendente}}"}
          - {kind: text, label: C.A.P., nth: 2, value: "{{ad#N:business.sede_legale_cap}}", when: "{{ask.altro_tecnico#N_dipendente}}"}
          - {kind: text, label: Telefono, value: "{{a#N:identity.phone|phone_it}}"}
          - {kind: text, label: cell., value: "{{a#N:identity.phone|phone_it}}"}
          - {kind: text, label: posta elettronica certificata, value: "{{a#N:identity.pec}}"}
          - {kind: radio, label: si}
          - {kind: text, label: Iscritto all'ordine/collegio, value: "{{a#N:albo.ordine}}", on_page: true}
          - {kind: text, label: di, value: "{{a#N:albo.provincia|provincia_nome}}", on_page: true}
          - {kind: text, label: al n., value: "{{a#N:albo.numero}}", on_page: true}
          - {kind: radio, label: "no", nth: 2, when: "{{ask.altro_tecnico#N_dipendente|not}}"}
          - {kind: radio, label: si, nth: 2, when: "{{ask.altro_tecnico#N_dipendente}}"}
          - {kind: text, label: Ragione sociale, value: "{{ad#N:business.denominazione}}", on_page: true, when: "{{ask.altro_tecnico#N_dipendente}}"}
          - {kind: text, label: codice fiscale / p. IVA, value: "{{ad#N:business.partita_iva}}", on_page: true, when: "{{ask.altro_tecnico#N_dipendente}}"}
          - {kind: select, label: Iscritta alla C.C.I.A.A. di, value: "{{ad#N:business.cciaa}}", on_page: true, when: "{{ask.altro_tecnico#N_dipendente}}"}
          - {kind: text, label: con sede in, value: "{{ad#N:business.sede_legale_comune|upper}}", on_page: true, when: "{{ask.altro_tecnico#N_dipendente}}"}
