  # Shared by the permesso, the SCIA and the SCIA alternativa: art. 8 L. 447/1995 (its documents
  # ticked as attached) and the passive acoustic requirements asked apart, the excavated earth,
  # fire prevention (a deroga asked, or the Vigili del Fuoco's assessment, with its documents).
  - section: Asseverazione PdC - inquinamento acustico
    aliases: ["Asseverazione SCIA Alternativa - Inquinamento acustico", "Asseverazione SCIA - Inquinamento acustico"]
    # The SCIA's by-products under VIA or AIA up to 6000 m³ with a Piano di Utilizzo (DM 161/2012):
    # repealed by DPR 120/2017 (art. 31), under which a site that small files the dichiarazione
    # di utilizzo even under VIA or AIA (art. 2 c. 1 t, art. 21). The permesso's line is the
    # large site's.
    law: ["le opere comportano la produzione di materiali da scavo per un volume inferiore o uguale a 6000", si comunicano gli estremi del provvedimento di VIA o AIA]
    # The materiali di risulta and the terre e rocce filings say the same thing (DPR 120/2017): soil
    # leaving the site as a by-product is filed (the dichiarazione with the title, the piano apart),
    # and a filing is for by-products.
    supports:
      - {if: "{{ask.scavo|is_sottoprodotti}}", value: "{{ask.terre_rocce}}", in: [dichiarazione, piano], else: "L'asseverazione dichiara sottoprodotti, ma la pratica non ha né la dichiarazione di utilizzo né il piano (alle terre e rocce ha risposto no). Le terre sono sottoprodotto solo con l'una o l'altro (DPR 120/2017 artt. 9, 21)."}
      - {if: "{{ask.terre_rocce|in_dichiarazione__piano}}", value: "{{ask.scavo}}", in: [sottoprodotti], else: "La pratica presenta la dichiarazione o il piano delle terre e rocce, quindi i materiali di risulta dell'asseverazione devono essere dichiarati come sottoprodotti."}
      - {if: "{{ask.scavo|is_sottoprodotti}} {{ask.terre_rocce|is_piano}}", value: "{{ask.scavo_piano_utilizzo}}", in: ["true"], else: "Il piano di utilizzo riguarda un cantiere di oltre 6000 m³ soggetto a VIA o AIA: la voce dell'asseverazione per i cantieri di grandi dimensioni."}
      - {if: "{{ask.scavo|is_sottoprodotti}} {{ask.terre_rocce|is_dichiarazione}}", value: "{{ask.scavo_piano_utilizzo}}", in: ["false"], else: "La dichiarazione di utilizzo riguarda un cantiere fino a 6000 m³ o uno non soggetto a VIA/AIA: non la voce dell'asseverazione per i grandi cantieri."}
    fields:
      - {kind: radio, label: Non rientra nell'ambito di applicazione dell'articolo 8, when: "{{ask.acustica|not}}"}
      - {kind: radio, label: Rientra nell'ambito di applicazione dell'articolo 8, when: "{{ask.acustica}}"}
      - {kind: checkbox, label: documentazione di impatto acustico, when: "{{ask.acustica}} {{ask.acustica_impatto}}"}
      - {kind: checkbox, label: valutazione previsionale di clima acustico, when: "{{ask.acustica}} {{ask.acustica_clima}}"}
      - {kind: checkbox, label: dichiarazione sostitutiva dell'atto di notorietà, when: "{{ask.acustica}} {{ask.acustica_dichiarazione}}"}
      # The permesso's starts with its article.
      - {kind: checkbox, label: la documentazione di previsione di impatto acustico, if_present: true, when: "{{ask.acustica}} {{ask.acustica_misure}}"}
      - {kind: checkbox, label: "(art. 4, commi 1 e 2, d.P.R. 227/2011)", if_present: true, when: "{{ask.acustica}} {{ask.acustica_misure}}"}
      - {kind: radio, label: non rientra nell'ambito dell'applicazione del d.P.C.M., when: "{{ask.acustica_passiva|not}}"}
