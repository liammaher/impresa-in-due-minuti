  # The agibilità's statics (art. 24 c. 5 b) DPR 380/2001): the collaudo statico of art. 67,
  # or for repairs and local works (art. 67 c. 8-bis) and the works of art. 94-bis c. 1 b) 2)
  # and c) 1) (c. 8-ter) the direttore dei lavori's dichiarazione di regolare esecuzione.
  collaudo:
    type: choice
    question: "I lavori hanno interessato le strutture: con cosa si chiudono? certificato allegato (il certificato di collaudo statico, art. 67 DPR 380/2001, allegato); certificato estremi (se ne indicano gli estremi: dove si trova, protocollo e data); regolare esecuzione allegata (per riparazioni e interventi locali, art. 67 c. 8-bis e 8-ter: la dichiarazione di regolare esecuzione del direttore dei lavori, allegata); regolare esecuzione estremi (se ne indicano gli estremi); non soggetto (interventi strutturali minori non soggetti a collaudo, come dice la casella del modulo: p.to 8.4.3 D.M. 14 gennaio 2008)"
    options: [certificato allegato, certificato estremi, regolare esecuzione allegata, regolare esecuzione estremi, non soggetto]
    when: "{{ask.strutture}}"
