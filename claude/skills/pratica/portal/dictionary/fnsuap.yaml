      - {kind: checkbox, label: "mutamento di destinazione d'uso, nel rispetto", when: "{{ask.scia_tipo|is_cambio_uso}} {{ask.cambio_uso_tipo|is_unita_opere_6bis_stessa_categoria}}"}
      - {kind: radio, label: "con opere riconducibili agli interventi di cui all'articolo 6-bis di singola unità immobiliare all", when: "{{ask.scia_tipo|is_cambio_uso}} {{ask.cambio_uso_tipo|is_unita_opere_6bis_stessa_categoria}}"}
      - {kind: checkbox, label: "mutamento di destinazione d'uso, nel rispetto", when: "{{ask.scia_tipo|is_cambio_uso}} {{ask.cambio_uso_tipo|is_unita_opere_6bis_tra_categorie}}"}
      - {kind: radio, label: "con opere riconducibili agli interventi di cui all'articolo 6-bis di singola unità immobiliare tra", when: "{{ask.scia_tipo|is_cambio_uso}} {{ask.cambio_uso_tipo|is_unita_opere_6bis_tra_categorie}}"}
