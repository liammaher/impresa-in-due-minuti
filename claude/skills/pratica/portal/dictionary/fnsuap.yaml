  igienico_conforme: {type: yes_no, question: "L'unità rispetta i requisiti igienico-sanitari (senza deroghe)?", propose: "true"}
  igienico_24_5bis: {type: yes_no, question: "Li rispetta ai sensi dell'art. 24 c. 5-bis DPR 380/2001 (locali di altezza da 2,40 a 2,70 m, o un monolocale da 20 a 28 m² per una persona o da 28 a 38 m² per due)?", propose: "false"}
  # Each case opens its own copy of art. 24 c. 5-ter's conditions below it (seen 2026-10-29):
  # one case per pratica is mapped (the recipe refuses more).
  igienico_5bis_caso:
    type: choice
    question: "Quale caso dell'art. 24 c. 5-bis? altezza (locali con altezza minima interna inferiore a 2,70 m ma di almeno 2,40 m, lett. a); monostanza uno (alloggio monostanza per una persona, di almeno 20 m² ma inferiore a 28 m² compresi i servizi, lett. b); monostanza due (per due persone, di almeno 28 m² ma inferiore a 38 m²); altezza e monostanza uno, altezza e monostanza due (entrambi i casi: un monostanza con altezza ridotta)"
    options: [altezza, monostanza uno, monostanza due, altezza e monostanza uno, altezza e monostanza due]
  igienico_adattabilita: {type: yes_no, question: "I locali rispettano il requisito di adattabilità del DM 236/1989 (art. 24 c. 5-ter DPR 380/2001)?"}
  igienico_5ter:
    type: choice
    question: "Quale condizione dell'art. 24 c. 5-ter ricorre? recupero (l'edificio è oggetto di interventi di recupero edilizio che ne migliorano le condizioni igienico-sanitarie, lett. a); progetto alternativo (gli elaborati allegati comprendono un progetto di ristrutturazione con soluzioni alternative per gli occupanti: maggiore superficie, o migliore aerazione naturale, lett. b)"
    options: [recupero, progetto alternativo]
  igienico_deroga_doc: {type: file, question: "I documenti per la richiesta di deroga igienico-sanitaria (PDF)"}
  # Art. 24 c. 5-quater: the minimum heights and surfaces another law lets the unit go below.
  igienico_5quater: {type: yes_no, question: "L'unità rispetta invece i requisiti igienico-sanitari in base a una deroga alle altezze o superfici minime consentita da un'altra legge o provvedimento (art. 24 c. 5-quater DPR 380/2001: come la L.R. Campania 15/2000 per i sottotetti)?", propose: "false"}
  igienico_5quater_atto: {type: text, question: "Quella legge o quel provvedimento, come lo denomina il modulo (il provvedimento di cui i lavori rispettano i requisiti)"}
