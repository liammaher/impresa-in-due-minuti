  sismica_protocollo: {type: text, question: "Il deposito del progetto strutturale: il suo numero di protocollo"}
  sismica_data: {type: date, question: "La sua data"}
  # The protections of the SCIA's asseverazione, as its four quadri ask them (the national
  # form: tutela storico-ambientale, ecologica, other vincoli, tutela funzionale). The
  # progettista knows them from the PRG's and the Comune's maps; each is theirs to say.
  paesaggio:
    type: choice
    question: "L'immobile è sottoposto a tutela paesaggistica (D.Lgs. 42/2004 parte III: art. 136, art. 142 o piano paesaggistico), e cosa richiedono i lavori? no (non tutelato); senza autorizzazione (tutelato, ma i lavori non alterano lo stato dei luoghi né l'aspetto esteriore degli edifici, o non richiedono autorizzazione: art. 149, DPR 31/2017 Allegato A); semplificata (DPR 31/2017 Allegato B); ordinaria (art. 146); proroga (i lavori hanno già un'autorizzazione in vigore che scade prima che finiscano, e non contrastano con un piano o una misura di tutela adottati nel frattempo: la sua proroga, art. 10-septies, presentata con il titolo); rinnovo (l'autorizzazione è scaduta da non più di un anno, i lavori non sono stati fatti o lo sono in parte, il progetto è invariato o con varianti minime: il suo rinnovo, art. 7 DPR 31/2017, presentato con il titolo; varianti non minime richiedono l'ordinaria, art. 7 c. 2)"
    options: ["no", senza autorizzazione, semplificata, ordinaria, proroga, rinnovo]
