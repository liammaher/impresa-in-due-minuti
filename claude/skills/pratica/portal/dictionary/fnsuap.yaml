  # Quadro f): paid when the permesso is collected ("prima dei lavori"), in instalments or
  # during the works; the opere a scomputo asked or not.
  - section: Calcolo del contributo di costruzione
    leave: [ai sensi della seguente normativa]
    fields:
      - {kind: radio, label: è a titolo gratuito, when: "{{ask.scia_onerosa|not}}"}
      - {kind: text, label: ai sensi della seguente normativa, value: "{{ask.contributo_normativa}}", when: "{{ask.scia_onerosa|not}}"}
      - {kind: radio, label: è a titolo oneroso, when: "{{ask.scia_onerosa}}"}
      - {kind: radio, label: chiede allo Sportello Unico di effettuare il calcolo, when: "{{ask.scia_onerosa}} {{ask.contributo_calcolo|is_sportello}}"}
      # Read on a filled draft 2026-11-01: the permesso adds no slot for the prospetto (the SCIA's does).
      - {kind: radio, label: allega il prospetto di calcolo preventivo, when: "{{ask.scia_onerosa}} {{ask.contributo_calcolo|is_prospetto}}", slot: "none of its own: Allegati liberi"}
      - {kind: radio, label: dichiara che il versamento del contributo di costruzione sarà effettuato al momento del ritiro, when: "{{ask.scia_onerosa}} {{ask.contributo_pagamento|is_prima_dei_lavori}}"}
      - {kind: radio, label: chiede la rateizzazione del contributo, when: "{{ask.scia_onerosa}} {{ask.contributo_pagamento|is_rateizzazione}}"}
      - {kind: radio, label: si impegna a corrispondere il costo di costruzione, when: "{{ask.scia_onerosa}} {{ask.contributo_pagamento|is_in_corso_d_opera}}"}
      # The opere a scomputo's SI/NO open only under "a titolo oneroso" (disabled otherwise: a free
      # permesso stopped twice on clicking it, 2026-10-31 and 11-01).
      # "SI" is also the start of "si impegna a corrispondere" above it: the second "si".
      - {kind: radio, label: SI, nth: 2, when: "{{ask.scia_onerosa}} {{ask.scomputo}}"}
      - {kind: radio, label: "NO", when: "{{ask.scia_onerosa}} {{ask.scomputo|not}}"}

