      - {kind: select, label: Estremi del titolo posseduto, value: "{{ask.titolo_attivita_tipo}}", when: "{{ask.alcol_con_scia|not}}"}
      - {kind: text, label: presentata/rilasciata al/dal Comune/SUAP di, value: "{{locale.comune}}", when: "{{ask.alcol_con_scia|not}}"}
      - {kind: date, label: in data, value: "{{ask.titolo_attivita_data|date_it}}", when: "{{ask.alcol_con_scia|not}}"}
      - {kind: text, label: prot. N°, value: "{{ask.titolo_attivita_protocollo}}", when: "{{ask.alcol_con_scia|not}}"}
      - {kind: text, label: codice ATECO e descrizione dell'attività svolta, value: "{{ask.ateco_descrizione}}", when: "{{ask.alcol_con_scia|not}}"}

  # An outside sign (the wizard's "insegna esterna" tick: a SCIA per mezzi pubblicitari inside the
  # pratica): the business's title to the building, the sign, protections, where it goes, and the
  # person's own statements. Without exclusive title (the owner's data and assent) and on a
  # protected building recipes refuse, as their own authorizations aren't mapped.
  - section: TITOLARITA' DELL'INTERVENTO
    fields:
      - {kind: select, label: "Il/La Sottoscritto/a dichiara di avere titolo", value: "{{ask.insegna_titolo_tipo}}"}
