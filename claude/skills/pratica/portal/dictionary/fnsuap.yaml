      # recipe refuses none: this form can't say so).
      - {kind: checkbox, label: "ricade nell'articolo 14, comma 6", when: "{{ask.incentivo_energetico|is_art_14_c6}}"}
      - {kind: checkbox, label: si certifica nella relazione tecnica una riduzione minima del 20, when: "{{ask.incentivo_energetico|is_art_14_c6}}"}
      - {kind: checkbox, label: "ricade nell'articolo 14, comma 7", when: "{{ask.incentivo_energetico|is_art_14_c7}}"}
      - {kind: checkbox, label: si certifica nella relazione tecnica una riduzione minima del 10, when: "{{ask.incentivo_energetico|is_art_14_c7}}"}
      - {kind: checkbox, label: "ricade nell'articolo 12, comma 1", when: "{{ask.incentivo_energetico|is_bonus_volumetrico}}"}
      - {kind: checkbox, label: si certifica nella relazione tecnica una copertura, when: "{{ask.incentivo_energetico|is_bonus_volumetrico}}"}
      - {kind: radio, label: non rientra tra quelli previsti dalla l.r. n. 19/2009}

