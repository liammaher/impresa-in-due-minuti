  - section: Asseverazione PdC - Dati progettista
    leave: [che i lavori riguardano l'immobile individuato]
    # Its change-of-use line, required, as the SCIA alternativa's (cambio-uso-regionale).
    supports:
      - {value: "{{ask.scia_cambio_uso}}", in: ["no", stessa categoria, tra categorie, intero immobile], defect: cambio-uso-regionale, else: "Il modulo non ha una voce per questo cambio d'uso della legge campana (un intero edificio verso un'altra categoria, un'unità fuori dalle zone A, B e C, da o verso il rurale): è un difetto del modulo; chieda al SUE."}

    # The piano casa: closed to new requests (quadro a's note).
    law: ["Opere edilizie straordinarie di cui alla l.r. n. 19/2009", interventi straordinari di ampliamento, ampliamento fino al venti per cento, modifica della destinazione d'uso da volumetria esistente non residenziale, realizzazione di opere interne finalizzate all'utilizzo dei volumi esistenti, interventi straordinari di demolizione e ricostruzione, aumento entro il limite del trentacinque per cento, ricostruzione a parità di volume, interventi edilizi in zona agricola (articolo 6-bis), mutamento di destinazione d'uso di immobili o loro parti per uso residenziale, realizzazione di nuove costruzioni ad uso produttivo, riqualificazione di aree urbane degradate (articolo 7), mutamento di destinazione d'uso ai fini abitativi, ricostruzione in sito di edifici diruti]
    fields:
      - {kind: text, label: Cognome, value: "{{t:identity.last_name}}", when: "{{ask.progettista_altro|not}}"}
      - {kind: text, label: Nome, value: "{{t:identity.first_name}}", when: "{{ask.progettista_altro|not}}"}
      - {kind: text, label: Iscritto all'ordine, value: "{{t:albo.ordine}}", when: "{{ask.progettista_altro|not}}"}
      - {kind: text, label: di, value: "{{t:albo.provincia|provincia_nome}}", when: "{{ask.progettista_altro|not}}"}
      - {kind: text, label: al n., value: "{{t:albo.numero}}", when: "{{ask.progettista_altro|not}}"}
      - {kind: text, label: Cognome, value: "{{p:identity.last_name}}", when: "{{ask.progettista_altro}}"}
      - {kind: text, label: Nome, value: "{{p:identity.first_name}}", when: "{{ask.progettista_altro}}"}
      - {kind: text, label: Iscritto all'ordine, value: "{{p:albo.ordine}}", when: "{{ask.progettista_altro}}"}
      - {kind: text, label: di, value: "{{p:albo.provincia|provincia_nome}}", when: "{{ask.progettista_altro}}"}
      - {kind: text, label: al n., value: "{{p:albo.numero}}", when: "{{ask.progettista_altro}}"}
      # Two radios with their own names, but the portal keeps one: the tipologia's.
      - {kind: radio, label: che le opere in progetto sono subordinate a rilascio}
      - {kind: checkbox, label: Intervento di nuova costruzione, when: "{{ask.pdc_tipo|is_nuova_costruzione}}"}
      - {kind: checkbox, label: costruzione di manufatti edilizi fuori terra o interrati, on_page: true, when: "{{ask.pdc_tipo|is_nuova_costruzione}} {{ask.nuova_costruzione_tipo|is_e1}}"}
      - {kind: checkbox, label: urbanizzazione primaria e secondaria realizzati, on_page: true, when: "{{ask.pdc_tipo|is_nuova_costruzione}} {{ask.nuova_costruzione_tipo|is_e2}}"}
      - {kind: checkbox, label: realizzazione di infrastrutture e di impianti, on_page: true, when: "{{ask.pdc_tipo|is_nuova_costruzione}} {{ask.nuova_costruzione_tipo|is_e3}}"}
      - {kind: checkbox, label: installazione di torri e tralicci, on_page: true, when: "{{ask.pdc_tipo|is_nuova_costruzione}} {{ask.nuova_costruzione_tipo|is_e4}}"}
      - {kind: checkbox, label: installazione di manufatti leggeri, on_page: true, when: "{{ask.pdc_tipo|is_nuova_costruzione}} {{ask.nuova_costruzione_tipo|is_e5}}"}
      - {kind: checkbox, label: interventi pertinenziali che le norme tecniche, on_page: true, when: "{{ask.pdc_tipo|is_nuova_costruzione}} {{ask.nuova_costruzione_tipo|is_e6}}"}
      - {kind: checkbox, label: realizzazione di depositi di merci, on_page: true, when: "{{ask.pdc_tipo|is_nuova_costruzione}} {{ask.nuova_costruzione_tipo|is_e7}}"}
      - {kind: checkbox, label: Interventi di ristrutturazione urbanistica, when: "{{ask.pdc_tipo|is_ristrutturazione_urbanistica}}"}
      - {kind: checkbox, label: Interventi di ristrutturazione edilizia che portino, when: "{{ask.pdc_tipo|is_ristrutturazione_edilizia}}"}
      - {kind: checkbox, label: interventi assoggettati a Segnalazione Certificata di Inizio Attività, when: "{{ask.pdc_tipo|is_facolta_scia}}"}
      # The box this tick opens (seen by the 2026-10-30 crawl, which tries a box once it's switched
      # on): which SCIA works, as quadro a)'s specificare.
      - {kind: text, label: specificare tipo intervento, value: "{{ask.intervento_tipo}}", when: "{{ask.pdc_tipo|is_facolta_scia}}"}
      - {kind: checkbox, label: Varianti in corso d'opera a permessi di costruire, when: "{{ask.pdc_tipo|is_variante_essenziale}}"}
      # The convenzionato goes with its works' kind; a Campania kind stands alone.
      - {kind: checkbox, label: Permesso di costruire convenzionato, when: "{{ask.pdc_tipo|in_nuova_costruzione__ristrutturazione_urbanistica__ristrutturazione_edilizia}} {{ask.pdc_procedura|is_convenzionato}}"}
      - {kind: checkbox, label: Interventi di recupero abitativo dei sottotetti, when: "{{ask.pdc_tipo|is_sottotetti}}"}
      - {kind: checkbox, label: Realizzazione di parcheggi in aree libere, when: "{{ask.pdc_tipo|is_parcheggi}}"}
      - {kind: checkbox, label: "Mutamento di destinazione d'uso, ai sensi dell'articolo 2", when: "{{ask.pdc_tipo|is_mutamento_uso}}"}
      - {kind: checkbox, label: con opere che determinino un aumento plano volumetrico, on_page: true, when: "{{ask.pdc_tipo|is_mutamento_uso}} {{ask.mutamento_lr_tipo|is_aumento_volumetrico}}"}
      - {kind: checkbox, label: con opere che incidano sulla sagoma, on_page: true, when: "{{ask.pdc_tipo|is_mutamento_uso}} {{ask.mutamento_lr_tipo|is_sagoma}}"}
      - {kind: checkbox, label: nelle zone agricole, on_page: true, when: "{{ask.pdc_tipo|is_mutamento_uso}} {{ask.mutamento_lr_tipo|is_zona_agricola}}"}
      - {kind: checkbox, label: Varianti a permessi di costruire comportanti modifica della sagoma, when: "{{ask.pdc_tipo|is_variante_sagoma}}"}
      - {kind: checkbox, label: altro non indicato nei punti precedenti, when: "{{ask.pdc_tipo|is_altro}}"}
      - {kind: text, label: "specificare:", value: "{{ask.intervento_tipo}}", when: "{{ask.pdc_tipo|is_altro}}"}
      - {kind: radio, label: non comportano mutamento di destinazione d’uso, when: "{{ask.scia_cambio_uso|is_no}}"}
      - {kind: radio, label: comportano mutamento di destinazione d’uso di una singola unità immobiliare all’interno, when: "{{ask.scia_cambio_uso|is_stessa_categoria}}"}
      - {kind: radio, label: "comportano mutamento di destinazione d’uso di una singola unità immobiliare, ubicata", when: "{{ask.scia_cambio_uso|is_tra_categorie}}"}
      - {kind: radio, label: comportano mutamento di destinazione d’uso di un intero immobile, when: "{{ask.scia_cambio_uso|is_intero_immobile}}"}
      - {kind: textarea, label: e che consistono in, value: "{{ask.dettaglio_intervento}}"}  # its own text: the counter changes
      - {kind: checkbox, label: che la richiesta di permesso di costruire è presentata in sanatoria, by_label: true, when: "{{ask.sanatoria_titolo|is_permesso}}"}

  # The building's surfaces and storeys, its plans, and the barriers rules (which a new
