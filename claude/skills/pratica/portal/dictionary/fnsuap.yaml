  # The permesso's protections: no box to attach for a bene culturale (the SUE asks the
  # Soprintendenza), the park's nulla osta request attached. A landscape authorization is its
  # own operation on Napoli's SUE, selected with the permesso in one pratica: the asseverazione
  # names its procedure, as the SCIA's does. Its landscape compatibility of art. 36-bis c. 4 (works
  # done without the landscape authorization) is only for the cases of art. 36-bis c. 1, which the
  # permesso's asseverazione can't state (defects.yaml pdc-36bis): refused with it, never ticked.
  # A permesso in sanatoria of art. 36 has its compatibility from the accertamento of art. 167,
  # the pratica's other operation (rehearsals/pdc-sanatoria-accertamento-fittizio): the quadro says
  # the works alter the place, and none of its three procedures is that one, so none is ticked.
  # The portal then refuses Salva (2026-11-02): the recipe refuses the case (defects.yaml pdc-36-paesaggio).
  - section: Asseverazione PdC - tutela storico ambientale
    defect:
      pdc-36bis: ["è assoggettato al procedimento di accertamento della compatibilità paesaggistica di cui all", "si allega documentazione necessaria ai fini del rilascio del parere vincolante"]
    fields:
      - {kind: radio, label: NON ricade in zona sottoposta a tutela, when: "{{ask.paesaggio|is_no}}"}
      - {kind: radio, label: "ricade in zona tutelata, ma le opere non comportano alterazione", when: "{{ask.paesaggio|is_senza_autorizzazione}}"}
      - {kind: radio, label: ricade in zona tutelata e le opere comportano alterazione, when: "{{ask.paesaggio_accertamento}} {{ask.paesaggio|in_semplificata__ordinaria}}"}
      - {kind: radio, label: ricade in zona tutelata e le opere comportano alterazione, when: "{{ask.sanatoria_paesaggio|not}} {{ask.paesaggio_accertamento|not}} {{ask.paesaggio|in_semplificata__proroga__rinnovo}}"}
      - {kind: radio, label: è assoggettato al procedimento semplificato, when: "{{ask.sanatoria_paesaggio|not}} {{ask.paesaggio_accertamento|not}} {{ask.paesaggio|in_semplificata__proroga__rinnovo}}"}
      # What each box adds on Allega documenti: as the SCIA's (read on the permesso's filled drafts 2026-11-01).
      - {kind: checkbox, label: Si allega la relazione paesaggistica semplificata, when: "{{ask.sanatoria_paesaggio|not}} {{ask.paesaggio_accertamento|not}} {{ask.paesaggio|in_semplificata__proroga__rinnovo}}", slot: "Relazione paesaggistica semplificata e documentazione necessaria"}
      - {kind: radio, label: ricade in zona tutelata e le opere comportano alterazione, when: "{{ask.sanatoria_paesaggio|not}} {{ask.paesaggio_accertamento|not}} {{ask.paesaggio|is_ordinaria}}"}
      - {kind: radio, label: è assoggettato al procedimento ordinario, when: "{{ask.sanatoria_paesaggio|not}} {{ask.paesaggio_accertamento|not}} {{ask.paesaggio|is_ordinaria}}"}
      - {kind: checkbox, label: Si allega la relazione paesaggistica e la documentazione, when: "{{ask.sanatoria_paesaggio|not}} {{ask.paesaggio_accertamento|not}} {{ask.paesaggio|is_ordinaria}}", slot: "Relazione paesaggistica e documentazione per il rilascio"}
      - {kind: radio, label: non è sottoposto a tutela, when: "{{ask.bene_culturale|not}}"}
      - {kind: radio, label: è sottoposto a tutela, when: "{{ask.bene_culturale}}"}
      - {kind: radio, label: non ricade in area tutelata, when: "{{ask.area_protetta|is_no}}"}
      - {kind: radio, label: "ricade in area tutelata, ma le opere non comportano alterazione", when: "{{ask.area_protetta|is_senza_alterazione}}"}
      - {kind: radio, label: è sottoposto alle relative disposizioni, when: "{{ask.area_protetta|is_nulla_osta}}"}
      - {kind: checkbox, label: "Si allega la documentazione necessaria ai fini del rilascio del parere/nulla osta", when: "{{ask.area_protetta|is_nulla_osta}}"}

  # As the SCIA alternativa's, with the Autorità di Bacino's plans after them.
  - section: Asseverazione PdC - aree a rischio e altri vincoli
    fields:
      - {kind: radio, label: nel comune NON è presente, when: "{{ask.rir|is_no}}"}
      - {kind: radio, label: "nel comune E' presente un'attività a rischio d'incidente rilevante e la relativa “area di danno” è individuata", when: "{{ask.rir|is_fuori_area}}"}
      - {kind: radio, label: l'intervento NON ricade nell'area di danno, when: "{{ask.rir|is_fuori_area}}"}
      - {kind: radio, label: "nel comune E' presente un'attività a rischio d'incidente rilevante e la relativa “area di danno” è individuata", when: "{{ask.rir|is_in_area}}"}
      - {kind: radio, label: l'intervento ricade in area di danno, when: "{{ask.rir|is_in_area}}"}
      - {kind: checkbox, label: si allega la documentazione necessaria alla valutazione del progetto, when: "{{ask.rir|is_in_area}}"}
      - {kind: radio, label: "nel comune E' presente un'attività a rischio d'incidente rilevante e la relativa “area di danno” non è individuata", when: "{{ask.rir|is_non_individuata}}"}
      - {kind: checkbox, label: si allega la documentazione necessaria alla valutazione del progetto, nth: 2, when: "{{ask.rir|is_non_individuata}}"}
      - {kind: checkbox, label: fascia di rispetto dei depuratori, when: "{{ask.altri_vincoli_eco|is_nessuno|not}} {{ask.altri_vincoli_eco_tipo|is_depuratori}}"}
      - {kind: checkbox, label: fascia di rispetto per pozzi, when: "{{ask.altri_vincoli_eco|is_nessuno|not}} {{ask.altri_vincoli_eco_tipo|is_pozzi}}"}
      - {kind: checkbox, label: Altro, when: "{{ask.altri_vincoli_eco|is_nessuno|not}} {{ask.altri_vincoli_eco_tipo|is_altro}}"}
      - {kind: text, label: "Specificare:", value: "{{ask.altri_vincoli_eco_quale}}", when: "{{ask.altri_vincoli_eco|is_nessuno|not}} {{ask.altri_vincoli_eco_tipo|is_altro}}"}
      - {kind: checkbox, label: si allegano le autocertificazioni, when: "{{ask.altri_vincoli_eco|is_autocertificazione}}"}
      - {kind: checkbox, label: si allega la documentazione necessaria ai fini del rilascio dei relativi atti di assenso, when: "{{ask.altri_vincoli_eco|is_assenso}}"}
      - {kind: radio, label: l'immobile non ricade in area vincolata, when: "{{ask.autorita_bacino|is_no}}"}
      - {kind: radio, label: l'immobile è assoggettato ai seguenti vincoli, when: "{{ask.autorita_bacino|is_vincolata}}"}
      - {kind: radio, label: rispetto alle misure di salvaguardia della costa, when: "{{ask.autorita_bacino|is_costa}}"}
      # Its "specificare:" is opened by its own radio, and is the second of that label when
      # another vincolo's is open above it (a combination the crawl didn't try).
      - {kind: text, label: "specificare:", value: "{{ask.autorita_bacino_quale}}", when: "{{ask.autorita_bacino|is_vincolata}} {{ask.altri_vincoli_eco|is_nessuno}}"}
      - {kind: text, label: "specificare:", value: "{{ask.autorita_bacino_quale}}", when: "{{ask.autorita_bacino|is_vincolata}} {{ask.altri_vincoli_eco|is_nessuno|not}} {{ask.altri_vincoli_eco_tipo|in_depuratori__pozzi}}"}
      - {kind: text, label: "specificare:", nth: 2, on_page: true, value: "{{ask.autorita_bacino_quale}}", when: "{{ask.autorita_bacino|is_vincolata}} {{ask.altri_vincoli_eco|is_nessuno|not}} {{ask.altri_vincoli_eco_tipo|is_altro}}"}
      - {kind: text, label: "specificare:", value: "{{ask.autorita_bacino_quale}}", when: "{{ask.autorita_bacino|is_costa}} {{ask.altri_vincoli_eco|is_nessuno}}"}
      - {kind: text, label: "specificare:", value: "{{ask.autorita_bacino_quale}}", when: "{{ask.autorita_bacino|is_costa}} {{ask.altri_vincoli_eco|is_nessuno|not}} {{ask.altri_vincoli_eco_tipo|in_depuratori__pozzi}}"}
      - {kind: text, label: "specificare:", nth: 2, on_page: true, value: "{{ask.autorita_bacino_quale}}", when: "{{ask.autorita_bacino|is_costa}} {{ask.altri_vincoli_eco|is_nessuno|not}} {{ask.altri_vincoli_eco_tipo|is_altro}}"}

  # Fine lavori: the date, whole or in part, and the title the works were done under.
  - section: comunicazione di fine lavori
    fields:
      - {kind: date, label: che in data, value: "{{ask.data_fine_lavori|date_it}}"}
      - {kind: radio, label: completamente, when: "{{ask.fine_completa}}"}
      - {kind: radio, label: in forma parziale, when: "{{ask.fine_completa|not}}"}
      - {kind: text, label: che il titolo e/o comunicazione, value: "{{ask.titolo_edilizio}}"}
      - {kind: text, label: prot./n., value: "{{ask.titolo_protocollo}}"}
      - {kind: date, label: del, value: "{{ask.titolo_data|date_it}}"}

  # The business itself declaring (a SUAP pratica: the ditta or company and its titolare or
  # legale rappresentante `t:`, its premises `locale`), from the pizzeria walk
  # (rehearsals/pizzeria-fittizia). A recipe with `subject: impresa` takes these before the ones
  # above.
  - section: Scheda anagrafica
    subject: impresa
    open: false
    branches: ["{{business.rea|empty|not}}", "{{business.rea|empty}}"]
    fields:
      - {kind: radio, label: "DITTA/SOCIETA'/IMPRESA"}
      # A business in the Registro delle imprese names its Camera di commercio; a company's
      # legale rappresentante declares (`t:`, Carica from the ruolo), its forma below.
      - {kind: radio, label: ISCRITTA ALLA CCIAA, when: "{{business.rea|empty|not}}"}
      - {kind: select, label: "Camera di commercio di:", value: "{{business.cciaa|provincia_nome}}", when: "{{business.rea|empty|not}}"}
      - {kind: radio, label: NON ANCORA ISCRITTA, when: "{{business.rea|empty}}"}
      - {kind: text, label: Nome, value: "{{t:identity.first_name}}"}
      - {kind: text, label: Cognome, value: "{{t:identity.last_name}}"}
      - {kind: text, label: Cod.Fiscale, value: "{{t:identity.codice_fiscale}}"}
      - {kind: select, label: Sesso, value: "{{t:identity.sex}}"}
      - {kind: text, label: Data nascita, value: "{{t:identity.date_of_birth|date_it}}"}
      - {kind: select, label: Provincia, value: "{{t:identity.birth_province}}"}
      - {kind: select, label: Comune, value: "{{t:identity.birth_comune|upper}}"}
      - {kind: select, label: Provincia, nth: 2, value: "{{t:residenza.provincia}}"}
      - {kind: select, label: Comune, nth: 2, value: "{{t:residenza.comune|upper}}"}
      - {kind: select, label: Toponimo (DUG), value: "{{t:residenza.indirizzo|dug}}"}
      - {kind: select, label: "da compilare obbligatoriamente", via: ALTRO, value: "{{t:residenza.indirizzo|dug_dettaglio}}", when: "{{t:residenza.indirizzo|dug_altro}}"}
      - {kind: text, label: Denominazione stradale, value: "{{t:residenza.indirizzo|street|upper}}"}
      - {kind: text, label: Numero civico, value: "{{t:residenza.civico}}"}
      - {kind: text, label: CAP, value: "{{t:residenza.cap}}"}
      - {kind: text, label: eMail/PEC, value: "{{t:identity.email}}"}
      - {kind: text, label: Telefono fisso/cellulare, value: "{{t:identity.phone|phone_it}}"}
      - {kind: select, label: Carica, value: "{{t:ruolo.tipo|carica}}"}
      # Forma giuridica first: choosing it re-renders the block and can empty Denominazione.
      - {kind: select, label: Forma giuridica, value: "{{business.forma_giuridica|forma}}"}
      - {kind: text, label: "Denominazione (nome della ditta", value: "{{business.denominazione}}"}
      - {kind: text, label: Codice Fiscale, value: "{{business.codice_fiscale}}"}
      - {kind: text, label: P.IVA, value: "{{business.partita_iva}}"}
      - {kind: select, label: Provincia, nth: 3, value: "{{business.sede_legale_provincia}}"}
      - {kind: select, label: Comune, nth: 3, value: "{{business.sede_legale_comune|upper}}"}
      - {kind: select, label: Toponimo (DUG), nth: 2, value: "{{business.sede_legale_indirizzo|dug}}"}
      # Found by label (the rows above renumber with the REA): the seat's is the second box of that
      # label when the titolare's home is ALTRO too, a state the crawl never saw.
      - {kind: select, label: "da compilare obbligatoriamente", via: ALTRO, value: "{{business.sede_legale_indirizzo|dug_dettaglio}}", when: "{{business.sede_legale_indirizzo|dug_altro}} {{t:residenza.indirizzo|dug_altro|not}}"}
      - {kind: select, label: "da compilare obbligatoriamente", nth: 2, on_page: true, value: "{{business.sede_legale_indirizzo|dug_dettaglio}}", when: "{{business.sede_legale_indirizzo|dug_altro}} {{t:residenza.indirizzo|dug_altro}}"}
      - {kind: text, label: Denominazione stradale, nth: 2, value: "{{business.sede_legale_indirizzo|street|upper}}"}
      - {kind: text, label: Numero civico, nth: 2, value: "{{business.sede_legale_civico}}"}
      - {kind: text, label: CAP, nth: 2, value: "{{business.sede_legale_cap}}"}
      - {kind: text, label: Telefono fisso/Cellulare, nth: 2, value: "{{business.telefono|phone_it}}"}
      - {kind: text, label: PEC, value: "{{business.pec}}"}
    leave: [Fax]

  - section: DOMICILIO DIGITALE
    subject: impresa
    fields:
      - {kind: checkbox, label: il seguente domicilio digitale inserito in INI-PEC}
      - {kind: text, label: il seguente domicilio digitale inserito in INI-PEC, value: "{{business.pec}}"}

  - section: DOMICILIO ELETTRONICO
    subject: impresa
    theirs: [Si dichiara di essere consapevoli]
    fields:
      - {kind: text, label: "N.B. Inserire l'indirizzo della casella PEC", value: "{{business.pec}}"}

  # The business's premises, under the titles each sector gives them (a transfer's new address
  # is the premises it moves to; the old one, "precedente ubicazione", is not this).
  - section: ubicazione dell'attività
    aliases: [ubicazione dello stabilimento, ubicazione dell'impianto produttivo, ubicazione impianto, "Ubicazione",
              indirizzo dell'attività, indirizzo dello stabilimento, sede dell'attività, dichiarazione ubicazione locale,
              dichiarazione relativa alla sede dell'attività, "dichiarazione dell'ubicazione dell'",
              dichiarazione dell'ubicazione dell'esercizio, dichiarazione relativa all'indirizzo dello stabilimento,
              nuovo indirizzo dell'esercizio, nuovo indirizzo dell'ubicazione dell'esercizio]
    subject: impresa
    leave: [Frazione]
    fields:
      - {kind: text, label: CAP, value: "{{locale.cap}}"}
      - {kind: lookup, label: "Via, Viale, Piazza", value: "{{locale.indirizzo}}"}
      - {kind: text, label: n° civico, value: "{{locale.civico}}"}
      - {kind: text, label: scala, value: "{{locale.scala}}", optional: true}
      - {kind: text, label: piano, value: "{{locale.piano}}", optional: true}
      - {kind: text, label: interno, value: "{{locale.interno}}", optional: true}

  - section: Dati catastali
    subject: impresa
    leave: [sezione Amministrativa, classe]
    fields:
      - {kind: radio, label: Nuovo Catasto Edilizio Urbano}
      - {kind: text, label: foglio, value: "{{locale.catasto_foglio}}"}
      - {kind: text, label: particella/mappale, value: "{{locale.catasto_particella}}"}
      - {kind: text, label: subalterno, value: "{{locale.catasto_subalterno}}"}
      - {kind: text, label: sezione Urbana, value: "{{locale.catasto_sezione}}", optional: true}
      - {kind: select, label: categoria, value: "{{locale.catasto_categoria|categoria}}"}

  # The fee exemption a Terzo settore body claims (a scelta of its own): the acknowledgement is
  # theirs, and the scelta is refused until a recipe maps it.
  - section: DICHIARAZIONE ESENZIONE PAGAMENTO
    theirs: [Presa visione]
    fields: []

  # Napoli's own rules for the business (the protected-zones street list, the openings plan):
  # boxes the person ticks having read them.
  - section: normative comunali
    theirs: [Elenco Strade piano Zone Tutelate, Piano per la programmazione delle aperture]
    fields: []

  # Closing a business (cessazione): which activity, the title it started under, from when;
  # and the Reg. 852/2004 registration it ends.
  - section: Oggetto della comunicazione
    aliases: [dichiarazione relativa alla cessazione dell'attività]
    fields:
      - {kind: text, label: la cessazione dell'attività di, value: "{{ask.attivita_cessata}}"}
      - {kind: text, label: prot./n., value: "{{ask.titolo_attivita_protocollo}}"}
      - {kind: date, label: del, value: "{{ask.titolo_attivita_data|date_it}}"}
      - {kind: radio, label: Cessazione contestuale alla comunicazione, when: "{{ask.cessazione_data|empty}}"}
      - {kind: radio, label: Cessazione con decorrenza, when: "{{ask.cessazione_data|empty|not}}"}
      - {kind: date, label: dal, value: "{{ask.cessazione_data|date_it}}", when: "{{ask.cessazione_data|empty|not}}"}
  # Suspending a business for a while (same title, its own boxes): which activity, its title,
  # from and to when; and the Reg. 852/2004 registration it suspends. Always "con decorrenza",
  # which holds from today too, so the dates are the only questions.
  - section: Oggetto della comunicazione
    fields:
      - {kind: text, label: la sospensione temporanea dell'attività di, value: "{{ask.attivita_sospesa}}"}
      - {kind: text, label: prot./n., value: "{{ask.titolo_attivita_protocollo}}"}
      - {kind: date, label: del, value: "{{ask.titolo_attivita_data|date_it}}"}
      - {kind: radio, label: Sospensione con decorrenza}
      - {kind: date, label: dal, value: "{{ask.sospensione_dal|date_it}}"}
      - {kind: date, label: al, value: "{{ask.sospensione_al|date_it}}"}
  - section: Sospensione temporanea dell'attività ai sensi dell'art. 6, Reg. CE n. 852/2004
    fields:
      - {kind: text, label: prot./n., value: "{{ask.notifica_852_protocollo}}"}
      - {kind: date, label: del, value: "{{ask.notifica_852_data|date_it}}"}
      - {kind: date, label: dal, value: "{{ask.sospensione_dal|date_it}}"}
      - {kind: date, label: al, value: "{{ask.sospensione_al|date_it}}"}
  - section: Cessazione dell'attività ai sensi dell'art. 6, Reg. CE n. 852/2004
    fields:
      - {kind: text, label: prot./n., value: "{{ask.notifica_852_protocollo}}"}
      - {kind: date, label: del, value: "{{ask.notifica_852_data|date_it}}"}
      - {kind: date, label: cesserà in data, value: "{{ask.cessazione_852_data|date_it}}"}

  # A bar or restaurant (somministrazione di alimenti e bevande): the sign, the season, what
  # kind of place, a shopping centre, the area where customers eat and drink. Drafted by
  # draft.py from mod_somministrazione_zone_non_tutelate_apertura, checked against the
  # pizzeria walk (rehearsals/pizzeria-fittizia).
  - section: Dati dell'esercizio di somministrazione
    fields:
      - {kind: text, label: Denominazione insegna, value: "{{ask.insegna}}"}
      - {kind: radio, label: Permanente, when: "{{ask.stagionale|not}}"}
      - {kind: radio, label: Stagionale, when: "{{ask.stagionale}}"}
      - {kind: text, label: dal (gg/mm), value: "{{ask.stagione_dal}}", when: "{{ask.stagionale}}"}
      - {kind: text, label: al (gg/mm), value: "{{ask.stagione_al}}", when: "{{ask.stagionale}}"}
      - {kind: textarea, label: Tipologia di esercizio, value: "{{business.descrizione_attivita}}"}
      # The protected zones' authorization has no shopping-centre question.
      - {kind: radio, label: Si, when: "{{ask.in_centro_commerciale}}", if_present: true}
      - {kind: radio, label: "No", when: "{{ask.in_centro_commerciale|not}}", if_present: true}
      - {kind: text, label: denominazione, nth: 2, value: "{{ask.centro_commerciale_denominazione}}", when: "{{ask.in_centro_commerciale}}", if_present: true}
      - {kind: text, label: Superficie di somministrazione, value: "{{ask.superficie_somministrazione_mq}}"}

  # The Reg. 852/2004 notifica (mod_notifica_sanitaria): when the activity starts, and if it
  # ends on a date (a temporary one).
  - section: notifica avvio e inizio attività
    aliases: [inizio dell'attività]
    fields:
      - {kind: radio, label: Avvio contestuale alla data di notifica, when: "{{ask.avvio_data|empty}}"}
      - {kind: radio, label: Avvio con decorrenza, when: "{{ask.avvio_data|empty|not}}"}
      - {kind: date, label: dal, value: "{{ask.avvio_data|date_it}}", when: "{{ask.avvio_data|empty|not}}"}
      - {kind: checkbox, label: Termine dell'attività, when: "{{ask.termine_data|empty|not}}"}
      - {kind: date, label: in data, value: "{{ask.termine_data|date_it}}", when: "{{ask.termine_data|empty|not}}"}

  # What the food business does, in the notifica's master list: the food-service block (a bar,
  # a restaurant), the bakery and pastry block, and food retail in a shop; a heading opens its
  # lines. The other blocks stay unticked.
  - section: tipologia di attività ai sensi dell'art. 6
    fields:
      - {kind: checkbox, label: "RISTORAZIONE:", when: "{{ask.ristorazione}}"}
      - {kind: checkbox, label: Produzione pasti pronti per ristorazione collettiva, when: "{{ask.ristorazione}} {{ask.pasti_collettiva}}"}
      - {kind: checkbox, label: Somministrazione pasti in ristorazione collettiva, when: "{{ask.ristorazione}} {{ask.mensa}}"}
      - {kind: checkbox, label: Ristorazione pubblica con somministrazione diretta, when: "{{ask.ristorazione}} {{ask.ristorante}}"}
      - {kind: checkbox, label: Bar e altri esercizi pubblici simili senza laboratorio, when: "{{ask.ristorazione}} {{ask.bar}}"}
      - {kind: checkbox, label: Bar e altri esercizi pubblici simili con laboratorio, when: "{{ask.ristorazione}} {{ask.bar_laboratorio}}"}
      - {kind: checkbox, label: Ristorazione pubblica in ambito di manifestazioni, when: "{{ask.ristorazione}} {{ask.manifestazioni}}"}
      - {kind: checkbox, label: Home restaurant, when: "{{ask.ristorazione}} {{ask.home_restaurant}}"}
      - {kind: checkbox, label: "PRODOTTI DA FORNO E DI PASTICCERIA", when: "{{ask.forno}}"}
      - {kind: checkbox, label: "Pane, pizza e altri prodotti da forno", when: "{{ask.forno}} {{ask.pane}}"}
      - {kind: checkbox, label: Prodotti di pasticceria freschi e secchi, when: "{{ask.forno}} {{ask.pasticceria}}"}
      - {kind: checkbox, label: Prodotti di gelateria, when: "{{ask.forno}} {{ask.gelateria}}"}
      - {kind: checkbox, label: Cibi pronti in genere, when: "{{ask.forno}} {{ask.gastronomia}}"}
      - {kind: checkbox, label: Pasta secca e/o fresca, when: "{{ask.forno}} {{ask.pasta}}"}
      - {kind: checkbox, label: "COMMERCIO AL DETTAGLIO DI ALIMENTI E BEVANDE:", when: "{{ask.dettaglio_alimenti}}"}
      - {kind: checkbox, label: In Esercizi di vicinato, when: "{{ask.dettaglio_alimenti}}"}

  # A shop (esercizio di vicinato): how it sells, its season, a shopping centre, the sales area
  # per sector. Drafted by draft.py from mod_esercizio_vicinato_apertura and checked by hand:
  # the shopping-centre types (G2CQ...), the C.C.N. and the factory outlet are Napoli's own
  # boxes, not the schema's. The total must equal the sectors' sum (the portal's note).
  - section: Dati sull'esercizio di vicinato
    fields:
      - {kind: checkbox, label: Vicinato, when: "{{ask.solo_distributori|not}}"}
