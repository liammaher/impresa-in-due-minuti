    leave: ["Allega Relazione paesaggistica semplificata"]
    theirs: ["Allega Relazione paesaggistica semplificata"]
    supports:
      - {if: "{{ask.paes_rinnovo_di|is_semplificata}}", when: "{{ask.paes_rinnovo_variazioni|not}}", else: "Il rinnovo di un'autorizzazione semplificata sul portale non ha una casella per le modifiche progettuali (ce l'ha solo quello di un'ordinaria): chieda al SUE come presentarlo."}
    fields:
      - {kind: text, label: Num., value: "{{ask.paes_protocollo}}"}
      - {kind: date, label: Data, value: "{{ask.paes_data|date_it}}"}
