          # address, and "il cui legale rappresentante è". In the block, the REA "n." is the
          # third "N." (after the home's and the studio's), and so on for the rest.
          - {kind: text, label: n., nth: 3, value: "{{ad#N:business.rea|rea_num}}", when: "{{ask.altro_tecnico#N_dipendente}}"}
          - {kind: select, label: Provincia, nth: 4, value: "{{ad#N:business.sede_legale_provincia}}", when: "{{ask.altro_tecnico#N_dipendente}}"}
          - {kind: select, label: Stato, nth: 4, value: ITALIA, when: "{{ask.altro_tecnico#N_dipendente}}"}
          - {kind: text, label: "Via, Piazza", nth: 3, value: "{{ad#N:business.sede_legale_indirizzo|upper}}", when: "{{ask.altro_tecnico#N_dipendente}}"}
          - {kind: text, label: "N.", nth: 4, value: "{{ad#N:business.sede_legale_civico}}", when: "{{ask.altro_tecnico#N_dipendente}}"}
          - {kind: text, label: C.A.P., nth: 3, value: "{{ad#N:business.sede_legale_cap}}", when: "{{ask.altro_tecnico#N_dipendente}}"}
          - {kind: text, label: Cognome, nth: 2, value: "{{ad#N:identity.last_name|upper}}", when: "{{ask.altro_tecnico#N_dipendente}}"}
          - {kind: text, label: Nome, nth: 2, value: "{{ad#N:identity.first_name|upper}}", when: "{{ask.altro_tecnico#N_dipendente}}"}

  # The firms on site (`f1:`, `f2:`, `f3:` ...: each block after the first by the "+" after the
  # last one, 48 boxes), or minor works the client does without one. Fields by label inside the
  # block that starts at "Ragione sociale".
  # A firm still to be chosen: the SCIA and the permesso say so ("sarà individuata"); the CILA
  # and the CIL have no such line, and their recipes refuse it.
  - section: h) Impresa esecutrice dei lavori
    leave: [Telefono, fax]
    fields:
      # Each form words a choice its own way: one label per wording, each starting its box's text
      # (a label found only inside it reads "loose" at run time).
      - {kind: radio, label: "che, in quanto opere di modesta entità", if_present: true, when: "{{ask.lavori_in_proprio}}"}
      - {kind: radio, label: "i lavori, in quanto opere di modesta entità", if_present: true, when: "{{ask.lavori_in_proprio}}"}
      - {kind: radio, label: in quanto opere di modesta entità, if_present: true, when: "{{ask.lavori_in_proprio}}"}
      - {kind: radio, label: l'impresa esecutrice/imprese esecutrici dei lavori sarà, if_present: true, when: "{{ask.lavori_in_proprio|not}} {{ask.impresa_dopo}}"}
      - {kind: radio, label: che i lavori sono/saranno eseguiti dall, if_present: true, when: "{{ask.lavori_in_proprio|not}}"}
      - {kind: radio, label: i lavori sono/saranno eseguiti dall, if_present: true, when: "{{ask.lavori_in_proprio|not}}"}
      - {kind: radio, label: i lavori sono eseguiti/sono stati eseguiti, if_present: true, when: "{{ask.lavori_in_proprio|not}} {{ask.impresa_dopo|not}}"}
      - {kind: radio, label: i lavori saranno eseguiti/sono eseguiti, if_present: true, when: "{{ask.lavori_in_proprio|not}} {{ask.impresa_dopo|not}}"}
      # One block per firm, each after the first by its "+" (`f#K`: f1, f2, f3 ...).
      - kind: each
        count: "{{ask.imprese_quante}}"
        when: "{{ask.lavori_in_proprio|not}} {{ask.impresa_dopo|not}}"
        anchor: Ragione sociale
        block:
          - {kind: text, label: Ragione sociale, value: "{{f#K:business.denominazione}}"}
          - {kind: text, label: codice fiscale / p. IVA, value: "{{f#K:business.partita_iva}}"}
          - {kind: select, label: Iscritta alla C.C.I.A.A. di, value: "{{f#K:business.cciaa}}"}
          - {kind: text, label: n., nth: 1, value: "{{f#K:business.rea|rea_num}}"}
          - {kind: text, label: con sede in, value: "{{f#K:business.sede_legale_comune|upper}}"}
          - {kind: select, label: provincia, nth: 1, value: "{{f#K:business.sede_legale_provincia}}"}
          - {kind: text, label: "Via, Piazza", value: "{{f#K:business.sede_legale_indirizzo|upper}}"}
          - {kind: text, label: N., nth: 2, value: "{{f#K:business.sede_legale_civico}}"}
          - {kind: text, label: C.A.P., value: "{{f#K:business.sede_legale_cap}}"}
          - {kind: text, label: Cognome, value: "{{f#K:identity.last_name}}"}
          - {kind: text, label: Nome, value: "{{f#K:identity.first_name}}"}
          - {kind: text, label: codice fiscale, nth: 2, value: "{{f#K:identity.codice_fiscale}}"}
          - {kind: text, label: nato a, value: "{{f#K:identity.birth_comune|upper}}"}
          - {kind: select, label: provincia, nth: 2, value: "{{f#K:identity.birth_province}}"}
          - {kind: date, label: nato il, value: "{{f#K:identity.date_of_birth|date_it}}"}
          - {kind: text, label: cell., value: "{{f#K:identity.phone|phone_it}}"}
          - {kind: text, label: posta elettronica, value: "{{f#K:business.pec}}"}
          # DURC: each box opens its own rows (and renumbers what follows). A firm enrolled with a
          # Cassa edile ticks it too; its rows come first, so the INPS's and INAIL's "sede di" and
          # "codice impresa" count after its own.
          - {kind: checkbox, label: Cassa edile, when: "{{f#K:business.cassa_edile_codice_impresa|empty|not}}"}
          - {kind: text, label: sede di, nth: 1, value: "{{f#K:business.cassa_edile_sede|upper}}", when: "{{f#K:business.cassa_edile_codice_impresa|empty|not}}"}
          - {kind: text, label: codice impresa, nth: 1, value: "{{f#K:business.cassa_edile_codice_impresa}}", when: "{{f#K:business.cassa_edile_codice_impresa|empty|not}}"}
          - {kind: text, label: codice cassa, value: "{{f#K:business.cassa_edile_codice}}", when: "{{f#K:business.cassa_edile_codice_impresa|empty|not}}"}
          - {kind: checkbox, label: INPS}
          - {kind: text, label: sede di, nth: 1, value: "{{f#K:business.sede_legale_comune|upper}}", when: "{{f#K:business.cassa_edile_codice_impresa|empty}}"}
          - {kind: text, label: sede di, nth: 2, value: "{{f#K:business.sede_legale_comune|upper}}", when: "{{f#K:business.cassa_edile_codice_impresa|empty|not}}"}
          - {kind: text, label: Matr./Pos. Contr., value: "{{f#K:business.inps_matricola}}"}
          - {kind: checkbox, label: INAIL}
          - {kind: text, label: sede di, nth: 2, value: "{{f#K:business.inail_codice_sede}}", when: "{{f#K:business.cassa_edile_codice_impresa|empty}}"}
          - {kind: text, label: sede di, nth: 3, value: "{{f#K:business.inail_codice_sede}}", when: "{{f#K:business.cassa_edile_codice_impresa|empty|not}}"}
          - {kind: text, label: codice impresa, nth: 1, value: "{{f#K:business.inail_codice_ditta}}", when: "{{f#K:business.cassa_edile_codice_impresa|empty}}"}
          - {kind: text, label: codice impresa, nth: 2, value: "{{f#K:business.inail_codice_ditta}}", when: "{{f#K:business.cassa_edile_codice_impresa|empty|not}}"}
          - {kind: text, label: pos. assicurativa, value: "{{f#K:business.inail_pat}}"}

  # Site safety. A choice is a radio in one pratica and a checkbox in another (`tick`); the
  # check of the firms' documents shows only in some (`if_present`).
  - section: i) Rispetto degli obblighi
    defect:
      cila-impresa-dopo: ["ricade nell'ambito di applicazione del d.lgs. 81/2008 ma si riserva"]
    fields:
      - {kind: tick, label: non ricade nell'ambito di applicazione delle norme, when: "{{ask.dlgs81|not}}"}
      - {kind: tick, label: ricade nell'ambito di applicazione delle norme, when: "{{ask.dlgs81}} {{ask.impresa_dopo|not}}"}
      # A firm still to be chosen: the declarations below come with its data, before the works
      # start ("si riserva"). The CILA's and the CIL's own "si riserva" isn't here: the portal
      # requires their firm's details anyway (their recipes refuse a firm still to be chosen).
      - {kind: tick, label: ricade nell'ambito di applicazione del d.lgs. n. 81/2008 ma si riserva, if_present: true, when: "{{ask.dlgs81}} {{ask.impresa_dopo}}"}
      - {kind: tick, label: "ricade nell'ambito di applicazione delle norme in materia di salute e sicurezza sul luogo di lavoro (d.lgs. n. 81/2008), ma si riserva", if_present: true, when: "{{ask.dlgs81}} {{ask.impresa_dopo}}"}
      # The rest only where the rules apply (works with no firm on site are outside them).
      - {kind: tick, label: dichiara che l'entità presunta del cantiere è inferiore, when: "{{ask.dlgs81}} {{ask.impresa_dopo|not}} {{ask.sotto_200}}"}
      - {kind: tick, label: dichiara che l'entità presunta del cantiere è pari o superiore, if_present: true, when: "{{ask.dlgs81}} {{ask.impresa_dopo|not}} {{ask.sotto_200|not}}"}
      - {kind: tick, label: dichiara di aver verificato la documentazione, if_present: true, when: "{{ask.dlgs81}} {{ask.impresa_dopo|not}} {{ask.verificato_idoneita}}"}
      - {kind: tick, label: dichiara che l'intervento non è soggetto all'invio, when: "{{ask.dlgs81}} {{ask.impresa_dopo|not}} {{ask.notifica_dovuta|not}}"}
      - {kind: tick, label: dichiara che l'intervento è soggetto all'invio, when: "{{ask.dlgs81}} {{ask.impresa_dopo|not}} {{ask.notifica_dovuta}}"}
      # The CIL's and the CILA's notifica has no slot of its own: Allegati liberi, which on the CIL
      # takes only signed files (read on a filled CIL draft 2026-11-01; the CILA 2026-10-28).
      - {kind: tick, label: allega alla presente comunicazione la notifica, if_present: true, when: "{{ask.dlgs81}} {{ask.impresa_dopo|not}} {{ask.notifica_dovuta}}", slot: "none of its own: Allegati liberi, the notifica in its own box (the CIL's recipe)"}
      - {kind: checkbox, label: e allega alla presente segnalazione la notifica, if_present: true, on_page: true, when: "{{ask.dlgs81}} {{ask.impresa_dopo|not}} {{ask.notifica_dovuta}}"}
      # The permesso and the SCIA alternativa: the notifica attached now (its slot is the recipe's,
      # read on the portal 2026-11-01), or sent before the works start (a permesso's once issued).
      - {kind: radio, label: e allega alla presente segnalazione la notifica, if_present: true, when: "{{ask.dlgs81}} {{ask.impresa_dopo|not}} {{ask.notifica_dovuta}} {{ask.notifica_allegata}}", slot: "Notifica preliminare (articolo 99 del d.lgs. n. 81/2008): its own (filled on the portal 2026-11-01)"}
      - {kind: radio, label: "allega la notifica, il cui contenuto", if_present: true, when: "{{ask.dlgs81}} {{ask.impresa_dopo|not}} {{ask.notifica_dovuta}} {{ask.notifica_allegata}}", slot: "Notifica preliminare (articolo 99 del d.lgs. n. 81/2008): its own (filled on the portal 2026-11-01)"}
      - {kind: radio, label: invierà la notifica prima dell'inizio dei lavori, if_present: true, when: "{{ask.dlgs81}} {{ask.impresa_dopo|not}} {{ask.notifica_dovuta}} {{ask.notifica_allegata|not}}"}

  # The progettista's relazione (her asseverazione and signature are the signed CILA).
  - section: Relazione Tecnica di Asseverazione
    # A tolerance's "bassa sismicità" row (zones 3 and 4) never holds in Napoli, zona 2 (DGR Campania
    # 5447/2002): the seismic row ticked is the one for zones 1 and 2.
    leave: [specificare il tipo di intervento, Comunicazioni, Autorità competente, Tipologia di atto, Note,
            dà atto che l’immobile interessato dalla tolleranza è ubicato in zona sismica a bassa]
    supports:
      - {if: "{{ask.tolleranze}}", value: "{{ask.toll_34bis_1,ask.toll_34bis_1bis,ask.toll_34bis_2,ask.toll_34bis_2bis,ask.toll_34ter_4|any}}", in: ["true"], else: "Le tolleranze costruttive dichiarate richiedono almeno un tipo (art. 34-bis o 34-ter c. 4)."}
      - {if: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}}", value: "{{ask.toll_sismica}}", in: [autorizzazione, silenzio assenso], else: "Una tolleranza strutturale rilevante per la pubblica incolumità (art. 94-bis c. 1 a) può essere dichiarata solo con l'autorizzazione sismica del Genio Civile (art. 94 c. 2) o con il suo silenzio assenso (c. 2-bis): art. 34-bis c. 3-bis DPR 380/2001."}
      - {if: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|in_minore_rilevanza__privo_di_rilevanza}}", value: "{{ask.toll_decorso}}", in: ["true"], else: "Una tolleranza strutturale di minore rilevanza o priva di rilevanza per la pubblica incolumità può essere dichiarata solo una volta decorso il termine del controllo regionale, senza richieste pendenti e senza esito negativo: art. 34-bis c. 3-bis DPR 380/2001."}
    fields:
      - {kind: text, label: Cognome, value: "{{t:identity.last_name}}", when: "{{ask.progettista_altro|not}}"}
      - {kind: text, label: Nome, value: "{{t:identity.first_name}}", when: "{{ask.progettista_altro|not}}"}
      - {kind: text, label: Iscritto all'ordine, value: "{{t:albo.ordine}}", when: "{{ask.progettista_altro|not}}"}
      - {kind: text, label: di, value: "{{t:albo.provincia|provincia_nome}}", when: "{{ask.progettista_altro|not}}"}
      - {kind: text, label: al n., value: "{{t:albo.numero}}", when: "{{ask.progettista_altro|not}}"}
      - {kind: text, label: Cognome, value: "{{p:identity.last_name}}", when: "{{ask.progettista_altro}}"}
      - {kind: text, label: Nome, value: "{{p:identity.first_name}}", when: "{{ask.progettista_altro}}"}
      - {kind: text, label: Iscritto all'ordine, value: "{{p:albo.ordine}}", when: "{{ask.progettista_altro}}"}
      - {kind: text, label: di, value: "{{p:albo.provincia|provincia_nome}}", when: "{{ask.progettista_altro}}"}
      - {kind: text, label: al n., value: "{{p:albo.numero}}", when: "{{ask.progettista_altro}}"}
      - {kind: checkbox, label: interventi di manutenzione straordinaria, when: "{{ask.cila_manutenzione}}"}
      - {kind: checkbox, label: Interventi di restauro e risanamento conservativo, when: "{{ask.cila_restauro}}"}
      - {kind: checkbox, label: Interventi di eliminazione delle barriere architettoniche, when: "{{ask.cila_barriere}}"}
      - {kind: checkbox, label: Opere temporanee per attività di ricerca nel sottosuolo, when: "{{ask.cila_sottosuolo}}"}
      - {kind: checkbox, label: Movimenti di terra, when: "{{ask.cila_terra}}"}
      - {kind: checkbox, label: Serre mobili stagionali, when: "{{ask.cila_serre}}"}
      - {kind: checkbox, label: Realizzazione di pertinenze minori, when: "{{ask.cila_pertinenze}}"}
      - {kind: checkbox, label: Altri interventi non riconducibili, when: "{{ask.cila_altri}}"}
      - {kind: text, label: specificare il tipo di intervento, value: "{{ask.cila_altri_tipo}}", when: "{{ask.cila_altri}}"}
      - {kind: textarea, label: e che consistono in, value: "{{ask.dettaglio_intervento}}"}
      # Filings presented with the CILA and assents for the SUE to acquire (items 2 and 3 of the
      # national form's relazione), two rows each on the page and more by "+". "Autorità
      # competente" also starts the assents' "… al rilascio": the filings' are its first two.
      - {kind: text, label: "Comunicazioni, segnalazioni", value: "{{ask.comunicazione_1}}", when: "{{ask.comunicazioni_contestuali}}"}
      - {kind: text, label: Autorità competente, value: "{{ask.comunicazione_1_autorita}}", when: "{{ask.comunicazioni_contestuali}}"}
      - {kind: text, label: "Comunicazioni, segnalazioni", nth: 2, value: "{{ask.comunicazione_2}}", when: "{{ask.comunicazioni_contestuali}} {{ask.comunicazioni_quante|atleast_2}}"}
      - {kind: text, label: Autorità competente, nth: 2, value: "{{ask.comunicazione_2_autorita}}", when: "{{ask.comunicazioni_contestuali}} {{ask.comunicazioni_quante|atleast_2}}"}
      - kind: each
        count: "{{ask.comunicazioni_quante}}"
        when: "{{ask.comunicazioni_contestuali}}"
        first: 3
        on_page: 2
        block:
          - {kind: text, label: "Comunicazioni, segnalazioni", value: "{{ask.comunicazione_#K}}"}
          - {kind: text, label: Autorità competente, value: "{{ask.comunicazione_#K_autorita}}"}
      - {kind: text, label: Tipologia di atto, value: "{{ask.atto_1}}", when: "{{ask.atti_da_acquisire}}"}
      - {kind: text, label: Autorità competente al rilascio, value: "{{ask.atto_1_autorita}}", when: "{{ask.atti_da_acquisire}}"}
      - {kind: text, label: Tipologia di atto, nth: 2, value: "{{ask.atto_2}}", when: "{{ask.atti_da_acquisire}} {{ask.atti_quanti|atleast_2}}"}
      - {kind: text, label: Autorità competente al rilascio, nth: 2, value: "{{ask.atto_2_autorita}}", when: "{{ask.atti_da_acquisire}} {{ask.atti_quanti|atleast_2}}"}
      - kind: each
        count: "{{ask.atti_quanti}}"
        when: "{{ask.atti_da_acquisire}}"
        first: 3
        on_page: 2
        block:
          - {kind: text, label: Tipologia di atto, value: "{{ask.atto_#K}}"}
          - {kind: text, label: Autorità competente al rilascio, value: "{{ask.atto_#K_autorita}}"}
      # Tolerances (art. 34-bis/34-ter): each declared, the 1-bis one's percentage by the unit's
      # floor area. Napoli is in seismic zone 2 (Campania, DGR 5447/2002), so a tolerance there
      # says whether it is structurally relevant; a relevant one opens its art. 94-bis class.
      - {kind: radio, label: "no", when: "{{ask.tolleranze|not}}"}
      - {kind: radio, label: "si", when: "{{ask.tolleranze}}"}
      - {kind: checkbox, label: "TOLLERANZA DI CUI ALL’ART. 34-BIS, COMMA 1 E 1-TER", when: "{{ask.tolleranze}} {{ask.toll_34bis_1}}"}
      - {kind: checkbox, label: "TOLLERANZA DI CUI ALL’ART. 34-BIS, COMMI 1-BIS", when: "{{ask.tolleranze}} {{ask.toll_34bis_1bis}}"}
      - {kind: radio, label: "2%, per le U.I.", when: "{{ask.tolleranze}} {{ask.toll_34bis_1bis}} {{ask.toll_superficie|is_oltre_500}}"}
      - {kind: radio, label: "3%, per le U.I.", when: "{{ask.tolleranze}} {{ask.toll_34bis_1bis}} {{ask.toll_superficie|is_300_500}}"}
      - {kind: radio, label: "4%, per le U.I.", when: "{{ask.tolleranze}} {{ask.toll_34bis_1bis}} {{ask.toll_superficie|is_100_300}}"}
      - {kind: radio, label: "5%, per le U.I.", when: "{{ask.tolleranze}} {{ask.toll_34bis_1bis}} {{ask.toll_superficie|is_60_100}}"}
      - {kind: radio, label: "6%, per le U.I.", when: "{{ask.tolleranze}} {{ask.toll_34bis_1bis}} {{ask.toll_superficie|is_sotto_60}}"}
      - {kind: checkbox, label: "TOLLERANZA DI CUI ALL’ART. 34-BIS, COMMA 2:", when: "{{ask.tolleranze}} {{ask.toll_34bis_2}}"}
      - {kind: checkbox, label: "TOLLERANZA DI CUI ALL’ART. 34-BIS, COMMA 2-BIS", when: "{{ask.tolleranze}} {{ask.toll_34bis_2bis}}"}
      - {kind: checkbox, label: "TOLLERANZA DI CUI ALL’ART. 34-TER", when: "{{ask.tolleranze}} {{ask.toll_34ter_4}}"}
      - {kind: radio, label: trattandosi di immobile ubicato in zona sismica a media o alta, when: "{{ask.tolleranze}}"}
      - {kind: radio, label: non ha rilevanza strutturale, when: "{{ask.tolleranze}} {{ask.toll_strutturale|not}}"}
      - {kind: radio, label: ha rilevanza strutturale, when: "{{ask.tolleranze}} {{ask.toll_strutturale}}"}
      # Its art. 94-bis class (the crawl stops at these three radios; what each opens was read on
      # the portal 2026-10-30): the seismic authorization or its silenzio assenso, each with its
      # date and prot. n.; for a minor or no relevance, the declaration that the control term ran out.
      - {kind: radio, label: intervento rilevante nei riguardi della pubblica incolumità, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}}"}
      - {kind: radio, label: allega l’autorizzazione sismica, on_page: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}} {{ask.toll_sismica|is_autorizzazione}}"}
      - {kind: date, label: rilasciata in data, value: "{{ask.toll_sismica_data|date_it}}", on_page: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}} {{ask.toll_sismica|is_autorizzazione}}"}
      - {kind: text, label: prot. n., value: "{{ask.toll_sismica_protocollo}}", on_page: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}} {{ask.toll_sismica|is_autorizzazione}}"}
      - {kind: radio, label: attesta che sulla istanza di autorizzazione, on_page: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}} {{ask.toll_sismica|is_silenzio_assenso}}"}
      - {kind: date, label: in data, value: "{{ask.toll_silenzio_data|date_it}}", on_page: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}} {{ask.toll_sismica|is_silenzio_assenso}}"}
      - {kind: text, label: prot. n., value: "{{ask.toll_silenzio_protocollo}}", on_page: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}} {{ask.toll_sismica|is_silenzio_assenso}}"}
      - {kind: radio, label: intervento di minore rilevanza nei riguardi, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_minore_rilevanza}}"}
      - {kind: radio, label: intervento privo di rilevanza nei riguardi, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_privo_di_rilevanza}}"}
      - {kind: checkbox, label: dichiara il decorso del termine del procedimento, on_page: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|in_minore_rilevanza__privo_di_rilevanza}} {{ask.toll_decorso}}"}

  # The fees, when the Comune's tariff has them. "pagamento on line" is required with them and
  # the only mode offered; it pays nothing (the SUE's payment page has no methods: the fees go
  # by bank transfer and their receipt is uploaded there).
  # None due: the tariff has none for the pratica, or it has and the client is exempt (its
  # reason's box moves the rows below, which only the other branch fills).
  - section: Dichiarazione relativa ai diritti
    branches: ["{{ask.diritti_euro|positive|not}}", "{{ask.diritti_euro|positive}}"]
    fields:
      - {kind: radio, label: non sono dovuti oneri, when: "{{ask.diritti_euro|positive|not}}"}
      - {kind: radio, label: poiché non previsti dal tariffario, when: "{{ask.diritti_euro|positive|not}} {{ask.diritti_esente|not}}"}
      - {kind: radio, label: poiché esentati, when: "{{ask.diritti_euro|positive|not}} {{ask.diritti_esente}}"}
      - {kind: textarea, label: specificare la motivazione, on_page: true, value: "{{ask.diritti_esenzione_motivo}}", when: "{{ask.diritti_euro|positive|not}} {{ask.diritti_esente}}"}
      - {kind: radio, label: sono dovuti oneri quali diritti o spese, when: "{{ask.diritti_euro|positive}}"}
      - {kind: number, label: per un totale di Euro, value: "{{ask.diritti_euro}}", when: "{{ask.diritti_euro|positive}}"}
      - {kind: radio, label: pagamento on line, when: "{{ask.diritti_euro|positive}}"}

  # CIL (opere temporanee): the communication, the dates, what the works are.
  - section: Comunicazione inizio lavori
    fields:
      - {kind: tick, label: COMUNICA L'INIZIO DEI LAVORI}
      - {kind: date, label: i lavori avranno inizio in data, value: "{{ask.data_inizio_lavori|date_it}}"}
      - {kind: date, label: i lavori termineranno in data, value: "{{ask.data_fine_prevista|date_it}}"}
      - {kind: textarea, label: le opere consistono in, value: "{{ask.dettaglio_intervento}}"}

  # CIL quadro e: other filings presented with it, two rows on the page and more by "+" (three
  # filled on the portal, 2026-11-03). The CIL has no request for assents.
  - section: Altre comunicazioni, segnalazioni e asseverazioni
    leave: [Comunicazioni, Autorità competente]
    fields:
      - {kind: text, label: "Comunicazioni, segnalazioni", value: "{{ask.comunicazione_1}}", when: "{{ask.comunicazioni_contestuali}}"}
      - {kind: text, label: Autorità competente, value: "{{ask.comunicazione_1_autorita}}", when: "{{ask.comunicazioni_contestuali}}"}
      - {kind: text, label: "Comunicazioni, segnalazioni", nth: 2, value: "{{ask.comunicazione_2}}", when: "{{ask.comunicazioni_contestuali}} {{ask.comunicazioni_quante|atleast_2}}"}
      - {kind: text, label: Autorità competente, nth: 2, value: "{{ask.comunicazione_2_autorita}}", when: "{{ask.comunicazioni_contestuali}} {{ask.comunicazioni_quante|atleast_2}}"}
      - kind: each
        count: "{{ask.comunicazioni_quante}}"
        when: "{{ask.comunicazioni_contestuali}}"
        first: 3
        on_page: 2
        block:
          - {kind: text, label: "Comunicazioni, segnalazioni", value: "{{ask.comunicazione_#K}}"}
          - {kind: text, label: Autorità competente, value: "{{ask.comunicazione_#K_autorita}}"}

  # Inizio lavori after a permesso di costruire: the permit, the date, its holder (the client),
  # where the works are.
  - section: dichiarazione riferimenti permesso di costruire
    fields:
      - {kind: text, label: numero permesso, value: "{{ask.pdc_numero}}"}
      - {kind: date, label: data rilascio, value: "{{ask.pdc_data|date_it}}"}
      - {kind: text, label: numero protocollo generale, value: "{{ask.pdc_protocollo}}"}
      - {kind: text, label: anno protocollo generale, value: "{{ask.pdc_anno}}"}
      - {kind: text, label: per interventi di, value: "{{ask.pdc_interventi}}"}

  - section: dichiarazione relativa alla comunicazione di inizio lavori
    fields:
      - {kind: date, label: in data, value: "{{ask.data_inizio_lavori|date_it}}"}

  - section: dichiarazione dell'intestatario del permesso di costruire
    fields:
      - {kind: text, label: intestatario, value: "{{c:identity.first_name,c:identity.last_name,c:business.denominazione|intestatario}}"}
      - {kind: text, label: in qualità di, value: "{{ask.titolo}}"}
      # A company or condominium holds it at its sede legale.
      - {kind: text, label: residente in, value: "{{c:residenza.comune|upper}}", when: "{{c:business.denominazione|empty}}"}
      - {kind: text, label: CAP, value: "{{c:residenza.cap}}", when: "{{c:business.denominazione|empty}}"}
      - {kind: text, label: via, value: "{{c:residenza.indirizzo|upper}}", when: "{{c:business.denominazione|empty}}"}
      - {kind: text, label: numero civico, value: "{{c:residenza.civico}}", when: "{{c:business.denominazione|empty}}"}
      - {kind: text, label: residente in, value: "{{c:business.sede_legale_comune|upper}}", when: "{{c:business.denominazione|empty|not}}"}
      - {kind: text, label: CAP, value: "{{c:business.sede_legale_cap}}", when: "{{c:business.denominazione|empty|not}}"}
      - {kind: text, label: via, value: "{{c:business.sede_legale_indirizzo|upper}}", when: "{{c:business.denominazione|empty|not}}"}
      - {kind: text, label: numero civico, value: "{{c:business.sede_legale_civico}}", when: "{{c:business.denominazione|empty|not}}"}

  # The SUE is the Comune di Napoli's: the comune is always Napoli.
  - section: dichiarazione dell'ubicazione dei lavori
    fields:
      - {kind: text, label: comune, value: NAPOLI}
      - {kind: text, label: "via, viale, piazza", value: "{{c:immobile.indirizzo|upper}}"}
      - {kind: text, label: numero civico, value: "{{c:immobile.civico}}"}

  # Proroga dei termini di inizio o di fine lavori (art. 15 c. 2 DPR 380/2001): the property,
  # the permit (a permesso di costruire, or a DIA by its P.G. number), its catasto and holder,
  # the dates, the days asked and why.
  - section: dichiarazione dell'immobile oggetto della domanda
    leave: [Località, N.Put]
    fields:
      - {kind: text, label: "via , viale, piazza", value: "{{c:immobile.indirizzo|upper}}"}
      - {kind: text, label: numero civico, value: "{{c:immobile.civico}}"}
      - {kind: text, label: CAP, value: "{{c:immobile.cap}}"}
      - {kind: radio, label: di cui al Permesso di costruire, when: "{{ask.titolo_tipo|is_permesso_di_costruire}}"}
      - {kind: text, label: P.G. numero, value: "{{ask.pdc_protocollo}}", when: "{{ask.titolo_tipo|is_permesso_di_costruire}}"}
      - {kind: date, label: del, value: "{{ask.pdc_data|date_it}}", when: "{{ask.titolo_tipo|is_permesso_di_costruire}}"}
      - {kind: radio, label: di cui alla DIA, when: "{{ask.titolo_tipo|is_dia}}"}
      - {kind: text, label: P.G. numero, nth: 2, value: "{{ask.pdc_protocollo}}", when: "{{ask.titolo_tipo|is_dia}}"}
      - {kind: date, label: del, nth: 2, value: "{{ask.pdc_data|date_it}}", when: "{{ask.titolo_tipo|is_dia}}"}
      - {kind: text, label: foglio, value: "{{c:immobile.catasto_foglio}}"}
      - {kind: text, label: mappale, value: "{{c:immobile.catasto_particella}}"}
      - {kind: text, label: subalterno, value: "{{c:immobile.catasto_subalterno}}"}
      - {kind: text, label: per (specificare l'oggetto dell'intervento), value: "{{ask.pdc_interventi}}"}
      - {kind: text, label: intestato a, value: "{{c:identity.first_name,c:identity.last_name,c:business.denominazione|intestatario}}"}
      - {kind: date, label: la cui data di inizio lavori è prevista per, value: "{{ask.proroga_data_prevista|date_it}}", if_present: true}
      - {kind: date, label: la cui data di fine lavori dovrebbe essere entro il, value: "{{ask.fine_termine|date_it}}", if_present: true}
      - {kind: date, label: ed è invece prevista per, value: "{{ask.proroga_data_prevista|date_it}}", if_present: true}

  # The same references where the proroga's property is asked elsewhere (the proroga di
  # ultimazione, the 30-month extensions of art. 10-septies L. 51/2022): a permesso or a SCIA.
  - section: riferimenti titolo edilizio e data prevista
    leave: [N.Put]
    fields:
      - {kind: radio, label: di cui al Permesso di costruire, when: "{{ask.titolo_tipo|is_permesso_di_costruire}}"}
      - {kind: text, label: P.G. numero, value: "{{ask.pdc_protocollo}}", when: "{{ask.titolo_tipo|is_permesso_di_costruire}}"}
      - {kind: date, label: del, value: "{{ask.pdc_data|date_it}}", when: "{{ask.titolo_tipo|is_permesso_di_costruire}}"}
      - {kind: radio, label: di cui alla SCIA, when: "{{ask.titolo_tipo|is_scia}}"}
      - {kind: text, label: P.G. numero, nth: 2, value: "{{ask.pdc_protocollo}}", when: "{{ask.titolo_tipo|is_scia}}"}
      - {kind: date, label: del, nth: 2, value: "{{ask.pdc_data|date_it}}", when: "{{ask.titolo_tipo|is_scia}}"}
      - {kind: text, label: per (specificare l'oggetto dell'intervento), value: "{{ask.pdc_interventi}}"}
      - {kind: text, label: intestato a, value: "{{c:identity.first_name,c:identity.last_name,c:business.denominazione|intestatario}}"}
      - {kind: date, label: la cui data di inizio lavori è prevista per, value: "{{ask.proroga_data_prevista|date_it}}", if_present: true}
      - {kind: date, label: la cui data di fine lavori dovrebbe essere entro il, value: "{{ask.fine_termine|date_it}}", if_present: true}
      - {kind: date, label: ed è invece prevista per, value: "{{ask.proroga_data_prevista|date_it}}", if_present: true}

  # The firm named or changed on its own (nomina, cambio dell'impresa esecutrice): the first
  # firm (`f1:`). The CILA's quadro h), with its blocks and DURC, is the entry above.
  - section: Impresa esecutrice dei lavori
    aliases: [nuova impresa esecutrice]
    leave: [telefono fisso]
    fields:
      - {kind: text, label: denominazione dell'impresa, value: "{{f1:business.denominazione}}"}
      - {kind: text, label: Codice Fiscale/Partita Iva, value: "{{f1:business.partita_iva}}"}
      - {kind: text, label: con sede legale a, value: "{{f1:business.sede_legale_comune|upper}}"}
      - {kind: text, label: Provincia, value: "{{f1:business.sede_legale_provincia}}"}
      - {kind: text, label: CAP, value: "{{f1:business.sede_legale_cap}}"}
      - {kind: text, label: "in via, viale, piazza", value: "{{f1:business.sede_legale_indirizzo|upper}}"}
      - {kind: text, label: n.civico, value: "{{f1:business.sede_legale_civico}}"}
      - {kind: text, label: cell., value: "{{f1:identity.phone|phone_it}}"}
      - {kind: text, label: PEC, value: "{{f1:business.pec}}"}
      - {kind: text, label: iscritta alla Camera di Commercio di, value: "{{f1:business.cciaa|provincia_nome}}"}
      - {kind: text, label: n. REA, value: "{{f1:business.rea|rea_num}}"}

  - section: titolo edilizio posseduto
    fields:
      - {kind: text, label: tipologia titolo edilizio, value: "{{ask.titolo_tipo|upper}}"}
      - {kind: text, label: n., value: "{{ask.pdc_numero}}"}
      - {kind: text, label: anno, value: "{{ask.pdc_anno}}"}

  - section: oggetto dell'istanza
    fields:
      - {kind: radio, label: prima nomina dell'impresa esecutrice, when: "{{ask.nomina_aggiunta|not}}"}
      - {kind: radio, label: nomina in aggiunta alla precedente impresa, when: "{{ask.nomina_aggiunta}}"}

  # Landscape pratiche: the tecnico is the designer, the architect who files with the procura or
  # another technician (`p:`), whose name, codice fiscale and studio ("Studio in:", read
  # 2026-11-02) the other choice opens above the albo's rows. The "+" after the albo's rows adds
  # another technician's whole block (`p2:`, `p3:` ...: name, codice fiscale, studio, phone, PEC,
  # albo, read on a draft 2026-11-05, cancelled unsaved). Under "è colui che presenta la pratica"
  # the same "+" shows only the new block's albo row, its name rows hidden by that choice: another
  # technician beside the architect presenting can't be named (defects.yaml paesaggio-altri-tecnici).
  - section: dati relativi al nome del tecnico
    leave: [Fax]
    supports:
      - {if: "{{ask.progettista_altro|not}}", value: "{{p2:identity.last_name|empty}}", in: ["true"], defect: paesaggio-altri-tecnici, else: "I tecnici del modulo paesaggistico: se l'architetto che presenta la pratica è il suo tecnico, il portale mostra il blocco di un altro tecnico («+») senza nome né codice fiscale, quindi un secondo tecnico non si può indicare. È un difetto del portale: chieda al SUE."}
    fields:
      - {kind: radio, label: è colui che presenta la pratica, when: "{{ask.progettista_altro|not}}"}
      - {kind: text, label: ordine/collegio/albo, value: "{{t:albo.ordine}}", when: "{{ask.progettista_altro|not}}"}
      - {kind: text, label: provincia (sigla), value: "{{t:albo.provincia}}", when: "{{ask.progettista_altro|not}}"}
      - {kind: text, label: numero iscrizione, value: "{{t:albo.numero}}", when: "{{ask.progettista_altro|not}}"}
      - {kind: radio, label: non è colui che presenta la pratica, when: "{{ask.progettista_altro}}"}
      # One block per technician, each after the first by its "+": `p:`, `p2:`, `p3:` ...
      - kind: each
        count: "{{ask.progettisti_quanti}}"
        when: "{{ask.progettista_altro}}"
        anchor: cognome
        block:
          - {kind: text, label: cognome, value: "{{p#N:identity.last_name|upper}}"}
          - {kind: text, label: nome, value: "{{p#N:identity.first_name|upper}}"}
          - {kind: text, label: codice fiscale, value: "{{p#N:identity.codice_fiscale}}"}
          - {kind: select, label: Stato, value: ITALIA}
          - {kind: select, label: Provincia, value: "{{p#N:business.sede_legale_provincia}}"}
          - {kind: text, label: Comune italiano, value: "{{p#N:business.sede_legale_comune|upper}}"}
          - {kind: text, label: "Via, viale", value: "{{p#N:business.sede_legale_indirizzo|upper}}"}
          - {kind: text, label: Numero civico, value: "{{p#N:business.sede_legale_civico}}"}
          - {kind: text, label: C.A.P., value: "{{p#N:business.sede_legale_cap}}"}
          - {kind: text, label: Telefono, value: "{{p#N:identity.phone|phone_it}}"}
          - {kind: text, label: Cell., value: "{{p#N:identity.phone|phone_it}}"}
          - {kind: text, label: Posta elettronica, value: "{{p#N:identity.pec}}", made_up: "the portal looks the PEC up at Salva and keeps it, flagged \"Indirizzo Pec non valido\" unless it is a real one (read 2026-11-02): a made-up address stays flagged"}
          - {kind: text, label: ordine/collegio/albo, value: "{{p#N:albo.ordine}}"}
          - {kind: text, label: provincia (sigla), value: "{{p#N:albo.provincia}}"}
          - {kind: text, label: numero iscrizione, value: "{{p#N:albo.numero}}"}

  # The accertamento di compatibilità paesaggistica: the works and what they changed, the
  # technician (the architect; more are "+" blocks, not mapped), art. 181 (the dichiarante's
  # presa visione) and when the works were done.
  - section: dichiarazione relativa alla descrizione delle opere
    fields:
      - {kind: textarea, label: sintetica descrizione delle opere, value: "{{ask.accertamento_descrizione}}"}
      - {kind: textarea, label: effetti conseguenti alla realizzazione delle opere, value: "{{ask.accertamento_effetti}}"}

  - section: dichiarazione relativa ai dati identificativi del/dei professionista/i
    fields:
      - {kind: text, label: Cognome, value: "{{t:identity.last_name|upper}}"}
      - {kind: text, label: Nome, value: "{{t:identity.first_name|upper}}"}
      - {kind: text, label: codice fiscale, value: "{{t:identity.codice_fiscale}}"}

  - section: dichiarazione riferita all'art. 181
    theirs: [PER PRESA VISIONE]
    fields: []

  - section: dichiarazione relativa alla datazione dell'abuso
    fields:
      - {kind: date, label: indicare la data dell'abuso, value: "{{ask.accertamento_data|date_it}}"}

  # The domanda di parere per esonero dall'autorizzazione paesaggistica. The crawl kept none of
  # the legittimità section's text: its eight radios are read as three choices by row order
  # (lot / conformity / other proof), unconfirmed on the page; a wrong grouping unticks one on
  # Salva and the read-back stops. The conformity radios stay greyed until "esiste un precedente
  # edilizio" is ticked (the 2026-10-30 recrawl): asked only then. One previous title only (its
  # "+" rows aren't mapped).
  - section: titolo del richiedente
    fields:
      - {kind: radio, label: proprietà, when: "{{ask.titolo|is_proprietario}}"}
      - {kind: radio, label: altro, when: "{{ask.titolo|is_proprietario|not}}"}
      - {kind: text, label: (specificare), value: "{{ask.titolo}}", when: "{{ask.titolo|is_proprietario|not}}"}

  - section: dichiarazione della legittimita' dell'intervento
    plus: "one previous title; the parere is refused in Napoli by law (the rules table), so more aren't mapped"
    fields:
      - {kind: radio, label: il lotto è libero, when: "{{ask.esonero_lotto|is_libero}}"}
      - {kind: radio, label: esiste un precedente edilizio, when: "{{ask.esonero_lotto|is_precedente}}"}
      - {kind: text, label: titolo (1), value: "{{ask.precedente_tipo}}", when: "{{ask.esonero_lotto|is_precedente}}"}
      - {kind: text, label: p.g. numero, value: "{{ask.precedente_numero}}", when: "{{ask.esonero_lotto|is_precedente}}"}
      - {kind: date, label: del, value: "{{ask.precedente_data|date_it}}", when: "{{ask.esonero_lotto|is_precedente}}"}
      - {kind: radio, label: lo stato di fatto è conforme, when: "{{ask.esonero_lotto|is_precedente}} {{ask.esonero_conformita|is_conforme}}"}
      - {kind: radio, label: lo stato di fatto non è conforme, when: "{{ask.esonero_lotto|is_precedente}} {{ask.esonero_conformita|is_non_conforme}}"}
      - {kind: date, label: le opere difformi sono state realizzate in data, value: "{{ask.esonero_difformi_data|date_it}}", when: "{{ask.esonero_lotto|is_precedente}} {{ask.esonero_conformita|is_non_conforme}}"}
      - {kind: radio, label: altro, when: "{{ask.esonero_lotto|is_precedente}} {{ask.esonero_conformita|is_altro}}"}
      - {kind: text, label: specificare, value: "{{ask.esonero_conformita_altro}}", when: "{{ask.esonero_lotto|is_precedente}} {{ask.esonero_conformita|is_altro}}"}
      - {kind: radio, label: altra documentazione probatoria, when: "{{ask.esonero_prova|is_documentazione}}"}
      - {kind: textarea, label: indicare la documentazione allegata alla presente, value: "{{ask.esonero_prova_elenco}}", when: "{{ask.esonero_prova|is_documentazione}}"}
      - {kind: radio, label: documentazione catastale di primo impianto, when: "{{ask.esonero_prova|is_catasto}}"}
      - {kind: textarea, label: indicare la documentazione allegata alla presente, nth: 2, value: "{{ask.esonero_prova_elenco}}", when: "{{ask.esonero_prova|is_catasto}}"}
      - {kind: radio, label: non esiste altro titolo abilitativo, when: "{{ask.esonero_prova|is_titoli}}"}

  # One item of Allegato A, chosen by its number ("A.2."): the runner takes the one option
