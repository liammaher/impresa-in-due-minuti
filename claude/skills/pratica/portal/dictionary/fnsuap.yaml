  # Cambio d'intestazione of a CILA, SCIA or DIA: as the voltura, the title by its kind.
  # Two "+" (read on a draft 2026-11-05, cancelled unsaved): the one after the titles' last row
  # adds another title's three boxes, all required, above "presentata da" (whose boxes it
  # renumbers); the one after the holders' last row another holder's three boxes. Two lists,
  # titles first, each block found by its own labels.
  - section: dichiarazione relativa agli estremi della CILA / SCIA / DIA e proprietario
    fields:
      - kind: each
        count: "{{ask.titoli_quanti}}"
        anchor: seleziona un titolo
        block:
          - {kind: select, label: seleziona un titolo, value: "{{ask.titolo#N_tipo|sigla}}"}
          - {kind: text, label: prot. n°, value: "{{ask.pdc#N_protocollo}}"}
          - {kind: date, label: del, value: "{{ask.pdc#N_data|date_it}}"}
      # One block per holder until now, each after the first by its "+" (the first after the
      # holders' last row: the title's is above them).
      - kind: each
        count: "{{ask.precedenti_quanti}}"
        anchor: cognome / ragione sociale
        block:
          - {kind: text, label: cognome / ragione sociale, value: "{{ask.precedente#N_cognome}}"}
          - {kind: text, label: nome, value: "{{ask.precedente#N_nome}}", optional: true}
