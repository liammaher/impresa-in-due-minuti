  # Three Si/No questions: the state is the legitimate one (from the titles, the tolerances this
  # relazione declares, and in sanatoria from it), the tolerances (the CILA's block, by label:
  # crawled apart from the first question, its ids would be offsets), and the sanatoria: the
  # works in progress (art. 37 c. 5) or done with double conformity (art. 36-bis), and the
  # catasto. Case 3 (art. 36-bis c. 1) isn't mapped: the portal makes its dating, its oblazione
  # and its works proposal one radio choice. Each case moves the rows after it, so they go by
  # label (the tolerances move the sanatoria's radios too: the runner finds them by label).
  - section: Asseverazione SCIA - Stato legittimo
    aliases: ["Asseverazione PdC - stato legittimo"]
    # Case 3's works proposal (non prevede / propone interventi) is one of the four rows the portal
    # keeps as one field (defects.yaml scia-36bis-c1): the case is refused, these are never ticked.
    # Its "bassa sismicità" row (zones 3 and 4) never holds in Napoli, zona 2 (DGR Campania
    # 5447/2002): the seismic row ticked is the one for zones 1 and 2. All crawled 2026-11-01.
    leave: [presentata con prot., in data, i cui lavori sono stati iniziati in data, realizzato in data, in euro,
            non prevede interventi, propone la realizzazione di interventi anche strutturali,
            dà atto che l’immobile interessato dall’intervento è ubicato in zona sismica a bassa,
            dà atto che l’immobile interessato dalla tolleranza è ubicato in zona sismica a bassa]
    # The rows the portal keeps as one field, read on made-up drafts (docs/portal-defects.md): case 3's
    # dating, oblazione and works proposal (its seismic box works, but the case can't be filed), and
    # the art. 34-ter variant's dating and oblazione (2026-11-02).
    defect:
      scia-36bis-c1: ["ai fini della sanatoria, la presente SCIA", "Quanto alla rilevanza sismica degli interventi realizzati in assenza"]
      scia-34ter: ["una variante in corso d'opera, in parziale difformità dal titolo, rilasciato prima", dà atto che la data/epoca di realizzazione, attesta che la data/epoca di realizzazione, determina l’oblazione dovuta]
    supports:
      - {if: "{{ask.tolleranze}}", value: "{{ask.toll_34bis_1,ask.toll_34bis_1bis,ask.toll_34bis_2,ask.toll_34bis_2bis,ask.toll_34ter_4|any}}", in: ["true"], else: "Le tolleranze costruttive dichiarate richiedono almeno un tipo (art. 34-bis o 34-ter c. 4)."}
      - {if: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}}", value: "{{ask.toll_sismica}}", in: [autorizzazione, silenzio assenso], else: "Una tolleranza strutturale rilevante per la pubblica incolumità (art. 94-bis c. 1 a) può essere dichiarata solo con l'autorizzazione sismica del Genio Civile (art. 94 c. 2) o con il suo silenzio assenso (c. 2-bis): art. 34-bis c. 3-bis DPR 380/2001."}
      - {if: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|in_minore_rilevanza__privo_di_rilevanza}}", value: "{{ask.toll_decorso}}", in: ["true"], else: "Una tolleranza strutturale di minore rilevanza o priva di rilevanza per la pubblica incolumità può essere dichiarata solo una volta decorso il termine del controllo regionale, senza richieste pendenti e senza esito negativo: art. 34-bis c. 3-bis DPR 380/2001."}
    fields:
      - {kind: radio, label: si}
      - {kind: checkbox, label: corrisponde allo stato legittimo come risultante}
      - {kind: checkbox, label: dal/i titolo/i o dalla/e pratica/che edilizia/e}
      - {kind: checkbox, label: dalle tolleranze di cui all’articolo 34-bis, when: "{{ask.tolleranze}}"}
      - {kind: checkbox, label: dalla sanatoria di cui al successivo quadro, if_present: true, when: "{{ask.sanatoria_titolo|in_scia__permesso}}"}
      - {kind: radio, label: "no", nth: 2, when: "{{ask.tolleranze|not}}"}
      - {kind: radio, label: si, nth: 2, when: "{{ask.tolleranze}}"}
      - {kind: checkbox, label: "TOLLERANZA DI CUI ALL’ART. 34-BIS, COMMA 1 E 1-TER", by_label: true, when: "{{ask.tolleranze}} {{ask.toll_34bis_1}}"}
      - {kind: checkbox, label: "TOLLERANZA DI CUI ALL’ART. 34-BIS, COMMI 1-BIS", by_label: true, when: "{{ask.tolleranze}} {{ask.toll_34bis_1bis}}"}
      - {kind: radio, label: "2%, per le U.I.", by_label: true, when: "{{ask.tolleranze}} {{ask.toll_34bis_1bis}} {{ask.toll_superficie|is_oltre_500}}"}
      - {kind: radio, label: "3%, per le U.I.", by_label: true, when: "{{ask.tolleranze}} {{ask.toll_34bis_1bis}} {{ask.toll_superficie|is_300_500}}"}
      - {kind: radio, label: "4%, per le U.I.", by_label: true, when: "{{ask.tolleranze}} {{ask.toll_34bis_1bis}} {{ask.toll_superficie|is_100_300}}"}
      - {kind: radio, label: "5%, per le U.I.", by_label: true, when: "{{ask.tolleranze}} {{ask.toll_34bis_1bis}} {{ask.toll_superficie|is_60_100}}"}
      - {kind: radio, label: "6%, per le U.I.", by_label: true, when: "{{ask.tolleranze}} {{ask.toll_34bis_1bis}} {{ask.toll_superficie|is_sotto_60}}"}
      - {kind: checkbox, label: "TOLLERANZA DI CUI ALL’ART. 34-BIS, COMMA 2:", by_label: true, when: "{{ask.tolleranze}} {{ask.toll_34bis_2}}"}
      - {kind: checkbox, label: "TOLLERANZA DI CUI ALL’ART. 34-BIS, COMMA 2-BIS", by_label: true, when: "{{ask.tolleranze}} {{ask.toll_34bis_2bis}}"}
      - {kind: checkbox, label: "TOLLERANZA DI CUI ALL’ART. 34-TER", by_label: true, when: "{{ask.tolleranze}} {{ask.toll_34ter_4}}"}
      - {kind: radio, label: trattandosi di immobile ubicato in zona sismica a media o alta, by_label: true, when: "{{ask.tolleranze}}"}
      - {kind: radio, label: non ha rilevanza strutturale, by_label: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale|not}}"}
      - {kind: radio, label: ha rilevanza strutturale, by_label: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale}}"}
      # Its art. 94-bis class (the crawl stops at these three radios; what each opens was read on
      # the portal 2026-10-30): the seismic authorization or its silenzio assenso, each with its
      # date and prot. n.; for a minor or no relevance, the declaration that the control term ran out.
      - {kind: radio, label: intervento rilevante nei riguardi della pubblica incolumità, by_label: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}}"}
      - {kind: radio, label: allega l’autorizzazione sismica, on_page: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}} {{ask.toll_sismica|is_autorizzazione}}"}
      - {kind: date, label: rilasciata in data, value: "{{ask.toll_sismica_data|date_it}}", on_page: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}} {{ask.toll_sismica|is_autorizzazione}}"}
      - {kind: text, label: prot. n., value: "{{ask.toll_sismica_protocollo}}", on_page: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}} {{ask.toll_sismica|is_autorizzazione}}"}
      - {kind: radio, label: attesta che sulla istanza di autorizzazione, on_page: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}} {{ask.toll_sismica|is_silenzio_assenso}}"}
      - {kind: date, label: in data, value: "{{ask.toll_silenzio_data|date_it}}", on_page: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}} {{ask.toll_sismica|is_silenzio_assenso}}"}
      - {kind: text, label: prot. n., value: "{{ask.toll_silenzio_protocollo}}", on_page: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_rilevante}} {{ask.toll_sismica|is_silenzio_assenso}}"}
      - {kind: radio, label: intervento di minore rilevanza nei riguardi, by_label: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_minore_rilevanza}}"}
      - {kind: radio, label: intervento privo di rilevanza nei riguardi, by_label: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|is_privo_di_rilevanza}}"}
      - {kind: checkbox, label: dichiara il decorso del termine del procedimento, on_page: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale}} {{ask.toll_classe|in_minore_rilevanza__privo_di_rilevanza}} {{ask.toll_decorso}}"}
      - {kind: radio, label: "no", nth: 3, when: "{{ask.sanatoria_titolo|is_nessuna}}"}
      - {kind: radio, label: si, nth: 3, if_present: true, when: "{{ask.sanatoria_titolo|in_scia__permesso}}"}
      - {kind: checkbox, label: un intervento soggetto a SCIA in corso di esecuzione, if_present: true, when: "{{ask.sanatoria_titolo|in_scia__permesso}} {{ask.sanatoria_titolo|is_scia}} {{ask.sanatoria_caso|is_in_corso}}"}
      - {kind: date, label: i cui lavori sono stati iniziati in data, by_label: true, value: "{{ask.sanatoria_data|date_it}}", when: "{{ask.sanatoria_titolo|in_scia__permesso}} {{ask.sanatoria_titolo|is_scia}} {{ask.sanatoria_caso|is_in_corso}}"}
