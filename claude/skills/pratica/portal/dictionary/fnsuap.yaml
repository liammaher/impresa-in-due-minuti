      - {kind: text, label: di, value: "{{t:albo.provincia|provincia_nome}}", when: "{{ask.progettista_altro|not}}"}
      - {kind: text, label: al n., value: "{{t:albo.numero}}", when: "{{ask.progettista_altro|not}}"}
      - {kind: text, label: Telefono, value: "{{business.telefono|phone_it}}", when: "{{ask.progettista_altro|not}}"}
      - {kind: text, label: cell., value: "{{t:identity.phone|phone_it}}", when: "{{ask.progettista_altro|not}}"}
      - {kind: text, label: posta elettronica certificata, value: "{{t:identity.pec}}", when: "{{ask.progettista_altro|not}}"}
