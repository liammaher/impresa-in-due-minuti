      - {kind: text, label: estremi del documento di soggiorno, value: "{{cr:permesso_soggiorno.numero}}", when: "{{c:business.denominazione,c:business.rea|impresa_non_iscritta}} {{cr:permesso_soggiorno.numero|empty|not}}"}
      - {kind: text, label: rilasciato da, value: "QUESTURA DI {{cr:permesso_soggiorno.questura_rilascio|upper}}", when: "{{c:business.denominazione,c:business.rea|impresa_non_iscritta}} {{cr:permesso_soggiorno.numero|empty|not}}"}
      - {kind: date, label: il, value: "{{cr:permesso_soggiorno.data_rilascio|date_it}}", when: "{{c:business.denominazione,c:business.rea|impresa_non_iscritta}} {{cr:permesso_soggiorno.numero|empty|not}}"}
      - {kind: date, label: scadenza, value: "{{cr:permesso_soggiorno.data_scadenza|date_it}}", when: "{{c:business.denominazione,c:business.rea|impresa_non_iscritta}} {{cr:permesso_soggiorno.numero|empty|not}}"}


  # The architect, from the studio vault's titolare. Prefilled with the SPID login's name and
  # CF, overwritten here. Born abroad (birth province EE, as the client's): "all'Estero" and the
  # Stato it switches on, in the "Nato a" row.
  - section: Qualifica e dati del procuratore
    leave: [Fax]
    fields:
      - {kind: select, label: Qualifica del procuratore, value: PROFESSIONISTA INCARICATO}
      - {kind: text, label: Nome, value: "{{t:identity.first_name}}"}
      - {kind: text, label: Cognome, value: "{{t:identity.last_name}}"}
      - {kind: select, label: Sesso, value: "{{t:identity.sex}}"}
      - {kind: select, label: Cittadinanza, value: ITALIA}
      - {kind: text, label: Nato a, value: "{{t:identity.birth_comune|upper}}"}
      - {kind: text, label: il, value: "{{t:identity.date_of_birth|date_it}}"}
      - {kind: radio, label: in Italia, when: "{{t:identity.birth_province|estero|not}}"}
      - {kind: text, label: Provincia, value: "{{t:identity.birth_province}}", when: "{{t:identity.birth_province|estero|not}}"}
      - {kind: radio, label: all'Estero, when: "{{t:identity.birth_province|estero}}"}
      - {kind: select, label: Stato, value: "{{t:identity.birth_country}}", when: "{{t:identity.birth_province|estero}}"}
      - {kind: text, label: Cod.Fiscale, value: "{{t:identity.codice_fiscale}}"}
      - {kind: text, label: Residente in, value: "{{t:residenza.comune|upper}}"}
      - {kind: text, label: Provincia, nth: 2, value: "{{t:residenza.provincia}}"}
      - {kind: text, label: CAP, value: "{{t:residenza.cap}}"}
      - {kind: text, label: Indirizzo, value: "{{t:residenza.indirizzo|upper}} {{t:residenza.civico}}"}
      - {kind: text, label: Tel, value: "{{t:identity.phone|phone_it}}"}
      - {kind: text, label: eMail PEC, value: "{{t:identity.pec}}"}

  - section: Oggetto della pratica
    fields:
      - {kind: text, label: descrizione sintetica, value: "{{ask.oggetto}}"}

  # The client's own domicilio digitale: their PEC in INAD when they say so, else saved empty.
  # A private person's is in INAD; INI-PEC is a business's or a professional's: a client company's.
  - section: DOMICILIO DIGITALE
    fields:
      - {kind: checkbox, label: il seguente domicilio digitale inserito in INAD, when: "{{ask.domicilio_inad}}"}
      - {kind: text, label: il seguente domicilio digitale inserito in INAD, value: "{{c:identity.pec}}", when: "{{ask.domicilio_inad}}"}
      - {kind: checkbox, label: il seguente domicilio digitale inserito in INI-PEC, when: "{{c:business.denominazione|empty|not}} {{ask.domicilio_inipec}}"}
      - {kind: text, label: il seguente domicilio digitale inserito in INI-PEC, value: "{{c:business.pec}}", when: "{{c:business.denominazione|empty|not}} {{ask.domicilio_inipec}}"}

  # The box under the PEC ("si dichiara di essere consapevoli ...") is required, and the
  # person's: the run leaves it and its "required" to them. The PEC is looked up at Salva, as the
  # landscape technician's is: every rehearsal's made-up one is flagged (seen 2026-11-02, once the
  # runner read the portal's warnings).
  - section: DOMICILIO ELETTRONICO
    theirs: [Si dichiara di essere consapevoli]
    fields:
      - {kind: text, label: "N.B. Inserire l'indirizzo della casella PEC", value: "{{t:identity.pec}}", made_up: "the portal looks the PEC up at Salva and keeps it, flagged \"Indirizzo Pec non valido\" unless it is a real one: a made-up address stays flagged"}

  # The property: the client's immobile in the vault (c:immobile.*), the property the works are on.
  - section: Localizzazione dell'intervento
    # The proroga's "sede dell'attività" and the voltura's "ubicazione dell'attività" are the
    # same block: where the works are (a business vault's recipe takes its own entry first).
    aliases: ["ubicazione dell'immobile", "dichiarazione relativa alla sede dell'attività", "dichiarazione ubicazione dell'intervento", "ubicazione dell'attività"]
    leave: [Frazione]
    fields:
      - {kind: text, label: CAP, value: "{{c:immobile.cap}}"}
      - {kind: lookup, label: "Via, Viale, Piazza", value: "{{c:immobile.indirizzo|upper}}"}
      - {kind: text, label: n° civico, value: "{{c:immobile.civico}}"}
      - {kind: text, label: scala, value: "{{c:immobile.scala}}", optional: true}
      - {kind: text, label: piano, value: "{{c:immobile.piano}}", optional: true}
      - {kind: text, label: interno, value: "{{c:immobile.interno}}", optional: true}

  # The property in the Catasto Fabbricati (NCEU: a unit with its subalterno and categoria), or a
  # plot only in the Catasto Terreni (NCT: a new building's land), whose one box of its own is the
  # sezione censuaria: the visura's sezione, which the vault keeps as catasto_sezione either way.
  # The section is a list of groups, each a catasto (the radios) with a list of units: a unit's
  # "+" (the first after its boxes) adds one with the same labels under the same catasto; the
  # group's "+" (the second) adds another group, its own radios and one unit (read on a CILA
  # draft 2026-11-04, NCEU and NCT alike, cancelled unsaved). Units go in vault order, one group
  # per catasto: where a unit's catasto isn't the one before's, the group's "+", then its radio
  # (the page's last of that label). The units are counted across groups, so unit n is the
  # n-th "foglio". A group's "+" after any group's last unit adds one more, so the catasto may
  # change as often as the units do (a third group back to the first read on a draft 2026-11-05).
  - section: Dati catastali
    leave: [sezione Amministrativa, classe]
    fields:
      - {kind: radio, label: Nuovo Catasto Edilizio Urbano, when: "{{ask.catasto_terreni|not}}"}
      - {kind: radio, label: Nuovo Catasto Terreni, when: "{{ask.catasto_terreni}}"}
      - kind: each
        count: "{{ask.unita_catastali}}"
        anchor: foglio
        add_when: "{{ask.catasto_terreni#N,ask.catasto_terreni#P|differ|not}}"
        block:
          - {kind: add, nth: 2, when: "{{ask.catasto_terreni#N,ask.catasto_terreni#P|differ}}"}
          # The new group's radios by their cell's text, the page's last: once the portal has
          # checked the section (any "+" does), every group's radio is titled "Il valore è
          # obbligatorio" and reads only NCEU or NCT (2026-11-04: by its long name, none found).
          - {kind: radio, label: NCEU, last: true, free: true, when: "{{ask.catasto_terreni#N,ask.catasto_terreni#P|differ}} {{ask.catasto_terreni#N|not}}"}
          - {kind: radio, label: NCT, last: true, free: true, when: "{{ask.catasto_terreni#N,ask.catasto_terreni#P|differ}} {{ask.catasto_terreni#N}}"}
          - {kind: text, label: foglio, value: "{{c:immobile#N.catasto_foglio}}"}
          - {kind: text, label: particella/mappale, value: "{{c:immobile#N.catasto_particella}}"}
          # Found by its own title: the particella's texts (its title said twice) read
          # "subalterno" from the next column as near as the subalterno's own, and by label the
          # first box wins (a run typed the subalterno into the particella, 2026-11-04). The title
          # is the portal's rule too: a unit with no subalterno takes 0, stored so in the vault.
          - {kind: text, label: subalterno, title: se non presente indicare il numero 0, value: "{{c:immobile#N.catasto_subalterno}}", when: "{{ask.catasto_terreni#N|not}}"}
          - {kind: text, label: sezione Urbana, value: "{{c:immobile#N.catasto_sezione}}", optional: true, when: "{{ask.catasto_terreni#N|not}}"}
          - {kind: select, label: categoria, value: "{{c:immobile#N.catasto_categoria|categoria}}", when: "{{ask.catasto_terreni#N|not}}"}
          - {kind: text, label: sezione Censuaria, value: "{{c:immobile#N.catasto_sezione}}", optional: true, when: "{{ask.catasto_terreni#N}}"}

  # The client's title. The dropdown's "altro" (a tenant, a comodatario: + specificare) adds a
  # row and renumbers the radios below it. Then the title held alone (a.1), or the assent of
  # the other holders (a.2), whose row opens: a person (`r:`), or a company (`o:`) with `r:` its
  # legale rappresentante. The "+" after the row adds another holder's whole row, the company tick
  # too (read on a SCIA draft 2026-11-05, three rows, cancelled unsaved): one per holder.
  - section: a) Titolarità dell'intervento
    aliases: ["Titolarità dell'intervento"]
    fields:
      - {kind: select, label: "Il richiedente dichiara di avere titolo", value: altro, when: "{{ask.titolo|titolo_is_altro}}"}
      - {kind: text, label: specificare, value: "{{ask.titolo}}", when: "{{ask.titolo|titolo_is_altro}}"}
      - {kind: select, label: "Il richiedente dichiara di avere titolo", value: "{{ask.titolo|titolo_pratica}}", when: "{{ask.titolo|titolo_is_altro|not}}"}
      - {kind: radio, label: avere titolarità esclusiva, when: "{{ask.titolo_esclusivo}}"}
      - {kind: radio, label: non avere titolarità esclusiva, when: "{{ask.titolo_esclusivo|not}}"}
      # One block per other holder, each after the first by its "+": a person (`r:`, `r2:` ...),
      # or a company (`o:`, `o2:` ...) with its legale rappresentante as `r#N:`.
      - kind: each
        count: "{{ask.altri_titolari}}"
        when: "{{ask.titolo_esclusivo|not}}"
        anchor: Cognome
        block:
          - {kind: text, label: Cognome, value: "{{r#N:identity.last_name}}"}
          - {kind: text, label: Nome, value: "{{r#N:identity.first_name}}"}
          - {kind: text, label: C.F., value: "{{r#N:identity.codice_fiscale}}"}
          - {kind: date, label: Data di nascita, value: "{{r#N:identity.date_of_birth|date_it}}"}
          - {kind: select, label: Sesso, value: "{{r#N:identity.sex|sesso}}"}
          - {kind: select, label: Provincia, value: "{{r#N:identity.birth_province}}"}
          - {kind: text, label: Comune italiano, value: "{{r#N:identity.birth_comune|upper}}"}
          - {kind: select, label: Provincia, nth: 2, value: "{{r#N:residenza.provincia}}"}
          - {kind: text, label: Comune italiano, nth: 2, value: "{{r#N:residenza.comune|upper}}"}
          - {kind: text, label: "Via, Piazza", value: "{{r#N:residenza.indirizzo|upper}}"}
          - {kind: text, label: "N.", value: "{{r#N:residenza.civico}}"}
          - {kind: text, label: C.A.P., value: "{{r#N:residenza.cap}}"}
          # A company's contacts, else the person's own.
          - {kind: text, label: PEC / posta elettronica, value: "{{o#N:business.pec}}", when: "{{o#N:business.denominazione|empty|not}}"}
          - {kind: text, label: Telefono, value: "{{o#N:business.telefono|phone_it}}", when: "{{o#N:business.denominazione|empty|not}}"}
          - {kind: text, label: PEC / posta elettronica, value: "{{r#N:identity.email}}", when: "{{o#N:business.denominazione|empty}}"}
          - {kind: text, label: Telefono, value: "{{r#N:identity.phone|phone_it}}", when: "{{o#N:business.denominazione|empty}}"}
          - {kind: checkbox, label: Da compilare solo nel caso in cui il titolare sia, when: "{{o#N:business.denominazione|empty|not}}"}
          - {kind: text, label: in qualità di, value: legale rappresentante, when: "{{o#N:business.denominazione|empty|not}}"}
          - {kind: text, label: della ditta / società, value: "{{o#N:business.denominazione}}", when: "{{o#N:business.denominazione|empty|not}}"}
          - {kind: text, label: con codice fiscale / p. IVA, value: "{{o#N:business.partita_iva}}", when: "{{o#N:business.denominazione|empty|not}}"}

  - section: b) Opere su parti comuni
    fields:
      - {kind: radio, label: non riguardano parti comuni, when: "{{ask.parti_comuni|is_nessuna}}"}
      - {kind: radio, label: riguardano le parti comuni di un fabbricato condominiale, when: "{{ask.parti_comuni|is_condominio}}"}
      - {kind: radio, label: riguardano parti comuni di un fabbricato con più proprietà, when: "{{ask.parti_comuni|is_comproprieta}}"}
      - {kind: radio, label: riguardano parti dell'edificio di proprietà comune, when: "{{ask.parti_comuni|is_art_1102}}"}

  # Only the dichiarante's PER PRESA VISIONE.
  - section: c) Presentazione della comunicazione
    omit: the dichiarante's PER PRESA VISIONE

  # Works to start (d.1: on a date, or once the SUE has the other assents), under way (d.2:
  # the start date and the 333 € receipt, uploaded here) or done (d.3: the end date and the
  # 1,000 € receipt). A receipt's box is named by the row above it: its own cell shows the
  # file's name once uploaded.
  - section: d) Qualificazione dell'intervento
    fields:
      - {kind: radio, label: intervento descritto di seguito nella dichiarazione del progettista, when: "{{ask.cila_stato|is_da_iniziare}}"}
      - {kind: radio, label: i lavori avranno inizio in data, when: "{{ask.cila_stato|is_da_iniziare}} {{ask.inizio_dopo_assensi|not}}"}
      - {kind: date, label: data inizio lavori, value: "{{ask.data_inizio_lavori|date_it}}", when: "{{ask.cila_stato|is_da_iniziare}} {{ask.inizio_dopo_assensi|not}}"}
      - {kind: radio, label: i lavori avranno inizio dopo la comunicazione, when: "{{ask.cila_stato|is_da_iniziare}} {{ask.inizio_dopo_assensi}}"}
      - {kind: radio, label: intervento in corso di esecuzione, when: "{{ask.cila_stato|is_in_corso}}"}
      - {kind: date, label: intervento iniziato in data, value: "{{ask.data_inizio_lavori|date_it}}", when: "{{ask.cila_stato|is_in_corso}}"}
      - {kind: file, label: "allegare qui la ricevuta di versamento", value: "{{ask.ricevuta_sanzione}}", when: "{{ask.cila_stato|is_in_corso}}"}
      - {kind: radio, label: intervento realizzato, when: "{{ask.cila_stato|is_realizzato}}"}
      - {kind: date, label: intervento realizzato in data, value: "{{ask.data_lavori_realizzati|date_it}}", when: "{{ask.cila_stato|is_realizzato}}"}
      - {kind: file, label: "allegare qui la ricevuta di versamento", value: "{{ask.ricevuta_sanzione}}", when: "{{ask.cila_stato|is_realizzato}}"}

  # The property's lawful use: residenziale, industriale, commerciale, else "altro" and its name.
  - section: e) Destinazione d'uso
    fields:
      - {kind: select, label: "L'intervento interessa l'immobile", value: "{{c:immobile.destinazione_uso|destinazione}}"}
      - {kind: text, label: specificare, via: altro, value: "{{c:immobile.destinazione_uso}}", when: "{{c:immobile.destinazione_uso|destinazione_is_altro}}"}

  # Free, or a contributo (manutenzione straordinaria adding urban load and floor area): paid,
  # its receipt in the attachments, or to be paid before the works start.
  - section: f) Calcolo del contributo
    fields:
      - {kind: radio, label: l'intervento da realizzare è a titolo gratuito, when: "{{ask.cila_onerosa|not}}"}
      - {kind: radio, label: l'intervento da realizzare è a titolo oneroso, when: "{{ask.cila_onerosa}}"}
      - {kind: radio, label: allega la ricevuta di versamento, when: "{{ask.cila_onerosa}} {{ask.contributo_pagato}}"}
      - {kind: radio, label: "effettuerà, prima dell'inizio dei lavori, il pagamento", when: "{{ask.cila_onerosa}} {{ask.contributo_pagato|not}}"}

