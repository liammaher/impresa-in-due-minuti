  sanatoria_paesaggio: {type: yes_no, question: "Si tratta di una sanatoria, per cui i lavori che richiedevano l'autorizzazione paesaggistica seguono l'art. 36-bis c. 4?", default: "false"}
  # A permesso in sanatoria of art. 36 (the recipe sets it): the landscape compatibility of works
