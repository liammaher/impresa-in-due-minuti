  # The SCIA's and the SCIA alternativa's f), the permesso's e): every box always shown, each
  # radio its own group, though the national form takes one of the five ways (asks.stato_legittimo).
  # A title's line is its kind's box, its "n." (named by the kind, its cell's context) and the
  # nth "del" (one per line, in order: 1-13 the titles and "altro", 14 and 15 the two primo
  # impianto lines, 16 the sanction's, 17 the tolerances' pratica). The two document blocks
  # (built before titles, a title lost) repeat their labels: nth 1 and 2. Each primo impianto
  # line has two more boxes with no text of their own, read as the line's label: its details
  # (they switch its n. and del on) and its copy (an upload in the quadro). "altro" alone repeats
  # ("+": specificare, n., del): titles past one per kind go there (the national form agrees).
  - section: Regolarità urbanistica e precedenti edilizi
    leave: [n., del, specificare, di Euro, a titolo di sanzione, Prot. n., atto di registrazione, in data]
    supports:
      - {if: "{{ask.stato_legittimo|is_titoli}}", value: "{{ask.prec_titolo_unico,ask.prec_permesso,ask.prec_autorizzazione,ask.prec_comunicazione,ask.prec_dia,ask.prec_dia_alternativa,ask.prec_scia,ask.prec_cel,ask.prec_condono,ask.prec_pdc_sanatoria,ask.prec_scia_sanatoria,ask.prec_scia_sanatoria_variante,ask.prec_altro|any}}", in: ["true"], else: "Uno stato legittimo desunto dai titoli dell'edificio richiede almeno un titolo."}
      - {if: "{{ask.stato_legittimo|in_epoca__prova}}", value: "{{ask.prova_catasto,ask.prova_altri|any}}", in: ["true"], else: "Per un edificio senza titolo agli atti servono il catasto di primo impianto o altri documenti."}
      - {if: "{{ask.stato_legittimo|is_tolleranze}}", value: "{{ask.toll_prec_pratica,ask.toll_prec_atto|any}}", in: ["true"], else: "Uno stato legittimo dalle dichiarazioni di tolleranze richiede dove sono state rese: la pratica o l'atto."}
    fields:
      # Only the permesso's e): a new construction on free land (its recipes offer it).
      - {kind: radio, label: che le opere riguardano un intervento di nuova costruzione su area libera, if_present: true, when: "{{ask.stato_legittimo|is_area_libera}}"}
      - {kind: radio, label: che l’immobile/U.I. è stato oggetto del/i seguente/i titolo/i, when: "{{ask.stato_legittimo|is_titoli}}"}
      - {kind: checkbox, label: titolo unico (SUAP), when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_titolo_unico}}"}
      - {kind: text, label: titolo unico (SUAP), value: "{{ask.prec_titolo_unico_numero}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_titolo_unico}}"}
      - {kind: date, label: del, nth: 1, value: "{{ask.prec_titolo_unico_data|date_it}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_titolo_unico}}"}
      - {kind: checkbox, label: permesso di costruire / licenza edil., when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_permesso}}"}
      - {kind: text, label: permesso di costruire / licenza edil., value: "{{ask.prec_permesso_numero}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_permesso}}"}
      - {kind: date, label: del, nth: 2, value: "{{ask.prec_permesso_data|date_it}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_permesso}}"}
      - {kind: checkbox, label: autorizzazione edilizia, when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_autorizzazione}}"}
      - {kind: text, label: autorizzazione edilizia, value: "{{ask.prec_autorizzazione_numero}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_autorizzazione}}"}
      - {kind: date, label: del, nth: 3, value: "{{ask.prec_autorizzazione_data|date_it}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_autorizzazione}}"}
      - {kind: checkbox, label: comunicazione edilizia (art. 26, when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_comunicazione}}"}
      - {kind: text, label: comunicazione edilizia (art. 26, value: "{{ask.prec_comunicazione_numero}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_comunicazione}}"}
      - {kind: date, label: del, nth: 4, value: "{{ask.prec_comunicazione_data|date_it}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_comunicazione}}"}
      - {kind: checkbox, label: denuncia di inizio attività, when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_dia}}"}
      - {kind: text, label: denuncia di inizio attività, value: "{{ask.prec_dia_numero}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_dia}}"}
      - {kind: date, label: del, nth: 5, value: "{{ask.prec_dia_data|date_it}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_dia}}"}
      - {kind: checkbox, label: DIA/SCIA alternativa al permesso di costruire, when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_dia_alternativa}}"}
      - {kind: text, label: DIA/SCIA alternativa al permesso di costruire, value: "{{ask.prec_dia_alternativa_numero}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_dia_alternativa}}"}
      - {kind: date, label: del, nth: 6, value: "{{ask.prec_dia_alternativa_data|date_it}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_dia_alternativa}}"}
      - {kind: checkbox, label: segnalazione certificata di inizio attività, when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_scia}}"}
      - {kind: text, label: segnalazione certificata di inizio attività, value: "{{ask.prec_scia_numero}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_scia}}"}
      - {kind: date, label: del, nth: 7, value: "{{ask.prec_scia_data|date_it}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_scia}}"}
      - {kind: checkbox, label: comunicazione edilizia libera, when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_cel}}"}
      - {kind: text, label: comunicazione edilizia libera, value: "{{ask.prec_cel_numero}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_cel}}"}
      - {kind: date, label: del, nth: 8, value: "{{ask.prec_cel_data|date_it}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_cel}}"}
      # The heading of the four titles in sanatoria, ticked with any of them.
      - {kind: checkbox, label: titolo edilizio in sanatoria, when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_condono,ask.prec_pdc_sanatoria,ask.prec_scia_sanatoria,ask.prec_scia_sanatoria_variante|any}}"}
      - {kind: checkbox, label: condono edilizio, when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_condono}}"}
      - {kind: text, label: condono edilizio, value: "{{ask.prec_condono_numero}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_condono}}"}
      - {kind: date, label: del, nth: 9, value: "{{ask.prec_condono_data|date_it}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_condono}}"}
      - {kind: checkbox, label: permesso di costruire in sanatoria, when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_pdc_sanatoria}}"}
      - {kind: text, label: permesso di costruire in sanatoria, value: "{{ask.prec_pdc_sanatoria_numero}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_pdc_sanatoria}}"}
      - {kind: date, label: del, nth: 10, value: "{{ask.prec_pdc_sanatoria_data|date_it}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_pdc_sanatoria}}"}
      - {kind: checkbox, label: SCIA in sanatoria di cui all’art. 36-bis, when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_scia_sanatoria}}"}
      - {kind: text, label: SCIA in sanatoria di cui all’art. 36-bis, value: "{{ask.prec_scia_sanatoria_numero}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_scia_sanatoria}}"}
      - {kind: date, label: del, nth: 11, value: "{{ask.prec_scia_sanatoria_data|date_it}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_scia_sanatoria}}"}
      - {kind: checkbox, label: SCIA in sanatoria per variante, when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_scia_sanatoria_variante}}"}
      - {kind: text, label: SCIA in sanatoria per variante, value: "{{ask.prec_scia_sanatoria_variante_numero}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_scia_sanatoria_variante}}"}
      - {kind: date, label: del, nth: 12, value: "{{ask.prec_scia_sanatoria_variante_data|date_it}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_scia_sanatoria_variante}}"}
      # "altro": its own specificare, then the 13th "n." and "del" (no kind in their cells).
      - {kind: checkbox, label: altro, when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_altro}}"}
      - {kind: text, label: specificare, value: "{{ask.prec_altro_quale}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_altro}}"}
      - {kind: text, label: n., nth: 13, value: "{{ask.prec_altro_numero}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_altro}}"}
      - {kind: date, label: del, nth: 13, value: "{{ask.prec_altro_data|date_it}}", when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_altro}}"}
      # Every other title on its own "altro" line, each added with "+".
      - kind: each
        count: "{{ask.prec_altro_quanti}}"
        when: "{{ask.stato_legittimo|is_titoli}} {{ask.prec_altro}}"
        first: 2
        block:
          - {kind: text, label: specificare, value: "{{ask.prec_altro_#K_quale}}"}
          - {kind: text, label: n., value: "{{ask.prec_altro_#K_numero}}"}
          - {kind: date, label: del, value: "{{ask.prec_altro_#K_data|date_it}}"}
      # Built when no title was required.
      - {kind: radio, label: si tratta di immobile realizzato in un’epoca, when: "{{ask.stato_legittimo|is_epoca}}"}
      - {kind: checkbox, label: copia accatastamento di primo impianto, nth: 1, when: "{{ask.stato_legittimo|is_epoca}} {{ask.prova_catasto}}"}
      # Its two boxes, under it and before the other line's: nth 2 its details, nth 3 its copy.
      # The crawl has them only as choices under the line's box, so gen.py's nth 2 is the other
      # line's box: by label, never that id.
      - {kind: checkbox, label: copia accatastamento di primo impianto, nth: 2, by_label: true, when: "{{ask.stato_legittimo|is_epoca}} {{ask.prova_catasto}} {{ask.prova_catasto_modo|is_estremi}}"}
      - {kind: text, label: n., nth: 14, value: "{{ask.prova_catasto_numero}}", when: "{{ask.stato_legittimo|is_epoca}} {{ask.prova_catasto}} {{ask.prova_catasto_modo|is_estremi}}"}
      - {kind: date, label: del, nth: 14, value: "{{ask.prova_catasto_data|date_it}}", when: "{{ask.stato_legittimo|is_epoca}} {{ask.prova_catasto}} {{ask.prova_catasto_modo|is_estremi}}"}
      - {kind: checkbox, label: copia accatastamento di primo impianto, nth: 3, on_page: true, when: "{{ask.stato_legittimo|is_epoca}} {{ask.prova_catasto}} {{ask.prova_catasto_modo|is_copia}}"}
      - {kind: file, label: copia accatastamento di primo impianto, value: "{{ask.prova_catasto_copia}}", on_page: true, when: "{{ask.stato_legittimo|is_epoca}} {{ask.prova_catasto}} {{ask.prova_catasto_modo|is_copia}}"}
      - {kind: checkbox, label: altri documenti probanti, nth: 1, when: "{{ask.stato_legittimo|is_epoca}} {{ask.prova_altri}}"}
      # A title lost, with documentary proof of it.
      - {kind: radio, label: non sono disponibili la copia o gli estremi del titolo abilitativo, when: "{{ask.stato_legittimo|is_prova}}"}
      - {kind: checkbox, label: copia accatastamento di primo impianto, nth: 2, when: "{{ask.stato_legittimo|is_prova}} {{ask.prova_catasto}}"}
      # Its two boxes: the crawl didn't reach them (the other line's are hidden in this state).
      - {kind: checkbox, label: copia accatastamento di primo impianto, nth: 3, on_page: true, when: "{{ask.stato_legittimo|is_prova}} {{ask.prova_catasto}} {{ask.prova_catasto_modo|is_estremi}}"}
      - {kind: text, label: n., nth: 15, value: "{{ask.prova_catasto_numero}}", when: "{{ask.stato_legittimo|is_prova}} {{ask.prova_catasto}} {{ask.prova_catasto_modo|is_estremi}}"}
      - {kind: date, label: del, nth: 15, value: "{{ask.prova_catasto_data|date_it}}", when: "{{ask.stato_legittimo|is_prova}} {{ask.prova_catasto}} {{ask.prova_catasto_modo|is_estremi}}"}
      - {kind: checkbox, label: copia accatastamento di primo impianto, nth: 4, on_page: true, when: "{{ask.stato_legittimo|is_prova}} {{ask.prova_catasto}} {{ask.prova_catasto_modo|is_copia}}"}
      - {kind: file, label: copia accatastamento di primo impianto, value: "{{ask.prova_catasto_copia}}", on_page: true, when: "{{ask.stato_legittimo|is_prova}} {{ask.prova_catasto}} {{ask.prova_catasto_modo|is_copia}}"}
      - {kind: checkbox, label: altri documenti probanti, nth: 2, when: "{{ask.stato_legittimo|is_prova}} {{ask.prova_altri}}"}
      # Sanctions imposed and paid: the receipt attached, or the payment's details.
      - {kind: radio, label: che per l’immobile/U.I. sono state irrogate le seguenti sanzioni, when: "{{ask.stato_legittimo|is_sanzioni}}"}
      - {kind: radio, label: si allega la relativa ricevuta, when: "{{ask.stato_legittimo|is_sanzioni}} {{ask.sanzione_prova|is_ricevuta}}"}
      - {kind: radio, label: si forniscono gli estremi del pagamento, when: "{{ask.stato_legittimo|is_sanzioni}} {{ask.sanzione_prova|is_estremi}}"}
      - {kind: text, label: di Euro, value: "{{ask.sanzione_importo}}", when: "{{ask.stato_legittimo|is_sanzioni}} {{ask.sanzione_prova|is_estremi}}"}
      - {kind: date, label: "a titolo di sanzione pecuniaria, irrogata in data", value: "{{ask.sanzione_irrogata|date_it}}", when: "{{ask.stato_legittimo|is_sanzioni}} {{ask.sanzione_prova|is_estremi}}"}
      - {kind: text, label: Prot. n., nth: 1, value: "{{ask.sanzione_protocollo}}", when: "{{ask.stato_legittimo|is_sanzioni}} {{ask.sanzione_prova|is_estremi}}"}
      - {kind: date, label: del, nth: 16, value: "{{ask.sanzione_protocollo_data|date_it}}", when: "{{ask.stato_legittimo|is_sanzioni}} {{ask.sanzione_prova|is_estremi}}"}
      # Construction tolerances declared earlier: in a pratica's forms, or attached to a deed.
      - {kind: radio, label: che l’immobile/U.I. è stato oggetto della/e seguente/i dichiarazione, when: "{{ask.stato_legittimo|is_tolleranze}}"}
      - {kind: checkbox, label: "dichiarazione delle tolleranze di cui all’art. 34-bis o 34-ter, comma 4, presentata", when: "{{ask.stato_legittimo|is_tolleranze}} {{ask.toll_prec_pratica}}"}
      - {kind: text, label: Prot. n., nth: 2, value: "{{ask.toll_prec_pratica_protocollo}}", when: "{{ask.stato_legittimo|is_tolleranze}} {{ask.toll_prec_pratica}}"}
      - {kind: date, label: del, nth: 17, value: "{{ask.toll_prec_pratica_data|date_it}}", when: "{{ask.stato_legittimo|is_tolleranze}} {{ask.toll_prec_pratica}}"}
      - {kind: checkbox, label: "dichiarazione delle tolleranze di cui all’art. 34-bis o 34-ter, comma 4, allegata", when: "{{ask.stato_legittimo|is_tolleranze}} {{ask.toll_prec_atto}}"}
      - {kind: text, label: atto di registrazione n., value: "{{ask.toll_prec_atto_numero}}", when: "{{ask.stato_legittimo|is_tolleranze}} {{ask.toll_prec_atto}}"}
      - {kind: date, label: in data, value: "{{ask.toll_prec_atto_data|date_it}}", when: "{{ask.stato_legittimo|is_tolleranze}} {{ask.toll_prec_atto}}"}
      # The state today: as the legitimate one, or with this pratica's sanatoria (its quadro c's
      # "presentata in sanatoria"). This pratica's own tolerances aren't mapped (the asseverazione
      # answers "no"). New construction on free land too: the portal requires one of the two, as the
      # national form does (its choice 011 has no "none"); free land with nothing built is fully
      # conformant (a run stopped on it, 2026-11-02).
      - {kind: radio, label: pienamente conforme alla documentazione dello stato legittimo, when: "{{ask.sanatoria_titolo|is_nessuna}}"}
      - {kind: radio, label: "conforme alla documentazione dello stato legittimo o di fatto legittimato sopra indicata, unitamente", when: "{{ask.sanatoria_titolo|in_scia__permesso}}"}

