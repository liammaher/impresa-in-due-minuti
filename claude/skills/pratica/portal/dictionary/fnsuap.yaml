sections:
  # The dichiarante is the client (the titolare). The draft opens on it. A private person declares
  # in their own name (PERSONA); a company or a condominium (`c:` with business.*) as DITTA/SOCIETA',
  # its legale rappresentante or administrator (`cr:`) declaring for it. Each way is a branch of
  # its own: ISCRITTA renumbers every row below it. The choices that move rows come first, the
  # non-EU box (which opens four rows) last, so the rows typed before keep the crawl's ids. Born
  # abroad, the Stato of birth replaces its Provincia and Comune with "Località estera" (no rows
  # move), so the residence's and the sede's Provincia and Comune count one fewer.
  - section: Scheda anagrafica
    open: false
    leave: [Fax]
    branches: ["{{c:business.denominazione|empty}}", "{{c:business.denominazione,c:business.rea|impresa_iscritta}}", "{{c:business.denominazione,c:business.rea|impresa_non_iscritta}}"]
    fields:
      # A private person: the client (`c:`).
      - {kind: radio, label: "PERSONA (Privato)", when: "{{c:business.denominazione|empty}}"}
      - {kind: select, label: Cittadinanza, value: "{{c:identity.citizenship|cittadinanza}}", when: "{{c:business.denominazione|empty}} {{c:identity.citizenship|straniera}}"}
      - {kind: select, label: Stato, value: "{{c:identity.birth_country}}", when: "{{c:business.denominazione|empty}} {{c:identity.birth_province|estero}}"}
      - {kind: text, label: Località estera, on_page: true, value: "{{c:identity.birth_comune|upper}}", when: "{{c:business.denominazione|empty}} {{c:identity.birth_province|estero}}"}
      - {kind: text, label: Nome, value: "{{c:identity.first_name}}", when: "{{c:business.denominazione|empty}}"}
      - {kind: text, label: Cognome, value: "{{c:identity.last_name}}", when: "{{c:business.denominazione|empty}}"}
      - {kind: text, label: Cod.Fiscale, value: "{{c:identity.codice_fiscale}}", when: "{{c:business.denominazione|empty}}"}
