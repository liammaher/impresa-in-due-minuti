      - {kind: radio, label: "è sottoposta a tutela ed è necessario il rilascio dell'autorizzazione di cui al comma 5", when: "{{ask.idrogeologico|is_autorizzazione}}"}
      - {kind: checkbox, label: "Si allega la documentazione necessaria ai fini del rilascio dell'autorizzazione", when: "{{ask.idrogeologico|is_autorizzazione}}"}
      - {kind: radio, label: non è sottoposta a tutela, nth: 2, when: "{{ask.idraulico|not}}"}
      - {kind: radio, label: "è sottoposta a tutela ed è necessario il rilascio dell'autorizzazione di cui al comma 2", when: "{{ask.idraulico}}"}
      - {kind: checkbox, label: "Si allega la documentazione necessaria ai fini del rilascio dell'autorizzazione", nth: 2, when: "{{ask.idraulico}}"}
      - {kind: radio, label: non è soggetto a Valutazione d'incidenza, when: "{{ask.vinca|not}}"}
      - {kind: radio, label: è soggetto a Valutazione d'incidenza, when: "{{ask.vinca}}"}
      - {kind: checkbox, label: Si allega la documentazione necessaria all'approvazione del progetto, when: "{{ask.vinca}}"}
      - {kind: radio, label: l'intervento non ricade nella fascia di rispetto, when: "{{ask.fascia_cimiteriale|is_no}}"}
      - {kind: radio, label: l'intervento ricade nella fascia di rispetto ed è consentito, when: "{{ask.fascia_cimiteriale|is_consentito}}"}
      - {kind: radio, label: l'intervento ricade in fascia di rispetto cimiteriale e non è consentito, when: "{{ask.fascia_cimiteriale|is_non_consentito}}"}
      - {kind: checkbox, label: Si allega la documentazione necessaria per la richiesta di deroga, when: "{{ask.fascia_cimiteriale|is_non_consentito}}"}

  # Major-hazard plants (RIR) and the other ecological vincoli (a sewage plant's fascia, or
  # another named), self-certified or with the request for their assent.
  - section: Asseverazione SCIA - Altri Vincoli
    supports:
      - {if: "{{ask.altri_vincoli_eco|is_nessuno|not}}", value: "{{ask.altri_vincoli_eco_tipo}}", in: [depuratori, altro], else: "Il modulo della SCIA non ha una voce specifica per la fascia di rispetto di un pozzo (art. 94 D.Lgs. 152/2006): risponda altro e la indichi."}
    fields:
      - {kind: radio, label: nel comune NON è presente, when: "{{ask.rir|is_no}}"}
      - {kind: radio, label: "nel comune E' presente un'attività a rischio d'incidente rilevante e la relativa “area di danno” è individuata", when: "{{ask.rir|is_fuori_area}}"}
      - {kind: radio, label: l'intervento NON ricade nell'area di danno, when: "{{ask.rir|is_fuori_area}}"}
      - {kind: radio, label: "nel comune E' presente un'attività a rischio d'incidente rilevante e la relativa “area di danno” è individuata", when: "{{ask.rir|is_in_area}}"}
      - {kind: radio, label: l'intervento ricade in area di danno, when: "{{ask.rir|is_in_area}}"}
      - {kind: checkbox, label: si allega la documentazione necessaria alla valutazione del progetto, when: "{{ask.rir|is_in_area}}"}
      - {kind: radio, label: "nel comune E' presente un'attività a rischio d'incidente rilevante e la relativa “area di danno” non è individuata", when: "{{ask.rir|is_non_individuata}}"}
      - {kind: checkbox, label: si allega la documentazione necessaria alla valutazione del progetto, nth: 2, when: "{{ask.rir|is_non_individuata}}"}
      - {kind: radio, label: Fascia di rispetto dei depuratori, when: "{{ask.altri_vincoli_eco|is_nessuno|not}} {{ask.altri_vincoli_eco_tipo|is_depuratori}}"}
      - {kind: radio, label: Altro, when: "{{ask.altri_vincoli_eco|is_nessuno|not}} {{ask.altri_vincoli_eco_tipo|is_altro}}"}
      - {kind: text, label: "Specificare:", value: "{{ask.altri_vincoli_eco_quale}}", when: "{{ask.altri_vincoli_eco|is_nessuno|not}} {{ask.altri_vincoli_eco_tipo|is_altro}}"}
      - {kind: checkbox, label: si allegano le autocertificazioni, when: "{{ask.altri_vincoli_eco|is_autocertificazione}}"}
      - {kind: checkbox, label: si allega la documentazione necessaria ai fini del rilascio dei relativi atti di assenso, when: "{{ask.altri_vincoli_eco|is_assenso}}"}

  # Fasce di rispetto (roads, rail, power lines, gas, military, airport, another), ticked as
