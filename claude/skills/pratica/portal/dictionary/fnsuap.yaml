      - {kind: date, label: Data di nascita, anchor: Cognome, block: 1, value: "{{p:identity.date_of_birth|date_it}}", when: "{{ask.progettista_altro}}"}
      - {kind: select, label: Cittadinanza, anchor: Cognome, block: 1, value: ITALIA, when: "{{ask.progettista_altro}}"}
      - {kind: select, label: Sesso, anchor: Cognome, block: 1, value: "{{p:identity.sex|sesso}}", when: "{{ask.progettista_altro}}"}
      - {kind: select, label: Stato, anchor: Cognome, block: 1, value: ITALIA, when: "{{ask.progettista_altro}}"}
      - {kind: select, label: Provincia, anchor: Cognome, block: 1, value: "{{p:identity.birth_province}}", when: "{{ask.progettista_altro}}"}
      - {kind: text, label: Comune italiano, anchor: Cognome, block: 1, value: "{{p:identity.birth_comune|upper}}", when: "{{ask.progettista_altro}}"}
      - {kind: select, label: Stato, nth: 2, anchor: Cognome, block: 1, value: ITALIA, when: "{{ask.progettista_altro}}"}
      - {kind: select, label: Provincia, nth: 2, anchor: Cognome, block: 1, value: "{{p:residenza.provincia}}", when: "{{ask.progettista_altro}}"}
      - {kind: text, label: Comune italiano, nth: 2, anchor: Cognome, block: 1, value: "{{p:residenza.comune|upper}}", when: "{{ask.progettista_altro}}"}
      - {kind: text, label: "Via, Piazza", anchor: Cognome, block: 1, value: "{{p:residenza.indirizzo|upper}}", when: "{{ask.progettista_altro}}"}
      - {kind: text, label: "N.", anchor: Cognome, block: 1, value: "{{p:residenza.civico}}", when: "{{ask.progettista_altro}}"}
      - {kind: text, label: C.A.P., anchor: Cognome, block: 1, value: "{{p:residenza.cap}}", when: "{{ask.progettista_altro}}"}
