  - section: Comunicazione per la vendita di alcolici
    theirs: [Di non aver riportato condanne, Di essere consapevole che l'avvio]
    fields:
      - {kind: checkbox, label: Alcole etilico puro, when: "{{ask.alcol_puro}}"}
      - {kind: checkbox, label: Aromi alcolici, when: "{{ask.alcol_aromi}}"}
      - {kind: checkbox, label: Liquori ed acquaviti, when: "{{ask.alcol_liquori}}"}
      - {kind: checkbox, label: Vino (tranquillo e/o spumante), when: "{{ask.alcol_vino}}"}
      - {kind: checkbox, label: Birra, when: "{{ask.alcol_birra}}"}
      - {kind: checkbox, label: Prodotti alcolici intermedi, when: "{{ask.alcol_intermedi}}"}
      - {kind: checkbox, label: Altre bevande alcoliche, when: "{{ask.alcol_altre_bevande}}"}
      - {kind: checkbox, label: Profumeria alcolica, when: "{{ask.alcol_profumeria}}"}
      - {kind: checkbox, label: Altri prodotti alcolici, when: "{{ask.alcol_altri}}"}
      - {kind: radio, label: Che la Comunicazione/SCIA/Istanza per l'esercizio, when: "{{ask.alcol_con_scia}}"}
      # With the SCIA the box takes the code alone ("dd.dd.dd"), after it the code and a few words.
