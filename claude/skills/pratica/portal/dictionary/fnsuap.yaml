      - {kind: text, label: prot.n., by_label: true, value: "{{ask.paes_protocollo}}", when: "{{ask.titolo_tipo|is_scia}} {{ask.titolo_con_paesaggistica}}"}
      - {kind: date, label: del, nth: 2, by_label: true, value: "{{ask.paes_data|date_it}}", when: "{{ask.titolo_tipo|is_scia}} {{ask.titolo_con_paesaggistica}}"}
      - {kind: radio, label: di cui all'autorizzazione paesaggistica, when: "{{ask.titolo_tipo|is_autorizzazione_paesaggistica}}"}
