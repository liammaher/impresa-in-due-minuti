      - {kind: checkbox, label: Il/la sottoscritto/a comunica la modifica della SEDE LEGALE, when: "{{ask.var_sede_legale}}"}
      - {kind: text, label: della la Società/impresa, value: "{{business.denominazione}}", when: "{{ask.var_sede_legale}}"}
      - {kind: date, label: a far data dal, value: "{{ask.var_decorrenza|date_it}}", when: "{{ask.var_sede_legale}}"}
      - {kind: text, label: dalla via, value: "{{ask.sede_precedente_via}}", when: "{{ask.var_sede_legale}}"}
      - {kind: text, label: Comune, value: "{{ask.sede_precedente_comune}}", when: "{{ask.var_sede_legale}}"}
      - {kind: text, label: prov., value: "{{ask.sede_precedente_provincia}}", when: "{{ask.var_sede_legale}}"}
      - {kind: text, label: alla via, value: "{{business.sede_legale_indirizzo}} {{business.sede_legale_civico}}", when: "{{ask.var_sede_legale}}"}
      - {kind: text, label: Comune, nth: 2, value: "{{business.sede_legale_comune}}", when: "{{ask.var_sede_legale}}"}
      - {kind: text, label: prov., nth: 2, value: "{{business.sede_legale_provincia}}", when: "{{ask.var_sede_legale}}"}
      - {kind: radio, label: Verbale, when: "{{ask.var_denominazione}} {{ask.var_atto|is_verbale}}"}
      - {kind: radio, label: Delibera societaria del CdA o Assemblea, when: "{{ask.var_denominazione}} {{ask.var_atto|is_delibera}}"}
      - {kind: radio, label: Altro, when: "{{ask.var_denominazione}} {{ask.var_atto|is_altro}}"}
      - {kind: date, label: del, nth: 2, value: "{{ask.var_atto_data|date_it}}", when: "{{ask.var_denominazione}} {{ask.var_atto|is_altro|not}}", on_page: true}
      - {kind: text, label: specificare, value: "{{ask.var_atto_altro}}", when: "{{ask.var_denominazione}} {{ask.var_atto|is_altro}}", on_page: true}
      - {kind: radio, label: Verbale, when: "{{ask.var_sede_legale}} {{ask.var_atto|is_verbale}}"}
      - {kind: radio, label: Delibera societaria del CdA o Assemblea, when: "{{ask.var_sede_legale}} {{ask.var_atto|is_delibera}}"}
      - {kind: radio, label: Altro, when: "{{ask.var_sede_legale}} {{ask.var_atto|is_altro}}"}
