      - {kind: radio, label: non ha rilevanza strutturale, by_label: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale|not}}"}
      - {kind: radio, label: ha rilevanza strutturale, by_label: true, when: "{{ask.tolleranze}} {{ask.toll_strutturale}}"}
