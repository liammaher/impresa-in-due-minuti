      - {kind: select, label: Provincia, nth: 3, anchor: Cognome, block: 1, value: "{{p:business.sede_legale_provincia}}", when: "{{ask.progettista_altro}}"}
      - {kind: text, label: Comune italiano, nth: 3, anchor: Cognome, block: 1, value: "{{p:business.sede_legale_comune|upper}}", when: "{{ask.progettista_altro}}"}
      - {kind: text, label: "Via, Piazza", nth: 2, anchor: Cognome, block: 1, value: "{{p:business.sede_legale_indirizzo|upper}}", when: "{{ask.progettista_altro}}"}
      - {kind: text, label: "N.", nth: 2, anchor: Cognome, block: 1, value: "{{p:business.sede_legale_civico}}", when: "{{ask.progettista_altro}}"}
      - {kind: text, label: C.A.P., nth: 2, anchor: Cognome, block: 1, value: "{{p:business.sede_legale_cap}}", when: "{{ask.progettista_altro}}"}
