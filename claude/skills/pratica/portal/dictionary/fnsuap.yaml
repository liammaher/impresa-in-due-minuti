  # The SCIA's own is the same section as the SCIA alternativa's (one crawl fingerprint): see
  # "Asseverazione SCIA Alternativa - Sicurezza impianti".

  # The SCIA's fire and acoustic quadro is the SCIA alternativa's: see "Asseverazione PdC -
  # inquinamento acustico".

  # Asbestos (the piano di lavoro attached), hygiene (conforming, under art. 24 c. 5-bis, or
  # the derogation asked) and the structures.
  - section: Asseverazione SCIA - Amianto
    aliases: ["Asseverazione SCIA Alternativa - Amianto"]
    leave: [con prot., in data]
    fields:
      - {kind: radio, label: non interessano parti di edifici con presenza di fibre di amianto, when: "{{ask.amianto|not}}"}
      - {kind: radio, label: interessano parti di edifici con presenza di fibre di amianto, when: "{{ask.amianto}}"}
      - {kind: checkbox, label: in allegato alla presente relazione di asseverazione, when: "{{ask.amianto}}"}
      - {kind: radio, label: è conforme ai requisiti igienico-sanitari e alle ipotesi di deroghe, when: "{{ask.igienico_conforme}} {{ask.igienico_24_5bis|not}}"}
      - {kind: radio, label: "è conforme ai requisiti igienico-sanitari previsti dalla normativa vigente e ricade", when: "{{ask.igienico_conforme}} {{ask.igienico_24_5bis}}"}
      # Its cases, opened by it (seen 2026-10-29): one is required, and each opens art. 5-ter's
      # adattabilità box (required) and its two conditions (one required) below it, found from
      # its box (`anchor`): a low one-room flat ticks two cases, and each one's conditions.
      - {kind: checkbox, label: locali con un’altezza minima interna, on_page: true, when: "{{ask.igienico_conforme}} {{ask.igienico_24_5bis}} {{ask.igienico_5bis_caso|in_altezza__altezza_e_monostanza_uno__altezza_e_monostanza_due}}"}
      - {kind: checkbox, label: che soddisfano il requisito dell, anchor: locali con un’altezza minima interna, block: 1, when: "{{ask.igienico_conforme}} {{ask.igienico_24_5bis}} {{ask.igienico_5bis_caso|in_altezza__altezza_e_monostanza_uno__altezza_e_monostanza_due}} {{ask.igienico_adattabilita}}"}
      - {kind: checkbox, label: i locali sono situati in edifici sottoposti ad interventi di recupero, anchor: locali con un’altezza minima interna, block: 1, when: "{{ask.igienico_conforme}} {{ask.igienico_24_5bis}} {{ask.igienico_5bis_caso|in_altezza__altezza_e_monostanza_uno__altezza_e_monostanza_due}} {{ask.igienico_5ter|is_recupero}}"}
      - {kind: checkbox, label: è contestualmente presentato, anchor: locali con un’altezza minima interna, block: 1, when: "{{ask.igienico_conforme}} {{ask.igienico_24_5bis}} {{ask.igienico_5bis_caso|in_altezza__altezza_e_monostanza_uno__altezza_e_monostanza_due}} {{ask.igienico_5ter|is_progetto_alternativo}}"}
      - {kind: checkbox, label: alloggio monostanza per una persona, on_page: true, when: "{{ask.igienico_conforme}} {{ask.igienico_24_5bis}} {{ask.igienico_5bis_caso|in_monostanza_uno__altezza_e_monostanza_uno}}"}
      - {kind: checkbox, label: che soddisfano il requisito dell, anchor: alloggio monostanza per una persona, block: 1, when: "{{ask.igienico_conforme}} {{ask.igienico_24_5bis}} {{ask.igienico_5bis_caso|in_monostanza_uno__altezza_e_monostanza_uno}} {{ask.igienico_adattabilita}}"}
      - {kind: checkbox, label: i locali sono situati in edifici sottoposti ad interventi di recupero, anchor: alloggio monostanza per una persona, block: 1, when: "{{ask.igienico_conforme}} {{ask.igienico_24_5bis}} {{ask.igienico_5bis_caso|in_monostanza_uno__altezza_e_monostanza_uno}} {{ask.igienico_5ter|is_recupero}}"}
      - {kind: checkbox, label: è contestualmente presentato, anchor: alloggio monostanza per una persona, block: 1, when: "{{ask.igienico_conforme}} {{ask.igienico_24_5bis}} {{ask.igienico_5bis_caso|in_monostanza_uno__altezza_e_monostanza_uno}} {{ask.igienico_5ter|is_progetto_alternativo}}"}
      - {kind: checkbox, label: alloggio monostanza per due persone, on_page: true, when: "{{ask.igienico_conforme}} {{ask.igienico_24_5bis}} {{ask.igienico_5bis_caso|in_monostanza_due__altezza_e_monostanza_due}}"}
      - {kind: checkbox, label: che soddisfano il requisito dell, anchor: alloggio monostanza per due persone, block: 1, when: "{{ask.igienico_conforme}} {{ask.igienico_24_5bis}} {{ask.igienico_5bis_caso|in_monostanza_due__altezza_e_monostanza_due}} {{ask.igienico_adattabilita}}"}
      - {kind: checkbox, label: i locali sono situati in edifici sottoposti ad interventi di recupero, anchor: alloggio monostanza per due persone, block: 1, when: "{{ask.igienico_conforme}} {{ask.igienico_24_5bis}} {{ask.igienico_5bis_caso|in_monostanza_due__altezza_e_monostanza_due}} {{ask.igienico_5ter|is_recupero}}"}
      - {kind: checkbox, label: è contestualmente presentato, anchor: alloggio monostanza per due persone, block: 1, when: "{{ask.igienico_conforme}} {{ask.igienico_24_5bis}} {{ask.igienico_5bis_caso|in_monostanza_due__altezza_e_monostanza_due}} {{ask.igienico_5ter|is_progetto_alternativo}}"}
      - {kind: radio, label: non è conforme ai requisiti igienico-sanitari, when: "{{ask.igienico_conforme|not}}"}
      - {kind: checkbox, label: Si allega documentazione per la richiesta di deroga, when: "{{ask.igienico_conforme|not}}"}
      # Sismica: concrete or steel works (their art. 65 denuncia attached), then the seismic
      # filing for works on structures.
      - {kind: radio, label: non prevede la realizzazione di opere di conglomerato cementizio, when: "{{ask.strutture|not}}"}
      - {kind: radio, label: non prevede la realizzazione di opere di conglomerato cementizio, when: "{{ask.strutture}} {{ask.cemento_armato|not}}"}
      - {kind: radio, label: prevede la realizzazione di opere di conglomerato cementizio, when: "{{ask.strutture}} {{ask.cemento_armato}}"}
      - {kind: checkbox, label: si allega la denuncia di cui all'articolo 65, when: "{{ask.strutture}} {{ask.cemento_armato}}"}
      - {kind: radio, label: non prevede opere da denunciare o autorizzare, when: "{{ask.strutture|not}}"}
      - {kind: radio, label: prevede opere in zona sismica da denunciare, when: "{{ask.strutture}} {{ask.sismica|is_deposito}}"}
      - {kind: checkbox, label: Si allega documentazione relativa alla denuncia dei lavori in zona sismica, when: "{{ask.strutture}} {{ask.sismica|is_deposito}}"}
      - {kind: radio, label: prevede opere strutturali soggette ad autorizzazione sismica, when: "{{ask.strutture}} {{ask.sismica|is_autorizzazione}}"}
      - {kind: checkbox, label: Si allega la documentazione necessaria per il rilascio dell'autorizzazione sismica, when: "{{ask.strutture}} {{ask.sismica|is_autorizzazione}}"}
      - {kind: radio, label: costituisce una variante non sostanziale riguardante parti strutturali, when: "{{ask.strutture}} {{ask.sismica|is_variante}}"}
      - {kind: text, label: con prot., value: "{{ask.sismica_protocollo}}", when: "{{ask.strutture}} {{ask.sismica|is_variante}}"}
      - {kind: date, label: in data, value: "{{ask.sismica_data|date_it}}", when: "{{ask.strutture}} {{ask.sismica|is_variante}}"}

  # Three protections, one answer each: the landscape (parte III D.Lgs. 42/2004), the building
  # as a bene culturale (parte II: the Soprintendenza), a protected natural area (L. 394/1991).
  # A landscape authorization is its own operation on Napoli's SUE, selected with the SCIA in
  # the wizard (rehearsals/scia-paesaggistica-*): here the asseverazione names its procedure.
  # An authorization the works already have, extended or renewed with the title (paesaggio
  # proroga or rinnovo), is stated as the semplificata, as the combinations were filled on the
  # portal (2026-11-04); the renewal is the semplificata's own procedure (art. 7 D.P.R. 31/2017).
  # The two "Si allega ... parere/nulla
  # osta" boxes are the Soprintendenza's (first) and the park's (second).
  - section: Asseverazione SCIA - Tutela Storico Ambientale
    aliases: ["Asseverazione SCIA Alternativa - Tutela Storico Ambientale"]
    fields:
      - {kind: radio, label: NON ricade in zona sottoposta a tutela, when: "{{ask.paesaggio|is_no}}"}
      - {kind: radio, label: "ricade in zona tutelata, ma le opere non comportano alterazione", when: "{{ask.paesaggio|is_senza_autorizzazione}}"}
      - {kind: radio, label: ricade in zona tutelata e le opere comportano alterazione, when: "{{ask.sanatoria_paesaggio|not}} {{ask.paesaggio|in_semplificata__proroga__rinnovo}}"}
      - {kind: radio, label: è assoggettato al procedimento semplificato, when: "{{ask.sanatoria_paesaggio|not}} {{ask.paesaggio|in_semplificata__proroga__rinnovo}}"}
      # What each box adds on Allega documenti, read on the combinations' filled drafts 2026-11-01:
      # the semplificata's a required slot taking a plain PDF (parts/paesaggistica-semplificata.yaml), the
      # ordinaria's the second relazione slot, the parere vincolante's a signed-only slot (the person's).
      - {kind: checkbox, label: Si allega la relazione paesaggistica semplificata, when: "{{ask.sanatoria_paesaggio|not}} {{ask.paesaggio|in_semplificata__proroga__rinnovo}}", slot: "Relazione paesaggistica semplificata e documentazione necessaria"}
      - {kind: radio, label: ricade in zona tutelata e le opere comportano alterazione, when: "{{ask.sanatoria_paesaggio|not}} {{ask.paesaggio|is_ordinaria}}"}
      - {kind: radio, label: è assoggettato al procedimento ordinario, when: "{{ask.sanatoria_paesaggio|not}} {{ask.paesaggio|is_ordinaria}}"}
      - {kind: checkbox, label: Si allega la relazione paesaggistica e la documentazione, when: "{{ask.sanatoria_paesaggio|not}} {{ask.paesaggio|is_ordinaria}}", slot: "Relazione paesaggistica e documentazione per il rilascio"}
      # A sanatoria: the compatibility of works already done, the parere's documents attached
      # (the SCIA's form only: the SCIA alternativa has no sanatoria).
      - {kind: radio, label: ricade in zona tutelata e le opere comportano alterazione, when: "{{ask.sanatoria_paesaggio}} {{ask.paesaggio|in_semplificata__ordinaria}}"}
      - {kind: radio, label: è assoggettato al procedimento di accertamento della compatibilità paesaggistica, if_present: true, when: "{{ask.sanatoria_paesaggio}} {{ask.paesaggio|in_semplificata__ordinaria}}"}
      - {kind: checkbox, label: si allega documentazione necessaria ai fini del rilascio del parere vincolante, if_present: true, when: "{{ask.sanatoria_paesaggio}} {{ask.paesaggio|in_semplificata__ordinaria}}", slot: "Documentazione necessaria ai fini del rilascio del parere vincolante (signed files only: the person's)"}
      - {kind: radio, label: non è sottoposto a tutela, when: "{{ask.bene_culturale|not}}"}
      - {kind: radio, label: è sottoposto a tutela, when: "{{ask.bene_culturale}}"}
      - {kind: checkbox, label: "Si allega la documentazione necessaria ai fini del rilascio del parere/nulla osta", when: "{{ask.bene_culturale}}"}
      - {kind: radio, label: non ricade in area tutelata, when: "{{ask.area_protetta|is_no}}"}
      - {kind: radio, label: "ricade in area tutelata, ma le opere non comportano alterazione", when: "{{ask.area_protetta|is_senza_alterazione}}"}
      - {kind: radio, label: è sottoposto alle relative disposizioni, when: "{{ask.area_protetta|is_nulla_osta}}"}
      - {kind: checkbox, label: "Si allega la documentazione necessaria ai fini del rilascio del parere/nulla osta", nth: 2, when: "{{ask.area_protetta|is_nulla_osta}}"}

  # Vincolo idrogeologico, vincolo idraulico, VINCA, a cemetery's fascia di rispetto (works not
  # allowed there ask for a deroga, its documents attached).
