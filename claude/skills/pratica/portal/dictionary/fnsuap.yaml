      - {kind: radio, label: AFFITTACAMERE, when: "{{ask.tipo_struttura|is_affittacamere}}"}
      - {kind: radio, label: BED AND BREAKFAST, when: "{{ask.tipo_struttura|is_bed_and_breakfast}}"}
  - section: carattere dell'esercizio
    fields:
      - {kind: radio, label: Annuale, when: "{{ask.stagionale|not}}"}
      - {kind: radio, label: Stagionale, when: "{{ask.stagionale}}"}
