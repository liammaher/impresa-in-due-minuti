      - {kind: radio, label: "3%, per le U.I.", by_label: true, when: "{{ask.tolleranze}} {{ask.toll_34bis_1bis}} {{ask.toll_superficie|is_300_500}}"}
      - {kind: radio, label: "4%, per le U.I.", by_label: true, when: "{{ask.tolleranze}} {{ask.toll_34bis_1bis}} {{ask.toll_superficie|is_100_300}}"}
      - {kind: radio, label: "5%, per le U.I.", by_label: true, when: "{{ask.tolleranze}} {{ask.toll_34bis_1bis}} {{ask.toll_superficie|is_60_100}}"}
      - {kind: radio, label: "6%, per le U.I.", by_label: true, when: "{{ask.tolleranze}} {{ask.toll_34bis_1bis}} {{ask.toll_superficie|is_sotto_60}}"}
