  # progettista says which filing; its documents are attached to the pratica.
  cemento_armato: {type: yes_no, question: "I lavori prevedono la realizzazione di strutture in conglomerato cementizio armato, normale o precompresso, o di strutture metalliche (art. 65 DPR 380/2001)?"}
  # The permesso's form also takes the art. 65 denuncia and the seismic deposito attached now.
  strutture_allegate: {type: yes_no, question: "I documenti degli adempimenti strutturali (la denuncia dell'art. 65, quelli del deposito sismico) si allegano ora alla richiesta, anziché alla comunicazione di inizio lavori?", propose: "false", when: "{{ask.strutture}}"}
  # The permesso's g1): the structural designer named now, or before the works start.
  strutture_incaricato: {type: yes_no, question: "Il progettista strutturale è già incaricato (indicato tra le persone della pratica), anziché da nominare prima dell'inizio dei lavori?", propose: "false", when: "{{ask.strutture}}"}
