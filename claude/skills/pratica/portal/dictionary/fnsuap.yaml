  paesaggio_accertamento: {type: yes_no, question: "La compatibilità paesaggistica dei lavori già eseguiti è richiesta con questa pratica, come accertamento ai sensi dell'art. 167 D.Lgs. 42/2004?", default: "false"}
  bene_culturale:
