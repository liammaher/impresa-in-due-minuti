# Known defects of a portal: a case the law allows that the portal can't take as the law asks.
# A recipe's refusal names one (`supports: - {..., defect: <id>}`); gen.py copies the entry into
# the steps file, and pre-flight returns it under `defects` beside the refusal, so the person
# hears what the portal does and chooses what to do. Never filled around (no hidden boxes ticked,
# no state the page itself can't make). What to report and how each was checked is the entry's
# `page`: defects.py --write draws docs/portal-defects.md from it (gen.py leaves it out of the
# steps files). This file is the one record: edit it, never the page.

scia-36bis-c1:
  title: "SCIA in sanatoria, art. 36-bis c. 1 (Salva Casa): the portal saves one of three statements"
  portal: "Napoli's SUE on impresainungiorno: the SCIA's asseverazione, sanatoria quadro"
  what: "The case's four rows (the date of the works proven by documents, the date attested, the oblazione, the works proposal) are one field: the portal keeps only the one ticked last."
  law: "Art. 36-bis DPR 380/2001 and the national form ask for all three together: when the works were done, the oblazione the technician determines (c. 5), and whether works are proposed (c. 2)."
  checked: "2026-11-01, on a made-up draft; the case's seismic box (art. 36-bis c. 3-bis) works and is not part of it"
  choices:
    - "Ask the SUE (Comune di Napoli, Sportello Unico Edilizia) how they want this sanatoria filed while the portal can't take it: by PEC, or on the portal with the date and the oblazione stated in the attached relazione tecnica asseverata."
    - "Report the defect to the portal's operator (InfoCamere's impresainungiorno support) or the SUE: docs/portal-defects.md says what and how it was checked."
    - "File it on the portal yourself, by hand, as the SUE tells you: Claude doesn't fill this case."
  report: docs/portal-defects.md
  page:
    heading: "SCIA in sanatoria, art. 36-bis c. 1: dating, oblazione and works proposal saved as one field"
    points:
      "Where": "SCIA edilizia with the sanatoria scelta, section \"Asseverazione SCIA - Stato legittimo, Dichiarazione di tolleranze, Sanatoria e regolarizzazioni per interventi già realizzati e in corso di esecuzione\", case \"un intervento soggetto a SCIA realizzato in assenza della SCIA stessa o in difformità da essa, che risulta conforme alla disciplina urbanistica vigente al momento della presentazione [...] e ai requisiti prescritti dalla disciplina edilizia vigente al momento della realizzazione\" (art. 36-bis c. 1 DPR 380/2001, as the Salva Casa decree 69/2024 wrote it)."
      "What happens": "the case opens four rows, \"dà atto che la data/epoca di realizzazione dell'intervento\", \"attesta che la data/epoca di realizzazione dell'intervento\", \"determina l'oblazione dovuta\" and \"ai fini della sanatoria, la presente SCIA:\". They are one radio field with the values 1, 2, 3 and 4: ticking one unticks the others, and the form saves one value."
      "What the law and the national form ask": "the technician states the date or epoch of the works (proven by documents, or attested), determines the oblazione (art. 36-bis c. 5), and says whether the SCIA proposes works needed for the sanatoria (c. 2). In InfoCamere's national form (`intervento_in_assenza_scia_fino_dieci_mila`) only the last is a choice (`no_interventi` or `propone_interventi`); the dating and the oblazione are separate items."
      "Effect": "the asseverazione can state one of the three, so a Salva Casa sanatoria of works done without a SCIA or in difformity from it can't be filed complete on the portal."
      "Checked": "2026-10-30 by hand; 2026-11-01 on a made-up draft (\"PROVA NON INVIARE\"): ticking each row in turn left only that one ticked, and the four rows' inputs carry the values 1 to 4 of one field. Nothing was saved."
      "Not part of it": "the case's seismic box below the four rows, \"Quanto alla rilevanza sismica [...] ai sensi dell'art. 36-bis, comma 3-bis\", works. Its choices are fields of their own: the zone (3 and 4, or 1 and 2), then for zones 1 and 2 whether the works have structural relevance, then the art. 94-bis class, and for a relevant one \"allega l'autorizzazione sismica\" or the silenzio assenso. Ticking them kept the dating row ticked (2026-11-01, same draft, not saved). So works on structures under c. 1 are blocked by this defect only. The box is offered only in this case, as in InfoCamere's SCIA form (`schema/sue-choices.json` 033/034): with double conformity and for works under way, structures go in the asseverazione's sismica quadro (the SCIA in sanatoria maps them there)."

scia-34ter:
  title: "SCIA in sanatoria, art. 34-ter (a variant to a pre-1977 title): the portal saves the dating or the oblazione"
  portal: "Napoli's SUE on impresainungiorno: the SCIA's asseverazione, sanatoria quadro"
  what: "The case's three rows (the date of the variant proven by documents, the date attested, the oblazione) are one field: the portal keeps only the one ticked last."
  law: "Art. 34-ter c. 2 and 3 DPR 380/2001 ask for both: the variant's date (by the documents of art. 9-bis c. 1-bis, else the technician's attestation) and the oblazione of art. 36-bis c. 5 the SCIA is subject to."
  checked: "2026-11-02, on a made-up draft, ticked and cancelled without saving; the sanatoria quadro's own rows (the varied title, the payment) are two fields and work"
  choices:
    - "Ask the SUE (Comune di Napoli, Sportello Unico Edilizia) how they want this sanatoria filed while the portal can't take it: by PEC, or on the portal with the date or the oblazione stated in the attached relazione tecnica asseverata."
    - "Report the defect to the portal's operator (InfoCamere's impresainungiorno support) or the SUE: docs/portal-defects.md says what and how it was checked."
    - "File it on the portal yourself, by hand, as the SUE tells you: Claude doesn't fill this case."
  report: docs/portal-defects.md
  page:
    heading: "SCIA in sanatoria, art. 34-ter: a pre-1977 variant's dating and oblazione saved as one field"
    points:
      "Where": "SCIA edilizia with the sanatoria scelta, section \"Asseverazione SCIA - Stato legittimo, Dichiarazione di tolleranze, Sanatoria e regolarizzazioni [...]\", case \"una variante in corso d'opera, in parziale difformità dal titolo, rilasciato prima della data di entrata in vigore della legge 28 gennaio 1977, n. 10 (articolo 34-ter DPR. n. 380)\"."
      "What happens": "the case opens three rows, \"dà atto che la data/epoca di realizzazione dell'intervento\" (with its date), \"attesta che la data/epoca di realizzazione dell'intervento\" (with its date) and \"determina l'oblazione dovuta [...]\" (with the amount). Their inputs carry the values 1, 2 and 3 of one choice: ticking \"dà atto\" unticked the oblazione, ticking \"attesta\" unticked \"dà atto\", so the form saves one of them."
      "What the law asks": "art. 34-ter c. 2 DPR 380/2001 (as the Salva Casa decree 69/2024 wrote it): the variant's date is proven by the documents of art. 9-bis c. 1-bis, fourth and fifth periods, and where they can't date it the technician attests it; c. 3: the SCIA goes with the payment of an oblazione determined under art. 36-bis c. 5. The dating (one of two ways) and the oblazione are both due. InfoCamere's national SCIA form (`schema/sue-choices.json`, 12 March 2026) has no pick-one rule for this case at all."
      "Effect": "the asseverazione can state the variant's date or its oblazione, never both, so a regularization of a variant to a pre-1977 title can't be filed complete on the portal."
      "Checked": "2026-11-02 on a made-up draft (\"PROVA NON INVIARE\"), ticked in turn and cancelled without saving. The case's quadro \"SANATORIA e regolarizzazioni [...]\" works: the varied title (its number and date, or the art. 9-bis documents) and the payment (its amount and date, or the receipt with the amount) are two fields with the values 1 and 2 each, and both stayed ticked."
      "To report": "the dating and the oblazione should be separate choices, as the quadro's title and payment are."

pdc-36bis:
  title: "Permesso in sanatoria, art. 36-bis: the portal saves one of the statements"
  portal: "Napoli's SUE on impresainungiorno: the permesso's asseverazione, sanatoria quadro"
  what: "The documents attached, the date of the works (documents or attestation) and the works proposal are one radio group: ticking one unticks the others."
  law: "Art. 36-bis DPR 380/2001 asks for the date of the works, the oblazione and whether works are proposed, together."
  checked: "2026-10-30, by hand on a made-up draft"
  choices:
    - "Ask the SUE how they want this permesso in sanatoria filed while the portal can't take it."
    - "Report the defect to the portal's operator or the SUE: docs/portal-defects.md says what."
    - "File it on the portal yourself, by hand, as the SUE tells you: Claude doesn't fill this case."
  report: docs/portal-defects.md
  page:
    heading: "Permesso in sanatoria, art. 36-bis: the same, on the permesso's asseverazione"
    points:
      "Where": "permesso di costruire with the sanatoria scelta, the asseverazione's sanatoria quadro, case \"In parziale difformità [...] o con variazioni essenziali\" (art. 36-bis)."
      "What happens": "the documents attached, the dating (documents or attestation) and the works proposal are one radio group, as on the SCIA (seen 2026-10-30). Art. 36 (works without the permesso) fills."
      "Effect": "a permesso in sanatoria under art. 36-bis can't be filed complete on the portal. What only that case opens goes with it, mapped by no recipe: the landscape compatibility of art. 36-bis c. 4 in the asseverazione's tutela quadro (works done without the landscape authorization), and the sanatoria quadro's acknowledgment that the SUE may ask for structural works, which the portal also keeps in one radio group with the oblazione's."

pdc-36-paesaggio:
  title: "Permesso in sanatoria (art. 36) in a protected area: the landscape quadro has no line for the accertamento of art. 167"
  portal: "Napoli's SUE on impresainungiorno: the permesso's asseverazione, quadro 16 (bene sottoposto ad autorizzazione paesaggistica), in the pratica that selects the permesso, its sanatoria and the accertamento di compatibilità paesaggistica together"
  what: "For works that alter the place the quadro requires one of three procedures (semplificata, ordinaria, the accertamento of art. 36-bis), none of which is the accertamento of art. 167 that works done without the permesso need, though the portal lets that accertamento be selected with the permesso in the same pratica."
  law: "Works done without the permesso (art. 36 DPR 380/2001) in a protected area are legalized only with their landscape compatibility found (art. 146 c. 4 D.Lgs. 42/2004), by the accertamento of art. 167 c. 4-5; the binding parere of art. 36-bis c. 4 is for partial difformity and essential variations only."
  checked: "2026-11-02, a made-up run in the pane (rehearsals/pdc-sanatoria-accertamento-fittizio): with the alteration ticked and no procedure, Salva answered \"il valore è obbligatorio\" on all three"
  choices:
    - "Ask the SUE (Comune di Napoli, Sportello Unico Edilizia) how they want the permesso's landscape quadro stated for an art. 36 sanatoria with the accertamento filed in the same pratica."
    - "Report the defect to the portal's operator (InfoCamere's impresainungiorno support) or the SUE: docs/portal-defects.md says what and how it was checked."
    - "File it on the portal yourself, by hand, as the SUE tells you: Claude doesn't fill this case."
  report: docs/portal-defects.md
  page:
    heading: "Permesso in sanatoria, art. 36, in a protected area: no line for the accertamento of art. 167"
    points:
      "Where": "the pratica that selects the permesso di costruire (sanatoria answered Sì) with the \"Accertamento di compatibilità paesaggistica (artt. 167-181 D.Lgs. 42/2004 - Comune)\"; the permesso's asseverazione, quadro 16 \"Bene sottoposto ad autorizzazione paesaggistica\"."
      "What happens": "\"ricade in zona tutelata e le opere comportano alterazione\" opens three procedures (semplificato, ordinario, accertamento \"di cui all'articolo 36-bis\") and Salva wants one (\"il valore è obbligatorio\" on each, seen 2026-11-02 on a made-up draft). None is the accertamento of art. 167 the pratica's other operation asks for."
      "Law": "works done without the permesso or in total difformity (art. 36 DPR 380/2001) in a protected area are legalized only with their landscape compatibility found (art. 146 c. 4 D.Lgs. 42/2004), by the accertamento of art. 167 c. 4-5, which excludes new usable surfaces or volumes; art. 36-bis c. 4 is for partial difformity and essential variations only."
      "Effect": "an art. 36 permesso in sanatoria in a protected area can't be filed on the portal without stating a procedure that isn't the case's. The rules table sends the case to the permesso with the accertamento (`rehearsals/pdc-sanatoria-accertamento-fittizio`), whose recipe refuses it with this defect; every other section of the pratica fills."
      "Ask for": "a line \"è assoggettato al procedimento di accertamento della compatibilità paesaggistica di cui agli artt. 167 e 181 del D.Lgs. 42/2004\" beside the art. 36-bis one."

cila-impresa-dopo:
  title: "CILA and CIL: the firm can't be left to be named later, though the form offers it"
  portal: "Napoli's SUE on impresainungiorno: the CILA's quadro i) and the CIL's quadro g) (salute e sicurezza), and their firm's quadro (h, f)"
  what: "The safety quadro offers \"ricade nell'ambito di applicazione del d.lgs. 81/2008 ma si riserva di presentare le dichiarazioni di cui al presente quadro prima dell'inizio lavori\", yet the firm's quadro has no line for a firm still to be chosen and the portal requires the firm's details (16 required boxes, the DURC ones among them) whatever the safety quadro says."
  law: "The committente sends the firm's documents (DURC, the notifica preliminare, the check of the firm's fitness) before the works start (art. 90 c. 9 c D.Lgs. 81/2008), not necessarily with the filing; the permesso's and the SCIA's forms on the same portal let the firm be named later."
  checked: "2026-11-01, a run of a made-up CILA in the pane (rehearsals/cila-fittizia, answers-impresa-dopo) stopped on the firm's required boxes; InfoCamere's national CILA form has no such reservation (schema/sue-choices.json 009-012)"
  choices:
    - "File the CILA or CIL once the firm is chosen: Claude fills it then."
    - "Ask the SUE whether a CILA may be filed before the firm is chosen, and how."
    - "Report the defect to the portal's operator (InfoCamere's impresainungiorno support) or the SUE: docs/portal-defects.md says what and how it was checked."
  report: docs/portal-defects.md
  page:
    heading: "CILA and CIL: a firm still to be chosen is offered, then refused"
    points:
      "Where": "the CILA's quadro \"i) Rispetto degli obblighi in materia di salute e sicurezza nei luoghi di lavoro\" (the CIL's g)), and the firm's quadro (the CILA's h), the CIL's f))."
      "What happens": "the safety quadro offers \"ricade nell'ambito di applicazione del d.lgs. 81/2008 ma si riserva di presentare le dichiarazioni di cui al presente quadro prima dell'inizio lavori\", but the firm's quadro has no line for a firm still to be chosen, and the portal requires the firm's details (16 required boxes, the DURC ones among them) whatever the safety quadro says."
      "What the law asks": "the firm's documents (DURC, the notifica preliminare, the check of its fitness) go to the Comune before the works start (art. 90 c. 9 c D.Lgs. 81/2008). On the same portal the permesso's and the SCIA's forms let the firm be named later. InfoCamere's national CILA form has no such reservation at all (`schema/sue-choices.json`), so the box looks like the Comune's own, without the rest of the form following it."
      "Effect": "a CILA or CIL can't be filed before the firm is chosen."
      "Checked": "2026-11-01, a made-up CILA run in the pane (`rehearsals/cila-fittizia`, `answers-impresa-dopo.json`) stopped on the firm's required boxes. Nothing was sent."
      "To report": "either the reservation should let the firm's quadro wait, or the box should go."

pdc-incentivo-energetico:
  title: "Permesso: an energy incentive must be claimed, even for a project with none"
  portal: "Napoli's SUE on impresainungiorno: the permesso's asseverazione, quadro sicurezza impianti e consumi energetici"
  what: "The quadro requires one of the energy incentives (art. 14 c. 6 or c. 7 D.Lgs. 102/2014, or the 5% volume bonus of D.Lgs. 28/2011) to be ticked: it offers no line for a project that claims none."
  law: "The incentives are options the designer may use (art. 14 D.Lgs. 102/2014: thicker walls and roofs not counted, distances and heights in derogation; the 5% bonus of D.Lgs. 28/2011 for renewables beyond the minimum), not a requirement of every permesso."
  checked: "2026-10-29, the permesso's first runs in the pane (rehearsals/pdc-fittizio): the quadro saved only with an incentive ticked"
  choices:
    - "Ask the SUE how a permesso with no energy incentive is filed while the portal requires one."
    - "Report the defect to the portal's operator (InfoCamere's impresainungiorno support) or the SUE: docs/portal-defects.md says what and how it was checked."
  report: docs/portal-defects.md
  page:
    heading: "Permesso: an energy incentive must be claimed, even for a project with none"
    points:
      "Where": "the permesso's asseverazione, quadro \"sicurezza impianti e consumi energetici\"."
      "What happens": "the quadro requires one of the energy incentives (art. 14 c. 6 or c. 7 D.Lgs. 102/2014, or the 5% volume bonus of D.Lgs. 28/2011) and offers no line for a project with none."
      "What the law asks": "the incentives are options the designer may take, not a requirement."
      "Effect": "a permesso with no energy incentive can't be filed as it is; the recipe refuses it."
      "Checked": "2026-10-29, the permesso's first runs in the pane (`rehearsals/pdc-fittizio`)."
      "To report": "the quadro should offer \"no incentive\"."

coholder-sesso:
  title: "Voltura and cambio d'intestazione: the co-holder's sex is two required boxes"
  portal: "Napoli's SUE on impresainungiorno: the co-holders' section (\"ci sono cointestatari\") of the voltura del permesso and of the cambio d'intestazione of a CILA, SCIA or DIA"
  what: "\"sesso: M\" and \"sesso: F\" are two radio groups, each required: the section saves only with both ticked, so it states both sexes."
  law: "A person has one sex on their codice fiscale; the form should take one."
  checked: "2026-10-31, the voltura's runs in the pane (rehearsals/voltura-pdc-fittizia); the cambio d'intestazione's co-holder 2026-11-02, the same section"
  choices:
    - "Claude ticks both, as the portal saves it no other way, and says so in the person's steps; the codice fiscale says which."
    - "Report the defect to the portal's operator (InfoCamere's impresainungiorno support) or the SUE: docs/portal-defects.md says what and how it was checked."
  report: docs/portal-defects.md
  page:
    heading: "Voltura and cambio d'intestazione: the co-holder's sex is two required boxes"
    points:
      "Where": "the co-holders' section (\"ci sono cointestatari\") of both pratiche."
      "What happens": "\"sesso: M\" and \"sesso: F\" are two radio groups, each required, so the section saves only with both ticked."
      "Effect": "the pratica states both sexes; Claude ticks both and says so in the person's steps."
      "Checked": "2026-10-31 (the voltura's runs), 2026-11-02 (the cambio d'intestazione's co-holder)."
      "To report": "one group, M or F."

coholders-one:
  title: "Voltura and cambio d'intestazione: the co-holders' section holds one person"
  portal: "Napoli's SUE on impresainungiorno: the co-holders' section (\"Informazioni su eventuali altri aventi titolo\", opened by the wizard's \"ci sono cointestatari\") of the voltura del permesso and of the cambio d'intestazione of a CILA, SCIA or DIA"
  what: "The section has one person's boxes and no \"+\" to add another, so a title passing to three or more holders (the dichiarante and two co-holders or more) can name only one co-holder."
  law: "The permesso passes to the successors in title (art. 11 c. 2 DPR 380/2001), however many: the voltura names each of them."
  checked: "2026-10-28, the batch crawl of both pratiche (catalogue/F839/sections/sue-voltura-intestazione-permesso-di-costruire.json, sue-cambio-intestazione-cia-scia-dia.json): one person's 14 boxes, no \"+\""
  choices:
    - "Ask the SUE how they want the other co-holders named: for instance the first in the section and every one in the attached dichiarazione sostitutiva of the right to the title, signed by each."
    - "Report the defect to the portal's operator (InfoCamere's impresainungiorno support) or the SUE: docs/portal-defects.md says what and how it was checked."
    - "File it on the portal yourself, by hand, as the SUE tells you: Claude doesn't fill this case."
  report: docs/portal-defects.md
  page:
    heading: "Voltura and cambio d'intestazione: the co-holders' section holds one person"
    points:
      "Where": "the co-holders' section (\"Informazioni su eventuali altri aventi titolo\", opened by the wizard's \"ci sono cointestatari\") of both pratiche."
      "What happens": "the section has one person's boxes (name, birth, residence, citizenship, sex, codice fiscale) and no \"+\" to add another."
      "What the law asks": "the permesso passes to the successors in title (art. 11 c. 2 DPR 380/2001), however many; the voltura names each of them."
      "Effect": "a title passing to three or more holders can name only one co-holder on the portal."
      "Checked": "2026-10-28, the batch crawl of both pratiche (one person's 14 boxes, no \"+\")."
      "To report": "a \"+\" on the section, as the CILA's and SCIA's lists of technicians and firms have."

