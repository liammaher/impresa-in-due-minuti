cambio-uso-regionale:
  title: "SCIA alternativa o permesso per un cambio d'uso della legge regionale"
  portal: "Napoli's SUE on impresainungiorno: the SCIA alternativa's quadro c) (Qualificazione dell'intervento) and the permesso's quadro a) and asseverazione (opere in progetto), from the national forms"
  what: "La voce sul cambio d'uso ha solo i casi dell'art. 23-ter: nessuna dichiara il suo."
  works: "I cambi d'uso dell'art. 23-ter li preparo."
  law: "In Campania questo cambio richiede la SCIA alternativa o il permesso (art. 2 c. 6 L.R. 13/2022)."
  checked: "03/11/2026, dai moduli del portale e dello schema nazionale; non provato su una bozza."
  choices:
    - "Chiedi al SUE quale voce spuntare, o se dichiararlo nella relazione."
    - "Segnala il difetto a InfoCamere (assistenza impresainungiorno) o al SUE."
    - "Presentala tu sul portale, come ti indica il SUE: io non la compilo."
  report: docs/portal-defects.md
  page:
    heading: "SCIA alternativa and permesso: no line for Campania's own changes of use"
    points:
      "Where": "SCIA alternativa al permesso di costruire, quadro c) \"Qualificazione dell'intervento\"; permesso di costruire, quadro a) and the asseverazione's \"opere in progetto\". All three come from the national forms (`schema/sue-choices.json`: scia_alternativa 002, permesso_di_costruire 000 and 019, each required)."
      "What happens": "the change-of-use choice offers \"non comporta mutamento\", \"una singola unità all'interno della stessa categoria\", \"una singola unità, ubicata in immobili ricompresi nelle zone A), B) e C) [...] tra categorie funzionali [...] a), a-bis), b) e c)\" and \"un intero immobile all'interno della stessa categoria funzionale nelle ipotesi di cui all'art. 23-ter, comma 3\"."
      "Effect": "a whole building changed to another category, a unit outside zones A, B and C, or a change to or from the rural category, which in Campania take the SCIA alternativa or the permesso (art. 2 c. 6 L.R. 13/2022; regional circular CI/2025/3, d), has no line that states it, and any line ticked states another change. Claude refuses these cases (`cambio-uso-regionale`). A ground-floor unit in zone A, B or C among categories a) to c) is the third line, and is filled."
      "Checked": "2026-11-03, from the labels as crawled, the national schema and the Comune's own Mod. SCIA/PDC of 23/06/2025 (quadro c, the same four lines); not tried on a draft. A whole building's change from offices to homes was filled on 2026-11-02 with the fourth line ticked (`rehearsals/pdc-sanatoria-fittizio`, `answers-cambio-intero`): that run stated a change within one category, and the case is refused since."
      "To report": "the choice should have a line for a change of use the regional law gives this title for (art. 23 c. 01 lets the regions add cases), or let it be stated in the relazione."

