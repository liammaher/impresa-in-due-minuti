  checked: "2026-10-31, the agibilità's runs in the pane (rehearsals/agibilita-fittizia): the four cases ticking neither showed the message, and the drafts kept their values"
  choices:
    - "Claude ticks the exception the case is, and none for an ordinary unit; the message is left for the direttore dei lavori, whose attestation it is, and the SUE if sending is refused."
    - "Report the defect to the portal's operator (InfoCamere's impresainungiorno support) or the SUE: docs/portal-defects.md says what and how it was checked."
  report: docs/portal-defects.md
  page:
    heading: "Agibilità: the art. 24 exceptions are marked required"
    points:
      "Where": "the agibilità's \"Attestazione tecnica - Agibilità\"."
      "What happens": "the boxes for art. 24 c. 5-bis/5-ter (small or low units) and c. 5-quater (a derogation another law allows) show \"deve essere selezionata almeno un'opzione\" when neither is ticked, though an ordinary unit is neither."
      "Effect": "an ordinary unit's draft carries the message; it kept its values on the runs. Whether sending accepts it isn't known (nothing is sent)."
      "Checked": "2026-10-31, the four agibilità cases ticking neither (`rehearsals/agibilita-fittizia`)."
      "To report": "the exceptions should be optional."

pdc-aree-fuoco:
  title: "Permesso: \"non interessa aree percorse dal fuoco\" unticks the soil statement"
  portal: "Napoli's SUE on impresainungiorno: the permesso's asseverazione, quadro qualità terreni, opere di urbanizzazione, scarichi"
  what: "The line that the area isn't one burned by a fire (art. 10 L. 353/2000) is one radio choice with the soil investigations' lines (none needed, analyses done, remediated): ticking it unticks the soil statement, and the other way round."
  law: "The two are separate statements: the soil's environmental quality (D.Lgs. 152/2006) and the ten-year ban on building on burned woods and pastures (art. 10 c. 1 L. 353/2000)."
  checked: "2026-11-01, on a made-up draft, ticked and cancelled without saving"
  choices:
    - "Claude ticks the soil statement and leaves the burned-area line; state it in the relazione tecnica if the SUE wants it, or ask the SUE how they want both stated."
    - "Report the defect to the portal's operator (InfoCamere's impresainungiorno support) or the SUE: docs/portal-defects.md says what and how it was checked."
  report: docs/portal-defects.md
  page:
    heading: "Permesso: the burned-area line is one choice with the soil statement"
    points:
      "Where": "permesso di costruire, the asseverazione's quadro \"qualità terreni, opere di urbanizzazione, scarichi\": \"non interessa aree percorse dal fuoco ai sensi dell'art. 10 della legge 353/2000\"."
      "What happens": "the line is a radio of the same choice as the soil investigations' (\"non richiede indagini ambientali preventive\", \"a seguito delle preventive analisi ambientali\", \"è stata oggetto di bonifica\"): ticking it unticks the soil statement (seen 2026-11-01, on a made-up draft, cancelled without saving)."
      "Effect": "a permesso states either its soil or that the area wasn't burned, never both. Claude ticks the soil statement and leaves the other (the steps' `yours` says so)."
      "To report": "the two lines should be separate choices (the soil under D.Lgs. 152/2006, the burned areas under art. 10 c. 1 L. 353/2000)."

cambio-uso-regionale:
  title: "SCIA alternativa and permesso: no line for a change of use Campania's law gives that title for"
  portal: "Napoli's SUE on impresainungiorno: the SCIA alternativa's quadro c) (Qualificazione dell'intervento) and the permesso's quadro a) and asseverazione (opere in progetto), from the national forms"
  what: "The required change-of-use choice has four lines, all art. 23-ter DPR 380/2001's: no change; one unit within its category; one unit in zone A, B or C among categories a) to c); a whole building within its category (c. 3). A whole building to another category, a unit outside zones A, B and C, or a change to or from the rural category has no line, and any line ticked states something else."
  law: "In Campania those changes take the SCIA alternativa al permesso (art. 2 c. 6 L.R. 13/2022; circolare regionale CI/2025/3, d), or the permesso, which the forms are filed for; art. 23-ter doesn't give their title, so the national forms, written for it, don't name them."
  checked: "2026-11-03, from the forms' labels as crawled (catalogue/F839/sections), the national schema's choices (schema/sue-choices.json: scia_alternativa 002, permesso_di_costruire 000 and 019, none optional) and the Comune's own Mod. SCIA/PDC of 23/06/2025 (quadro c, the same four lines); not tried on a draft"
  choices:
    - "Ask the SUE (Comune di Napoli, Sportello Unico Edilizia) which line they want ticked for this change, or whether the change is stated in the relazione and the line left as the portal allows."
    - "Report the defect to the portal's operator (InfoCamere's impresainungiorno support) or the SUE: docs/portal-defects.md says what and how it was checked."
    - "File it on the portal yourself, by hand, as the SUE tells you: Claude doesn't fill this case."
  report: docs/portal-defects.md
  page:
    heading: "SCIA alternativa and permesso: no line for Campania's own changes of use"
    points:
      "Where": "SCIA alternativa al permesso di costruire, quadro c) \"Qualificazione dell'intervento\"; permesso di costruire, quadro a) and the asseverazione's \"opere in progetto\". All three come from the national forms (`schema/sue-choices.json`: scia_alternativa 002, permesso_di_costruire 000 and 019, each required)."
      "What happens": "the change-of-use choice offers \"non comporta mutamento\", \"una singola unità all'interno della stessa categoria\", \"una singola unità, ubicata in immobili ricompresi nelle zone A), B) e C) [...] tra categorie funzionali [...] a), a-bis), b) e c)\" and \"un intero immobile all'interno della stessa categoria funzionale nelle ipotesi di cui all'art. 23-ter, comma 3\"."
      "Effect": "a whole building changed to another category, a unit outside zones A, B and C, or a change to or from the rural category, which in Campania take the SCIA alternativa or the permesso (art. 2 c. 6 L.R. 13/2022; regional circular CI/2025/3, d), has no line that states it, and any line ticked states another change. Claude refuses these cases (`cambio-uso-regionale`). A ground-floor unit in zone A, B or C among categories a) to c) is the third line, and is filled."
      "Checked": "2026-11-03, from the labels as crawled, the national schema and the Comune's own Mod. SCIA/PDC of 23/06/2025 (quadro c, the same four lines); not tried on a draft. A whole building's change from offices to homes was filled on 2026-11-02 with the fourth line ticked (`rehearsals/pdc-sanatoria-fittizio`, `answers-cambio-intero`): that run stated a change within one category, and the case is refused since."
      "To report": "the choice should have a line for a change of use the regional law gives this title for (art. 23 c. 01 lets the regions add cases), or let it be stated in the relazione."
