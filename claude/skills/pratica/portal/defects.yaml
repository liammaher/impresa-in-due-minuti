  report: docs/portal-defects.md
  page:
    heading: "Permesso: the burned-area line is one choice with the soil statement"
    points:
      "Where": "permesso di costruire, the asseverazione's quadro \"qualità terreni, opere di urbanizzazione, scarichi\": \"non interessa aree percorse dal fuoco ai sensi dell'art. 10 della legge 353/2000\"."
      "What happens": "the line is a radio of the same choice as the soil investigations' (\"non richiede indagini ambientali preventive\", \"a seguito delle preventive analisi ambientali\", \"è stata oggetto di bonifica\"): ticking it unticks the soil statement (seen 2026-11-01, on a made-up draft, cancelled without saving)."
