# What the autorizzazione paesaggistica semplificata (DPR 31/2017 - Comune) adds to the building
# pratica it's filed with, the two selected together in the wizard: a combination's recipe
# `extends` its main pratica's rehearsal, then this. The asseverazione names the procedure from
# `paesaggio`; the relazione and its drawings take only signed files, so they are the person's
# (each recipe's `yours`).
asks:
  paesaggio: {default: "semplificata"}
rules:
  handles: [napoli/comune/autorizzazione-paesaggistica-semplificata]
supports:
  - when: "{{ask.paes_variante|not}}"
    else: "So far only for a new authorization: the variant of one already issued isn't run yet."
