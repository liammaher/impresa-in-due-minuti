# What the dichiarazione di utilizzo delle terre e rocce da scavo (art. 21 DPR 120/2017) adds to the
# building pratica it's filed with, the two selected together in the wizard: a combination's recipe
# `extends` its main pratica's rehearsal, then this. The wizard adds two adempimenti (the SUE's and
# ARPA Campania's) and no section of its own (catalogue/F839/sue-wizard.json `pairs`, 2026-11-03):
# the dichiarazione itself is the portal's document on the attachments screen, signed after the
# declarations (the dictionary's slot), and its data are the person's there.
# Its operation in the SUE's wizard: a combination's operations are its main pratica's, then this.
operation: "Dichiarazione di utilizzo del materiale di scavo fuori del sito di produzione ai sensi dell'art. 21 del DPR n.120/2017 (da trasmettere almeno 15 giorni prima dell'inizio dei lavori di scavo)"
rules:
  handles: [napoli/comune/utilizzo-materiale-scavo-fuori-sito]
# The case it adds to the main pratica's P6 answers: excavated soil leaving a small site as a
# by-product. Each combination's recipe adds its works (`gen.py --answers`), and where the main form has
# the asseverazione's materiali di risulta (SCIA, SCIA alternativa, permesso) states them as by-products
# (the dictionary refuses a case where the two disagree). Works already done are a sanatoria, which the
# rules table never asks this for (the dichiarazione comes before the excavation): the P6 CILA is a late
# one, so the CILA combinations make it "da iniziare".
answers:
  terre_rocce: dichiarazione
